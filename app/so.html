<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>SO ID12</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f4f6f9;

      /* Menghormati safe area (status bar & nav bar) */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    iframe {
      border: none;
      width: 100%;
      height: 100%;  /* Mengikuti tinggi area konten setelah padding */
      display: block;
    }

    #warning {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,0,0,0.2);
      color: #900;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      padding-top: 40vh;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="warning">⚠️ Halaman ini optimal di WebView / iframe. Di browser biasa, layout mungkin kurang pas.</div>

  <iframe id="stockFrame"
    src="https://script.google.com/macros/s/AKfycbyT3PRoqiv_epPOPQtQKOFukkA-SVFsO4twJUfPGs8-CZ8QJSHxgyBnCttwRVmhi2W-bg/exec"
    loading="lazy"
    allowfullscreen
    scrolling="yes">
  </iframe>

  <script>
    // Tidak perlu resize manual, CSS sudah menangani 100% secara responsif.
    // Fungsi ini hanya sebagai fallback untuk browser lama.
    function resizeIframe() {
      const iframe = document.getElementById('stockFrame');
      iframe.style.width = '100%';
      iframe.style.height = '100%';
    }

    window.addEventListener('resize', resizeIframe);
    window.addEventListener('orientationchange', resizeIframe);
    window.addEventListener('load', resizeIframe);
  </script>
</body>
</html>
