<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Display Rak (TF.js Langsung)</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 15px; }
    label { display: block; margin-top: 15px; }
    button { margin-top: 20px; padding: 12px 24px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; }
    #status { font-size: 0.9em; color: #555; }
  </style>
</head>
<body>
  <h2>Cek Display Rak Promo</h2>
  <label>Nama Toko / ID:</label>
  <input type="text" id="storeName" placeholder="Toko A">
  <label>Upload Foto Display:</label>
  <input type="file" id="photoInput" accept="image/*" capture="environment">
  <button id="submitBtn" onclick="submitCheck()">Cek Kepatuhan</button>
  <div id="result"></div>
  <div id="status">Memuat model...</div>

  <!-- Hanya TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script>
    // ===== KONFIGURASI =====
    const MODEL_URL = './model.json'; // Sesuaikan jika model di folder lain
    // Nama kelas sesuai urutan saat training di Teachable Machine
    // (ganti sesuai dengan nama kelas Anda)
    const CLASS_NAMES = ['Lulus', 'Tidak Lulus'];
    const CONFIDENCE_THRESHOLD = 0.7; // opsional, minimal kepercayaan

    let model;

    async function loadModel() {
      try {
        model = await tf.loadGraphModel(MODEL_URL);
        document.getElementById('status').textContent = 'Model siap.';
        console.log('Model berhasil dimuat');
      } catch (err) {
        console.error(err);
        document.getElementById('status').textContent = 'Gagal memuat model: ' + err.message;
      }
    }

    // Preprocess gambar dan dapatkan prediksi
    async function predictImage(imgElement) {
      const tensor = tf.browser.fromPixels(imgElement)
        .resizeNearestNeighbor([224, 224])  // ukuran input model Teachable Machine
        .expandDims(0)
        .toFloat()
        .div(255.0); // normalisasi ke 0-1
      const predictions = await model.predict(tensor).data();
      tensor.dispose();
      return predictions;
    }

    async function submitCheck() {
      const storeName = document.getElementById('storeName').value.trim();
      const fileInput = document.getElementById('photoInput');
      const file = fileInput.files[0];
      const resultDiv = document.getElementById('result');
      const submitBtn = document.getElementById('submitBtn');

      if (!storeName || !file) {
        resultDiv.innerHTML = '<p style="color:red;">Mohon isi nama toko dan pilih foto.</p>';
        return;
      }
      if (!model) {
        resultDiv.innerHTML = '<p style="color:red;">Model belum dimuat.</p>';
        return;
      }

      submitBtn.disabled = true;
      resultDiv.innerHTML = '<p>⏳ Mengecek foto...</p>';

      try {
        const img = await loadImage(file);
        const predArray = await predictImage(img);
        
        // Cari indeks dengan probabilitas tertinggi
        let maxIndex = 0;
        let maxProb = predArray[0];
        for (let i = 1; i < predArray.length; i++) {
          if (predArray[i] > maxProb) {
            maxProb = predArray[i];
            maxIndex = i;
          }
        }

        const className = CLASS_NAMES[maxIndex] || `Kelas ${maxIndex}`;
        const confidence = maxProb;
        
        // Tentukan status
        let status = 'Lulus';
        if (className.toLowerCase().includes('tidak') || confidence < CONFIDENCE_THRESHOLD) {
          status = 'Tidak Lulus';
        }

        resultDiv.innerHTML = `
          <h3>Status: ${status === 'Lulus' ? '✅ Lulus' : '❌ Tidak Lulus'}</h3>
          <p>Kelas terdeteksi: ${className} (${(confidence * 100).toFixed(1)}%)</p>
        `;
      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
      } finally {
        submitBtn.disabled = false;
      }
    }

    function loadImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // Preload model saat halaman selesai
    window.addEventListener('load', loadModel);
  </script>
</body>
</html>
