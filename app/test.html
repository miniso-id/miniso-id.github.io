<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        body { opacity: 0; transition: opacity 0.2s ease-in; margin: 0; padding: 0; font-family: -apple-system, system-ui; background: #ffffff; height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }
        body.fade-in { opacity: 1; }
        .fade-out { opacity: 0 !important; transition: opacity 0.2s ease-out; }

        /* --- LOGIN OVERLAY --- */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg-gray); z-index: 20000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; width: 90%; max-width: 350px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        .login-box h2 { color: var(--miniso-red); margin: 0 0 10px 0; font-weight: 800; font-size: 28px; }
        .login-box input, .login-box select { width: 100%; height: 48px; margin-bottom: 15px; padding: 0 15px; border-radius: 12px; border: 1.5px solid #eee; background: #f9f9f9; outline: none; font-size: 15px; }
        .btn-login { width: 100%; height: 50px; background: var(--miniso-red); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s; z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        #ui-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px; border-bottom: 1px solid #eee; z-index: 1000; }
        .top-bar { display: flex; gap: 10px; align-items: center; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        #catFilterContainer { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px 0; scrollbar-width: none; }
        .cat-chip { padding: 8px 16px; background: #f0f0f0; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .cat-chip.active { background: var(--miniso-red); color: white; }

        /* --- SCANNER & AI BOX --- */
        #reader { display:none; width:100%; max-width:340px; aspect-ratio:1/1; margin:15px auto; background:#000; border-radius:20px; overflow:hidden; position:relative; border: 4px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        .focus-guide { position: absolute; inset: 20%; border: 2.5px solid var(--miniso-red); border-radius: 15px; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
        .ai-status-overlay { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; color: #fff; font-size: 11px; font-weight: bold; z-index: 10; text-shadow: 1px 1px 2px #000; background: rgba(0,0,0,0.4); padding: 5px 0; }

        .main-content { flex: 1; overflow-y: auto; padding: 0 16px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px 0 80px 0; }
        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px; background: white; border-radius: 16px; border: 1px solid #f0f0f0; }
        .list-img-box { width: 70px; height: 70px; background: #f9f9f9; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .list-img-box img { width: 100%; height: 100%; object-fit: contain; }

        #detailContainer { display: none; padding-top: 20px; padding-bottom: 80px; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; }
        .price-comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .price-item { padding: 12px; border-radius: 12px; background: var(--bg-gray); }
        .price-item.reg { background: var(--miniso-soft); border-bottom: 3px solid var(--miniso-red); }
        .floating-back { position: fixed; top: 30px; left: 20px; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 9999; }
        
        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; display: none; align-items: center; justify-content: center; }
        #lightbox.active { display: flex; }
        #lightbox img { max-width: 90%; max-height: 80vh; border-radius: 15px; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>MMS-X</h2>
        <p>Silakan masuk ke akun Anda</p>
        <select id="loginAs">
            <option value="Administrator">Administrator</option>
            <option value="Area">Area</option>
            <option value="Store">Store</option>
        </select>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="btn-login" onclick="checkLogin()">MASUK</button>
        <p id="loginError" style="color:red; display:none; font-size:12px; margin-top:10px;">Login Gagal!</p>
    </div>
</div>

<div id="sidebar" class="sidebar">
    <h2>MMS-X</h2>
    <a href="#" onclick="logout()">Logout</a>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="lightbox" onclick="this.classList.remove('active')">
    <img id="lightboxImg" src="">
</div>

<div id="appContent" style="display:flex; height: 100vh; flex-direction: column;">
    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="search-container">
                <input id="searchInput" placeholder="Cari nama / barcode...">
                <button id="scanBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
            </div>
        </div>
        <div id="catFilterContainer">
            <div class="cat-chip active" onclick="filterCat('All', this)">All</div>
        </div>
        <div id="reader">
            <div class="ai-status-overlay" id="aiStatus">⏳ MEMULAI AI...</div>
            <video id="videoElement" playsinline></video>
            <div class="focus-guide"></div>
        </div>
        <div id="cameraControl" style="display:none;"><select id="videoSource" style="width:100%; margin:10px 0; padding:10px; border-radius:8px;"></select></div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanning = false, lastScroll = 0, timer;
    let currentCategory = 'All';
    const codeReader = new ZXing.BrowserMultiFormatReader();
    window.isScanning = false;

    document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("fade-in");
        fetchCategories();
        search();
    });

    async function checkLogin() {
        const role = document.getElementById('loginAs').value;
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const { data } = await _supabase.from('users').select('*').eq('login as', role).eq('username', user).eq('password', pass).maybeSingle();
        if (data) {
            localStorage.setItem('mms_auth', 'true');
            document.getElementById('loginOverlay').style.display = 'none';
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }
    if(localStorage.getItem('mms_auth') === 'true') document.getElementById('loginOverlay').style.display = 'none';

    function logout() { localStorage.clear(); location.reload(); }

    async function fetchCategories() {
        const { data } = await _supabase.rpc('get_unique_categories');
        if (data) {
            const container = document.getElementById('catFilterContainer');
            container.innerHTML = '<div class="cat-chip active" onclick="filterCat(\'All\', this)">All</div>' + 
                data.map(item => `<div class="cat-chip" onclick="filterCat('${item.category}', this)">${item.category}</div>`).join('');
        }
    }

    function filterCat(cat, el) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        search();
    }

    async function search() {
        const q = document.getElementById("searchInput").value.trim();
        const list = document.getElementById("listContainer");
        let query = _supabase.from('export').select('*');
        if (currentCategory !== 'All') query = query.eq('Category', currentCategory);
        if (q) query = query.or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`);
        let { data } = await query.limit(50);
        if(data) {
            list.innerHTML = data.map(p => `
                <div class="list-item" onclick="showDetail('${p.Barcode}')">
                    <div class="list-img-box"><img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/150'"></div>
                    <div class="list-info">
                        <div style="font-size:10px; color:red; font-weight:800;">${p.Category || 'GENERAL'}</div>
                        <div style="font-weight:700; font-size:14px;">${p.Name}</div>
                        <div style="font-size:11px; color:#888;">${p.Barcode}</div>
                    </div>
                </div>
            `).join('');
        }
    }
    window.search = search;
    document.getElementById("searchInput").oninput = () => { clearTimeout(timer); timer = setTimeout(search, 400); };

    /* --- SCANNER & CAMERA STORAGE --- */
    document.getElementById("scanBtn").onclick = () => { scanning ? stopScan() : startScan(); };

    async function startScan() {
        scanning = true; window.isScanning = true;
        document.getElementById("reader").style.display = "block";
        const videoDevices = await codeReader.listVideoInputDevices();
        const backCams = videoDevices.filter(d => !d.label.toLowerCase().includes('front'));
        let selectedId = localStorage.getItem('preferredCameraId') || (backCams.length > 0 ? backCams[0].deviceId : videoDevices[0].deviceId);

        updateCameraList(videoDevices, selectedId);

        try {
            await codeReader.decodeFromVideoDevice(selectedId, 'videoElement', (result) => {
                if (result && scanning) {
                    document.getElementById("beepOk").play();
                    document.getElementById("searchInput").value = result.text;
                    stopScan();
                    showDetail(result.text);
                }
            });
        } catch (err) { console.error(err); }
    }

    function stopScan() {
        codeReader.reset();
        scanning = false; window.isScanning = false;
        document.getElementById("reader").style.display = "none";
        document.getElementById("cameraControl").style.display = "none";
    }

    function updateCameraList(devices, currentId) {
        const source = document.getElementById("videoSource");
        if (devices.length > 1) {
            document.getElementById("cameraControl").style.display = "block";
            source.innerHTML = devices.map(d => `<option value="${d.deviceId}" ${d.deviceId === currentId ? 'selected' : ''}>${d.label || 'Kamera'}</option>`).join("");
            source.onchange = (e) => { 
                localStorage.setItem('preferredCameraId', e.target.value);
                stopScan(); startScan(); 
            };
        }
    }

    async function showDetail(barcode) {
        lastScroll = document.getElementById("scrollContainer").scrollTop;
        const { data: p } = await _supabase.from('export').select('*').ilike('Barcode', `%${barcode}%`).maybeSingle();
        if (!p) return;
        document.getElementById("listContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "none";
        document.getElementById("detailContainer").style.display = "block";
        document.getElementById("btnBackFloating").style.display = "flex";
        document.getElementById("detailContainer").innerHTML = `
            <div class="product-card">
                <img src="${p.Image || ''}" style="width:100%; height:300px; object-fit:contain; padding:20px;" onclick="openLightbox('${p.Image}')">
                <div style="padding:24px;">
                    <span style="color:red; font-weight:800; font-size:12px;">${p.Category}</span>
                    <h2 style="margin:10px 0;">${p.Name}</h2>
                    <div class="price-comparison-grid">
                        <div class="price-item reg"><small>Regular</small><br><strong>Rp${parseInt(p["Regular Store Price"] || 0).toLocaleString('id-ID')}</strong></div>
                        <div class="price-item"><small>Street</small><br><strong>Rp${parseInt(p["Street Store Price"] || 0).toLocaleString('id-ID')}</strong></div>
                    </div>
                </div>
            </div>`;
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid";
        document.getElementById("btnBackFloating").style.display = "none";
    }

    function openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('active'); }
    function toggleSidebar() { document.getElementById("sidebar").classList.toggle("active"); document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none"; }
</script>

<script>
    let detector;
    let aiActive = false;

    async function initAI() {
        const status = document.getElementById('aiStatus');
        try {
            status.innerText = "⏳ MEMULAI ENGINE AI...";
            detector = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            status.innerText = "✅ AI ONLINE (ARAHKAN KE OBJEK)";
            status.style.color = "#00ff00";
        } catch (e) { 
            status.innerText = "❌ AI OFFLINE";
            status.style.color = "red";
        }
    }

    async function runAIDetection() {
        if (!detector || !window.isScanning) { aiActive = false; return; }
        const video = document.getElementById('videoElement');
        if (!video || video.readyState < 2) { setTimeout(runAIDetection, 500); return; }

        try {
            const predictions = await detector.detect(video);
            if (predictions.length > 0 && window.isScanning) {
                const valid = predictions
                    .filter(p => p.class !== 'person')
                    .sort((a, b) => b.score - a.score)[0];

                if (valid && valid.score > 0.55) {
                    const item = valid.class;
                    document.getElementById('aiStatus').innerText = `🎯 DETEKSI: ${item.toUpperCase()}`;
                    const searchInput = document.getElementById('searchInput');
                    if (searchInput.value !== item) {
                        searchInput.value = item;
                        if (window.search) window.search();
                    }
                }
            }
        } catch (err) { console.warn("AI Busy..."); }
        if(window.isScanning) setTimeout(runAIDetection, 1500);
    }

    window.addEventListener('load', initAI);

    const observer = new MutationObserver(() => {
        const reader = document.getElementById('reader');
        if (reader.style.display === 'block' && !aiActive) {
            aiActive = true;
            runAIDetection();
        }
    });
    observer.observe(document.getElementById('reader'), { attributes: true, attributeFilter: ['style'] });
</script>

</body>
</html>
