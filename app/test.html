<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Fix</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #ffffff; height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }

        /* --- LOGIN OVERLAY --- */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg-gray); z-index: 20000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; width: 90%; max-width: 350px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        .btn-login { width: 100%; height: 50px; background: var(--miniso-red); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* --- HEADER & SCANNER FIX --- */
        #ui-header { background: white; padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px; border-bottom: 1px solid #eee; z-index: 1000; flex-shrink: 0; }
        .top-bar { display: flex; gap: 10px; align-items: center; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; }
        
        /* Tombol Scan dipastikan berada di lapisan atas agar bisa diklik */
        #scanBtn { 
            position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; 
            background: var(--miniso-red); color: white; border: none; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; z-index: 5; 
        }

        /* Container Scanner */
        #reader { 
            display:none; width:100%; max-width:340px; margin:15px auto; 
            background:#000; border-radius:20px; overflow:hidden; 
            border: 4px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
        }

        .main-content { flex: 1; overflow-y: auto; padding: 0 16px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px 0 80px 0; }
        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px; background: white; border-radius: 16px; border: 1px solid #f0f0f0; cursor: pointer; }
        
        /* Detail Page */
        #detailContainer { display: none; padding: 20px 0 80px 0; }
        .product-card { background: white; border-radius: 20px; border: 1px solid #eee; overflow: hidden; }
        .price-val { font-size: 20px; font-weight: 800; color: var(--miniso-red); }

        .floating-back { position: fixed; top: 40px; left: 20px; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 9999; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>MMS-X</h2>
        <input type="text" id="username" placeholder="Username" style="width:100%; margin-bottom:10px; padding:10px; border-radius:8px; border:1px solid #ddd;">
        <input type="password" id="password" placeholder="Password" style="width:100%; margin-bottom:15px; padding:10px; border-radius:8px; border:1px solid #ddd;">
        <button class="btn-login" onclick="checkLogin()">MASUK</button>
    </div>
</div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="appContent">
    <header id="ui-header">
        <div class="top-bar">
            <div class="search-container">
                <input id="searchInput" placeholder="Cari nama / barcode...">
                <button id="scanBtn" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
            </div>
        </div>
        
        <select id="videoSource" style="width:100%; margin-top:10px; padding:8px; border-radius:8px; border:1px solid #eee; font-size:12px;"></select>
        
        <div id="reader"></div>
    </header>

    <main class="main-content">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let html5QrCode;
    let isScanning = false;
    let lastCamId = localStorage.getItem('preferredCameraId'); //

    // 1. Inisialisasi Kamera & Dropdown
    async function initCameras() {
        try {
            const devices = await Html5Qrcode.getCameras();
            const select = document.getElementById('videoSource');
            if (devices && devices.length > 0) {
                select.innerHTML = devices.map(d => `<option value="${d.id}" ${d.id === lastCamId ? 'selected' : ''}>${d.label}</option>`).join('');
                
                // Jika belum pernah simpan kamera, cari yang labelnya mengandung 'back'
                if (!lastCamId) {
                    const backCam = devices.find(d => d.label.toLowerCase().includes('back'));
                    lastCamId = backCam ? backCam.id : devices[0].id;
                    select.value = lastCamId;
                }
            }
        } catch (e) {
            console.error("Izin kamera ditolak");
        }
    }

    // 2. Event Handler Tombol Scan (Memastikan klik terdaftar)
    document.getElementById("scanBtn").addEventListener("click", function(e) {
        e.preventDefault();
        if (isScanning) {
            stopScan();
        } else {
            startScan();
        }
    });

    async function startScan() {
        const readerDiv = document.getElementById("reader");
        readerDiv.style.display = "block";
        document.getElementById("detailContainer").style.display = "none";
        
        isScanning = true;
        html5QrCode = new Html5Qrcode("reader");
        
        const config = { 
            fps: 20, 
            qrbox: { width: 250, height: 150 },
            aspectRatio: 1.0 
        };

        try {
            const selectedId = document.getElementById("videoSource").value;
            await html5QrCode.start(
                selectedId, 
                config, 
                (decodedText) => {
                    document.getElementById("beepOk").play();
                    stopScan();
                    showDetail(decodedText);
                }
            );
        } catch (err) {
            console.error("Gagal start scan:", err);
            stopScan();
        }
    }

    async function stopScan() {
        isScanning = false;
        document.getElementById("reader").style.display = "none";
        if (html5QrCode) {
            try {
                await html5QrCode.stop();
            } catch (e) {}
            html5QrCode = null;
        }
    }

    // Simpan pilihan kamera setiap kali diubah
    document.getElementById("videoSource").onchange = (e) => {
        lastCamId = e.target.value;
        localStorage.setItem('preferredCameraId', lastCamId);
        if (isScanning) {
            stopScan().then(() => startScan());
        }
    };

    /* --- FUNGSI PENDUKUNG --- */
    async function checkLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if(user === "admin" && pass === "123") { // Dummy login
            localStorage.setItem('mms_auth', 'true');
            document.getElementById('loginOverlay').style.display = 'none';
        } else {
            alert("Login Gagal!");
        }
    }

    if(localStorage.getItem('mms_auth') === 'true') {
        document.getElementById('loginOverlay').style.display = 'none';
    }

    async function showDetail(bc) {
        const { data: p } = await _supabase.from('export').select('*').ilike('Barcode', `%${bc}%`).maybeSingle();
        if(!p) return alert("Produk tidak ditemukan");
        
        document.getElementById("ui-header").style.display = "none";
        document.getElementById("listContainer").style.display = "none";
        const det = document.getElementById("detailContainer");
        det.style.display = "block";
        det.innerHTML = `
            <div class="product-card">
                <div style="padding:20px; text-align:center;"><img src="${p.Image || ''}" style="max-width:100%; height:250px; object-fit:contain;"></div>
                <div style="padding:20px;">
                    <h2 style="margin:0;">${p.Name}</h2>
                    <p style="color:red; font-size:24px; font-weight:800;">Rp${parseInt(p["Regular Store Price"] || 0).toLocaleString('id-ID')}</p>
                    <p>Barcode: ${p.Barcode}</p>
                </div>
            </div>
        `;
        document.getElementById("btnBackFloating").style.display = "flex";
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid";
        document.getElementById("btnBackFloating").style.display = "none";
    }

    // Jalankan inisialisasi saat window load
    window.addEventListener('load', () => {
        initCameras();
    });
</script>
</body>
</html>
