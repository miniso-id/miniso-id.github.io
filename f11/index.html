<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F11 PDA iData</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --bg: #f8fafc; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            margin: 0; padding: 0;
            width: 480px; height: 800px; /* Lock PDA Resolution */
            overflow: hidden; 
            display: flex; flex-direction: column;
        }

        /* Container utama dibatasi tinggi agar tidak scroll */
        #main-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .card { 
            background: white; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column;
            height: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        /* Gambar dibuat lebih kecil (maks 35% tinggi layar) */
        .img-area { 
            height: 280px; 
            display: flex; align-items: center; justify-content: center;
            background: #fff; padding: 10px;
            border-bottom: 1px solid #f1f5f9;
        }
        .img-area img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .info-area { 
            flex: 1; 
            padding: 12px; 
            display: flex; flex-direction: column; 
            justify-content: space-between; /* Menjaga harga tetap di bawah */
        }

        .category { font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; }
        
        .product-name { 
            font-size: 1.35rem; color: #1e293b; margin: 4px 0; 
            line-height: 1.2; font-weight: 700;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .barcode { font-family: monospace; font-size: 0.9rem; color: #64748b; margin-bottom: 10px; }

        /* Sektor Harga Dibuat Compact */
        .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .p-box { padding: 10px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; }
        .p-label { font-size: 0.65rem; color: #64748b; font-weight: 800; }
        .p-val { font-size: 1.3rem; font-weight: 800; color: #1e293b; }
        
        .promo-extra {
            background: #fff1f2; padding: 8px 12px; border-radius: 8px;
            border-left: 4px solid var(--danger);
        }
        .promo-extra span { color: var(--danger); font-weight: 800; font-size: 0.85rem; }

        /* Layar Standby */
        .standby { 
            position: absolute; inset: 0; background: var(--bg); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; text-align: center;
        }
        .standby h1 { font-size: 3rem; color: #cbd5e1; margin: 0; }

        .hidden-input { position: absolute; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="standby-screen" class="standby">
        <h1>SCAN</h1>
        <p style="color:#94a3b8">Ready to scan barcode</p>
        <div id="status-db" style="font-size:0.8rem; margin-top:20px;">Checking Database...</div>
    </div>

    <input id="searchInput" class="hidden-input" type="text" autofocus>

    <div id="main-container">
        <div id="result-content" class="card" style="display:none">
            </div>
    </div>

    <audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>
    <audio id="beepErr" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
const SUPABASE_URL = 'https://uesupubktkxfjsylcwwr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const input = document.getElementById("searchInput");
const resultContent = document.getElementById("result-content");
const standbyScreen = document.getElementById("standby-screen");
const statusDb = document.getElementById("status-db");

let isSearching = false;

// Cek Koneksi
async function checkConn() {
    const { error } = await supabaseClient.from('export').select('count', { count: 'exact', head: true });
    statusDb.innerText = error ? "OFFLINE" : "ONLINE - iData Ready";
    statusDb.style.color = error ? "red" : "green";
}
checkConn();

async function search(q) {
    if (isSearching) return;
    isSearching = true;

    try {
        const { data, error } = await supabaseClient.rpc('get_product_cached', { search_term: q.trim() });
        if (error || !data || data.length === 0) throw new Error();

        document.getElementById("beepOk").play().catch(()=>{});
        render(data[0]);
        standbyScreen.style.display = "none";
        resultContent.style.display = "flex";
    } catch (err) {
        document.getElementById("beepErr").play().catch(()=>{});
        alert("Produk Tidak Ditemukan!");
        resetUI();
    } finally {
        isSearching = false;
    }
}

function resetUI() {
    resultContent.style.display = "none";
    standbyScreen.style.display = "flex";
    input.focus();
}

function render(p) {
    const clean = (val) => (!val || val === "NORMAL PRICE" || val === "NORMAL") ? "" : val;
    
    resultContent.innerHTML = `
        <div class="img-area">
            <img src="${p.Image || p.image || 'https://placehold.co/300x300'}" onerror="this.src='https://placehold.co/300x300'">
        </div>
        <div class="info-area">
            <div>
                <div class="category">${p.Category || '-'}</div>
                <h2 class="product-name">${p.Name || p.name || 'Produk'}</h2>
                <div class="barcode">${p.Barcode || p.barcode || '-'}</div>
            </div>

            <div class="price-section">
                <div class="price-grid">
                    <div class="p-box">
                        <div class="p-label">REGULAR</div>
                        <div class="p-val">${p["Regular Store Price"] || '0'}</div>
                        <div style="color:var(--danger); font-size:0.6rem; font-weight:bold">${clean(p["Regular Store Promo"])}</div>
                    </div>
                    <div class="p-box" style="border-color:#bae6fd; background:#f0f9ff">
                        <div class="p-label" style="color:#0369a1">STREET</div>
                        <div class="p-val" style="color:#0369a1">${p["Street Store Price"] || '0'}</div>
                        <div style="color:#0369a1; font-size:0.6rem; font-weight:bold">${clean(p["Street Store Promo"])}</div>
                    </div>
                </div>
                
                ${clean(p["Extra Promo"]) ? `
                <div class="promo-extra">
                    <div class="p-label" style="color:var(--danger)">SPECIAL</div>
                    <span>${p["Extra Promo"]}</span>
                </div>` : '<div style="height:45px"></div>'}
            </div>
        </div>
    `;
}

// PDA Scanner Focus
document.addEventListener('click', () => input.focus());
setInterval(() => { if(document.activeElement !== input) input.focus(); }, 800);

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        if(input.value) search(input.value);
        input.value = "";
    }
});
window.onload = () => input.focus();
</script>
</body>
</html>
