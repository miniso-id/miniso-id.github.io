<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>MMS – Miniso Management System</title>

<!-- ===== PWA ===== -->
<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#ffffff">

<!-- ===== iOS PWA ===== -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MMS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<!-- ===== BASIC STYLE ===== -->
<style>
/* Safe area (notch / dynamic island) */
body {
  margin: 0;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* Disable pull to refresh (iOS feel) */
html, body {
  overscroll-behavior-y: contain;
  touch-action: manipulation;
}

/* Example header */
.header {
  height: 56px;
  background: #111;
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 16px;
}

/* ===== PWA MODE ===== */
.pwa-mode .header {
  display: none !important;
}

/* ===== iOS INSTALL BANNER ===== */
#ios-pwa-banner {
  display: none;
}

.pwa-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #111;
  color: #fff;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 9999;
}

.pwa-bar button {
  background: none;
  border: none;
  color: #fff;
  font-size: 18px;
}

.pwa-tip {
  position: fixed;
  bottom: 56px;
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
  z-index: 9999;
}
</style>
</head>

<body>

<!-- HEADER (auto hide di PWA) -->
<div class="header">
  MMS – Miniso Management System
</div>

<!-- ===== CONTENT ===== -->
<main style="padding:16px">
  <h2>Welcome 👋</h2>
  <p>Web ini sudah siap dipakai sebagai aplikasi iOS via Add to Home Screen.</p>
</main>

<!-- ===== iOS INSTALL BANNER ===== -->
<div id="ios-pwa-banner">
  <div class="pwa-bar">
    <span>📲 Tambahkan MMS ke Home Screen</span>
    <button onclick="closePWABanner()">✕</button>
  </div>
  <div class="pwa-tip">
    Tap <b>Share</b> ➜ <b>Add to Home Screen</b>
  </div>
</div>

<!-- ===== SCRIPT ===== -->
<script>
/* ===== Detect PWA Mode ===== */
const isPWA =
  window.matchMedia('(display-mode: standalone)').matches ||
  window.navigator.standalone === true;

if (isPWA) {
  document.documentElement.classList.add("pwa-mode");
}

/* ===== iOS Install Banner ===== */
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const bannerSeen = localStorage.getItem("mms_pwa_banner");

if (isIOS && !isPWA && !bannerSeen) {
  document.getElementById("ios-pwa-banner").style.display = "block";
}

function closePWABanner() {
  localStorage.setItem("mms_pwa_banner", "1");
  document.getElementById("ios-pwa-banner").style.display = "none";
}

/* ===== Service Worker Register + Auto Update ===== */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").then(reg => {
    reg.onupdatefound = () => {
      location.reload();
    };
  });
}
</script>

</body>
</html>
