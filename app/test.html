    <meta name="description" content="Internal Retail Support Tool">
    <meta name="author" content="MMS-X Development">
    <title>MMS-X</title>

    <script>
    if (typeof navigator.serviceWorker !== 'undefined') {
        navigator.serviceWorker.register('sw.js')
    }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* ... (semua CSS sebelumnya tidak berubah, hanya tambahan di bawah) ... */

        /* Tambahan untuk transisi login & app */
        #loginOverlay {
            transition: opacity 0.25s ease;
        }
        #appContent {
            transition: opacity 0.25s ease;
            opacity: 0; /* mulai transparan, akan diubah oleh showApp */
        }
    </style>
</head>
<body>
    <!-- semua elemen HTML sama seperti sebelumnya -->

    <script>
        // ... (kode force update, supabase, dll. tidak berubah) ...

        // ========== MODIFIKASI showApp ==========
        function showApp(instant = false) {
            const loginOverlay = document.getElementById('loginOverlay');
            const appContent = document.getElementById('appContent');
            const displayUsername = document.getElementById('displayUsername');

            // Isi data user
            displayUsername.innerText = localStorage.getItem('mms_user') || 'User';
            setVersionTexts();
            checkPermissions();

            if (instant) {
                // Langsung tampilkan tanpa transisi (saat reload dengan sesi tersimpan)
                loginOverlay.style.display = 'none';
                appContent.style.display = 'flex';
                appContent.style.opacity = '1';
                fetchIndonesianHoliday();
                return;
            }

            // Transisi setelah login berhasil
            loginOverlay.style.transition = 'opacity 0.25s ease';
            loginOverlay.style.opacity = '0';

            setTimeout(() => {
                loginOverlay.style.display = 'none';
                appContent.style.display = 'flex';
                appContent.style.opacity = '0';
                appContent.style.transition = 'opacity 0.25s ease';

                requestAnimationFrame(() => {
                    appContent.style.opacity = '1';
                });

                fetchIndonesianHoliday();
            }, 250);
        }

        // ========== MODIFIKASI window.onload ==========
        window.onload = () => {
            document.body.classList.add('fade-in');
            setVersionTexts();
            if (localStorage.getItem('mms_auth') === 'true') {
                showApp(true); // instant = true agar langsung muncul tanpa animasi ganda
            }
            injectLangSwitcher();
            updateOnlineStatus();
        };

        // ========== MODIFIKASI attemptLogin (panggil showApp() tanpa parameter) ==========
        async function attemptLogin() {
            // ... (validasi, supabase) ...
            if (data) {
                // ... set localStorage ...
                showApp(); // panggil tanpa instant, jadi pakai transisi
            }
            // ...
        }

        // (fungsi‑fungsi lain tidak berubah)
    </script>
</body>
</html>
