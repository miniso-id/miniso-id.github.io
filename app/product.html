<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Deluxe v3.9</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --bg-gray: #f2f2f7;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; 
            background: #ffffff; color: var(--text-dark); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- LOGIN --- */
        #loginScreen {
            position: fixed; inset: 0; background: white; z-index: 9000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
        }
        .login-input {
            width: 100%; max-width: 340px; padding: 16px; margin-bottom: 12px; 
            border: 1.5px solid #eee; border-radius: 14px; font-size: 16px;
        }
        .btn-login {
            width: 100%; max-width: 340px; padding: 16px; background: var(--miniso-red); 
            color: white; border: none; border-radius: 14px; font-weight: bold;
        }

        /* --- STICKY HEADER --- */
        #ui-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 16px 16px 8px 16px;
            border-bottom: 1px solid #eee;
            z-index: 1000;
            position: sticky;
            top: 0;
        }
        .top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        
        .search-container { position: relative; flex: 1; }
        #searchInput { 
            width: 100%; height: 46px; padding: 0 45px 0 15px; 
            border-radius: 14px; border: 1.5px solid #eee; 
            background: #f2f2f7; outline: none; font-size: 15px;
        }
        #scanBtn { 
            position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; 
            background: var(--miniso-red); color: white; border: none; border-radius: 10px; font-size: 18px; 
        }

        /* --- SCROLLABLE CONTENT --- */
        .main-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 0 16px; 
            -webkit-overflow-scrolling: touch; 
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width); background: var(--miniso-red); color: #fff;
            position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 5000; padding: 25px;
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 5px; font-weight: 600; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 4000; display: none; backdrop-filter: blur(4px); }

        /* --- LIST ITEMS --- */
        .search-item { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .thumb-img { width: 65px; height: 65px; border-radius: 10px; object-fit: contain; background: #f9f9f9; }
        
        #reader { display: none; width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 10px; border: 3px solid var(--miniso-red); }
        #loader { display: none; text-align: center; color: var(--miniso-red); padding: 15px; font-weight: bold; }

        /* --- FLOATING BACK BUTTON --- */
        .floating-back {
            position: fixed; top: 20px; left: 20px; width: 45px; height: 45px; 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-radius: 50%; display: none; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 8000; cursor: pointer;
            border: 1px solid rgba(0,0,0,0.05); color: var(--text-dark);
        }

        .product-detail-card { display: none; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); padding-bottom: 50px; }
        .price-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .price-item { background: var(--bg-gray); padding: 15px; border-radius: 16px; text-align: center; }
        .barcode-img-container { background: white; padding: 20px; border-radius: 20px; border: 1px dashed #ccc; text-align: center; margin-top: 20px; }

        /* --- IMAGE MODAL --- */
        #imgModal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 9999; backdrop-filter: blur(15px); align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        #imgModal.active { display: flex; opacity: 1; }
        #modalImg { max-width: 90%; max-height: 80%; transform: scale(0.8); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #imgModal.active #modalImg { transform: scale(1); }

        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="imgModal" onclick="closeImgModal()">
    <img id="modalImg" src="">
</div>

<div id="loginScreen">
    <h1 style="color:var(--miniso-red); font-size: 3.5rem; margin-bottom: 0; letter-spacing: -3px; font-weight: 900;">MINISO</h1>
    <p style="color:#888; margin-bottom: 30px; font-weight: 500;">Inventory System v3.9</p>
    <input type="text" id="username" class="login-input" placeholder="Username">
    <input type="password" id="password" class="login-input" placeholder="Password">
    <button class="btn-login" onclick="handleLogin()">MASUK</button>
</div>

<div id="appContent" style="display:none; height: 100vh; flex-direction: column;">
    
    <div id="sidebar" class="sidebar">
        <h2 style="font-weight: 900; letter-spacing: -1px;">MMS-X</h2>
        <a href="#" style="background: rgba(255,255,255,0.2);">🔍 Price Checker</a>
        <a href="https://miniso-id.github.io/so/">📦 Stock Opname</a>
        <a href="#" onclick="handleLogout()" style="margin-top: 50px; opacity: 0.7;">Logout</a>
    </div>
    <div id="overlay" onclick="toggleSidebar()"></div>

    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none; font-size:24px; padding:0 5px;">☰</button>
            <div class="search-container">
                <input id="searchInput" placeholder="Cari nama / barcode...">
                <button id="scanBtn">📸</button>
            </div>
        </div>
        <select id="catFilter" style="width:100%; padding:12px; border-radius:12px; border:1px solid #eee; background: #fff; font-weight: bold;">
            <option value="">Semua Kategori</option>
        </select>
        <div id="reader"></div>
        <div id="loader">Memproses...</div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer" class="product-detail-card"></div>
    </main>
</div>

<audio id="beep" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabaseco"; // Fix this URL if broken
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient("https://uesupubktkxfjsylcwwr.supabase.co", SUPABASE_KEY);

    let scanning = false, lastScroll = 0, timer;
    const input = document.getElementById("searchInput");
    const catFilter = document.getElementById("catFilter");
    const listCont = document.getElementById("listContainer");
    const detCont = document.getElementById("detailContainer");
    const header = document.getElementById("ui-header");
    const floatingBack = document.getElementById("btnBackFloating");

    function cleanPrice(val) {
        if(!val) return "Rp0";
        let str = String(val).replace(/Rp/g, "").replace(/\./g, "").trim();
        let num = parseInt(str) || 0;
        return "Rp" + num.toLocaleString('id-ID');
    }

    function openImgModal(src) {
        if(!src || src.includes('placehold.co')) return;
        const modal = document.getElementById('imgModal');
        document.getElementById('modalImg').src = src;
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeImgModal() {
        const modal = document.getElementById('imgModal');
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 300);
    }

    function handleLogin() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        if((u === "admin" && p === "miniso123") || (u === "ID12" && p === "12121212")) {
            sessionStorage.setItem("logged", "true");
            location.reload();
        } else { alert("Login Gagal"); }
    }
    function handleLogout() { sessionStorage.clear(); location.reload(); }
    function toggleSidebar() { 
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }

    async function init() {
        if(sessionStorage.getItem("logged") !== "true") return;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appContent").style.display = "flex";
        loadCategories();
    }

    async function loadCategories() {
        const { data } = await _supabase.from('export').select('Category');
        if(data) {
            const cats = [...new Set(data.map(i => i.Category))].filter(Boolean).sort();
            cats.forEach(c => {
                const opt = document.createElement("option");
                opt.value = opt.textContent = c;
                catFilter.appendChild(opt);
            });
        }
    }

    input.oninput = () => { clearTimeout(timer); timer = setTimeout(search, 500); };
    catFilter.onchange = search;

    async function search() {
        const q = input.value.trim();
        const c = catFilter.value;
        if(!q && !c) { listCont.innerHTML = ""; return; }
        detCont.style.display = "none";
        listCont.style.display = "block";
        document.getElementById("loader").style.display = "block";

        let query = _supabase.from('export').select('*');
        if(q) query = query.or(`Name.ilike.%${q}%,Barcode.eq.${q}`);
        if(c) query = query.eq('Category', c);

        const { data } = await query.limit(50);
        document.getElementById("loader").style.display = "none";
        if(data) renderList(data);
    }

    function renderList(data) {
        listCont.innerHTML = data.map(p => `
            <div class="search-item" onclick="showDetail('${p.Barcode}')">
                <img class="thumb-img" src="${p.Image || ''}" 
                     onclick="event.stopPropagation(); openImgModal(this.src)" 
                     onerror="this.src='https://placehold.co/100x100?text=No+Img'">
                <div style="flex:1">
                    <small style="color:var(--miniso-red); font-weight:bold;">${p.Category || 'GENERAL'}</small>
                    <div style="font-weight:bold; font-size:14px; line-height:1.2;">${p.Name || ''}</div>
                    <div style="font-size:11px; color:#666; margin-top:2px;">${p.Barcode}</div>
                </div>
                <div style="font-weight:bold; color:var(--miniso-red);">${cleanPrice(p["Regular Store Price"])}</div>
            </div>
        `).join('');
    }

    async function showDetail(fullBarcode) {
        lastScroll = document.getElementById("scrollContainer").scrollTop;
        document.getElementById("loader").style.display = "block";

        const { data } = await _supabase.from('export').select('*').eq('Barcode', fullBarcode).maybeSingle();
        document.getElementById("loader").style.display = "none";

        if(data) {
            listCont.style.display = "none";
            header.style.display = "none"; // Sembunyikan search saat detail
            detCont.style.display = "block";
            floatingBack.style.display = "flex";

            const rawString = String(data.Barcode).trim();
            const barcodeForImg = rawString.includes('/') ? rawString.split('/')[0] : rawString;
            const bcType = barcodeForImg.length === 13 ? 'ean13' : 'code128';
            const bcUrl = `https://bwipjs-api.metafloor.com/?bcid=${bcType}&text=${barcodeForImg}&scale=3&rotate=N&includetext`;

            detCont.innerHTML = `
                <div style="text-align:center; margin-bottom: 20px;">
                    <img src="${data.Image || ''}" 
                         style="width:100%; max-height:380px; object-fit:contain; border-radius:0 0 30px 30px; background:#fff;" 
                         onclick="openImgModal(this.src)"
                         onerror="this.src='https://placehold.co/300x300?text=No+Image'">
                </div>
                <div style="padding:0 5px;">
                    <small style="color:var(--miniso-red); font-weight:bold; letter-spacing:1px;">${data.Category || 'GENERAL'}</small>
                    <h2 style="margin:5px 0 20px 0; font-size: 26px; line-height:1.1; font-weight: 800;">${data.Name || ''}</h2>
                    
                    <div class="price-box">
                        <div class="price-item"><small style="color:#888">Regular Store</small><br><b style="color:var(--miniso-red); font-size:18px;">${cleanPrice(data["Regular Store Price"])}</b></div>
                        <div class="price-item"><small style="color:#888">Street Store</small><br><b style="font-size:18px;">${cleanPrice(data["Street Store Price"])}</b></div>
                    </div>

                    <div style="background:var(--miniso-soft); padding:20px; border-radius:24px; font-size:14px; border: 1px solid rgba(230,21,35,0.1);">
                        <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
                            <span style="color:#666;">Regular Promo:</span> 
                            <b style="color:#007aff; text-align:right;">${data["Regular Store Promo"] || "NORMAL PRICE"}</b>
                        </div>
                        <div style="display:flex; justify-content:space-between;">
                            <span style="color:#666;">Street Promo:</span> 
                            <b style="color:#34c759; text-align:right;">${data["Street Store Promo"] || "NORMAL PRICE"}</b>
                        </div>
                    </div>

                    <div class="barcode-img-container">
                        <img src="${bcUrl}" style="max-width:100%;">
                        <div style="margin-top:12px; font-weight:bold; font-size:13px; word-break: break-all; color:#555;">${rawString}</div>
                    </div>
                </div>
            `;
            document.getElementById("scrollContainer").scrollTop = 0;
        }
    }

    function back() {
        detCont.style.display = "none";
        floatingBack.style.display = "none";
        header.style.display = "block";
        listCont.style.display = "block";
        document.getElementById("scrollContainer").scrollTop = lastScroll;
    }

    document.getElementById("scanBtn").onclick = () => {
        const reader = document.getElementById("reader");
        if(scanning) { Quagga.stop(); scanning = false; reader.style.display = "none"; }
        else {
            scanning = true;
            reader.style.display = "block";
            Quagga.init({
                inputStream: { type: "LiveStream", target: reader, constraints: { facingMode: "environment" } },
                decoder: { readers: ["ean_reader", "code_128_reader"] }
            }, (err) => { if(!err) Quagga.start(); });
        }
    };

    Quagga.onDetected(res => {
        document.getElementById("beep").play();
        Quagga.stop(); scanning = false;
        document.getElementById("reader").style.display = "none";
        showDetail(res.codeResult.code);
    });

    window.onload = init;
</script>
</body>
</html>
