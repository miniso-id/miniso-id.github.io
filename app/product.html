<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Final Online</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --bg-gray: #f2f2f7;
            --sidebar-width: 280px;
            --shadow-soft: 0 4px 20px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; 
            background: #ffffff; color: var(--text-dark); 
            height: 100vh; overflow: hidden; 
        }

        /* --- LOGIN SCREEN --- */
        #loginScreen {
            position: fixed; inset: 0; background: white; z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
        }
        .login-card { width: 100%; max-width: 340px; text-align: center; }
        .login-card h1 { color: var(--miniso-red); font-size: 3rem; margin-bottom: 5px; font-weight: 900; letter-spacing: -2px; }
        .login-input {
            width: 100%; padding: 16px; margin-bottom: 12px; border: 1.5px solid #eee;
            border-radius: 14px; outline: none; font-size: 16px; background: #f9f9f9;
        }
        .btn-login {
            width: 100%; padding: 16px; background: var(--miniso-red); color: white;
            border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer;
        }

        /* --- APP WRAPPER --- */
        #appContent { display: none; height: 100vh; width: 100%; flex-direction: column; }
        .app-wrapper { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width); background-color: var(--miniso-red); color: #fff;
            display: flex; flex-direction: column; padding: 25px; z-index: 2000; flex-shrink: 0;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar h2 { font-size: 1.8rem; font-weight: 900; }
        .sidebar a { text-decoration: none; color: #fff; padding: 14px 18px; margin-bottom: 8px; border-radius: 12px; display: block; font-weight: 600; }
        .logout-btn { margin-top: auto; background: rgba(0,0,0,0.1) !important; text-align: center; }

        #overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1500; 
            opacity: 0; visibility: hidden; backdrop-filter: blur(4px); transition: 0.3s;
        }
        #overlay.active { opacity: 1; visibility: visible; }

        /* --- MAIN AREA --- */
        .main-content { flex: 1; overflow-y: auto; position: relative; padding: 16px; background: #fff; }
        .top-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; position: sticky; top: 0; background: white; z-index: 100; padding: 5px 0; }
        .menu-toggle { background: var(--miniso-soft); color: var(--miniso-red); border: none; width: 44px; height: 44px; border-radius: 12px; font-size: 20px; }
        
        .search-container { position: relative; flex-grow: 1; }
        #searchInput { width: 100%; height: 44px; padding: 0 45px 0 15px; border: 1.5px solid #eee; border-radius: 12px; outline: none; background: #f5f5f7; font-size: 16px; }
        #scanBtn { background: var(--miniso-red); color: white; border: none; width: 36px; height: 36px; border-radius: 9px; position: absolute; right: 4px; top: 4px; display: flex; align-items: center; justify-content: center; }

        /* --- SCANNER --- */
        #reader { display:none; width:100%; max-width:350px; aspect-ratio:1/1; margin:10px auto; border-radius:24px; overflow:hidden; position:relative; border: 4px solid var(--miniso-red); }
        #reader video { width: 100%; height: 100%; object-fit: cover; }

        /* --- LIST & ITEMS --- */
        .search-item { padding: 12px; border-radius: 16px; background: white; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; border: 1px solid #f0f0f0; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .thumb-img { width: 55px; height: 55px; object-fit: contain; border-radius: 10px; background: #f9f9f9; }

        /* --- DETAIL --- */
        .product-card { background: white; border-radius: 24px; display: none; animation: slideUp 0.3s ease-out; }
        .price-item { background: var(--bg-gray); padding: 15px; border-radius: 16px; text-align: center; }
        
        #imagePopup { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:6000; align-items:center; justify-content:center; }
        #popupImg { max-width: 90%; max-height: 80%; border-radius: 10px; }

        #loader { display: none; text-align: center; padding: 20px; color: #888; font-style: italic; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card">
        <h1>MINISO</h1>
        <p style="color:#8e8e93; margin-bottom:30px;">Product Checker Online v3.0</p>
        <input type="text" id="username" class="login-input" placeholder="Username">
        <input type="password" id="password" class="login-input" placeholder="Password">
        <button class="btn-login" onclick="handleLogin()">MASUK</button>
    </div>
</div>

<div id="appContent">
    <div id="imagePopup" onclick="this.style.display='none'">
        <img id="popupImg" src="">
    </div>

    <div class="app-wrapper">
        <nav class="sidebar" id="sidebar">
            <h2>MMS-X</h2>
            <div id="userDisplay" style="font-size: 13px; margin-bottom: 30px; opacity: 0.8;"></div>
            <a href="#" onclick="toggleSidebar()" style="background:rgba(255,255,255,0.15)">📸 Price Check</a>
            <a href="https://miniso-id.github.io/so/">📦 Stock Opname ID12</a>
            <a href="#" class="logout-btn" onclick="handleLogout()">LOGOUT</a>
        </nav>
        <div id="overlay" onclick="toggleSidebar()"></div>

        <main class="main-content" id="scrollContainer">
            <div id="ui-controls">
                <div class="top-bar">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <div class="search-container">
                        <input id="searchInput" placeholder="Cari Nama / Scan Barcode...">
                        <button id="scanBtn" onclick="toggleScanner()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2m-10 0H5a2 2 0 0 1-2-2v-2"></path></svg>
                        </button>
                    </div>
                </div>
                <div id="reader"></div>
                <div id="loader">Menghubungkan ke database...</div>
            </div>

            <div id="listContainer"></div>
            <div id="detailContainer" class="product-card"></div>
        </main>
    </div>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const USERS = { "admin": "miniso123", "ID12": "12121212" };

    // --- AUTH ---
    function handleLogin() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        if(USERS[u] === p) {
            sessionStorage.setItem("isLoggedIn", "true");
            sessionStorage.setItem("activeUser", u);
            location.reload();
        } else { alert("User atau Password salah!"); }
    }
    function handleLogout() { sessionStorage.clear(); location.reload(); }
    function toggleSidebar() { 
        document.getElementById("sidebar").classList.toggle("active"); 
        document.getElementById("overlay").classList.toggle("active"); 
    }

    if(sessionStorage.getItem("isLoggedIn") === "true") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appContent").style.display = "flex";
        document.getElementById("userDisplay").textContent = "User: " + sessionStorage.getItem("activeUser");
    }

    // --- SEARCH ---
    const input = document.getElementById("searchInput");
    const listContainer = document.getElementById("listContainer");
    const detailContainer = document.getElementById("detailContainer");
    const loader = document.getElementById("loader");

    let typingTimer;
    input.oninput = () => {
        clearTimeout(typingTimer);
        const q = input.value.trim();
        if (q.length < 3) { listContainer.innerHTML = ""; return; }
        typingTimer = setTimeout(() => performSearch(q), 500);
    };

    async function performSearch(q) {
        detailContainer.style.display = "none";
        listContainer.style.display = "block";
        loader.style.display = "block";
        
        try {
            const { data, error } = await _supabase
                .from('export')
                .select('*')
                .or(`Name.ilike.%${q}%,Barcode.eq.${q}`)
                .limit(25);

            loader.style.display = "none";
            if (error) throw error;
            renderList(data);
        } catch (err) { loader.textContent = "Koneksi Bermasalah."; }
    }

    function renderList(data) {
        if (!data || data.length === 0) {
            listContainer.innerHTML = "<p style='text-align:center; padding:20px;'>Produk tidak ditemukan.</p>";
            return;
        }
        listContainer.innerHTML = data.map(p => `
            <div class="search-item" onclick="getDetail('${p.Barcode}')">
                <img class="thumb-img" src="${p.Image || ''}" onerror="this.style.visibility='hidden'">
                <div style="flex:1">
                    <div style="font-size:10px; font-weight:bold; color:var(--miniso-red);">${p.Category || ''}</div>
                    <div style="font-size:14px; font-weight:700;">${p.Name}</div>
                    <div style="font-size:11px; color:#999;">${p.Barcode}</div>
                </div>
                <div style="font-weight:800; color:var(--miniso-red); font-size:14px;">Rp${(p["Regular Store Price"] || 0).toLocaleString('id-ID')}</div>
            </div>
        `).join('');
    }

    // --- DETAIL ---
    async function getDetail(barcode) {
        loader.style.display = "block";
        const { data, error } = await _supabase.from('export').select('*').eq('Barcode', barcode).maybeSingle();
        loader.style.display = "none";
        if (data) renderDetail(data);
    }

    function renderDetail(p) {
        listContainer.style.display = "none";
        detailContainer.style.display = "block";
        document.getElementById("ui-controls").style.display = "none";
        
        const barcodeApi = `https://bwipjs-api.metafloor.com/?bcid=ean13&text=${p.Barcode}&scale=3&rotate=N&includetext`;

        detailContainer.innerHTML = `
            <div style="text-align:center; padding:20px; position:relative;">
                <img src="${p.Image || ''}" style="max-width:100%; max-height:280px;" onclick="zoomImg('${p.Image}')">
            </div>
            <div style="padding:15px;">
                <span style="color:var(--miniso-red); font-weight:800; font-size:12px;">${p.Category || ''}</span>
                <h2 style="margin:5px 0 20px 0; font-size:20px;">${p.Name}</h2>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="price-item"><small>Regular:</small><br><b style="color:var(--miniso-red);">Rp${(p["Regular Store Price"] || 0).toLocaleString('id-ID')}</b></div>
                    <div class="price-item"><small>Street:</small><br><b>Rp${(p["Street Store Price"] || 0).toLocaleString('id-ID')}</b></div>
                </div>
                <div style="margin-top:15px; background:#f9f9f9; padding:15px; border-radius:16px; font-size:13px;">
                    <div style="display:flex; justify-content:space-between;"><span>Promo Reg:</span> <b>${p["Regular Promo"] || '-'}</b></div>
                    <div style="display:flex; justify-content:space-between; margin-top:8px;"><span>Promo Street:</span> <b>${p["Street Store Promo"] || '-'}</b></div>
                    <div style="margin-top:8px; color:var(--miniso-red); font-weight:bold; text-align:center;">${p["Extra Promo"] || ''}</div>
                </div>
                <div style="text-align:center; margin-top:20px; padding:15px; border:1px dashed #ccc; border-radius:15px;">
                    <img src="${barcodeApi}" style="max-width:200px;">
                    <div style="font-weight:bold; margin-top:5px;">${p.Barcode}</div>
                </div>
                <button onclick="closeDetail()" style="width:100%; margin:20px 0; padding:18px; background:var(--miniso-red); color:white; border:none; border-radius:16px; font-weight:bold; font-size:16px;">KEMBALI</button>
            </div>
        `;
    }

    function closeDetail() {
        detailContainer.style.display = "none";
        listContainer.style.display = "block";
        document.getElementById("ui-controls").style.display = "block";
    }

    function zoomImg(src) {
        if(!src) return;
        document.getElementById("popupImg").src = src;
        document.getElementById("imagePopup").style.display = "flex";
    }

    // --- SCANNER ---
    let scanning = false;
    function toggleScanner() {
        if(scanning) { stopScan(); return; }
        scanning = true;
        document.getElementById("reader").style.display = "block";
        Quagga.init({
            inputStream: { type: "LiveStream", target: document.getElementById("reader"), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "code_128_reader"] },
            locate: true
        }, (err) => {
            if (err) { alert("Kamera tidak diizinkan."); stopScan(); return; }
            Quagga.start();
        });
    }

    Quagga.onDetected(res => {
        const code = res.codeResult.code;
        document.getElementById("beepOk").play().catch(()=>{});
        stopScan();
        input.value = code;
        getDetail(code);
    });

    function stopScan() {
        Quagga.stop();
        scanning = false;
        document.getElementById("reader").style.display = "none";
    }
</script>
</body>
</html>
