<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Responsive</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root { --miniso-red: #e61523; --bg-gray: #f4f4f4; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        header { padding: calc(20px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid #eee; background: white; }
        .top-bar { display: flex; gap: 10px; align-items: center; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; padding: 0 50px 0 15px; outline: none; box-sizing: border-box; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        #cameraSelect { width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px solid #ddd; font-size: 13px; }

        #scannerWrapper { display: none; width: 92%; max-width: 350px; margin: 15px auto; border-radius: 24px; overflow: hidden; border: 4px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #reader { width: 100%; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 16px; }
        .list-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; }
        .product-card { text-align: center; }
        .product-card img { width: 100%; max-width: 280px; border-radius: 20px; }
        .price-text { color: var(--miniso-red); font-size: 28px; font-weight: 800; }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="search-container">
            <input id="searchInput" placeholder="Cari barcode atau nama...">
            <button id="scanBtn">📸</button>
        </div>
    </div>
    <select id="cameraSelect"></select>
    <div id="scannerWrapper"><div id="reader"></div></div>
</header>

<main class="main-content">
    <div id="listContainer"></div>
    <div id="detailContainer" style="display: none;"></div>
</main>

<audio id="beep" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let html5QrCode;
    let isScanning = false;

    async function setupApp() {
        const devices = await Html5Qrcode.getCameras();
        const select = document.getElementById('cameraSelect');
        if (devices && devices.length > 0) {
            select.innerHTML = devices.map(d => `<option value="${d.id}">${d.label}</option>`).join('');
            const lastCam = localStorage.getItem('mms_last_cam');
            if (lastCam) select.value = lastCam;
        }
        select.onchange = () => {
            localStorage.setItem('mms_last_cam', select.value);
            if (isScanning) restartScanner();
        };
    }

    document.getElementById('scanBtn').onclick = () => isScanning ? stopScanner() : startScanner();

    async function startScanner() {
        isScanning = true;
        document.getElementById('scannerWrapper').style.display = 'block';
        document.getElementById('detailContainer').style.display = 'none';
        html5QrCode = new Html5Qrcode("reader");
        try {
            await html5QrCode.start(
                document.getElementById('cameraSelect').value, 
                { fps: 20, qrbox: { width: 250, height: 150 } },
                (code) => {
                    document.getElementById('beep').play();
                    stopScanner();
                    fetchData(code);
                }
            );
        } catch (err) { stopScanner(); }
    }

    async function stopScanner() {
        isScanning = false;
        document.getElementById('scannerWrapper').style.display = 'none';
        if (html5QrCode) await html5QrCode.stop();
    }

    async function fetchData(code) {
        const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${code}%`).maybeSingle();
        if (data) renderProduct(data);
    }

    function renderProduct(p) {
        document.getElementById('listContainer').style.display = 'none';
        const det = document.getElementById('detailContainer');
        det.style.display = 'block';
        det.innerHTML = `
            <div class="product-card">
                <div style="text-align:left; cursor:pointer; padding:10px;" onclick="location.reload()"><b>← KEMBALI</b></div>
                <img src="${p.Image || ''}">
                <h2>${p.Name}</h2>
                <div class="price-text">Rp${parseInt(p["Regular Store Price"] || 0).toLocaleString()}</div>
                <p>Barcode: ${p.Barcode}</p>
            </div>
        `;
    }

    window.onload = setupApp;
</script>
</body>
</html>
