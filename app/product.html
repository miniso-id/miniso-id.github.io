<!DOCTYPE html>
<html lang="id">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MMS-X</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>

<style>
:root{
--miniso-red:#e61523;
--miniso-soft:#fff1f2;
--text-dark:#1a1a1a;
--promo-blue:#007bff;
--promo-green:#28a745;
--bg-gray:#f4f4f4;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
margin:0;
font-family:-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#fff;color:var(--text-dark);
height:100vh;display:flex;flex-direction:column;overflow:hidden;
}

/* HEADER */
#ui-header{
background:rgba(255,255,255,.95);
backdrop-filter:blur(14px);
padding:16px;
border-bottom:1px solid #eee;
position:sticky;top:0;z-index:1000
}
.top-bar{
display:flex;gap:10px;align-items:center;
max-width:1200px;margin:auto
}
.search-container{flex:1;position:relative}
#searchInput{
width:100%;height:46px;border-radius:14px;
border:1.5px solid #eee;padding:0 50px 0 15px;
background:#f2f2f7;font-size:15px
}
#scanBtn{
position:absolute;right:6px;top:6px;
width:38px;height:34px;border:none;
background:var(--miniso-red);color:#fff;
border-radius:10px
}
#categoryFilter{
margin-top:10px;width:100%;
padding:10px;border-radius:12px;
border:1.5px solid #eee;
background:#f2f2f7;font-weight:600
}

/* MAIN */
.main-content{
flex:1;overflow-y:auto;
padding:0 16px
}

/* PRODUCT LIST */
#listContainer{
display:grid;
gap:12px;
padding:15px 0 80px;
}

.product-list-item{
display:flex;
gap:12px;
padding:14px;
border-radius:16px;
background:#fff;
box-shadow:0 3px 12px rgba(0,0,0,.06);
cursor:pointer;
transition:.2s;
overflow:hidden;
}

.product-list-item:hover{transform:translateY(-2px)}

.product-list-img{
width:70px;height:70px;
object-fit:contain;
border-radius:12px;
background:#f8f8f8;
flex-shrink:0;
}

.product-list-content{flex:1;min-width:0}

.product-list-title{
font-weight:700;font-size:14px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.product-list-barcode{font-size:11px;color:#888}
.product-list-category{
font-size:11px;font-weight:700;
color:var(--miniso-red)
}
.product-list-category-detail{
font-size:11px;color:#666;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

/* GRID DESKTOP */
@media(min-width:768px){
#listContainer{
grid-template-columns:repeat(auto-fill,minmax(320px,1fr))
}
}

/* DETAIL CARD */
.product-card{
background:#fff;border-radius:18px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
overflow:hidden;max-width:800px;margin:auto
}
.image-box{text-align:center;padding:15px;position:relative}
.image-box img{max-width:100%;height:260px;object-fit:contain}
.p-info{padding:20px}
.p-cat{font-size:11px;font-weight:700;color:var(--miniso-red)}
.p-title{font-size:20px;font-weight:700;margin:5px 0}
.p-desc{font-size:13px;color:#666;margin-bottom:15px}
.price-comparison-grid{
display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.price-item{
padding:12px;border-radius:12px;
background:var(--bg-gray);border-bottom:4px solid #ddd
}
.price-item.reg{border-bottom-color:var(--miniso-red);background:var(--miniso-soft)}
.price-item.str{border-bottom-color:var(--promo-green)}
.price-label{font-size:10px;font-weight:800;color:#888}
.price-val{font-size:18px;font-weight:800}
.price-item.reg .price-val{color:var(--miniso-red)}
.p-meta{border-top:1px solid #eee;padding-top:15px;margin-top:15px}
.meta-row{display:flex;justify-content:space-between;font-size:12px}

/* IMAGE MODAL */
#imgModal{
position:fixed;inset:0;
background:rgba(0,0,0,.6);
backdrop-filter:blur(6px);
display:flex;align-items:center;justify-content:center;
opacity:0;visibility:hidden;
transition:.25s;z-index:9999
}
#imgModal.active{opacity:1;visibility:visible}
#imgModal img{
max-width:90%;max-height:90%;
border-radius:18px;background:#fff;
padding:10px;transform:scale(.85);
transition:.25s
}
#imgModal.active img{transform:scale(1)}
</style>
</head>

<body>

<header id="ui-header">
<div class="top-bar">
<div class="search-container">
<input id="searchInput" placeholder="Cari nama / barcode...">
<button id="scanBtn">📷</button>
</div>
</div>
<select id="categoryFilter">
<option value="">Semua Kategori</option>
</select>
</header>

<main class="main-content" id="scrollContainer">
<div id="listContainer"></div>
<div id="detailContainer"></div>
</main>

<div id="imgModal" onclick="closeImgModal()">
<img id="modalImage">
</div>

<script>
const SUPABASE_URL="https://uesupubktkxfjsylcwwr.supabase.co";
const SUPABASE_KEY="PASTE_KEY_MU";
const _supabase=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let timer;

document.getElementById("searchInput").oninput=()=>{
clearTimeout(timer);
timer=setTimeout(search,500);
};

async function loadCategories(){
const {data}=await _supabase.from('export').select('Category');
if(!data)return;
const unique=[...new Set(data.map(i=>i.Category).filter(Boolean))];
const sel=document.getElementById("categoryFilter");
unique.forEach(c=>sel.innerHTML+=`<option value="${c}">${c}</option>`);
}
loadCategories();
document.getElementById("categoryFilter").onchange=search;

async function search(){
const q=searchInput.value.trim();
const cat=categoryFilter.value;
if(!q&&!cat){listContainer.innerHTML="";return;}

let query=_supabase.from('export').select('*');
if(q)query=query.or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`);
if(cat)query=query.eq('Category',cat);

const {data}=await query.limit(50);
if(!data)return;

listContainer.innerHTML=data.map(p=>`
<div class="product-list-item" onclick="showDetail('${p.Barcode}')">
<img class="product-list-img" src="${p.Image||''}" onclick="event.stopPropagation();openImgModal('${p.Image}')">
<div class="product-list-content">
<div class="product-list-title">${p.Name}</div>
<div class="product-list-barcode">${p.Barcode}</div>
<div class="product-list-category">${p.Category||''}</div>
<div class="product-list-category-detail">${p["Category Detail"]||''}</div>
</div>
</div>
`).join('');
}

function openImgModal(src){
if(!src)return;
modalImage.src=src;
imgModal.classList.add("active");
}
function closeImgModal(){
imgModal.classList.remove("active");
}
</script>
</body>
</html>
