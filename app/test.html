<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        body {
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }
        body.fade-in { opacity: 1; }
        .fade-out { opacity: 0 !important; transition: opacity 0.2s ease-out; }

        .focus-guide {
            position: absolute; inset: 15%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px; z-index: 2;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.5);
        }
        .focus-guide::before, .focus-guide::after {
            content: ""; position: absolute; width: 20px; height: 20px;
            border: 4px solid var(--miniso-red);
        }
        .focus-guide::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
        .focus-guide::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }

        #loginOverlay {
            position: fixed; inset: 0; background: var(--bg-gray);
            z-index: 20000; display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: white; width: 90%; max-width: 350px; padding: 35px 25px;
            border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center;
        }
        .login-box h2 { color: var(--miniso-red); margin: 0 0 10px 0; font-weight: 800; font-size: 28px; }
        .login-box p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .login-box label { display: block; text-align: left; font-size: 11px; font-weight: 800; color: #999; margin: 0 0 5px 5px; text-transform: uppercase; }
        .login-box input, .login-box select {
            width: 100%; height: 48px; margin-bottom: 15px; padding: 0 15px;
            border-radius: 12px; border: 1.5px solid #eee; background: #f9f9f9; outline: none; font-size: 15px; transition: 0.3s;
        }
        .login-box input:focus { border-color: var(--miniso-red); background: white; }
        .btn-login {
            width: 100%; height: 50px; background: var(--miniso-red); color: white;
            border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        .btn-login:active { transform: scale(0.98); }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto;
            background: #ffffff; color: var(--text-dark);
            height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden;
        }

        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s; z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        #ui-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px;
            border-bottom: 1px solid #eee;
            z-index: 1000; width: 100%; flex-shrink: 0;
        }
        .top-bar { display: flex; gap: 10px; align-items: center; max-width: 1200px; margin-inline: auto; width: 100%; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #catFilterContainer { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px 0; scrollbar-width: none; width: 100%; }
        #catFilterContainer::-webkit-scrollbar { display: none; }
        .cat-chip { padding: 8px 16px; background: #f0f0f0; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: 0.2s; flex-shrink: 0; text-transform: uppercase; }
        .cat-chip.active { background: var(--miniso-red); color: white; }

        #reader {
            display:none; width:100%; max-width:340px; aspect-ratio:1/1;
            margin:15px auto; background:#000; border-radius:20px;
            overflow:hidden; position:relative; border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        #reader video { width: 100%; height: 100%; object-fit: cover; }
        .focus-guide { position: absolute; inset: 20%; border: 2.5px solid var(--miniso-red); border-radius: 15px; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
        .tap-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 3; }
        .tap-hint.warn { color: #FFD600; font-size: 12px; }
        #cameraControl { display:none; text-align:center; margin-bottom: 20px; }

        .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; width: 100%; padding: 0 16px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px 0 80px 0; width: 100%; }
        @media (min-width: 768px) { #listContainer { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; } }

        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px; background: white; border-radius: 16px; border: 1px solid #f0f0f0; transition: 0.2s; cursor: pointer; width: 100%; min-width: 0; }
        .list-item:active { transform: scale(0.98); background: #fafafa; }
        .list-img-box { width: 70px; height: 70px; background: #f9f9f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid #f0f0f0; }
        .list-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .list-info { flex: 1; min-width: 0; }
        .list-cat { font-size: 10px; color: var(--miniso-red); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .list-name { font-weight: 700; font-size: 14px; color: #111; line-height: 1.4; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .list-bc { font-size: 11px; color: #888; word-break: break-all; line-height: 1.2; }

        #detailContainer { display: none; padding-top: 20px; padding-bottom: 80px; max-width: 700px; margin: 0 auto; width: 100%; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; width: 100%; animation: slideUp 0.3s ease-out; }
        .image-box { background: #fff; text-align: center; padding: 20px; position: relative; border-bottom: 1px solid #f5f5f5; }
        .image-box img { max-width: 100%; height: 300px; object-fit: contain; cursor: zoom-in; }
        .promo-badge { position: absolute; bottom: 15px; right: 15px; background: #ff9800; color: white; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; z-index: 10; }
        .p-info { padding: 24px; }
        .p-cat { font-size: 11px; font-weight: 800; color: var(--miniso-red); text-transform: uppercase; margin-bottom: 8px; display: block; }
        .p-title { font-size: 22px; font-weight: 800; margin: 0 0 10px 0; color: #000; line-height: 1.3; word-break: break-word; }

        #stockResult {
            margin-top: 14px; border-radius: 16px; overflow: hidden;
            border: 1px solid #eee; display: none; /* akan ditampilkan via JS */
        }
        .stock-header {
            background: #111; color: white; padding: 12px 16px;
            font-size: 12px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;
        }
        .stock-header .store-badge {
            background: var(--miniso-red); padding: 2px 8px; border-radius: 6px; font-size: 11px;
        }
        .stock-empty-msg {
            padding: 24px; text-align: center; color: #888;
            font-size: 13px; font-weight: 600; background: white;
        }
        .stock-loading {
            padding: 20px; text-align: center; color: #666; font-size: 13px;
            display: flex; align-items: center; justify-content: center; gap: 10px; background: white;
        }
        .mini-spin {
            width: 18px; height: 18px; border: 3px solid #eee;
            border-top-color: var(--miniso-red); border-radius: 50%;
            animation: spin 0.8s linear infinite; flex-shrink: 0;
        }
        .stock-error { padding: 16px; text-align: center; color: var(--miniso-red); font-size: 13px; font-weight: 700; background: #fff1f2; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <button class="login-back-btn" onclick="window.location.href='https://miniso-id.github.io/app/?app=mmsx'" title="Back to Home"
        style="position:absolute; top: calc(env(safe-area-inset-top) + 16px); left:16px; width:44px; height:44px; background:white; border-radius:12px; display:flex; align-items:center; justify-content:center; box-shadow: 0 4px 16px rgba(0,0,0,0.1); cursor:pointer; border:1px solid rgba(0,0,0,0.06); z-index:20001;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="login-box">
        <h2>MMS-X</h2>
        <p>Silakan masuk ke akun Anda</p>
        <label>Login As</label>
        <select id="loginAs">
            <option value="Administrator">Administrator</option>
            <option value="Area">Area</option>
            <option value="Store">Store</option>
        </select>
        <label>Username</label>
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <button class="btn-login" onclick="checkLogin()">MASUK</button>
        <p id="loginError" style="color:var(--miniso-red); font-size:12px; margin-top:15px; font-weight:700; display:none;">Login Gagal!</p>
    </div>
</div>

<div id="sidebar" class="sidebar">
    <h2>MMS-X</h2>
    <a href="https://miniso-id.github.io/app/?app=mmsx" onclick="toggleSidebar()">Home</a>
    <a href="#" onclick="logout()" style="background:rgba(0,0,0,0.2); margin-top:20px;">Logout</a>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="btnBackFloating" class="floating-back" onclick="back()"
     style="position:fixed; top:calc(20px + env(safe-area-inset-top)); left:16px; width:44px; height:44px; background:white; border-radius:12px; display:none; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(0,0,0,0.12); z-index:9999; cursor:pointer; border:1px solid rgba(0,0,0,0.06);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="lightbox" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center;" onclick="closeLightbox()">
    <img id="lightboxImg" src="" style="max-width:95%; max-height:85vh; border-radius:24px;">
</div>

<div id="appContent" style="display:flex; height: 100vh; flex-direction: column;">
    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none; padding:10px 5px; cursor:pointer;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="search-container">
                <input id="searchInput" placeholder="Cari nama / barcode..." autocomplete="off">
                <button id="scanBtn">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
                <button id="aiSearchBtn" style="position: absolute; right: 50px; top: 4px; width: 42px; height: 38px; background: #4b5563; color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10;">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><text x="50%" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="13px">AI</text></svg>
                </button>
            </div>
        </div>
        <div id="catFilterContainer">
            <div class="cat-chip active" onclick="filterCat('All', this)">All</div>
        </div>
        <div id="reader">
            <video id="videoElement"></video>
            <div class="tap-hint">ARAHKAN BARCODE KE TENGAH KOTAK</div>
        </div>
        <div id="cameraControl"><select id="videoSource" style="padding: 10px; width: 100%; max-width: 300px; border-radius: 8px; margin: 10px auto; display:block;"></select></div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    // === KONFIGURASI ===
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const _userSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const STOCK_PROXY_URL = `${SUPABASE_URL}/functions/v1/stock-proxy`;

    // === LOGIN ===
    async function checkLogin() {
        const role = document.getElementById('loginAs').value;
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const err = document.getElementById('loginError');
        const btn = document.querySelector('.btn-login');
        btn.innerText = "LOADING..."; err.style.display = 'none';
        try {
            const { data } = await _userSupabase.from('users').select('*')
                .eq('login as', role).eq('username', user).eq('password', pass).maybeSingle();
            if (data) {
                localStorage.setItem('mmsx_auth', 'true');
                localStorage.setItem('mmsx_role', role);
                localStorage.setItem('mmsx_store_code', data.username);
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                err.style.display = 'block';
            }
        } catch (e) { alert("Error koneksi database user"); }
        finally { btn.innerText = "MASUK"; }
    }

    // Auto-login (perbaiki key)
    if (localStorage.getItem('mmsx_auth') === 'true') {
        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById('loginOverlay');
            if(overlay) overlay.style.display = 'none';
        });
    }

    function logout() { localStorage.clear(); window.location.href = "index.html"; }

    // === SIDEBAR & UTILITAS ===
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }
    function openLightbox(src) {
        if(!src || src.includes('placeholder')) return;
        document.getElementById('lightboxImg').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }
    function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

    // === KATEGORI & PENCARIAN ===
    let currentCategory = 'All';
    async function fetchCategories() {
        try {
            const { data } = await _supabase.rpc('get_unique_categories');
            if (data) {
                const container = document.getElementById('catFilterContainer');
                container.innerHTML = '<div class="cat-chip active" onclick="filterCat(\'All\', this)">All</div>';
                data.forEach(item => {
                    const chip = document.createElement('div');
                    chip.className = 'cat-chip';
                    chip.innerText = item.category;
                    chip.onclick = () => filterCat(item.category, chip);
                    container.appendChild(chip);
                });
            }
        } catch (e) { console.error("Gagal fetch kategori:", e); }
    }
    fetchCategories();

    function filterCat(cat, el) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        search();
    }

    document.getElementById("searchInput").oninput = () => {
        clearTimeout(window._searchTimer);
        window._searchTimer = setTimeout(search, 400);
    };

    async function search() {
        const q = document.getElementById("searchInput").value.trim();
        const list = document.getElementById("listContainer");
        if (q === "") { list.innerHTML = ""; return; }
        if (q.length === 13 && /^\d+$/.test(q)) {
            loadProductDetail(q);
            list.innerHTML = "";
            return;
        }
        let query = _supabase.from('export').select('Barcode, Name, Category, "Detail Category", Image');
        if (currentCategory !== 'All') query = query.eq('Category', currentCategory);
        query = query.or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%,"Detail Category".ilike.%${q}%`);
        const { data } = await query.limit(200);
        if (data) {
            list.innerHTML = data.map(p => `
                <div class="list-item" onclick="loadProductDetail('${p.Barcode}')">
                    <div class="list-img-box" onclick="event.stopPropagation(); openLightbox('${p.Image}')">
                        <img src="${p.Image || ''}" onerror="this.src='https://placehold.co/150x150?text=MINISO'">
                    </div>
                    <div class="list-info">
                        <div class="list-cat">${p.Category || 'GENERAL'}</div>
                        <div style="font-size:10px;color:#888;margin-top:1px;">${p["Detail Category"] || ''}</div>
                        <div class="list-name">${p.Name}</div>
                        <div class="list-bc">${p.Barcode}</div>
                    </div>
                </div>
            `).join('');
        }
    }

    // === SCANNER ZXING (SEDERHANA, TANPA PREPROCESSING RUMIT) ===
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let scanning = false;
    let lastSelectedDeviceId = localStorage.getItem('preferredCameraId');

    document.getElementById("scanBtn").onclick = () => scanning ? stopScan() : startScan(lastSelectedDeviceId);

    async function startScan(deviceId = null) {
        scanning = true;
        document.getElementById("reader").style.display = "block";
        const constraints = {
            video: {
                deviceId: deviceId ? { exact: deviceId } : undefined,
                width: { ideal: 1280 },
                height: { ideal: 720 },
                facingMode: "environment"
            }
        };
        try {
            await codeReader.decodeFromConstraints(constraints, 'videoElement', (result, err) => {
                if (result) onDetected(result.text);
            });
        } catch (e) {
            console.error("Gagal memulai scanner:", e);
            stopScan();
            if (deviceId) {
                // coba lagi tanpa deviceId spesifik
                lastSelectedDeviceId = null;
                startScan(null);
            }
        }
    }

    function stopScan() {
        codeReader.reset();
        scanning = false;
        document.getElementById("reader").style.display = "none";
    }

    let isProcessingScan = false;
    async function onDetected(code) {
        if (isProcessingScan) return;
        isProcessingScan = true;
        stopScan();
        document.getElementById("beepOk").play();
        document.getElementById("searchInput").value = code;
        await loadProductDetail(code);
        isProcessingScan = false;
    }

    // === DETAIL PRODUK + STOK ===
    function getStoreCode() { return localStorage.getItem('mmsx_store_code') || 'ID00'; }

    const prodTranslations = {
        id: {
            stockLoading: "Menghubungi server MINISO...",
            stockEmpty: "Tidak ada data stok untuk barcode ini di toko",
            stockError: "Gagal mengambil data stok.",
            stockHeaderSku: "SKU ditemukan",
            stockTotalLabel: "Total",
            stockAvailableLabel: "Tersedia",
            stockOnOrderLabel: "On Order",
            stockStoreLabel: "STOK TOKO",
            regPromoLabel: "PROMO REGULER",
            strPromoLabel: "PROMO RUKO",
        },
        en: {
            stockLoading: "Connecting to MINISO server...",
            stockEmpty: "No stock data for this barcode in store",
            stockError: "Failed to retrieve stock data.",
            stockHeaderSku: "SKUs found",
            stockTotalLabel: "Total",
            stockAvailableLabel: "Available",
            stockOnOrderLabel: "On Order",
            stockStoreLabel: "STOCK STORE",
            regPromoLabel: "REGULAR PROMO",
            strPromoLabel: "STREET PROMO",
        }
    };
    function getStockTranslation() {
        const lang = localStorage.getItem('mms_lang') || 'id';
        return prodTranslations[lang] || prodTranslations.id;
    }

    async function loadProductDetail(barcode) {
        const det = document.getElementById("detailContainer");
        det.innerHTML = `<div class="stock-loading" style="padding:40px;"><div class="mini-spin"></div> Memuat detail...</div>`;
        det.style.display = "block";
        document.getElementById("listContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "none";
        document.getElementById("btnBackFloating").style.display = "flex";

        const exportPromise = _supabase.from('export')
            .select('"Regular Store Promo","Street Store Promo",Image,Name,Category,"Detail Category",Description')
            .eq('Barcode', barcode).maybeSingle();

        const stockPromise = fetch(STOCK_PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
            body: JSON.stringify({ barCodeOrGoodsName: barcode, pageSize: 20, pageNum: 1, storeCode: getStoreCode(), brandCode: 30 })
        }).then(r => r.json()).catch(e => ({ error: e.message }));

        try {
            const [expData, stockData] = await Promise.all([exportPromise, stockPromise]);
            renderCombinedDetail(barcode, expData, stockData);
        } catch (err) {
            det.innerHTML = `<div class="stock-error">⚠️ Gagal memuat data.<br>${err.message}</div>`;
        }
    }

    function renderCombinedDetail(barcode, expData, stockData) {
        const det = document.getElementById("detailContainer");
        const t = getStockTranslation();

        const items = stockData?.data?.list || [];
        const firstItem = items[0] || {};
        const productName = firstItem.name || expData?.Name || 'Produk';
        const retailPrice = parseInt(firstItem.retailPrice || 0);
        const category = firstItem.categoryName || expData?.Category || '';
        const detailCategory = firstItem.detailCategoryName || expData?.["Detail Category"] || '';
        const imageUrl = firstItem.picList?.[0]?.materialPictureUrl || expData?.Image || '';

        const regPromo = (expData?.["Regular Store Promo"] || '').trim();
        const strPromo = (expData?.["Street Store Promo"] || '').trim();

        let html = `
        <div class="product-card">
            <div class="image-box">
                ${(regPromo && regPromo !== 'NORMAL') ? `<div class="promo-badge">${regPromo}</div>` : ''}
                <img src="${imageUrl}" onerror="this.src='https://placehold.co/150x150?text=MINISO'" onclick="openLightbox('${imageUrl}')">
            </div>
            <div class="p-info">
                ${category ? `<span class="p-cat">${category}</span>` : ''}
                ${detailCategory ? `<span style="display:block;font-size:10px;color:#888;margin-top:2px;">${detailCategory}</span>` : ''}
                <h3 class="p-title">${productName}</h3>
                <div style="margin:15px 0;">
                    <span style="font-weight:800; font-size:22px; color:var(--miniso-red);">Rp${retailPrice.toLocaleString('id-ID')}</span>
                    <span style="font-size:12px; color:#888; margin-left:8px;">${t.stockStoreLabel} ${getStoreCode()}</span>
                </div>
                <div style="border-top:1px solid #eee; padding-top:20px;">
                    <div style="text-align:center; margin-bottom:15px;">
                        <span style="font-weight:600; font-size:12px;">${barcode}</span>
                        <svg id="barcodeCanvas" style="max-height:50px; width:100%; margin-top:8px; background:white; padding:5px; border-radius:4px; border:1px solid #eee;"></svg>
                    </div>
                    ${(regPromo && regPromo !== 'NORMAL') ? `<div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;"><span>${t.regPromoLabel}</span><span style="font-weight:700; color:var(--promo-blue)">${regPromo}</span></div>` : ''}
                    ${(strPromo && strPromo !== 'NORMAL') ? `<div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;"><span>${t.strPromoLabel}</span><span style="font-weight:700; color:var(--promo-green)">${strPromo}</span></div>` : ''}
                    <div id="stockResult"></div>
                </div>
            </div>
        </div>`;
        det.innerHTML = html;

        JsBarcode("#barcodeCanvas", barcode, {
            format: "CODE128", lineColor: "#000", width: 2, height: 40, displayValue: false
        });

        renderStockSection(items, barcode, getStoreCode(), t);
    }

    function renderStockSection(items, barcode, storeCode, t) {
        const box = document.getElementById('stockResult');
        if (!box) return;

        if (!items.length) {
            box.innerHTML = `<div class="stock-empty-msg">📦 ${t.stockEmpty} <b>${storeCode}</b></div>`;
            box.style.display = 'block';
            return;
        }

        let stockHtml = `
        <div class="stock-header">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            ${t.stockStoreLabel} <span class="store-badge">${storeCode}</span>
            <span style="margin-left:auto;">${items.length} ${t.stockHeaderSku}</span>
        </div>`;

        items.forEach(item => {
            const name = item.name || '-';
            const barCode = item.barCode || barcode;
            const price = parseInt(item.retailPrice || 0);
            const totalInv = parseInt(item.totalInvent ?? 0);
            const availableInv = parseInt(item.availableInvent ?? 0);
            const inTransitInv = parseInt(item.inTransitInvent ?? 0);
            const imgUrl = item.picList?.[0]?.materialPictureUrl || '';
            const cat = item.categoryName || '';
            const detCat = item.detailCategoryName || '';

            stockHtml += `
            <div style="background:white; padding:12px 16px; border-bottom:1px solid #eee;">
                <div style="display:flex; gap:12px; margin-bottom:10px;">
                    ${imgUrl ? `<img src="${imgUrl}" style="width:48px; height:48px; object-fit:contain; border-radius:8px; border:1px solid #eee;" onerror="this.style.display='none'">` : ''}
                    <div style="flex:1;">
                        <div style="font-weight:700; font-size:13px;">${name}</div>
                        ${(cat||detCat) ? `<div style="font-size:10px; color:#888;">${cat}${detCat?' · '+detCat:''}</div>` : ''}
                        <div style="font-size:11px; color:#999;">${barCode}</div>
                        <div style="font-size:14px; font-weight:800; color:var(--miniso-red);">Rp${price.toLocaleString('id-ID')}</div>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;">
                    <div style="background:#f9f9f9; border-radius:8px; padding:8px; text-align:center;">
                        <div style="font-size:10px; color:#888;">${t.stockTotalLabel}</div>
                        <div style="font-size:18px; font-weight:800;">${totalInv < 0 ? '—' : totalInv}</div>
                    </div>
                    <div style="background:#f9f9f9; border-radius:8px; padding:8px; text-align:center; border-bottom:3px solid ${availableInv<=0?'#dc2626':availableInv<5?'#d97706':'#16a34a'};">
                        <div style="font-size:10px; color:#888;">${t.stockAvailableLabel}</div>
                        <div style="font-size:18px; font-weight:800; color:${availableInv<=0?'#dc2626':availableInv<5?'#d97706':'#16a34a'};">${availableInv<0?'—':availableInv}</div>
                    </div>
                    <div style="background:#f9f9f9; border-radius:8px; padding:8px; text-align:center; border-bottom:3px solid #3b82f6;">
                        <div style="font-size:10px; color:#888;">${t.stockOnOrderLabel}</div>
                        <div style="font-size:18px; font-weight:800; color:#3b82f6;">${inTransitInv}</div>
                    </div>
                </div>
            </div>`;
        });

        box.innerHTML = stockHtml;
        box.style.display = 'block';
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid";
        document.getElementById("btnBackFloating").style.display = "none";
        document.getElementById("searchInput").value = "";
    }

    // AI Vision (placeholder)
    document.getElementById('aiSearchBtn').onclick = async () => {
        alert("Fitur AI Vision belum tersedia di demo ini.");
    };

    // Tampilkan body setelah semua siap
    document.body.classList.add('fade-in');
</script>
</body>
</html>
