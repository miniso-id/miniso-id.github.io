<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X | AI Search</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --bg-gray: #f4f4f4;
            --text-dark: #1a1a1a;
        }

        body { margin: 0; font-family: -apple-system, sans-serif; background: #fff; overflow: hidden; height: 100vh; }
        
        /* Header AI Style */
        #ai-header {
            padding: calc(20px + env(safe-area-inset-top)) 16px 15px;
            background: white;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        /* Video Container */
        #vision-container {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            aspect-ratio: 1/1;
            position: relative;
            background: #000;
            border-radius: 30px;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        #videoElement { width: 100%; height: 100%; object-fit: cover; }

        /* AI Prediction Label */
        #ai-status-box {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(230, 21, 35, 0.9);
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        /* Scan Button */
        .btn-capture {
            width: 70px;
            height: 70px;
            background: var(--miniso-red);
            border: 5px solid #fff;
            border-radius: 50%;
            margin: -35px auto 0;
            position: relative;
            z-index: 10;
            box-shadow: 0 5px 15px rgba(230, 21, 35, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Results Area */
        .results-section {
            padding: 20px 16px;
            overflow-y: auto;
            flex: 1;
        }

        .ai-card {
            background: #f9f9f9;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            border: 1px solid #eee;
            animation: slideIn 0.3s ease-out;
        }

        .ai-card img { width: 60px; height: 60px; border-radius: 10px; object-fit: contain; background: #fff; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        #loading-overlay {
            position: fixed; inset: 0; background: white; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <h2 style="color: var(--miniso-red);">MMS-X AI</h2>
        <p>Memuat Model Intelijen...</p>
    </div>

    <header id="ai-header">
        <h2 style="margin:0; font-size: 18px;">Pencarian Visual AI</h2>
        <select id="videoSource" style="margin-top:10px; border-radius: 8px; padding: 5px;"></select>
    </header>

    <div id="vision-container">
        <video id="videoElement" autoplay playsinline></video>
        <div id="ai-status-box">MENGAMATI...</div>
    </div>

    <div class="btn-capture" onclick="searchByAI()">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="white"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6m0-2a5 5 0 1 1 0 10 5 5 0 0 1 0-10M19 19H5V8h14v11M12 6a9 9 0 1 1 0 18 9 9 0 0 1 0-18m7-4h-3l-1-2h-6l-1 2H5C3.9 2 3 2.9 3 4v15c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </div>

    <div class="results-section" id="aiResults">
        <p style="text-align: center; color: #888;">Arahkan kamera ke produk dan tekan tombol merah untuk mencari.</p>
    </div>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let net;
    let currentPrediction = "";
    let lastCameraId = localStorage.getItem('preferredCameraId'); // Konsistensi kamera

    async function initAI() {
        net = await mobilenet.load();
        document.getElementById('loading-overlay').style.display = 'none';
        setupCamera(lastCameraId);
    }

    async function setupCamera(deviceId = null) {
        const video = document.getElementById('videoElement');
        const constraints = {
            video: { 
                deviceId: deviceId ? { exact: deviceId } : undefined,
                facingMode: "environment" 
            }
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        // Update list kamera
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        const select = document.getElementById('videoSource');
        
        select.innerHTML = videoDevices.map(d => 
            `<option value="${d.deviceId}" ${d.deviceId === deviceId ? 'selected' : ''}>${d.label || 'Kamera'}</option>`
        ).join('');

        select.onchange = (e) => {
            localStorage.setItem('preferredCameraId', e.target.value); // Simpan pilihan
            setupCamera(e.target.value);
        };

        // Mulai analisis kontinyu
        detectFrame();
    }

    async function detectFrame() {
    const video = document.getElementById('videoElement');
    const predictions = await net.classify(video);
    
    if (predictions.length > 0) {
        const topResult = predictions[0];
        currentPrediction = topResult.className.split(',')[0];
        document.getElementById('ai-status-box').innerText = "MELIHAT: " + currentPrediction;

        // OTOMATIS CARI: Jika tingkat keyakinan AI di atas 60%
        if (topResult.probability > 0.60) {
            searchByAI(); // Panggil fungsi cari tanpa tunggu tekan tombol
        }
    }
    
    if (scanning) requestAnimationFrame(detectFrame);
}
    async function searchByAI() {
        const resultsDiv = document.getElementById('aiResults');
        resultsDiv.innerHTML = `<p style="text-align:center;">Mencari produk: <b>${currentPrediction}</b>...</p>`;

        // Cari di database berdasarkan hasil prediksi AI
        const { data } = await _supabase
            .from('export')
            .select('*')
            .or(`Name.ilike.%${currentPrediction}%,Category.ilike.%${currentPrediction}%`)
            .limit(5);

        if (data && data.length > 0) {
            resultsDiv.innerHTML = `<h4>Produk Terkait:</h4>` + data.map(p => `
                <div class="ai-card">
                    <img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/150'">
                    <div>
                        <div style="font-size:10px; color:red; font-weight:800;">${p.Category}</div>
                        <div style="font-weight:700;">${p.Name}</div>
                        <div style="color:#28a745; font-weight:800; margin-top:5px;">Rp${parseInt(p["Regular Store Price"]).toLocaleString('id-ID')}</div>
                    </div>
                </div>
            `).join('');
        } else {
            resultsDiv.innerHTML = `<p style="text-align:center; color:#888;">Tidak ditemukan produk yang mirip di database.</p>`;
        }
    }

    initAI();
</script>
</body>
</html>
