<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        /* Animasi Masuk Halaman */
        body { opacity: 0; transition: opacity 0.2s ease-in; }
        body.fade-in { opacity: 1; }
        .fade-out { opacity: 0 !important; transition: opacity 0.2s ease-out; }

        /* --- LOGIN OVERLAY --- */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg-gray); z-index: 20000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; width: 90%; max-width: 350px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        .login-box h2 { color: var(--miniso-red); margin: 0 0 10px 0; font-weight: 800; font-size: 28px; }
        .login-box p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .login-box label { display: block; text-align: left; font-size: 11px; font-weight: 800; color: #999; margin: 0 0 5px 5px; text-transform: uppercase; }
        .login-box input, .login-box select { width: 100%; height: 48px; margin-bottom: 15px; padding: 0 15px; border-radius: 12px; border: 1.5px solid #eee; background: #f9f9f9; outline: none; font-size: 15px; transition: 0.3s; }
        .btn-login { width: 100%; height: 50px; background: var(--miniso-red); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }

        /* --- STYLE ASLI --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; background: #ffffff; color: var(--text-dark); height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }

        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        #ui-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px; border-bottom: 1px solid #eee; z-index: 1000; width: 100%; flex-shrink: 0; }
        .top-bar { display: flex; gap: 10px; align-items: center; max-width: 1200px; margin-inline: auto; width: 100%; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #catFilterContainer { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px 0; scrollbar-width: none; width: 100%; }
        .cat-chip { padding: 8px 16px; background: #f0f0f0; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: 0.2s; flex-shrink: 0; text-transform: uppercase; }
        .cat-chip.active { background: var(--miniso-red); color: white; }

        #reader { display:none; width:100%; max-width:340px; aspect-ratio:1/1; margin:15px auto; background:#000; border-radius:20px; overflow:hidden; position:relative; border: 4px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        #reader video { width: 100%; height: 100%; object-fit: cover; }
        .focus-guide { position: absolute; inset: 20%; border: 2.5px solid var(--miniso-red); border-radius: 15px; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
        .tap-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 3; }

        /* Label AI (Tambahan) */
        #aiLabel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #00ff00; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-family: monospace; z-index: 10; font-weight: bold; }

        .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; width: 100%; padding: 0 16px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px 0 80px 0; width: 100%; }
        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px; background: white; border-radius: 16px; border: 1px solid #f0f0f0; cursor: pointer; }
        .list-img-box { width: 70px; height: 70px; background: #f9f9f9; border-radius: 12px; overflow: hidden; border: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: center; }
        .list-img-box img { width: 100%; height: 100%; object-fit: contain; }

        #detailContainer { display: none; padding-top: 20px; padding-bottom: 80px; max-width: 700px; margin: 0 auto; width: 100%; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; animation: slideUp 0.3s ease-out; }
        .floating-back { position: fixed; top: calc(25px + env(safe-area-inset-top)); left: 20px; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 9999; }
        
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>MMS-X</h2>
        <p>Silakan masuk ke akun Anda</p>
        <label>Login As</label>
        <select id="loginAs">
            <option value="Administrator">Administrator</option>
            <option value="Area">Area</option>
            <option value="Store">Store</option>
        </select>
        <label>Username</label>
        <input type="text" id="username" placeholder="Username" autocomplete="off">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <button class="btn-login" onclick="checkLogin()">MASUK</button>
        <p id="loginError" style="color:var(--miniso-red); font-size:12px; margin-top:15px; font-weight:700; display:none;">Login Gagal!</p>
    </div>
</div>

<div id="sidebar" class="sidebar">
    <h2>MMS-X</h2>
    <a href="#" onclick="logout()">Logout</a>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="appContent" style="display:flex; height: 100vh; flex-direction: column;">
    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none; padding:10px 5px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
            <div class="search-container">
                <input id="searchInput" placeholder="Cari nama / barcode..." autocomplete="off">
                <button id="scanBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg></button>
            </div>
        </div>
        <div id="catFilterContainer"><div class="cat-chip active" onclick="filterCat('All', this)">All</div></div>
        <div id="reader">
            <div id="aiLabel">AI: Loading...</div>
            <video id="videoElement" playsinline autoplay></video>
            <div class="focus-guide"></div>
            <div class="tap-hint">ARAHKAN BARCODE • TAP UNTUK FOKUS</div>
        </div>
        <div id="cameraControl"><select id="videoSource" style="padding: 10px; width: 100%; max-width: 300px; border-radius: 8px; margin: 10px auto; display:block;"></select></div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script type="module">
    import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
    let detector;
    let lastTime = -1;

    async function initAI() {
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
        detector = await ObjectDetector.createFromOptions(vision, {
            baseOptions: {
                modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite`,
                delegate: "GPU"
            },
            scoreThreshold: 0.5,
            runningMode: "VIDEO"
        });
        document.getElementById("aiLabel").innerText = "AI: READY";
    }

    async function detectLoop() {
        if (!window.isScanning || !detector) return;
        const video = document.getElementById("videoElement");
        if (video.currentTime !== lastTime) {
            lastTime = video.currentTime;
            const result = await detector.detectForVideo(video, performance.now());
            if (result.detections.length > 0) {
                const obj = result.detections[0].categories[0];
                document.getElementById("aiLabel").innerText = `AI: ${obj.categoryName.toUpperCase()} (${Math.round(obj.score*100)}%)`;
            }
        }
        requestAnimationFrame(detectLoop);
    }

    window.addEventListener('load', initAI);
    window.startAI = detectLoop;
</script>

<script>
    // Konfigurasi Database
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const codeReader = new ZXing.BrowserMultiFormatReader();
    window.isScanning = false;
    let lastSelectedDeviceId = localStorage.getItem('preferredCameraId'); // Penggunaan kamera tersimpan [cite: 2026-02-22]

    // Login & Logout
    async function checkLogin() {
        localStorage.setItem('mmsx_auth', 'true');
        document.getElementById('loginOverlay').style.display = 'none';
    }
    function logout() { localStorage.clear(); window.location.reload(); }

    // Kategori & Search
    async function fetchCategories() {
        const { data } = await _supabase.rpc('get_unique_categories');
        if (data) {
            const container = document.getElementById('catFilterContainer');
            data.forEach(item => {
                const chip = document.createElement('div');
                chip.className = 'cat-chip';
                chip.innerText = item.category;
                chip.onclick = () => filterCat(item.category, chip);
                container.appendChild(chip);
            });
        }
    }
    fetchCategories();

    function filterCat(cat, el) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        search(cat);
    }

    async function search(cat = 'All') {
        const q = document.getElementById("searchInput").value.trim();
        let query = _supabase.from('export').select('*');
        if (cat !== 'All') query = query.eq('Category', cat);
        if (q) query = query.or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`);
        const { data } = await query.limit(100);
        if (data) {
            document.getElementById("listContainer").innerHTML = data.map(p => `
                <div class="list-item" onclick="showDetail('${p.Barcode}')">
                    <div class="list-img-box"><img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/150'"></div>
                    <div class="list-info">
                        <div style="font-size:10px; color:red; font-weight:800;">${p.Category}</div>
                        <div style="font-weight:700; font-size:14px;">${p.Name}</div>
                        <div style="font-size:11px; color:#888;">${p.Barcode}</div>
                    </div>
                </div>
            `).join('');
        }
    }

    // Scanner & Kamera
    document.getElementById("scanBtn").onclick = () => { window.isScanning ? stopScan() : startScan(lastSelectedDeviceId); };

    async function startScan(deviceId = null) {
        window.isScanning = true;
        document.getElementById("reader").style.display = "block";
        const videoDevices = await codeReader.listVideoInputDevices();
        let selectedId = deviceId || lastSelectedDeviceId || videoDevices[0].deviceId;
        
        updateCameraList(videoDevices, selectedId);
        
        await codeReader.decodeFromVideoDevice(selectedId, 'videoElement', (result) => {
            if (result) {
                document.getElementById("beepOk").play();
                onDetected(result.text);
            }
        });

        if(window.startAI) window.startAI(); // Trigger AI
    }

    function stopScan() {
        codeReader.reset();
        window.isScanning = false;
        document.getElementById("reader").style.display = "none";
        document.getElementById("cameraControl").style.display = "none";
    }

    function updateCameraList(devices, currentId) {
        const source = document.getElementById("videoSource");
        if (devices.length > 1) {
            document.getElementById("cameraControl").style.display = "block";
            source.innerHTML = devices.map(d => `<option value="${d.deviceId}" ${d.deviceId === currentId ? 'selected' : ''}>${d.label}</option>`).join("");
        }
    }

    document.getElementById("videoSource").onchange = (e) => {
        lastSelectedDeviceId = e.target.value;
        localStorage.setItem('preferredCameraId', lastSelectedDeviceId); // Simpan pilihan kamera [cite: 2026-02-22]
        stopScan();
        startScan(lastSelectedDeviceId);
    };

    function onDetected(code) {
        stopScan();
        document.getElementById("searchInput").value = code;
        showDetail(code);
    }

    async function showDetail(barcode) {
        const { data: p } = await _supabase.from('export').select('*').ilike('Barcode', `%${barcode}%`).maybeSingle();
        if (!p) return;
        document.getElementById("listContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "none";
        document.getElementById("detailContainer").innerHTML = `
            <div class="product-card">
                <div style="text-align:center; padding:20px;"><img src="${p.Image}" style="max-width:100%; height:250px; object-fit:contain;"></div>
                <div style="padding:20px;">
                    <span style="color:red; font-weight:800; font-size:12px;">${p.Category}</span>
                    <h3 style="margin:10px 0;">${p.Name}</h3>
                    <div style="background:#f4f4f4; padding:15px; border-radius:10px; display:flex; justify-content:space-between;">
                        <div><small>REGULAR</small><br><b>Rp${p["Regular Store Price"]}</b></div>
                        <div><small>STREET</small><br><b>Rp${p["Street Store Price"]}</b></div>
                    </div>
                </div>
            </div>
        `;
        document.getElementById("detailContainer").style.display = "block";
        document.getElementById("btnBackFloating").style.display = "flex";
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid";
        document.getElementById("btnBackFloating").style.display = "none";
    }

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("fade-in");
        if(localStorage.getItem('mmsx_auth') === 'true') document.getElementById('loginOverlay').style.display = 'none';
    });
</script>

</body>
</html>
