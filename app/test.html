<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X MediaPipe Edition</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --bg-gray: #f4f4f4;
            --text-dark: #1a1a1a;
        }

        body { margin: 0; font-family: -apple-system, sans-serif; background: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER - Sama dengan product(5).html */
        header { padding: calc(20px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid #eee; background: white; }
        .top-bar { display: flex; gap: 10px; align-items: center; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; padding: 0 50px 0 15px; outline: none; box-sizing: border-box; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        /* SCANNER BOX - Area Kamera */
        #scannerContainer { display: none; width: 92%; max-width: 350px; aspect-ratio: 1/1; margin: 15px auto; background: #000; border-radius: 24px; overflow: hidden; position: relative; border: 4px solid white; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay { position: absolute; inset: 20%; border: 2px solid var(--miniso-red); border-radius: 15px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.5); pointer-events: none; }
        
        /* STATUS LABEL */
        #statusLabel { font-size: 11px; text-align: center; margin-top: 6px; font-weight: bold; color: #8e8e93; }

        /* CONTENT AREA */
        .main-content { flex: 1; overflow-y: auto; padding: 16px; background: white; }
        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px; background: white; border-radius: 16px; border: 1px solid #f0f0f0; margin-bottom: 10px; }
        .item-img { width: 60px; height: 60px; border-radius: 10px; object-fit: contain; background: #f9f9f9; }
        
        /* DETAIL VIEW - Mirip punya kamu */
        #detailContainer { display: none; }
        .back-btn { padding: 10px 18px; background: #f0f0f0; border-radius: 10px; font-weight: bold; display: inline-block; margin-bottom: 20px; cursor: pointer; }
        .price-tag { color: var(--miniso-red); font-size: 26px; font-weight: 800; margin: 10px 0; }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="search-container">
            <input id="searchInput" placeholder="Cari barcode atau nama...">
            <button id="scanBtn">📸</button>
        </div>
    </div>
    <div id="statusLabel">SISTEM SEDANG SIAP-SIAP...</div>

    <div id="scannerContainer">
        <video id="videoElement" playsinline muted></video>
        <div class="scan-overlay"></div>
    </div>
</header>

<main class="main-content" id="scrollContainer">
    <div id="listContainer"></div>
    <div id="detailContainer"></div>
</main>

<audio id="beep" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let barcodeDetector;
    let isScanning = false;
    let isProcessing = false;

    // 1. Setup MediaPipe (Inisialisasi)
    async function setupMediaPipe() {
        const status = document.getElementById('statusLabel');
        try {
            const vision = await tasksVision.FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            barcodeDetector = await tasksVision.BarcodeDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/barcode_detector/barcode_detector/float16/1/barcode_detector.tflite",
                    delegate: "GPU"
                },
                runningMode: "VIDEO"
            });
            status.innerText = "SISTEM SIAP ✅";
            status.style.color = "#28a745";
        } catch (e) {
            status.innerText = "GAGAL MEMUAT ENGINE ❌";
            console.error(e);
        }
    }
    setupMediaPipe();

    // 2. Kontrol Kamera
    document.getElementById('scanBtn').onclick = () => isScanning ? stop() : start();

    async function start() {
        if (!barcodeDetector) return alert("Tunggu sebentar, engine sedang loading...");
        isScanning = true;
        isProcessing = false;
        document.getElementById('scannerContainer').style.display = 'block';
        const video = document.getElementById('videoElement');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                requestAnimationFrame(predictLoop);
            };
        } catch (err) {
            alert("Akses kamera ditolak!");
            stop();
        }
    }

    function predictLoop() {
        if (!isScanning) return;
        const video = document.getElementById('videoElement');
        
        if (video.readyState >= 2 && !isProcessing) {
            const detections = barcodeDetector.detectForVideo(video, performance.now());
            if (detections.barcodes.length > 0) {
                isProcessing = true; // Lock agar tidak kirim ribuan request ke Supabase
                handleFound(detections.barcodes[0].rawValue);
            }
        }
        requestAnimationFrame(predictLoop);
    }

    async function handleFound(code) {
        const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${code}%`).maybeSingle();
        if (data) {
            document.getElementById('beep').play();
            stop();
            renderDetail(data);
        } else {
            // Jika tidak ada di DB, tunggu 1.5 detik baru boleh scan lagi (biar tidak freeze)
            setTimeout(() => { isProcessing = false; }, 1500);
        }
    }

    function stop() {
        isScanning = false;
        const video = document.getElementById('videoElement');
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        document.getElementById('scannerContainer').style.display = 'none';
    }

    // 3. Render Tampilan (Sama dengan product(5).html)
    function renderDetail(p) {
        document.getElementById('listContainer').style.display = 'none';
        const det = document.getElementById('detailContainer');
        det.style.display = 'block';
        det.innerHTML = `
            <div class="back-btn" onclick="location.reload()">← KEMBALI</div>
            <div style="text-align:center"><img src="${p.Image}" style="width:100%; max-width:400px; border-radius:20px;"></div>
            <h2 style="margin:20px 0 5px">${p.Name}</h2>
            <div class="price-tag">Rp${parseInt(p["Regular Store Price"]).toLocaleString()}</div>
            <p style="color:#888">Barcode: <b>${p.Barcode}</b></p>
        `;
    }

    // Search Manual
    document.getElementById('searchInput').oninput = async (e) => {
        const q = e.target.value;
        if (q.length < 3) return;
        const { data } = await _supabase.from('export').select('*').or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`).limit(10);
        if (data) {
            document.getElementById('listContainer').innerHTML = data.map(p => `
                <div class="list-item" onclick="renderDetail(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <img class="item-img" src="${p.Image}">
                    <div><b>${p.Name}</b><br><small>${p.Barcode}</small></div>
                </div>
            `).join('');
        }
    };
</script>
</body>
</html>
