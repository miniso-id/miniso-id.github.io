<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X + AI Vision</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    
    <style>
        /* ... (Gunakan style yang sama dengan sebelumnya) ... */
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        body { margin: 0; font-family: sans-serif; opacity: 0; transition: opacity 0.2s; }
        body.fade-in { opacity: 1; }

        #ui-header { background: white; padding: 20px 16px; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; }
        .top-bar { display: flex; gap: 8px; align-items: center; }
        .search-container { position: relative; flex: 1; display: flex; gap: 5px; }
        #searchInput { flex: 1; height: 46px; padding: 0 15px; border-radius: 12px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; }
        
        .btn-icon { width: 46px; height: 46px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
        #scanBtn { background: var(--miniso-red); }
        #aiBtn { background: #5856d6; } /* Warna ungu untuk AI */
        
        #reader { display:none; width:100%; max-width:400px; aspect-ratio:1/1; margin:15px auto; background:#000; border-radius:20px; overflow:hidden; position:relative; }
        #reader video { width: 100%; height: 100%; object-fit: cover; }
        .ai-label { position: absolute; top: 10px; left: 10px; background: rgba(88, 86, 214, 0.8); color: white; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; z-index: 10; }
        
        #listContainer { padding: 16px; display: grid; gap: 10px; }
        .list-item { display: flex; gap: 15px; padding: 10px; background: white; border: 1px solid #eee; border-radius: 12px; }
        .list-img-box { width: 60px; height: 60px; background: #f9f9f9; border-radius: 8px; overflow: hidden; }
        .list-img-box img { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body class="fade-in">

<header id="ui-header">
    <div class="top-bar">
        <div class="search-container">
            <input id="searchInput" placeholder="Cari barang...">
            <button id="scanBtn" class="btn-icon" title="Scan Barcode">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path></svg>
            </button>
            <button id="aiBtn" class="btn-icon" title="AI Object Scan">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8M8 12h8"></path></svg>
            </button>
        </div>
    </div>
    
    <div id="reader">
        <div id="aiStatus" class="ai-label" style="display:none;">AI THINKING...</div>
        <video id="videoElement" autoplay playsinline muted></video>
    </div>
</header>

<main id="listContainer"></main>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const codeReader = new ZXing.BrowserMultiFormatReader();
    let net = null; // Untuk model AI
    let isAiScanning = false;
    let videoStream = null;

    // 1. Load Model AI saat aplikasi dibuka
    async function loadAI() {
        console.log("Loading AI Model...");
        net = await mobilenet.load();
        console.log("AI Model Ready!");
    }
    loadAI();

    // 2. Fitur AI VISION Scan
    document.getElementById('aiBtn').onclick = async () => {
        if (isAiScanning) {
            stopAllScan();
            return;
        }
        startAiScan();
    };

    async function startAiScan() {
        isAiScanning = true;
        document.getElementById('reader').style.display = 'block';
        document.getElementById('aiStatus').style.display = 'block';
        
        const video = document.getElementById('videoElement');
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = videoStream;

        // Loop Deteksi
        const detect = async () => {
            if (!isAiScanning) return;
            
            const result = await net.classify(video);
            if (result.length > 0) {
                const prediction = result[0].className.split(',')[0]; // Ambil nama benda pertama
                document.getElementById('aiStatus').innerText = "AI: " + prediction.toUpperCase();
                
                // Jika tingkat keyakinan > 60%, cari di database
                if (result[0].probability > 0.6) {
                    searchDatabase(prediction);
                }
            }
            setTimeout(detect, 1000); // Deteksi setiap 1 detik
        };
        detect();
    }

    async function searchDatabase(keyword) {
        // Cari nama barang yang mengandung kata kunci dari AI
        const { data } = await _supabase.from('export')
            .select('*')
            .ilike('Name', `%${keyword}%`)
            .limit(10);
        
        if (data && data.length > 0) {
            renderList(data);
        }
    }

    function renderList(data) {
        const container = document.getElementById('listContainer');
        container.innerHTML = data.map(p => `
            <div class="list-item">
                <div class="list-img-box"><img src="${p.Image}"></div>
                <div>
                    <div style="font-size:12px; color:red; font-weight:bold;">${p.Category}</div>
                    <div style="font-weight:bold;">${p.Name}</div>
                    <div style="font-size:11px; color:#888;">${p.Barcode}</div>
                </div>
            </div>
        `).join('');
    }

    function stopAllScan() {
        isAiScanning = false;
        if (videoStream) videoStream.getTracks().forEach(track => track.stop());
        codeReader.reset();
        document.getElementById('reader').style.display = 'none';
        document.getElementById('aiStatus').style.display = 'none';
    }

    // Integrasi Barcode (ZXing) tetap ada di tombol scanBtn
    document.getElementById('scanBtn').onclick = () => {
        stopAllScan();
        // Logika startScan barcode kamu...
        alert("Barcode Scanner Aktif");
    };

</script>
</body>
</html>
