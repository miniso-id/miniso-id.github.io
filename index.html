<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="title" content="MMS-X">
    <title>MMS-X</title>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "MMS-X",
  "url": "https://mmsx.pages.dev/"
}
</script>
    
    <style>
        /* Reset box-sizing agar padding tidak merusak lebar elemen */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh; /* Typo diperbaiki */
            position: relative;
        }

        .header-banner {
            width: 100%;
            height: 160px;
            background-color: #d12e2e;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }

        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 90%; /* Lebar responsif untuk layar HP */
            max-width: 380px; /* Batas maksimal agar tidak terlalu lebar di PC */
            padding: 40px 25px; /* Padding samping disesuaikan agar tidak sesak di HP */
            text-align: center;
            z-index: 1;
            margin-top: 80px; /* Jarak proporsional dari atas */
            margin-bottom: 40px; /* Jarak aman sebelum footer */
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 35px;
        }

        .button {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 2px solid #e1e1e3;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 16px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .button:hover, .button:active {
            border-color: #0071e3;
            background-color: #fcfcfc;
        }

        .button-icon {
            width: 32px;
            height: 32px;
            margin-right: 16px;
            flex-shrink: 0; /* Mencegah ikon mengecil otomatis di layar HP kecil */
        }

        .button-text-container {
            text-align: left;
        }

        .button-label {
            font-size: 11px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .button-title {
            font-size: 16px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .footer {
            margin-top: auto; /* Mendorong footer agar selalu di paling bawah layar */
            padding-bottom: 25px;
            font-size: 12px;
            color: #86868b;
            line-height: 1.5;
            text-align: center;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="header-banner"></div>

    <div class="container">
        <img src="/app/user512.png" alt="Miniso Logo" class="logo">
        
        <div class="title">MMS-X</div>

        <a href="https://github.com/miniso-id/MMS-X/releases/tag/MMS-X-v3.1.2" class="button">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Android_robot.svg" alt="Android Icon" class="button-icon">
            <div class="button-text-container">
                <div class="button-label">DOWNLOAD FOR</div>
                <div class="button-title">Android (APK)</div>
            </div>
        </a>

        <a href="https://mmsx.pages.dev/ios" class="button">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Icon" class="button-icon">
            <div class="button-text-container">
                <div class="button-label">OPEN FOR</div>
                <div class="button-title">iPhone/iPad (PWA)</div>
            </div>
        </a>
    </div>

    <div class="footer">
        © 2026 MMS Project Support<br>
        Developed by Fahril
    </div>

</body>
</html>
