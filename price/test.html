<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MMS-X</title>

<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>

<style>
/* ================= LAYOUT & SIDEBAR ================= */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; font-family: Arial, sans-serif; overflow: hidden; background: #f8f9fa; }

.app-wrapper { display: flex; height: 100vh; width: 100%; }

.sidebar {
  width: 250px;
  background-color: #222;
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 20px;
  transition: transform 0.3s ease;
  z-index: 1001;
  flex-shrink: 0;
}

.sidebar h2 { text-align: center; margin-bottom: 30px; font-size: 1.5rem; border-bottom: 1px solid #444; padding-bottom: 10px; }
.sidebar a { text-decoration: none; color: #ccc; padding: 15px; margin-bottom: 5px; border-radius: 5px; display: block; }
.sidebar a:hover, .sidebar a.active-link { background-color: #007bff; color: white; }

.main-content { flex: 1; padding: 15px; overflow-y: auto; position: relative; width: 100%; }

/* ================= HEADER COMPACT (SEJAJAR) ================= */
.top-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  background: white;
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.menu-toggle {
  background: #333;
  color: white;
  border: none;
  padding: 10px 14px;
  font-size: 20px;
  border-radius: 8px;
  cursor: pointer;
  flex-shrink: 0;
}

/* SEARCH BOX DENGAN ICON KAMERA DI DALAM */
.search-container {
  position: relative;
  flex-grow: 1;
  display: flex;
  align-items: center;
}

#searchInput {
  width: 100%;
  padding: 12px 85px 12px 15px; /* Spasi kanan untuk tombol X dan Kamera */
  font-size: 16px;
  border: 2px solid #ddd;
  border-radius: 8px;
  outline: none;
  transition: border-color 0.3s;
}

#searchInput:focus { border-color: #007bff; }

.input-actions {
  position: absolute;
  right: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#clearBtn {
  cursor: pointer;
  font-weight: bold;
  color: #999;
  display: none;
  font-size: 18px;
}

#scanBtn {
  background: #007bff;
  color: white;
  border: none;
  padding: 7px 10px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

#scanBtn:disabled { background: #ccc; }

/* ================= CSS SCANNER & RESULT ================= */
#reader {
  display:none;
  width:100%;
  max-width:360px;
  aspect-ratio:1/1;
  margin:10px auto;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  position:relative;
}
#reader video { width:100%; height:100%; object-fit:cover; }
#reader::after {
  content:""; position:absolute; inset:18%; 
  border:2px dashed rgba(0,255,0,.7); pointer-events:none;
}

.card {
    background: white; padding: 12px; margin-bottom: 10px;
    border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    display: flex; gap: 12px;
}
.card img { width: 70px; height: 70px; object-fit: contain; }

#history span {
  margin:4px; padding:4px 10px; background: white;
  border: 1px solid #ddd; border-radius: 20px;
  display: inline-block; font-size: 12px; cursor: pointer;
}

@media (max-width: 768px) {
  .sidebar { position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); }
  .sidebar.active { transform: translateX(0); }
}
</style>
</head>

<body>

<div class="app-wrapper">
    <nav class="sidebar" id="sidebar">
        <h2>MMS-X</h2>
        <a href="#" class="active-link" onclick="closeSidebarOnly()">📸 Price Check</a>
        <a href="#">📦 Stock Opname</a>
        <a href="#">📝 List Barang</a>
        <a href="#">⚙️ Pengaturan</a>
    </nav>

    <main class="main-content" id="mainContent">
        
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="search-container">
                <input id="searchInput" placeholder="Loading..." disabled>
                <div class="input-actions">
                    <span id="clearBtn">✕</span>
                    <button id="scanBtn" title="Scan Barcode" disabled>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="reader"></div>

        <div style="margin-bottom: 10px; font-weight: bold; color: #555;">Scan History:</div>
        <div id="history"></div>
        
        <div id="result" style="margin-top: 15px;"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>
<audio id="beepErr" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
/* ================= LOGIKA UI (NAVBAR & CLICK OUTSIDE) ================= */
const sidebar = document.getElementById('sidebar');
const menuToggle = document.getElementById('menuToggle');

menuToggle.onclick = (e) => {
    e.stopPropagation();
    sidebar.classList.toggle('active');
};

function closeSidebarOnly() {
    if(window.innerWidth <= 768) sidebar.classList.remove('active');
}

document.addEventListener('click', (e) => {
    if (window.innerWidth <= 768 && sidebar.classList.contains('active')) {
        if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
            sidebar.classList.remove('active');
        }
    }
});

/* ================= LOGIKA CORE (DATA & SEARCH) ================= */
const input=document.getElementById("searchInput");
const clearBtn=document.getElementById("clearBtn");
const scanBtn=document.getElementById("scanBtn");
const reader=document.getElementById("reader");
const result=document.getElementById("result");
const historyDiv=document.getElementById("history");
const beepOk=document.getElementById("beepOk");
const beepErr=document.getElementById("beepErr");

let barcodeIndex=new Map();
let history=[];
let dataReady=false;

fetch("/product/products.json")
.then(r=>r.json())
.then(data=>{
  data.forEach(p=>{
    if(p.b){
      p.b.split("/").forEach(code=>{ barcodeIndex.set(code.trim(),p); });
    }
  });
  dataReady=true;
  input.disabled=false;
  scanBtn.disabled=false;
  input.placeholder="Scan / Ketik Barcode...";
});

input.oninput=e=>{
  clearBtn.style.display=e.target.value?"block":"none";
  search(e.target.value);
};

clearBtn.onclick=()=>{
  input.value="";
  result.innerHTML="";
  clearBtn.style.display="none";
};

function search(q){
  if(!dataReady)return;
  q=q.trim();
  if(!q){ result.innerHTML=""; return; }
  if(barcodeIndex.has(q)){
    beepOk.play().catch(e=>{});
    addHistory(q);
    render([barcodeIndex.get(q)]);
  }else{
    beepErr.play().catch(e=>{});
    result.innerHTML="";
  }
}

function render(list){
  result.innerHTML = list.map(p => `
    <div class="card">
      <img src="${p.i}" alt="${p.n}" onerror="this.src='https://via.placeholder.com/70?text=No+Img'">
      <div class="info">
        <b style="display:block; margin-bottom:4px;">${p.n}</b>
        <div style="font-size:12px; color:#777; margin-bottom:8px;">BC: ${p.b}</div>
        <div style="font-size:14px;">Reg: <b>Rp${p.r.toLocaleString()}</b></div>
        <div style="font-size:14px;">Str: <b>Rp${p.s.toLocaleString()}</b></div>
      </div>
    </div>
  `).join("");
}

function addHistory(code){
  if(history.includes(code))return;
  history.unshift(code);
  if(history.length>5)history.pop();
  historyDiv.innerHTML=history.map(h=>`<span onclick="input.value='${h}'; search('${h}')">${h}</span>`).join("");
}

/* ================= KAMERA & QUAGGA (FITUR TETAP SAMA) ================= */
let scanning=false,lastCode="",stableCount=0;
let zoomLevel=2,zoomMin=1,zoomMax=3,lastZoomAdjust=0;

scanBtn.onclick=()=>{
  if(scanning||!dataReady)return;
  scanning=true;
  reader.style.display="block";

  Quagga.init({
    inputStream:{
      type:"LiveStream",
      target:reader,
      constraints:{
        facingMode:{ exact:"environment" },
        width:{ ideal:1920 }, height:{ ideal:1080 },
        focusMode:"continuous"
      },
      area:{ top:"18%", right:"18%", left:"18%", bottom:"18%" }
    },
    decoder:{
      readers:[ "ean_reader", "code_128_reader", "code_39_reader", "upc_reader", "upc_e_reader" ]
    },
    locate:true
  },err=>{
    if(err){
      scanning=false; reader.style.display="none";
      alert("Kamera error/tidak diizinkan");
      return;
    }
    Quagga.start();
    setTimeout(()=>{
      const track=Quagga.CameraAccess.getActiveTrack();
      if(track && track.getCapabilities().zoom){
        const caps=track.getCapabilities();
        zoomMin=caps.zoom.min||1; zoomMax=caps.zoom.max||3;
        zoomLevel=Math.min(2,zoomMax);
        track.applyConstraints({ advanced:[{ zoom:zoomLevel }] });
      }
    },500);

    Quagga.onDetected(res=>{
      const code=res.codeResult.code;
      const decoded=res.codeResult.decodedCodes||[];
      let avgError = decoded.length ? decoded.reduce((s,d)=>s+(d.error||1),0)/decoded.length : 1;
      const valid = decoded.length>=3 && avgError<0.35;

      autoZoom(valid?"good":"bad");

      if(code===lastCode){ if(valid) stableCount++; }
      else { lastCode=code; stableCount= valid ? 1 : 0; }

      if(stableCount>=2){
        Quagga.stop();
        scanning=false;
        reader.style.display="none";
        input.value=code;
        search(code);
      }
    });
  });
};

function autoZoom(mode){
  const now=Date.now();
  if(now-lastZoomAdjust<1000)return;
  const track=Quagga.CameraAccess.getActiveTrack();
  if(!track)return;
  if(mode==="bad" && zoomLevel<zoomMax) zoomLevel+=0.2;
  if(mode==="good" && zoomLevel>zoomMin+0.7) zoomLevel-=0.1;
  zoomLevel=Math.max(zoomMin,Math.min(zoomLevel,zoomMax));
  track.applyConstraints({ advanced:[{ zoom:zoomLevel }] });
  lastZoomAdjust=now;
}
</script>

</body>
</html>
