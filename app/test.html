<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Barcode MediaPipe</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>
    
    <style>
        :root { --miniso-red: #e61523; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: #fff; }
        
        /* UI Header - Sesuai style kamu */
        header { padding: calc(20px + env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid #eee; }
        .top-bar { display: flex; gap: 10px; align-items: center; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; padding: 0 50px 0 15px; outline: none; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; cursor: pointer; }

        /* Area Kamera */
        #scannerArea { display: none; width: 90%; max-width: 350px; aspect-ratio: 1/1; margin: 20px auto; border-radius: 20px; overflow: hidden; position: relative; border: 5px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; inset: 20%; border: 2px solid var(--miniso-red); border-radius: 15px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); pointer-events: none; }
        
        #status { font-size: 11px; text-align: center; color: #888; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="search-container">
            <input id="searchInput" placeholder="Cari barcode...">
            <button id="scanBtn">📸</button>
        </div>
    </div>
    <div id="status">MENGHUBUNGKAN KE AI...</div>
    
    <div id="scannerArea">
        <video id="videoFeed" playsinline muted></video>
        <div class="overlay"></div>
    </div>
</header>

<main id="resultArea" style="padding: 20px;"></main>

<script>
    let barcodeDetector;
    let scanning = false;

    // 1. Inisialisasi MediaPipe Barcode Detector
    async function initMediaPipe() {
        const vision = await tasksVision.FilesetResolver.forVisionTasks(
            "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
        );
        barcodeDetector = await tasksVision.BarcodeDetector.createFromOptions(vision, {
            baseOptions: {
                modelAssetPath: "https://storage.googleapis.com/mediapipe-models/barcode_detector/barcode_detector/float16/1/barcode_detector.tflite",
                delegate: "GPU"
            },
            runningMode: "VIDEO"
        });
        document.getElementById('status').innerText = "SCANNER SIAP ✅";
    }
    initMediaPipe();

    // 2. Kontrol Kamera
    document.getElementById('scanBtn').onclick = async () => {
        if (scanning) return stop();
        start();
    };

    async function start() {
        scanning = true;
        document.getElementById('scannerArea').style.display = 'block';
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        const video = document.getElementById('videoFeed');
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            video.play();
            renderLoop();
        };
    }

    // 3. Loop Deteksi Real-time
    function renderLoop() {
        if (!scanning) return;
        const video = document.getElementById('videoFeed');
        if (video.readyState >= 2) {
            const results = barcodeDetector.detectForVideo(video, performance.now());
            if (results.barcodes.length > 0) {
                const code = results.barcodes[0].rawValue;
                console.log("Barcode Terdeteksi:", code);
                alert("Barcode: " + code); // Ganti dengan fungsi cari di Supabase kamu
                stop();
            }
        }
        requestAnimationFrame(renderLoop);
    }

    function stop() {
        scanning = false;
        const video = document.getElementById('videoFeed');
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        document.getElementById('scannerArea').style.display = 'none';
    }
</script>
</body>
</html>
