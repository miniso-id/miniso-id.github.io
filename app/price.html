<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

/* Animasi Masuk Halaman */
body {
    opacity: 0;
    transition: opacity 0.2s ease-in;
}

body.fade-in {
    opacity: 1;
}

/* Animasi Keluar Halaman */
.fade-out {
    opacity: 0 !important;
    transition: opacity 0.2s ease-out;
}

/* Animasi Garis Laser Scan */
.scan-line {
    position: absolute;
    top: 20%;
    left: 10%;
    width: 80%;
    height: 2px;
    background: var(--miniso-red);
    box-shadow: 0 0 8px 1px var(--miniso-red);
    z-index: 5;
    animation: scanMove 2s infinite linear;
}

@keyframes scanMove {
    0% { top: 20%; }
    50% { top: 80%; }
    100% { top: 20%; }
}

/* Kotak Fokus yang Lebih Responsif */
.focus-guide {
    position: absolute;
    inset: 15%; /* Sedikit lebih lebar untuk barcode panjang */
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 15px;
    z-index: 2;
    box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); /* Efek gelap di luar kotak */
}

/* Sudut kotak yang lebih tebal */
.focus-guide::before, .focus-guide::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    border: 4px solid var(--miniso-red);
}

.focus-guide::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.focus-guide::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; 
            background: #ffffff; color: var(--text-dark); 
            height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden;
        }

        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        #ui-header { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(15px); 
            padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px; 
            border-bottom: 1px solid #eee; 
            z-index: 1000; 
            width: 100%; 
            flex-shrink: 0; 
        }
        .top-bar { display: flex; gap: 10px; align-items: center; max-width: 1200px; margin-inline: auto; width: 100%; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #reader { 
            display:none; width:100%; max-width:340px; aspect-ratio:1/1; 
            margin:15px auto; background:#000; border-radius:20px; 
            overflow:hidden; position:relative; border: 4px solid white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
        }
        /* Cari bagian ini di dalam tag <style> */
#reader video { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    
    /* TAMBAHKAN KODE BARU DI SINI */
    filter: contrast(1.6) brightness(1.1) grayscale(1);
    image-rendering: pixelated;
}
        .focus-guide { position: absolute; inset: 20%; border: 2.5px solid var(--miniso-red); border-radius: 15px; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
        .tap-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 3; }
        #cameraControl { display:none; text-align:center; margin-bottom: 20px; }

        .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; width: 100%; padding: 0 16px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px 0 80px 0; width: 100%; }
        
        @media (min-width: 768px) { #listContainer { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; } }

        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px; background: white; border-radius: 16px; border: 1px solid #f0f0f0; transition: 0.2s; cursor: pointer; width: 100%; min-width: 0; }
        .list-item:active { transform: scale(0.98); background: #fafafa; }
        .list-img-box { width: 70px; height: 70px; background: #f9f9f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid #f0f0f0; }
        .list-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .list-info { flex: 1; min-width: 0; }
        .list-cat { font-size: 10px; color: var(--miniso-red); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .list-name { font-weight: 700; font-size: 14px; color: #111; line-height: 1.4; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .list-bc { font-size: 11px; color: #888; word-break: break-all; line-height: 1.2; }

        #detailContainer { display: none; padding-top: 20px; padding-bottom: 80px; max-width: 700px; margin: 0 auto; width: 100%; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; width: 100%; animation: slideUp 0.3s ease-out; }
        .image-box { background: #fff; text-align: center; padding: 20px; position: relative; border-bottom: 1px solid #f5f5f5; }
        .image-box img { max-width: 100%; height: 300px; object-fit: contain; cursor: zoom-in; }
        .promo-badge { position: absolute; bottom: 15px; right: 15px; background: #ff9800; color: white; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; z-index: 10; }
        .p-info { padding: 24px; }
        .p-cat { font-size: 11px; font-weight: 800; color: var(--miniso-red); text-transform: uppercase; margin-bottom: 8px; display: block; }
        .p-title { font-size: 22px; font-weight: 800; margin: 0 0 10px 0; color: #000; line-height: 1.3; word-break: break-word; }
        .p-desc { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.6; word-break: break-word; }
        
        .price-comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .price-item { padding: 14px; border-radius: 14px; border-bottom: 4px solid #ddd; background: var(--bg-gray); }
        .price-item.reg { border-bottom-color: var(--miniso-red); background: var(--miniso-soft); }
        .price-item.str { border-bottom-color: var(--promo-green); }
        .price-label { font-size: 10px; font-weight: 800; color: #777; margin-bottom: 5px; text-transform: uppercase; display: block; }
        .price-val { font-size: 19px; font-weight: 800; color: #222; }
        .price-item.reg .price-val { color: var(--miniso-red); }

        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 24px; cursor: pointer; backdrop-filter: blur(12px); }
        #lightbox.active { display: flex; opacity: 1; }
        #lightbox img { max-width: 95%; max-height: 85vh; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); transform: scale(0.8) translateY(20px); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #lightbox.active img { transform: scale(1) translateY(0); }

        .floating-back { position: fixed; top: calc(25px + env(safe-area-inset-top)); left: 20px; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 9999; cursor: pointer; border: 1px solid #eee; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>

<div id="page-loader" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:30000; align-items:center; justify-content:center; backdrop-filter:blur(2px);">
    <div class="spinner" style="border-top-color: var(--miniso-red); width: 40px; height: 40px; border-width: 4px;"></div>
</div>

<div id="sidebar" class="sidebar">
    <h2>MMS-X</h2>
    <a href="https://miniso-id.github.io/app/" onclick="toggleSidebar()">Home</a>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="">
</div>

<div id="appContent" style="display:flex; height: 100vh; flex-direction: column;">
    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none; padding:10px 5px; cursor:pointer;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="search-container">
                <input id="searchInput" placeholder="Scan / Input Barcode..." autocomplete="off">
                <button id="scanBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
            </div>

        <div id="reader">
    <video id="videoElement"></video>
    <div class="focus-guide"></div>
    <div class="scan-line"></div> <div class="tap-hint">ARAHKAN BARCODE KE TENGAH KOTAK</div>
</div>
        <div id="cameraControl"><select id="videoSource" style="padding: 10px; width: 100%; max-width: 300px; border-radius: 8px; margin: 10px auto; display:block;"></select></div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
// --- SISTEM CACHE MENGHEMAT EGRESS ---
const CACHE_EXPIRATION = 86400000;

function saveToLocalCache(barcode, data) {
    const cacheEntry = { timestamp: Date.now(), payload: data };
    localStorage.setItem(`cache_${barcode}`, JSON.stringify(cacheEntry));
}

function getLocalCache(barcode) {
    const rawData = localStorage.getItem(`cache_${barcode}`);
    if (!rawData) return null;
    const cacheEntry = JSON.parse(rawData);
    if ((Date.now() - cacheEntry.timestamp) > CACHE_EXPIRATION) {
        localStorage.removeItem(`cache_${barcode}`);
        return null;
    }
    return cacheEntry.payload;
}

// Jalankan saat halaman dimuat
document.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("fade-in");
});

function navigateTo(url) {
    const loader = document.getElementById('page-loader');
    if (loader) loader.style.display = 'flex';
    document.body.classList.add("fade-out");
    setTimeout(() => {
        window.location.href = url;
    }, 200); 
}

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker Registered!', reg.scope))
                .catch(err => console.log('Service Worker Failed:', err));
        });
    }
    
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanning = false, lastScroll = 0, timer;
    let lastSelectedDeviceId = localStorage.getItem('preferredCameraId');

    // Inisialisasi ZXing
    const codeReader = new ZXing.BrowserMultiFormatReader();

    function openLightbox(src) {
        if(!src || src.includes('placeholder')) return;
        const lb = document.getElementById('lightbox');
        document.getElementById('lightboxImg').src = src;
        lb.classList.add('active');
    }

    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

    function toggleSidebar() { 
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }

    function cleanPrice(val) {
        if(!val) return 0;
        return parseInt(String(val).replace(/[^0-9]/g, "")) || 0;
    }

    document.getElementById("searchInput").oninput = () => { clearTimeout(timer); timer = setTimeout(search, 400); };

    async function search() {
    const q = document.getElementById("searchInput").value.trim();
    const list = document.getElementById("listContainer");
    
    // Jika input kosong, hapus tampilan list dan berhenti
    if (q === "") {
        list.innerHTML = "";
        return;
    }
    
    // OPTIMASI: Hanya ambil kolom yang butuh ditampilkan di list
    let query = _supabase.from('export').select('Barcode, Name, Category, Image');
    
    // Filter barcode berdasarkan input
    query = query.ilike('Barcode', `%${q}%`);
    
    // Limit dipasang agar tidak bocor egress
    let { data } = await query.limit(1);
    if(data) {
        list.innerHTML = data.map(p => `
            <div class="list-item" onclick="showDetail('${p.Barcode}')">
                <div class="list-img-box" onclick="event.stopPropagation(); openLightbox('${p.Image || ''}')">
                    <img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/150x150?text=Miniso'" loading="lazy">
                </div>
                <div class="list-info">
                    <div class="list-cat">${p.Category || 'GENERAL'}</div>
                    <div class="list-name">${p.Name}</div>
                    <div class="list-bc">${p.Barcode}</div>
                </div>
            </div>
        `).join('');
    }
}

    document.getElementById("scanBtn").onclick = () => { scanning ? stopScan() : startScan(lastSelectedDeviceId); };

    async function startScan(deviceId = null) {
    scanning = true; 
    document.getElementById("reader").style.display = "block";
    
    // 1. Definisikan Hints untuk ZXing (Kunci Ketajaman & 360 Derajat)
    const hints = new Map();
    const formats = [
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.UPC_A,
        ZXing.BarcodeFormat.UPC_E
    ];
    
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    
    // TRY_HARDER wajib aktif untuk mencari barcode miring/distorsi
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true); 
    
    // CHARACTER_SET membantu pembacaan data yang lebih stabil
    hints.set(ZXing.DecodeHintType.CHARACTER_SET, 'utf-8');
    
    // PURE_BARCODE false memberi tahu scanner bahwa ada background di sekitar barcode
    hints.set(ZXing.DecodeHintType.PURE_BARCODE, false);
    hints.set(ZXing.DecodeHintType.ASSUME_GS1, true);
    hints.set(ZXing.DecodeHintType.ALSO_SUPPORT_CONVEX, true);

    // 2. Setting Resolusi Tinggi & Aspect Ratio
    const constraints = {
        video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { min: 1280, ideal: 1920, max: 2560 },
            height: { min: 720, ideal: 1080, max: 1440 },
            frameRate: { ideal: 30, max: 60 },
            facingMode: "environment",
            // Mengunci aspect ratio 16:9 agar barcode tidak terdistorsi/gepeng saat miring
            aspectRatio: { ideal: 1.7777777778 },
            focusMode: { ideal: "continuous" },
            whiteBalanceMode: { ideal: "continuous" }
            
        }
    };

    try {
        const videoDevices = await codeReader.listVideoInputDevices();
        const backCameras = videoDevices.filter(d => !d.label.toLowerCase().includes('front'));
        let selectedId = deviceId || lastSelectedDeviceId || (backCameras.length > 0 ? backCameras[0].deviceId : videoDevices[0].deviceId);
        
        updateCameraList(backCameras, selectedId);

        // 3. Pasang hints ke reader sebelum mulai
        codeReader.hints = hints;

        // Gunakan decodeFromConstraints untuk menerapkan setting video di atas
        await codeReader.decodeFromConstraints(constraints, 'videoElement', (result, err) => {
            if (result) {
                // ZXing secara otomatis mendeteksi rotasi jika TRY_HARDER aktif
                onDetected(result.text);
            }
        });

        // 4. Maksimalkan Hardware Focus & Zoom
        const videoTrack = document.getElementById('videoElement').srcObject.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        
        const advanced = {};
        
        // Paksa Continuous Focus (Sangat penting untuk angle miring)
        if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
            advanced.focusMode = 'continuous';
        }

        // Gunakan sedikit Zoom (0.5 di atas minimum) 
        // Ini membantu sensor memisahkan garis barcode yang merapat akibat angle miring
        if (capabilities.zoom) {
            const targetZoom = Math.min(capabilities.zoom.min + 0.5, capabilities.zoom.max);
            advanced.zoom = targetZoom;
        }

        if (capabilities.exposureMode && capabilities.exposureMode.includes('continuous')) {
    advanced.exposureMode = 'continuous';
}

        if (Object.keys(advanced).length > 0) {
            await videoTrack.applyConstraints({ advanced: [advanced] });
        }

    } catch (err) {
        console.error("Gagal optimasi kamera:", err);
        // Fallback jika deviceId bermasalah
        if(deviceId) { 
            codeReader.reset(); 
            startScan(null); 
        }
    }
}
    function updateCameraList(devices, currentId) {
        const source = document.getElementById("videoSource");
        const control = document.getElementById("cameraControl");
        
        if (devices.length <= 1) {
            control.style.display = "none";
        } else {
            control.style.display = "block";
            source.innerHTML = devices.map(d => 
                `<option value="${d.deviceId}" ${d.deviceId === currentId ? 'selected' : ''}>${d.label || 'Kamera'}</option>`
            ).join("");
        }
    }

    document.getElementById("videoSource").onchange = (e) => { 
        lastSelectedDeviceId = e.target.value; 
        localStorage.setItem('preferredCameraId', lastSelectedDeviceId); 
        stopScan(); 
        startScan(lastSelectedDeviceId); 
    };

    document.getElementById("reader").onclick = async () => {
    const videoTrack = document.getElementById('videoElement').srcObject?.getVideoTracks()[0];
    if (videoTrack) {
        try {
            const capabilities = videoTrack.getCapabilities();
            // Jika mendukung fokus manual (manual-focus atau single-shot)
            if (capabilities.focusMode) {
                await videoTrack.applyConstraints({
                    advanced: [{ focusMode: 'continuous' }] // Paksa balik ke continuous
                });
                console.log("Fokus dipicu ulang");
            }
        } catch (e) {
            console.warn("Fokus manual tidak didukung pada perangkat ini.");
        }
    }
};

    function stopScan() { 
        codeReader.reset(); 
        scanning = false; 
        document.getElementById("reader").style.display = "none"; 
        document.getElementById("cameraControl").style.display = "none"; 
    }

    async function onDetected(code) {
        // Cek Cache dulu
        const cachedData = getLocalCache(code);
        if (cachedData) {
            document.getElementById("beepOk").play(); 
            stopScan(); 
            document.getElementById("searchInput").blur(); 
            document.getElementById("searchInput").value = code; 
            showDetail(code); // Panggil fungsi asli agar terjemahan tetap jalan
            return;
        }

        // Fetch lengkap sekali saja, simpan ke cache, lalu panggil showDetail
        const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${code}%`).maybeSingle();
        if(data) { 
            saveToLocalCache(code, data); // Simpan ke cache
            document.getElementById("beepOk").play(); 
            stopScan(); 
            document.getElementById("searchInput").blur(); 
            document.getElementById("searchInput").value = code; 
            showDetail(code); // showDetail akan temukan cache dan tidak fetch ulang
        }
    }

    // FUNGSI RENDER DIPISAH AGAR BISA DIPANGGIL CACHE
    function renderDetailView(p) {
        document.getElementById("listContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "none";
        const regPrice = cleanPrice(p["Regular Store Price"]);
        const strPrice = cleanPrice(p["Street Store Price"]);
        const promoText = (p["Extra Promo"] || "").trim();
        const discountLabel = (promoText !== "" && promoText !== "NORMAL PRICE" && p["Regular Store Promo"] !== "NORMAL") 
            ? `<div class="promo-badge">${promoText}</div>` 
            : "";
            
        const det = document.getElementById("detailContainer");
        det.innerHTML = `
            <div class="product-card">
                <div class="image-box">
                    ${discountLabel}
                    <img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/500x500?text=Miniso+Product'" onclick="openLightbox('${p.Image || ''}')">
                </div>
                <div class="p-info">
                    <span class="p-cat">${p.Category || 'GENERAL'}</span>
                    <h3 class="p-title">${p.Name}</h3>
                    <p class="p-desc">${p.Description || ''}</p>
                    <div class="price-comparison-grid">
                        <div class="price-item reg">
                            <span class="price-label">Regular Store</span>
                            <span class="price-val">Rp${regPrice.toLocaleString('id-ID')}</span>
                        </div>
                        <div class="price-item str">
                            <span class="price-label">Street Store</span>
                            <span class="price-val">Rp${strPrice.toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                    <div style="border-top: 1px solid #eee; padding-top: 20px;">
                        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
                            <span style="color:#888; font-weight:600;">BARCODE</span><span style="font-weight:700; word-break:break-all; text-align:right; max-width:60%;">${p.Barcode}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
                            <span style="color:#888; font-weight:600;">REG PROMO</span><span style="font-weight:700; color:var(--promo-blue)">${p["Regular Store Promo"] || '-'}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size:12px;">
                            <span style="color:#888; font-weight:600;">STR PROMO</span><span style="font-weight:700; color:var(--promo-green)">${p["Street Store Promo"] || '-'}</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
        det.style.display = "block";
        det.classList.add('active');
        document.getElementById("btnBackFloating").style.display = "flex";
        document.getElementById("scrollContainer").scrollTo(0, 0);
    }

    async function showDetail(fullBarcode) {
        lastScroll = document.getElementById("scrollContainer").scrollTop;
        
        let p = getLocalCache(fullBarcode);
        
        // Hanya tarik API jika cache tidak ada
        if (!p) {
            const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${fullBarcode}%`).maybeSingle();
            if(!data) return;
            p = data;
            saveToLocalCache(fullBarcode, p);
        }
        
        renderDetailView(p);
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid";
        document.getElementById("btnBackFloating").style.display = "none";
        document.getElementById("scrollContainer").scrollTop = lastScroll;
        startScan(lastSelectedDeviceId);
    }

    // Jalankan scan otomatis saat startup
    startScan(lastSelectedDeviceId);
</script>

<script>
const priceTranslations = {
    id: {
        searchPlaceholder: "Scan / Input Barcode...",
        tapHint: "ARAHKAN BARCODE • TAP UNTUK FOKUS",
        sidebarHome: "Beranda",
        regStoreLabel: "Toko Reguler",
        strStoreLabel: "Toko Ruko",
        barcodeLabel: "BARCODE",
        regPromoLabel: "PROMO REGULER",
        strPromoLabel: "PROMO RUKO",
        generalCat: "UMUM"
    },
    en: {
        searchPlaceholder: "Scan / Enter Barcode...",
        tapHint: "POINT AT BARCODE • TAP TO FOCUS",
        sidebarHome: "Home",
        regStoreLabel: "Regular Store",
        strStoreLabel: "Street Store",
        barcodeLabel: "BARCODE",
        regPromoLabel: "REGULAR STORE PROMO",
        strPromoLabel: "STREET STORE PROMO",
        generalCat: "GENERAL"
    },
    cn: {
        searchPlaceholder: "扫描 / 输入条形码...",
        tapHint: "对准条形码 • 轻触对焦",
        sidebarHome: "首页",
        regStoreLabel: "常规店价格",
        strStoreLabel: "街边店价格",
        barcodeLabel: "条码",
        regPromoLabel: "常规促销",
        strPromoLabel: "街边店促销",
        generalCat: "普通"
    }
};

function applyPriceLanguage() {
    const lang = localStorage.getItem('mms_lang') || 'id';
    const t = priceTranslations[lang];

    const searchInput = document.getElementById('searchInput');
    if (searchInput) searchInput.placeholder = t.searchPlaceholder;
    
    const tapHint = document.querySelector('.tap-hint');
    if (tapHint) tapHint.innerText = t.tapHint;

    const sidebarHome = document.querySelector('#sidebar a');
    if (sidebarHome) sidebarHome.innerText = t.sidebarHome;

    const originalShowDetail = window.showDetail;
    window.showDetail = async function(fullBarcode) {
        await originalShowDetail(fullBarcode); 
        
        const labels = document.querySelectorAll('.price-label');
        if (labels.length >= 2) {
            labels[0].innerText = t.regStoreLabel;
            labels[1].innerText = t.strStoreLabel;
        }

        const infoLabels = document.querySelectorAll('#detailContainer span[style*="color:#888"]');
        if (infoLabels.length >= 3) {
            infoLabels[0].innerText = t.barcodeLabel;
            infoLabels[1].innerText = t.regPromoLabel;
            infoLabels[2].innerText = t.strPromoLabel;
        }
    };
}

document.addEventListener('DOMContentLoaded', applyPriceLanguage);
</script>
</body>
</html>
