<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X | AI Powered</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        body { opacity: 0; transition: opacity 0.2s ease-in; margin: 0; padding: 0; font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; background: #ffffff; color: var(--text-dark); height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }
        body.fade-in { opacity: 1; }
        .fade-out { opacity: 0 !important; transition: opacity 0.2s ease-out; }

        /* --- LOGIN & UI STYLE --- */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg-gray); z-index: 20000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; width: 90%; max-width: 350px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        .btn-login { width: 100%; height: 50px; background: var(--miniso-red); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
        
        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        #ui-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px; border-bottom: 1px solid #eee; z-index: 1000; width: 100%; flex-shrink: 0; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        #catFilterContainer { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px 0; scrollbar-width: none; }
        .cat-chip { padding: 8px 16px; background: #f0f0f0; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .cat-chip.active { background: var(--miniso-red); color: white; }

        #reader { display:none; width:100%; max-width:340px; aspect-ratio:1/1; margin:15px auto; background:#000; border-radius:20px; overflow:hidden; position:relative; border: 4px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        #reader video { width: 100%; height: 100%; object-fit: cover; }
        .focus-guide { position: absolute; inset: 20%; border: 2.5px solid var(--miniso-red); border-radius: 15px; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
        
        /* AI Info Overlay */
        #aiStatus { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 10px; z-index: 10; font-family: monospace; }

        .main-content { flex: 1; overflow-y: auto; padding: 0 16px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px 0 80px 0; }
        
        #detailContainer { display: none; padding-top: 20px; padding-bottom: 80px; max-width: 700px; margin: 0 auto; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; animation: slideUp 0.3s ease-out; }
        
        .floating-back { position: fixed; top: calc(25px + env(safe-area-inset-top)); left: 20px; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 9999; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>MMS-X</h2>
        <p>Silakan masuk ke akun Anda</p>
        <label style="display:block; text-align:left; font-size:11px; font-weight:800; color:#999; margin:0 0 5px 5px;">Username</label>
        <input type="text" id="username" style="width:100%; height:48px; margin-bottom:15px; border-radius:12px; border:1.5px solid #eee; padding:0 15px;">
        <button class="btn-login" onclick="checkLogin()">MASUK</button>
    </div>
</div>

<div id="sidebar" class="sidebar">
    <h2>MMS-X</h2>
    <a href="#" onclick="logout()">Logout</a>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="appContent" style="display:flex; height: 100vh; flex-direction: column;">
    <header id="ui-header">
        <div style="display: flex; gap: 10px; align-items: center;">
            <button onclick="toggleSidebar()" style="background:none; border:none; padding:10px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="search-container">
                <input id="searchInput" placeholder="Cari nama / barcode...">
                <button id="scanBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
            </div>
        </div>
        <div id="catFilterContainer"></div>
        
        <div id="reader">
            <div id="aiStatus">AI: Loading...</div>
            <video id="videoElement"></video>
            <div class="focus-guide"></div>
        </div>
        <div id="cameraControl" style="display:none; margin-top:10px;">
            <select id="videoSource" style="width:100%; padding:10px; border-radius:8px;"></select>
        </div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const codeReader = new ZXing.BrowserMultiFormatReader();
    let scanning = false;
    let net = null; // Untuk model TensorFlow
    let lastSelectedDeviceId = localStorage.getItem('preferredCameraId'); // Mengambil kamera tersimpan

    // 1. Load AI Model (COCO-SSD)
    async function initAI() {
        const status = document.getElementById('aiStatus');
        try {
            net = await cocoSsd.load();
            status.innerText = "AI: Ready";
            status.style.color = "#4CAF50";
        } catch (e) {
            status.innerText = "AI: Error";
            console.error(e);
        }
    }

    // 2. AI Prediction Loop
    async function runAI() {
        if (!scanning || !net) return;
        
        const video = document.getElementById('videoElement');
        if (video.readyState === 4) {
            const predictions = await net.detect(video);
            if (predictions.length > 0) {
                const best = predictions[0];
                document.getElementById('aiStatus').innerText = `AI: ${best.class} (${Math.round(best.score*100)}%)`;
            }
        }
        requestAnimationFrame(runAI);
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("fade-in");
        initAI();
        if(localStorage.getItem('mmsx_auth') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
        }
    });

    async function startScan(deviceId = null) {
        scanning = true;
        document.getElementById("reader").style.display = "block";
        
        try {
            const videoDevices = await codeReader.listVideoInputDevices();
            // Gunakan ID yang diberikan, atau yang tersimpan, atau kamera belakang pertama
            let selectedId = deviceId || lastSelectedDeviceId || (videoDevices.length > 0 ? videoDevices[0].deviceId : null);
            
            updateCameraList(videoDevices, selectedId);

            await codeReader.decodeFromVideoDevice(selectedId, 'videoElement', (result, err) => {
                if (result) {
                    document.getElementById("searchInput").value = result.text;
                    stopScan();
                    showDetail(result.text);
                }
            });

            // Jalankan deteksi AI setelah kamera aktif
            runAI();

        } catch (err) {
            console.error(err);
        }
    }

    function updateCameraList(devices, currentId) {
        const source = document.getElementById("videoSource");
        const control = document.getElementById("cameraControl");
        
        if (devices.length > 1) {
            control.style.display = "block";
            source.innerHTML = devices.map(d => 
                `<option value="${d.deviceId}" ${d.deviceId === currentId ? 'selected' : ''}>${d.label || 'Kamera'}</option>`
            ).join("");
        }
    }

    document.getElementById("videoSource").onchange = (e) => {
        lastSelectedDeviceId = e.target.value;
        localStorage.setItem('preferredCameraId', lastSelectedDeviceId); // Simpan pilihan kamera
        stopScan();
        startScan(lastSelectedDeviceId);
    };

    document.getElementById("scanBtn").onclick = () => {
        scanning ? stopScan() : startScan(lastSelectedDeviceId);
    };

    function stopScan() {
        codeReader.reset();
        scanning = false;
        document.getElementById("reader").style.display = "none";
        document.getElementById("cameraControl").style.display = "none";
    }

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }

    function checkLogin() {
        localStorage.setItem('mmsx_auth', 'true');
        document.getElementById('loginOverlay').style.display = 'none';
    }

    function logout() {
        localStorage.clear();
        window.location.reload();
    }

    async function showDetail(barcode) {
        // Logika detail produk Anda di sini
        alert("Mendeteksi barcode: " + barcode);
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid";
        document.getElementById("btnBackFloating").style.display = "none";
    }
</script>

</body>
</html>
