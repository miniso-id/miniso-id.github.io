<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>MMS-X Miniso Edition - Sharp Focus</title>
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    <style>
        :root { --miniso-red: #e61523; --miniso-soft: #fff1f2; }
        body { margin: 0; font-family: sans-serif; background: #fdfdfd; }
        .app-wrapper { padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* Area Scanner */
        #reader { 
            width: 100%; max-width: 350px; aspect-ratio: 1/1; 
            background: #000; border-radius: 20px; overflow: hidden; 
            position: relative; border: 4px solid #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        #reader video { width: 100%; height: 100%; object-fit: cover; }

        /* Bingkai Fokus & Instruksi */
        .focus-guide {
            position: absolute; inset: 20%; border: 2px solid var(--miniso-red);
            border-radius: 15px; pointer-events: none; z-index: 2;
        }
        .tap-hint {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            color: white; font-size: 10px; text-shadow: 1px 1px 2px #000; z-index: 3;
        }

        .controls { width: 100%; max-width: 350px; margin-top: 15px; text-align: center; }
        #scanBtn { 
            background: var(--miniso-red); color: white; border: none; 
            padding: 12px 25px; border-radius: 10px; font-weight: bold; cursor: pointer;
        }
        #videoSource { width: 100%; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid #ccc; }
        #result { margin-top: 20px; width: 100%; max-width: 350px; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div id="reader">
        <div class="focus-guide"></div>
        <div class="tap-hint">Sentuh layar untuk fokus ulang</div>
    </div>

    <div class="controls">
        <button id="scanBtn">START SCAN</button>
        <select id="videoSource" style="display:none;"></select>
    </div>

    <div id="result"></div>
</div>

<script>
    const reader = document.getElementById("reader");
    const scanBtn = document.getElementById("scanBtn");
    const videoSource = document.getElementById("videoSource");
    let scanning = false;

    // 1. FUNGSI TRIGGER AUTOFOCUS MANUAL (Tap to Focus)
    reader.onclick = async () => {
        const track = Quagga.CameraAccess.getActiveTrack();
        if (track && track.getCapabilities) {
            const caps = track.getCapabilities();
            try {
                // Paksa sensor untuk re-focus
                await track.applyConstraints({
                    advanced: [{ focusMode: "continuous" }, { focusMode: "manual" }]
                });
                await track.applyConstraints({
                    advanced: [{ focusMode: "continuous" }]
                });
                console.log("Re-focus triggered");
            } catch (e) { console.log("AF not supported on this lens"); }
        }
    };

    scanBtn.onclick = () => {
        if (scanning) {
            Quagga.stop();
            scanning = false;
            scanBtn.innerText = "START SCAN";
            videoSource.style.display = "none";
        } else {
            startScan();
        }
    };

    function startScan(deviceId = null) {
        Quagga.init({
            inputStream: {
                type: "LiveStream",
                target: reader,
                constraints: {
                    deviceId: deviceId ? { exact: deviceId } : undefined,
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            },
            decoder: { readers: ["ean_reader", "code_128_reader"] },
            locate: true
        }, (err) => {
            if (err) return alert("Error: " + err);
            Quagga.start();
            scanning = true;
            scanBtn.innerText = "STOP SCAN";
            videoSource.style.display = "block";
            
            // 2. AKTIFKAN CONTINUOUS AUTOFOCUS SAAT START
            const track = Quagga.CameraAccess.getActiveTrack();
            if (track && track.applyConstraints) {
                track.applyConstraints({
                    advanced: [{ focusMode: "continuous" }]
                }).catch(() => console.log("Continuous Focus not supported"));
            }
            
            updateCameraList();
        });
    }

    async function updateCameraList() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        videoSource.innerHTML = videoDevices.map(d => 
            `<option value="${d.deviceId}" ${Quagga.CameraAccess.getActiveTrack().label === d.label ? 'selected' : ''}>${d.label || 'Kamera'}</option>`
        ).join("");
    }

    videoSource.onchange = () => {
        Quagga.stop();
        startScan(videoSource.value);
    };

    Quagga.onDetected(res => {
        const code = res.codeResult.code;
        document.getElementById("result").innerHTML = `<h3>Terdeteksi: ${code}</h3>`;
        // Opsional: Quagga.stop(); scanning = false;
    });
</script>
</body>
</html>
