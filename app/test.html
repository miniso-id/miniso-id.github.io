        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;

/* Animasi Masuk Halaman */
body {
    opacity: 0;
    transition: opacity 0.2s ease-in;
}

body.fade-in {
    opacity: 1;
}

/* Animasi Keluar Halaman */
.fade-out {
    opacity: 0 !important;
    transition: opacity 0.2s ease-out;
}

/* Kotak Fokus yang Lebih Responsif */
.focus-guide {
    position: absolute;
    inset: 15%; /* Sedikit lebih lebar untuk barcode panjang */
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-radius: 15px;
    z-index: 2;
    box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); /* Efek gelap di luar kotak */
}

/* Sudut kotak yang lebih tebal */
.focus-guide::before, .focus-guide::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    border: 4px solid var(--miniso-red);
}

.focus-guide::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.focus-guide::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }

// --- KODE BARU: OPTIMASI CACHE EGRESS ---
const CACHE_KEY = "mmsx_cache_";
const CACHE_TIME = 3600000; // 1 Jam

function saveToCache(barcode, data) {
    const entry = { timestamp: Date.now(), payload: data };
    localStorage.setItem(CACHE_KEY + barcode, JSON.stringify(entry));
}

function getFromCache(barcode) {
    const raw = localStorage.getItem(CACHE_KEY + barcode);
    if (!raw) return null;
    const entry = JSON.parse(raw);
    if (Date.now() - entry.timestamp > CACHE_TIME) {
        localStorage.removeItem(CACHE_KEY + barcode);
        return null;
    }
    return entry.payload;
}

    /* --- LOGIKA LOGIN TERINTEGRASI --- */
    async function checkLogin() {
        const role = document.getElementById('loginAs').value;
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const err = document.getElementById('loginError');
        const btn = document.querySelector('.btn-login');

        btn.innerText = "LOADING...";
        err.style.display = 'none';

        try {
            const { data } = await _userSupabase
                .from('users') 
                .select('*')
                .eq('login as', role)
                .eq('username', user)
                .eq('password', pass)
                .maybeSingle();

            if (data) {
                localStorage.setItem('mmsx_auth', 'true');
                localStorage.setItem('mmsx_role', role); 
                
                document.getElementById('loginOverlay').style.display = 'none';
            } else {
                err.style.display = 'block';
            }
        } catch (e) {
            alert("Error Koneksi Database User");
        } finally {
            btn.innerText = "MASUK";
        }
    }

}

    /* --- INISIALISASI ZXING --- */
    const codeReader = new ZXing.BrowserMultiFormatReader();
    let scanning = false, lastScroll = 0, timer;
    let lastSelectedDeviceId = localStorage.getItem('preferredCameraId'); // Rekaman kamera terakhir
    let currentCategory = 'All';

    async function fetchCategories() {
        const { data, error } = await _supabase.rpc('get_unique_categories');

        if (error) {
            console.error("Gagal mengambil kategori:", error);
            return;
        }

        if (data) {
            const container = document.getElementById('catFilterContainer');
            container.innerHTML = '<div class="cat-chip active" onclick="filterCat(\'All\', this)">All</div>';

            data.forEach(item => {
                const catName = item.category; 
                const chip = document.createElement('div');
                chip.className = 'cat-chip';
                chip.innerText = catName;
                chip.onclick = () => filterCat(catName, chip);
                container.appendChild(chip);
            });
        }
    }
    fetchCategories();

    function filterCat(cat, el) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        search();
    }

    function openLightbox(src) {
        if(!src || src.includes('placeholder')) return;
        const lb = document.getElementById('lightbox');
        document.getElementById('lightboxImg').src = src;
        lb.classList.add('active');
    }

    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

    function toggleSidebar() { 
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }

    function cleanPrice(val) {
        if(!val) return 0;
        return parseInt(String(val).replace(/[^0-9]/g, "")) || 0;
    }

    document.getElementById("searchInput").oninput = () => { clearTimeout(timer); timer = setTimeout(search, 400); };

    async function search() {
        const q = document.getElementById("searchInput").value.trim();
        const list = document.getElementById("listContainer");

        // LOGIKA BARU: Jika input kosong, hapus tampilan list dan berhenti di sini
        if (q === "") {
            list.innerHTML = "";
            return;
        }

        // OPTIMASI EGRESS: Pilih kolom yang dibutuhkan saja dan limit lebih kecil (10)
        let query = _supabase.from('export').select('Barcode, Name, Category, "Detail Category", Image');
        
        if (currentCategory !== 'All') query = query.eq('Category', currentCategory);
        
        // Karena kita sudah cek q di atas, maka bagian ini pasti dijalankan saat ada teks
        query = query.or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%,"Detail Category".ilike.%${q}%`);
        
        let { data } = await query.limit(200);
        
        if(data) {
            list.innerHTML = data.map(p => `
                <div class="list-item" onclick="showDetail('${p.Barcode}')">
                    <div class="list-img-box" onclick="event.stopPropagation(); openLightbox('${p.Image}')">
                        <img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/150x150?text=Miniso'" loading="lazy">
                    </div>
                    <div class="list-info">
                        <div class="list-cat">${p.Category || 'GENERAL'}</div>
                        <div class="list-name">${p.Name}</div>
                        <div class="list-bc">${p.Barcode}</div>
                    </div>
                </div>
            `).join('');
        }
    }

    /* --- LOGIKA SCANNER ZXING --- */
    document.getElementById("scanBtn").onclick = () => { scanning ? stopScan() : startScan(lastSelectedDeviceId); };

    async function startScan(deviceId = null) {
        scanning = true; 
        document.getElementById("reader").style.display = "block";
        document.body.style.overflow = "hidden";
        
        const hints = new Map();
        const formats = [
            ZXing.BarcodeFormat.EAN_13,
            ZXing.BarcodeFormat.EAN_8,
            ZXing.BarcodeFormat.CODE_128,
            ZXing.BarcodeFormat.UPC_A,
            ZXing.BarcodeFormat.UPC_E
        ];
        
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        hints.set(ZXing.DecodeHintType.TRY_HARDER, true); 
        hints.set(ZXing.DecodeHintType.CHARACTER_SET, 'utf-8');
        hints.set(ZXing.DecodeHintType.PURE_BARCODE, false);
        hints.set(ZXing.DecodeHintType.ASSUME_GS1, true);
        hints.set(ZXing.DecodeHintType.ALSO_SUPPORT_CONVEX, true);

        const constraints = {
            video: {
                deviceId: deviceId ? { exact: deviceId } : undefined,
                width: { min: 1280, ideal: 1920, max: 2560 },
                height: { min: 720, ideal: 1080, max: 1440 },
                frameRate: { ideal: 30, max: 60 },
                facingMode: "environment",
                aspectRatio: { ideal: 1.7777777778 },
                whiteBalanceMode: { ideal: "continuous" }
            }
        };

        try {
            const videoDevices = await codeReader.listVideoInputDevices();
            const backCameras = videoDevices.filter(d => !d.label.toLowerCase().includes('front'));
            let selectedId = deviceId || lastSelectedDeviceId || (backCameras.length > 0 ? backCameras[0].deviceId : videoDevices[0].deviceId);
            
            updateCameraList(backCameras, selectedId);

            codeReader.hints = hints;

            await codeReader.decodeFromConstraints(constraints, 'videoElement', (result, err) => {
                if (result) {
                    onDetected(result.text);
                }
            });

            const videoTrack = document.getElementById('videoElement').srcObject.getVideoTracks()[0];
            const capabilities = videoTrack.getCapabilities();
            
            const advanced = {};
            
            if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                advanced.focusMode = 'continuous';
            }

            if (capabilities.zoom) {
                const targetZoom = Math.min(capabilities.zoom.min + 1.0, capabilities.zoom.max);
                advanced.zoom = targetZoom;
            }

            if (capabilities.exposureMode && capabilities.exposureMode.includes('continuous')) {
    advanced.exposureMode = 'continuous';
}

            if (Object.keys(advanced).length > 0) {
                await videoTrack.applyConstraints({ advanced: [advanced] });
            }

        } catch (err) {
            console.error("Gagal optimasi kamera:", err);
            if(deviceId) { 
                codeReader.reset(); 
                startScan(null); 
            }
            if (!aiAutoTimer) {
        aiAutoTimer = setInterval(() => {
            // Hanya jalankan AI jika sedang scanning dan tidak sedang loading AI sebelumnya
            const loading = document.getElementById('hybridAiLoading');
            if (scanning && loading.style.display !== 'flex') {
                captureHybridAi(); 
            }
        }, 7000); // 7000ms = 7 detik
        }
    }

    function updateCameraList(devices, currentId) {
        const source = document.getElementById("videoSource");
        const control = document.getElementById("cameraControl");
        
        if (devices.length <= 1) {
            control.style.display = "none";
        } else {
            control.style.display = "block";
            source.innerHTML = devices.map(d => 
                `<option value="${d.deviceId}" ${d.deviceId === currentId ? 'selected' : ''}>${d.label || 'Kamera'}</option>`
            ).join("");
        }
    }

    document.getElementById("videoSource").onchange = (e) => { 
        lastSelectedDeviceId = e.target.value; 
        localStorage.setItem('preferredCameraId', lastSelectedDeviceId); 
        stopScan(); 
        startScan(lastSelectedDeviceId); 
    };

    document.getElementById("reader").onclick = async () => {
        const videoTrack = document.getElementById('videoElement').srcObject?.getVideoTracks()[0];
        if (videoTrack) {
            try {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.focusMode) {
                    await videoTrack.applyConstraints({
                        advanced: [{ focusMode: 'continuous' }] 
                    });
                    console.log("Fokus dipicu ulang");
                }
            } catch (e) {
                console.warn("Fokus manual tidak didukung pada perangkat ini.");
            }
        }
    };

function stopScan() {
    codeReader.reset();
    scanning = false;
    
    // MATIKAN AI OTOMATIS
    if (aiAutoTimer) {
        clearInterval(aiAutoTimer);
        aiAutoTimer = null;
    }

    document.getElementById("reader").style.display = "none";
    document.body.style.overflow = "auto";
}

    async function onDetected(code) {
        // OPTIMASI EGRESS: Cek cache sebelum fetch
        if (getFromCache(code)) {
            document.getElementById("beepOk").play(); 
            stopScan(); 
            document.getElementById("searchInput").blur(); 
            document.getElementById("searchInput").value = code; 
            showDetail(code);
            return;
        }

        const { data } = await _supabase.from('export').select('Barcode').ilike('Barcode', `%${code}%`).maybeSingle();
        if(data) { 
            document.getElementById("beepOk").play(); 
            stopScan(); 
            document.getElementById("searchInput").blur(); 
            document.getElementById("searchInput").value = code; 
            showDetail(code); 
        }
    }

async function showDetail(fullBarcode) {
        lastScroll = document.getElementById("scrollContainer").scrollTop;

        // OPTIMASI EGRESS: Gunakan cache jika ada
        let p = getFromCache(fullBarcode);
        if (!p) {
            const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${fullBarcode}%`).maybeSingle();
            if(!data) return;
            p = data;
            saveToCache(fullBarcode, p);
        }

        document.getElementById("listContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "none";
        const regPrice = cleanPrice(p["Regular Store Price"]);
        const strPrice = cleanPrice(p["Street Store Price"]);
        const promoText = (p["Extra Promo"] || "").trim();
        const discountLabel = (promoText !== "" && promoText !== "NORMAL PRICE" && p["Regular Store Promo"] !== "NORMAL") 
        ? `<div class="promo-badge">${promoText}</div>` 
        : "";

        // Logika: Ambil barcode pertama saja sebelum tanda "/"
        const firstBarcode = p.Barcode ? p.Barcode.split('/')[0].trim() : "";

        const det = document.getElementById("detailContainer");
        det.innerHTML = `
            <div class="product-card">
                <div class="image-box">
                    ${discountLabel}
                    <img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/500x500?text=Miniso+Product'" onclick="openLightbox('${p.Image}')">
                </div>
                <div class="p-info">
                    <span class="p-cat">${p.Category || 'GENERAL'}</span>
                    <h3 class="p-title">${p.Name}</h3>
                    <p class="p-desc">${p.Description || ''}</p>
                    <div class="price-comparison-grid">
                        <div class="price-item reg">
                            <span class="price-label">Regular Store</span>
                            <span class="price-val">Rp${regPrice.toLocaleString('id-ID')}</span>
                        </div>
                        <div class="price-item str">
                            <span class="price-label">Street Store</span>
                            <span class="price-val">Rp${strPrice.toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                    <div style="border-top: 1px solid #eee; padding-top: 20px;">
                        
                        <div style="display:flex; flex-direction:column; align-items:center; margin-bottom:15px; width:100%;">
                            <span style="font-weight:700; font-size:12px; word-break:break-all; margin-bottom:8px; text-align:center;">${p.Barcode}</span>
                            <svg id="barcodeCanvas" style="max-height:60px; width:auto; max-width:100%; background:white; padding:5px; border-radius:4px; border:1px solid #eee;"></svg>
                        </div>
                        
                        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
                            <span style="color:#888; font-weight:600;">REG PROMO</span><span style="font-weight:700; color:var(--promo-blue)">${p["Regular Store Promo"] || '-'}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size:12px;">
                            <span style="color:#888; font-weight:600;">STR PROMO</span><span style="font-weight:700; color:var(--promo-green)">${p["Street Store Promo"] || '-'}</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
        // Generate Barcode secara lokal
        if(firstBarcode) {
            JsBarcode("#barcodeCanvas", firstBarcode, {
                format: "CODE128",
                lineColor: "#000",
                width: 2,
                height: 40,
                displayValue: false 
            });
        }

        det.style.display = "block";
        det.classList.add('active');
        document.getElementById("btnBackFloating").style.display = "flex";
        document.getElementById("scrollContainer").scrollTo(0, 0);
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid";
        document.getElementById("btnBackFloating").style.display = "none";
        document.getElementById("scrollContainer").scrollTop = lastScroll;
    }

// --- FUNGSI AI VISION (Direct to Edge Function) ---

// Buka Kamera AI
document.getElementById('aiSearchBtn').onclick = async () => {
    document.getElementById('aiOverlay').style.display = 'flex';
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: "environment",
                focusMode: { ideal: "continuous" },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            } 
        });

        // --- BAGIAN TAMBAHAN ZOOM MULAI DI SINI ---
const video = document.getElementById('aiVideo');
video.srcObject = stream;

const track = stream.getVideoTracks()[0];
const capabilities = track.getCapabilities();

// Jika HP mendukung zoom, kita set ke 2x (agar barcode kecil terlihat besar)
if (capabilities.zoom) {
    track.applyConstraints({
        advanced: [{ zoom: 1.0 }] 
    });
}
        
        document.getElementById('aiVideo').srcObject = stream;
    } catch (err) {
        alert("Gagal mengakses kamera: " + err.message);
        closeAi();
    }
};

async function captureHybridAi() {
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('aiCanvas');
    
    // Gunakan indikator loading yang lebih halus (misal: hanya spinner kecil)
    // agar tidak menutupi seluruh layar saat scan otomatis
    console.log("AI sedang mengecek produk secara otomatis...");

    try {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const base64 = canvas.toDataURL('image/jpeg', 0.9).split(',')[1];

        const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-vision`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify({ image: base64 })
        });

        const data = await response.json();
        
        // JIKA AI BERHASIL MENEMUKAN NAMA PRODUK
        if (data.description && data.description !== "Unknown") {
            const searchInput = document.getElementById("searchInput");
            searchInput.value = data.description;
            
            stopScan(); // Berhenti karena produk ditemukan
            search();   // Tampilkan hasil
        }
        
    } catch (e) {
        // Cukup log saja, jangan pakai Alert agar user tidak terganggu
        console.error("Auto AI Silent Error:", e);
    }
}
    
    function showAiLoading(msg) {
        document.getElementById('aiStatus').innerText = msg;
        document.getElementById('aiLoading').style.display = 'flex';
    }

    function hideAiLoading() {
        document.getElementById('aiLoading').style.display = 'none';
    }

    function closeAi() {
        const video = document.getElementById('aiVideo');
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        document.getElementById('aiOverlay').style.display = 'none';
    }
</script>
