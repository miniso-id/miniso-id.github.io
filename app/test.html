<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Final Fix</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --text-dark: #1a1a1a;
            --bg-gray: #f4f4f4;
        }

        body { margin: 0; font-family: -apple-system, sans-serif; background: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER & SEARCH */
        header { padding: calc(20px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid #eee; background: white; z-index: 100; }
        .top-bar { display: flex; gap: 10px; align-items: center; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 44px; border-radius: 12px; border: 1px solid #ddd; background: #f5f5f7; padding: 0 45px 0 12px; outline: none; font-size: 15px; }
        #scanBtn { position: absolute; right: 5px; top: 5px; width: 34px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        #statusInfo { font-size: 10px; text-align: center; margin-top: 5px; color: #999; font-weight: bold; }

        /* SCANNER BOX */
        #reader { display: none; width: 90%; max-width: 320px; aspect-ratio: 1/1; margin: 15px auto; background: #000; border-radius: 18px; overflow: hidden; position: relative; border: 3px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        .scanner-overlay { position: absolute; inset: 20%; border: 2px solid var(--miniso-red); border-radius: 12px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); pointer-events: none; }

        /* LIST & DETAIL */
        .main-content { flex: 1; overflow-y: auto; padding: 10px 16px 80px; }
        .list-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; }
        .list-img { width: 50px; height: 50px; border-radius: 8px; object-fit: contain; background: #f9f9f9; }
        
        #detailContainer { display: none; padding: 10px 0; }
        .back-btn { padding: 10px 20px; background: #eee; border-radius: 8px; display: inline-block; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="search-container">
            <input id="searchInput" placeholder="Cari barcode atau nama...">
            <button id="scanBtn">📸</button>
        </div>
    </div>
    <div id="statusInfo">Menginisialisasi sistem...</div>

    <div id="reader">
        <video id="videoElement" playsinline muted></video>
        <div class="scanner-overlay"></div>
    </div>
</header>

<main class="main-content">
    <div id="listContainer"></div>
    <div id="detailContainer"></div>
</main>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let detector = null;
    let isScanning = false;
    let isLock = false;

    // Load Library & Model
    async function init() {
        const info = document.getElementById('statusInfo');
        try {
            const vision = window.tasksVision || window.vision;
            const files = await vision.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
            detector = await vision.BarcodeDetector.createFromOptions(files, {
                baseOptions: { 
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/barcode_detector/barcode_detector/float16/1/barcode_detector.tflite",
                    delegate: "GPU" 
                },
                runningMode: "VIDEO"
            });
            info.innerText = "Scanner Siap ✅";
            info.style.color = "green";
        } catch (e) {
            info.innerText = "Error: Library gagal dimuat ❌";
            console.error(e);
        }
    }
    init();

    document.getElementById('scanBtn').onclick = () => isScanning ? stop() : start();

    async function start() {
        if (!detector) return alert("Mohon tunggu, sistem sedang loading...");
        isScanning = true;
        isLock = false;
        document.getElementById('reader').style.display = 'block';
        const video = document.getElementById('videoElement');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                draw();
            };
        } catch (e) {
            alert("Kamera tidak diizinkan.");
            stop();
        }
    }

    function draw() {
        if (!isScanning) return;
        const video = document.getElementById('videoElement');
        if (video.readyState >= 2 && !isLock) {
            const results = detector.detectForVideo(video, performance.now());
            if (results.barcodes.length > 0) {
                isLock = true;
                processBarcode(results.barcodes[0].rawValue);
            }
        }
        requestAnimationFrame(draw);
    }

    async function processBarcode(code) {
        const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${code}%`).maybeSingle();
        if (data) {
            document.getElementById('beepOk').play();
            stop();
            showDetail(data);
        } else {
            console.log("Tidak ditemukan:", code);
            setTimeout(() => { isLock = false; }, 1500); // Lanjut scan lagi setelah 1.5 detik
        }
    }

    function stop() {
        isScanning = false;
        const video = document.getElementById('videoElement');
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        document.getElementById('reader').style.display = 'none';
    }

    function showDetail(p) {
        document.getElementById('listContainer').style.display = 'none';
        const det = document.getElementById('detailContainer');
        det.style.display = 'block';
        det.innerHTML = `
            <div class="back-btn" onclick="location.reload()">← Kembali</div>
            <div style="text-align:center"><img src="${p.Image}" style="width:200px"></div>
            <h2>${p.Name}</h2>
            <p style="color:var(--miniso-red); font-size:24px; font-weight:bold;">Rp${parseInt(p["Regular Store Price"]).toLocaleString()}</p>
            <p>Barcode: ${p.Barcode}</p>
        `;
    }

    // Search function
    document.getElementById('searchInput').oninput = async (e) => {
        const q = e.target.value;
        if (q.length < 3) return;
        const { data } = await _supabase.from('export').select('*').or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`).limit(10);
        if (data) {
            document.getElementById('listContainer').innerHTML = data.map(p => `
                <div class="list-item" onclick="processBarcode('${p.Barcode}')">
                    <img class="list-img" src="${p.Image}">
                    <div><b>${p.Name}</b><br><small>${p.Barcode}</small></div>
                </div>
            `).join('');
        }
    };
</script>
</body>
</html>
