<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Pasang MMS-X</title>
    <style>
        /* Hanya gaya untuk prompt iOS */
        body {
            margin: 0;
            background: #ffffff;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #ios-prompt {
            display: none;  /* ditampilkan hanya jika kondisi terpenuhi */
            background: white;
            width: 85%;
            max-width: 320px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border: 2px solid #e61523;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .app-logo {
            width: 70px;
            margin: 0 auto 15px;
            border-radius: 15px;
        }
        .prompt-text {
            font-size: 15px;
            line-height: 1.6;
            color: #333;
        }
        .ios-share-icon {
            height: 24px;
            vertical-align: middle;
            margin: 0 5px;
        }
    </style>
</head>
<body>

<div id="ios-prompt">
    <img src="https://miniso-id.github.io/app/user512.png" class="app-logo" alt="MMS-X Logo">
    <div class="prompt-text">
        <strong>Pasang MMS-X</strong><br>
        Tambahkan ke Home Screen untuk mulai menggunakan aplikasi.<br><br>
        Tap <img src="https://miniso-id.github.io/ios/share.png" class="ios-share-icon"> lalu pilih<br>
        <b>"Add to Home Screen"</b>
    </div>
</div>

<script>
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true || 
                         window.matchMedia('(display-mode: standalone)').matches;

    if (isStandalone) {
        // Sudah diinstal → langsung buka aplikasi utama
        window.location.replace('https://miniso-id.github.io/app/');
    } else if (isIOS) {
        // iOS tetapi belum standalone → tampilkan panduan
        document.getElementById('ios-prompt').style.display = 'block';
    } else {
        // Android / Desktop → bisa juga langsung arahkan ke app atau beri pesan
        // Kalau mau langsung ke app:
        window.location.replace('https://miniso-id.github.io/ios/');
    }
</script>

</body>
</html>
