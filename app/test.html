<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X | Miniso Indonesia</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-gray);
            color: var(--text-dark);
            -webkit-tap-highlight-color: transparent;
        }

        /* --- LOGIN OVERLAY --- */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-box {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-box img { width: 120px; margin-bottom: 20px; }

        .login-box input, .login-box select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--miniso-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            cursor: pointer;
        }

        /* --- SCANNER & RESULT UI --- */
        #mainApp { padding-bottom: 80px; }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            display: none;
            border-radius: 12px;
            overflow: hidden;
        }

        #videoElement { width: 100%; height: auto; display: block; }

        .scan-controls {
            padding: 15px;
            background: white;
            display: none;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        #stockResult {
            margin: 15px;
            background: white;
            border-radius: 12px;
            padding: 15px;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .mini-spin {
            width: 18px; height: 18px;
            border: 2px solid #ddd;
            border-top: 2px solid var(--miniso-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .stock-error { color: #dc3545; text-align: center; padding: 10px; font-weight: bold; }
        .stock-loading { text-align: center; color: #666; padding: 20px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e3/Miniso_logo.svg/1200px-Miniso_logo.svg.png" alt="Miniso">
            <h3>MMS-X Login</h3>
            <select id="loginRole">
                <option value="staff">Staff Toko</option>
                <option value="spv">Supervisor</option>
            </select>
            <input type="text" id="loginUser" placeholder="Username">
            <input type="password" id="loginPass" placeholder="Password">
            
            <input type="text" id="loginToken" placeholder="Tempel Token Miniso di sini" style="border: 2px solid #007bff; background: #f0f7ff;">
            <p style="font-size: 11px; color: #666; text-align: left; margin-top: 0;">*Dapatkan token terbaru dari HTTP Toolkit (MuMu Player)</p>

            <button class="btn-login" onclick="doLogin()">MASUK APLIKASI</button>
            <p id="loginError" style="color: red; font-size: 14px; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="mainApp">
        <div class="scan-controls" id="cameraControl">
            <label style="font-size: 12px; color: #666; display: block; margin-bottom: 5px;">Pilih Kamera:</label>
            <select id="videoSource" style="width: 80%; padding: 8px; border-radius: 6px;"></select>
        </div>

        <div id="reader">
            <video id="videoElement"></video>
        </div>

        <div id="stockResult"></div>
        
        <div id="detailContainer" style="padding: 40px 20px; text-align: center;">
            <p style="color: #666; margin-bottom: 20px;">Silakan scan barcode barang untuk cek stok aktual.</p>
            <button onclick="initScanner()" id="scanBtn" style="padding: 15px 30px; background: var(--miniso-red); color: white; border: none; border-radius: 50px; font-weight: bold; width: 80%;">
                MULAI SCAN BARCODE
            </button>
            
            <button onclick="doLogout()" style="margin-top: 20px; padding: 10px; background: transparent; color: #888; border: 1px solid #ccc; border-radius: 8px; width: 80%;">
                LOGOUT & GANTI TOKEN
            </button>
        </div>
    </div>

    <audio id="beepOk" src="https://www.soundjay.com/buttons/beep-07a.mp3" preload="auto"></audio>

    <script>
        // ==========================================
        // 1. PENGATURAN EDGE FUNCTION
        // ==========================================
        // GANTI URL DI BAWAH INI DENGAN URL EDGE FUNCTION SUPABASE ANDA
        const EDGE_FUNCTION_URL = "https://[PROJECT-REF].supabase.co/functions/v1/miniso-proxy";


        // ==========================================
        // 2. LOGIKA LOGIN & LOGOUT
        // ==========================================
        function doLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const token = document.getElementById('loginToken').value;
            const errorEl = document.getElementById('loginError');

            if(!user || !pass || !token) {
                errorEl.innerText = "Harap isi semua kolom termasuk Token.";
                return;
            }

            // Simpan status login dan token ke memori HP
            localStorage.setItem('mmsx_auth', 'true');
            localStorage.setItem('miniso_session_token', token.trim());
            document.getElementById('loginOverlay').style.display = 'none';
        }

        function doLogout() {
            localStorage.removeItem('mmsx_auth');
            localStorage.removeItem('miniso_session_token');
            document.getElementById('loginOverlay').style.display = 'flex';
        }

        // Cek apakah sudah login saat aplikasi dibuka
        if(localStorage.getItem('mmsx_auth') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
        }


        // ==========================================
        // 3. LOGIKA SCANNER (ZXING) & MEMORI KAMERA
        // ==========================================
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const videoSourceSelect = document.getElementById('videoSource');

        async function initScanner() {
            try {
                const videoInputDevices = await codeReader.listVideoInputDevices();
                if (videoInputDevices.length === 0) {
                    alert("Kamera tidak ditemukan.");
                    return;
                }

                // Render opsi kamera ke dropdown
                videoSourceSelect.innerHTML = '';
                videoInputDevices.forEach((device) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Kamera ${videoSourceSelect.length + 1}`;
                    videoSourceSelect.appendChild(option);
                });

                // Cek memori kamera terakhir
                const savedCameraId = localStorage.getItem('mmsx_last_camera');
                let selectedDeviceId = videoInputDevices[0].deviceId; 
                
                if (savedCameraId && videoInputDevices.some(d => d.deviceId === savedCameraId)) {
                    selectedDeviceId = savedCameraId;
                    videoSourceSelect.value = savedCameraId;
                }

                // Jika user ganti kamera, simpan ke memori
                videoSourceSelect.onchange = () => {
                    localStorage.setItem('mmsx_last_camera', videoSourceSelect.value);
                    codeReader.reset();
                    startScan(videoSourceSelect.value);
                };

                // Tampilkan UI Scanner
                document.getElementById('reader').style.display = 'block';
                document.getElementById('cameraControl').style.display = 'block';
                document.getElementById('detailContainer').style.display = 'none';
                document.getElementById('stockResult').style.display = 'none';

                startScan(selectedDeviceId);

            } catch (err) {
                console.error("Scanner Error:", err);
            }
        }

        function startScan(deviceId) {
            codeReader.decodeFromVideoDevice(deviceId, 'videoElement', (result, err) => {
                if (result) {
                    // Mainkan suara beep
                    const beep = document.getElementById('beepOk');
                    if(beep) {
                        beep.currentTime = 0;
                        beep.play().catch(e => console.log("Audio play diizinkan setelah interaksi user"));
                    }
                    
                    // Matikan scanner sementara memproses data
                    codeReader.reset();
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('cameraControl').style.display = 'none';
                    
                    // Panggil API
                    checkStock(result.text);
                }
            });
        }


        // ==========================================
        // 4. KONEKSI KE EDGE FUNCTION SUPABASE
        // ==========================================
        async function checkStock(barcode) {
            const box = document.getElementById('stockResult');
            box.style.display = 'block';
            box.innerHTML = `<div class="stock-loading"><div class="mini-spin"></div> Menghubungkan ke Gudang Miniso...</div>`;

            try {
                // Tarik token dinamis yang diinput saat login
                const activeToken = localStorage.getItem('miniso_session_token');
                if (!activeToken) {
                    throw new Error("Token tidak ditemukan. Harap Logout dan tempel Token Anda.");
                }

                // Eksekusi API via Proxy Supabase
                const response = await fetch(EDGE_FUNCTION_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        minisoToken: activeToken,
                        payloadData: {
                            ctgCode: barcode,
                            pageNo: 1,
                            pageSize: 20
                        }
                    })
                });

                const json = await response.json();

                if (json.code === "200" && json.data && json.data.list.length > 0) {
                    renderStockUI(json.data.list[0], barcode);
                } else if (json.code === "407") {
                    throw new Error("Error 407: Sesi Token Habis. Harap ambil token baru dari MuMu Player.");
                } else {
                    throw new Error(json.msg || "Barang tidak ditemukan di server.");
                }

            } catch (err) {
                box.innerHTML = `
                    <div class="stock-error">
                        ⚠️ Gagal memuat data stok.<br>
                        <small style="font-weight:400; color:#666;">${err.message}</small>
                    </div>
                    <button onclick="initScanner()" style="width:100%; margin-top:15px; padding:12px; background:#eee; border:none; border-radius:8px; font-weight:bold;">COBA SCAN LAGI</button>
                `;
            }
        }

        // ==========================================
        // 5. RENDER UI HASIL PENCARIAN
        // ==========================================
        function renderStockUI(item, barcode) {
            const box = document.getElementById('stockResult');
            const harga = parseInt(item.retailPrice).toLocaleString('id-ID');
            
            box.innerHTML = `
                <div style="display:flex; align-items:center;">
                    <img src="${item.picList[0].materialPictureUrl}" style="width:80px; border-radius:8px; margin-right:15px; border: 1px solid #eee;">
                    <div style="flex:1;">
                        <div style="font-weight:bold; font-size:15px; margin-bottom:5px;">${item.name}</div>
                        <div style="color:var(--miniso-red); font-size:18px; font-weight:900;">Rp ${harga}</div>
                        <div style="font-size:11px; color:#888; margin-top:5px;">Barcode: ${item.barCode}</div>
                    </div>
                </div>
                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; text-align:center;">
                    <div style="background:#f8f9fa; padding:10px; border-radius:8px;">
                        <span style="font-size:11px; color:#888;">STOK TERSEDIA</span>
                        <div style="font-size:22px; font-weight:bold; color:var(--promo-green);">${item.availableInvent}</div>
                    </div>
                    <div style="background:#f8f9fa; padding:10px; border-radius:8px;">
                        <span style="font-size:11px; color:#888;">DALAM PERJALANAN</span>
                        <div style="font-size:22px; font-weight:bold; color:var(--promo-blue);">${item.inTransitInvent}</div>
                    </div>
                </div>
                
                <button onclick="initScanner()" style="width:100%; margin-top:15px; padding:15px; background:var(--miniso-red); color:white; border:none; border-radius:8px; font-weight:bold; font-size:14px;">
                    SCAN BARANG LAIN
                </button>
                
                <button onclick="document.getElementById('detailContainer').style.display='block'; document.getElementById('stockResult').style.display='none';" style="width:100%; margin-top:10px; padding:12px; background:transparent; color:#888; border:1px solid #ccc; border-radius:8px; font-weight:bold; font-size:14px;">
                    KEMBALI KE MENU
                </button>
            `;
        }
    </script>
</body>
</html>
