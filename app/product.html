<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; 
            background: #ffffff; color: var(--text-dark); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        /* --- HEADER & SCANNER --- */
        #ui-header { background: rgba(255, 255, 255, 0.98); box-shadow: 0 1px 10px rgba(0,0,0,0.05); padding: 16px 16px 5px 16px; z-index: 1000; position: sticky; top: 0; }
        .header-content { max-width: 800px; margin: 0 auto; width: 100%; }
        
        .top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; transition: 0.3s; }
        #searchInput:focus { border-color: var(--miniso-red); background: #fff; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; }
        #scanBtn:active { transform: scale(0.9); }

        /* --- CATEGORY FILTER (NEW) --- */
        .category-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; 
            scrollbar-width: none; /* Firefox */
        }
        .category-scroll::-webkit-scrollbar { display: none; } /* Chrome/Safari */
        .cat-chip {
            padding: 6px 14px; background: #f0f0f0; border-radius: 20px; 
            font-size: 13px; font-weight: 600; color: #555; white-space: nowrap; cursor: pointer;
            border: 1px solid transparent; transition: all 0.3s ease;
        }
        .cat-chip.active { background: var(--miniso-soft); color: var(--miniso-red); border-color: var(--miniso-red); }

        /* --- SCANNER UI --- */
        #reader { 
            display:none; width:100%; max-width:340px; aspect-ratio:1/1; 
            margin:15px auto; background:#000; border-radius:20px; 
            overflow:hidden; position:relative; border: 4px solid white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
        }
        #reader video { width: 100%; height: 100%; object-fit: cover; }
        .focus-guide { position: absolute; inset: 20%; border: 2.5px solid var(--miniso-red); border-radius: 15px; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
        .tap-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 3; }
        #cameraControl { display:none; text-align:center; margin-bottom: 20px; }
        #videoSource { padding: 10px; border-radius: 8px; border: 2px solid var(--miniso-red); width: 100%; max-width: 300px; font-weight: 600; }

        /* --- LIST LAYOUT (IMPROVED) --- */
        .main-content { flex: 1; overflow-y: auto; padding: 0 16px; scroll-behavior: smooth; }
        #listContainer { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 12px; 
            padding-bottom: 80px; 
            max-width: 800px; 
            margin: 10px auto 0;
        }
        
        /* Desktop/Tablet Grid View */
        @media (min-width: 768px) {
            #listContainer { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        }

        .list-item {
            background: #fff; border-radius: 12px; padding: 12px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f0f0f0;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeInItem 0.4s ease-out forwards;
        }
        .list-item:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .list-item img { 
            width: 60px; height: 60px; object-fit: contain; border-radius: 8px; background: #fff; 
            border: 1px solid #f9f9f9; flex-shrink: 0;
        }
        .list-info { flex: 1; overflow: hidden; }
        .list-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .list-code { font-size: 12px; color: #888; display: flex; align-items: center; gap: 5px; }

        /* --- PRODUCT DETAIL CARD --- */
        .product-card { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; animation: slideUp 0.3s ease-out; }
        .image-box { background: #fff; text-align: center; padding: 15px; position: relative; border-bottom: 1px solid #f9f9f9; }
        .image-box img { max-width: 100%; height: 250px; object-fit: contain; cursor: zoom-in; transition: opacity 0.2s; }
        .image-box img:active { opacity: 0.7; }
        .promo-badge { position: absolute; top: 12px; left: 12px; background: #ff9800; color: white; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; z-index: 10; }
        .p-info { padding: 20px; }
        .p-cat { font-size: 11px; font-weight: 700; color: var(--miniso-red); text-transform: uppercase; margin-bottom: 5px; display: block; }
        .p-title { font-size: 20px; font-weight: 700; margin: 0 0 5px 0; color: #111; }
        .p-desc { font-size: 13px; color: #666; margin-bottom: 15px; line-height: 1.4; }
        .price-comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
        .price-item { padding: 12px; border-radius: 12px; border-bottom: 4px solid #ddd; display: flex; flex-direction: column; background: var(--bg-gray); }
        .price-item.reg { border-bottom-color: var(--miniso-red); background: var(--miniso-soft); }
        .price-item.str { border-bottom-color: var(--promo-green); }
        .price-label { font-size: 10px; font-weight: 800; color: #888; margin-bottom: 4px; text-transform: uppercase; }
        .price-val { font-size: 18px; font-weight: 800; color: #333; }
        .price-item.reg .price-val { color: var(--miniso-red); }
        .p-meta { border-top: 1px solid #eee; padding-top: 15px; }
        .meta-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; align-items: center; }
        .meta-label { color: #888; display: flex; align-items: center; gap: 5px; }
        .meta-val { font-weight: 700; color: #333; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; }

        #detailContainer { display: none; padding-top: 20px; padding-bottom: 80px; max-width: 800px; margin: 0 auto; }
        #detailContainer.active { display: block; }
        .floating-back { position: fixed; top: 20px; left: 20px; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 8000; cursor: pointer; transition: transform 0.2s; }
        .floating-back:active { transform: scale(0.9); }

        /* --- LIGHTBOX (NEW) --- */
        #imgLightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999;
            display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease; backdrop-filter: blur(5px);
        }
        #imgLightbox.show { display: flex; opacity: 1; }
        #imgLightbox img { max-width: 95%; max-height: 90%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #imgLightbox.show img { transform: scale(1); }
        .close-lb { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; padding: 10px; }

        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInItem { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <h2>MMS-X</h2>
    <a href="https://miniso-id.github.io/app/">Home</a>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="imgLightbox" onclick="closeLightbox()">
    <div class="close-lb">&times;</div>
    <img id="lbImage" src="">
</div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="appContent" style="display:flex; height: 100vh; flex-direction: column;">
    <header id="ui-header">
        <div class="header-content">
            <div class="top-bar">
                <button onclick="toggleSidebar()" style="background:none; border:none; padding:10px 5px; cursor:pointer;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="search-container">
                    <input id="searchInput" placeholder="Cari nama / barcode...">
                    <button id="scanBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                    </button>
                </div>
            </div>
            
            <div id="catFilters" class="category-scroll">
                <div class="cat-chip active" onclick="setCategory('ALL', this)">Semua</div>
                <div class="cat-chip" onclick="setCategory('Household', this)">Household</div>
                <div class="cat-chip" onclick="setCategory('Digital', this)">Digital</div>
                <div class="cat-chip" onclick="setCategory('Creative', this)">Creative</div>
                <div class="cat-chip" onclick="setCategory('Toy', this)">Toy</div>
                <div class="cat-chip" onclick="setCategory('Bag', this)">Bag</div>
                <div class="cat-chip" onclick="setCategory('Accessory', this)">Accessory</div>
            </div>

            <div id="reader">
                <div class="focus-guide"></div>
                <div class="tap-hint">ARAHKAN BARCODE • TAP UNTUK FOKUS</div>
            </div>
            <div id="cameraControl"><select id="videoSource"></select></div>
        </div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanning = false, lastScroll = 0, timer;
    let lastSelectedDeviceId = localStorage.getItem('preferredCameraId');
    let currentCategory = 'ALL';

    function toggleSidebar() { 
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }

    function cleanPrice(val) {
        if(!val) return 0;
        return parseInt(String(val).replace(/[^0-9]/g, "")) || 0;
    }

    /* --- CATEGORY LOGIC --- */
    function setCategory(cat, el) {
        currentCategory = cat;
        // Update UI Active State
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        // Trigger Search
        search();
    }

    /* --- LIGHTBOX LOGIC --- */
    function openLightbox(src) {
        const lb = document.getElementById("imgLightbox");
        const img = document.getElementById("lbImage");
        img.src = src;
        lb.classList.add("show");
    }
    
    function closeLightbox() {
        const lb = document.getElementById("imgLightbox");
        lb.classList.remove("show");
        setTimeout(() => { document.getElementById("lbImage").src = ""; }, 300);
    }

    document.getElementById("searchInput").oninput = () => { clearTimeout(timer); timer = setTimeout(search, 500); };

    async function search() {
        const q = document.getElementById("searchInput").value.trim();
        const list = document.getElementById("listContainer");
        
        // Show empty state if no query and no category (optional, kept similar to original but allowing cat filter)
        if(!q && currentCategory === 'ALL') { list.innerHTML = ""; return; }
        
        list.innerHTML = '<div style="text-align:center; padding:20px; color:#999; width:100%;">Memuat...</div>';

        let query = _supabase.from('export').select('*');
        
        // Apply Text Search
        if (q) {
            query = query.or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`);
        }
        
        // Apply Category Filter
        if (currentCategory !== 'ALL') {
            // Note: Gunakan ilike agar case-insensitive (misal: "toy" match "Toy")
            query = query.ilike('Category', `%${currentCategory}%`);
        }

        let { data } = await query.limit(30);

        if(data && data.length > 0) {
            list.innerHTML = data.map(p => `
                <div class="list-item" onclick="showDetail('${p.Barcode}')">
                    <img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/60?text=IMG'" onclick="event.stopPropagation(); openLightbox(this.src)">
                    <div class="list-info">
                        <div class="list-name">${p.Name}</div>
                        <div class="list-code">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            ${p.Barcode}
                        </div>
                    </div>
                </div>
            `).join('');
        } else {
            list.innerHTML = '<div style="text-align:center; padding:20px; color:#999; width:100%;">Produk tidak ditemukan</div>';
        }
    }

    document.getElementById("scanBtn").onclick = () => { scanning ? stopScan() : startScan(lastSelectedDeviceId); };

    async function startScan(deviceId = null) {
        scanning = true; document.getElementById("reader").style.display = "block";
        const constraints = { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "environment" };
        if (deviceId) constraints.deviceId = { exact: deviceId };

        Quagga.init({
            inputStream: { type: "LiveStream", target: document.getElementById("reader"), constraints: constraints, area: { top: "20%", right: "20%", left: "20%", bottom: "20%" } },
            decoder: { readers: ["ean_reader", "code_128_reader"] }
        }, (err) => {
            if (err) { if(deviceId) startScan(null); return; }
            Quagga.start(); updateCameraList();
        });
    }

    async function updateCameraList() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        const final = videoDevices.filter(d => !d.label.toLowerCase().includes('front'));
        const source = document.getElementById("videoSource");
        if (final.length <= 1) { document.getElementById("cameraControl").style.display = "none"; }
        else {
            document.getElementById("cameraControl").style.display = "block";
            source.innerHTML = final.map(d => `<option value="${d.deviceId}" ${d.deviceId === lastSelectedDeviceId ? 'selected' : ''}>${d.label || 'Kamera'}</option>`).join("");
        }
    }

    document.getElementById("videoSource").onchange = (e) => { lastSelectedDeviceId = e.target.value; localStorage.setItem('preferredCameraId', lastSelectedDeviceId); Quagga.stop(); startScan(lastSelectedDeviceId); };
    function stopScan() { Quagga.stop(); scanning = false; document.getElementById("reader").style.display = "none"; document.getElementById("cameraControl").style.display = "none"; }

    Quagga.onDetected(async res => {
        const code = res.codeResult.code;
        const { data } = await _supabase.from('export').select('Barcode').ilike('Barcode', `%${code}%`).maybeSingle();
        if(data) { document.getElementById("beepOk").play(); stopScan(); document.getElementById("searchInput").value = code; showDetail(code); }
    });

    async function showDetail(fullBarcode) {
        lastScroll = document.getElementById("scrollContainer").scrollTop;
        // Fetch detail, keep logic safe
        const { data: p } = await _supabase.from('export').select('*').ilike('Barcode', `%${fullBarcode}%`).maybeSingle();
        if(!p) return;

        document.getElementById("listContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "none";

        const regPrice = cleanPrice(p["Regular Store Price"]);
        const strPrice = cleanPrice(p["Street Store Price"]);
        const discountLabel = (p["Regular Store Promo"] && p["Regular Store Promo"] !== "NORMAL") ? `<div class="promo-badge">${p["Regular Store Promo"]}</div>` : "";

        const det = document.getElementById("detailContainer");
        det.innerHTML = `
            <div class="product-card">
                <div class="image-box">
                    ${discountLabel}
                    <img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/300x300?text=Miniso+Product'" onclick="openLightbox(this.src)">
                </div>
                <div class="p-info">
                    <span class="p-cat">${p.Category || 'GENERAL'}</span>
                    <h3 class="p-title">${p.Name}</h3>
                    <p class="p-desc">${p.Description || ''}</p>
                    
                    <div class="price-comparison-grid">
                        <div class="price-item reg">
                            <span class="price-label">Regular Price</span>
                            <span class="price-val">Rp${regPrice.toLocaleString('id-ID')}</span>
                        </div>
                        <div class="price-item str">
                            <span class="price-label">Street Store</span>
                            <span class="price-val">Rp${strPrice.toLocaleString('id-ID')}</span>
                        </div>
                    </div>

                    <div class="p-meta">
                        <div class="meta-row"><span class="meta-label">Barcode</span><span class="meta-val">${p.Barcode}</span></div>
                        <div class="meta-row">
                            <span class="meta-label"><span class="dot" style="background:var(--promo-blue)"></span> Regular Promo</span>
                            <span class="meta-val" style="color:var(--promo-blue)">${p["Regular Store Promo"] || '-'}</span>
                        </div>
                        <div class="meta-row">
                            <span class="meta-label"><span class="dot" style="background:var(--promo-green)"></span> Street Promo</span>
                            <span class="meta-val" style="color:var(--promo-green)">${p["Street Store Promo"] || '-'}</span>
                        </div>
                    </div>
                </div>
            </div>
        `;
        det.style.display = "block";
        det.classList.add('active');
        document.getElementById("btnBackFloating").style.display = "flex";
        document.getElementById("scrollContainer").scrollTo(0, 0);
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid"; // Restore to grid
        document.getElementById("btnBackFloating").style.display = "none";
        document.getElementById("scrollContainer").scrollTop = lastScroll;
    }
</script>
</body>
</html>
