<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Cek Display Rak Promo</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; }
    label { display: block; margin-top: 15px; }
    button { margin-top: 20px; padding: 10px 20px; }
    #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Upload Foto Display Toko</h2>
  
  <label>Pilih Referensi:</label>
  <select id="refSelect">
    <option value="1">Promo Lebaran</option>
    <!-- Bisa diisi dari Google Sheets kalau mau, untuk contoh di-hardcode -->
  </select>
  
  <label>Nama Toko / ID:</label>
  <input type="text" id="storeName" placeholder="Toko A">
  
  <label>Upload Foto Display:</label>
  <input type="file" id="photoInput" accept="image/*" capture="environment">
  
  <button onclick="submitCheck()">Cek Kepatuhan</button>
  
  <div id="result"></div>

  <script>
    // Ganti dengan URL Web App dari Google Apps Script Anda (deploy)
    const API_URL = 'https://script.google.com/macros/s/AKfycbzg8NC-SBScxBtSfqjQpyh_2M8GlXGBIYIN_B-g9EplngWqSCqhUGaHvQM3-2SplhqR/exec';

    // Fungsi resize gambar sebelum kirim (supaya tidak terlalu besar)
    function resizeImage(file, maxWidth = 1024) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height *= maxWidth / width;
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            // Ambil base64 tanpa prefix "data:image/..."
            const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
            resolve(base64);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function submitCheck() {
      const refSelect = document.getElementById('refSelect');
      const storeName = document.getElementById('storeName').value.trim();
      const fileInput = document.getElementById('photoInput');
      const file = fileInput.files[0];
      const resultDiv = document.getElementById('result');

      if (!storeName || !file) {
        resultDiv.innerHTML = '<p style="color:red;">Mohon isi nama toko dan pilih foto.</p>';
        return;
      }

      resultDiv.innerHTML = '<p>⏳ Mengecek foto... tunggu sebentar.</p>';

      try {
        const base64 = await resizeImage(file, 1024);
        
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({
            referenceId: refSelect.value,
            storeName: storeName,
            imageBase64: base64
          })
        });

        const result = await response.json();
        if (result.success) {
          const d = result.data;
          resultDiv.innerHTML = `
            <h3>Status: ${d.compliance === 'PASS' ? '✅ Lulus' : '❌ Tidak Lulus'}</h3>
            <p><strong>Skor:</strong> ${(d.score * 100).toFixed(0)}%</p>
            <p><strong>Penjelasan AI:</strong> ${d.explanation}</p>
          `;
        } else {
          resultDiv.innerHTML = `<p style="color:red;">Gagal: ${result.error}</p>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
      }
    }
  </script>
</body>
</html>
