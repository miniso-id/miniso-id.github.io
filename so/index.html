<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>SO ID12</title>
<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
  background:#f4f6f9;
}

iframe {
  border:none;
  width:100%;
  height:100%;
  display:block;
}

/* Opsional: warning jika iframe dibuka di browser mobile biasa */
#warning {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,0,0,0.2);
  color:#900;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  padding-top:40vh;
  z-index:9999;
}
</style>
</head>
<body>

<div id="warning">⚠️ Halaman ini paling optimal di WebView / iframe. Di browser mobile biasa, layout mungkin kurang pas.</div>

<iframe id="stockFrame"
  src="https://script.google.com/macros/s/AKfycbwbaTsgm0Ai8lmkHLFcA1cqtWujOusIA-jDpnlxTGy34MEH1hwDgom63VSexLYY7W1bPw/exec"
  loading="lazy"
  allowfullscreen
  scrolling="no">
</iframe>

<script>
// Deteksi mobile
function isMobile() {
  return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

// Deteksi iframe
function inIframe() {
  try {
    return window.self !== window.top;
  } catch (e) {
    return true; // cross-origin iframe
  }
}

// Auto fullscreen & fit
function resizeIframe(){
  const iframe = document.getElementById('stockFrame');
  iframe.style.width = window.innerWidth + 'px';
  iframe.style.height = window.innerHeight + 'px';
}

// Event resize
window.addEventListener('resize', resizeIframe);
window.addEventListener('orientationchange', resizeIframe);

// Initial resize
window.addEventListener('load', ()=>{
  resizeIframe();

  
});
</script>

</body>
</html>
