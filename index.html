<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMS-X</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-h-screen;
        }

        .header-banner {
            width: 100%;
            height: 100px;
            background-color: #d12e2e; /* Merah Miniso */
            position: absolute;
            top: 0;
        }

        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 380px;
            padding: 40px;
            text-align: center;
            z-index: 1;
            margin-top: 140px; /* Menyesuaikan posisi di bawah banner */
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 25px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 40px;
        }

        .button {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 2px solid #e1e1e3;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 16px;
            text-decoration: none;
            transition: border-color 0.2s;
        }

        .button:hover {
            border-color: #0071e3; /* Warna aksen saat hover */
        }

        .button-icon {
            width: 32px;
            height: 32px;
            margin-right: 16px;
        }

        .button-text-container {
            text-align: left;
        }

        .button-label {
            font-size: 11px;
            font-weight: 600;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .button-title {
            font-size: 17px;
            font-weight: 600;
            color: #1d1d1f;
        }

        .footer {
            margin-top: 40px;
            padding-bottom: 30px;
            font-size: 12px;
            color: #86868b;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header-banner"></div>

    <div class="container">
        <img src="https://miniso-id.github.io/app/user512.png" alt="Miniso Logo" class="logo">
        
        <div class="title">MMS-X v2.0</div>

        <a href="https://miniso-id.github.io/MMS-X-v2.apk" class="button">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Android_robot.svg" alt="Android Icon" class="button-icon">
            <div class="button-text-container">
                <div class="button-label">DOWNLOAD FOR</div>
                <div class="button-title">Android (APK)</div>
            </div>
        </a>

        <a href="https://miniso-id.github.io/ios" class="button">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Icon" class="button-icon">
            <div class="button-text-container">
                <div class="button-label">OPEN FOR</div>
                <div class="button-title">iOS / Web PWA</div>
            </div>
        </a>
    </div>

    <div class="footer">
        © 2026 MMS Project Support<br>
        Developed by Fahril
    </div>

</body>
</html>
