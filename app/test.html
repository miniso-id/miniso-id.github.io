<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X | Price Checker</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        /* Animasi */
        body { opacity: 0; transition: opacity 0.2s ease-in; margin: 0; padding: 0; font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; background: #ffffff; color: var(--text-dark); height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }
        body.fade-in { opacity: 1; }
        .fade-out { opacity: 0 !important; transition: opacity 0.2s ease-out; }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* UI Sidebar & Header */
        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        #ui-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px; border-bottom: 1px solid #eee; z-index: 1000; width: 100%; flex-shrink: 0; }
        .top-bar { display: flex; gap: 10px; align-items: center; max-width: 1200px; margin-inline: auto; width: 100%; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Scanner Box */
        #reader { display:none; width:100%; max-width:340px; aspect-ratio:1/1; margin:15px auto; background:#000; border-radius:20px; overflow:hidden; position:relative; border: 4px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        #reader video { width: 100%; height: 100%; object-fit: cover; }
        .focus-guide { position: absolute; inset: 20%; border: 2.5px solid var(--miniso-red); border-radius: 15px; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
        .tap-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 3; }
        #cameraControl { display:none; text-align:center; margin-bottom: 20px; }

        /* Content Areas */
        .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; width: 100%; padding: 0 16px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px 0 80px 0; width: 100%; }
        
        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px; background: white; border-radius: 16px; border: 1px solid #f0f0f0; transition: 0.2s; cursor: pointer; }
        .list-img-box { width: 70px; height: 70px; background: #f9f9f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid #f0f0f0; }
        .list-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .list-info { flex: 1; min-width: 0; }
        .list-cat { font-size: 10px; color: var(--miniso-red); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .list-name { font-weight: 700; font-size: 14px; color: #111; line-height: 1.4; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .list-bc { font-size: 11px; color: #888; }

        /* Detail Card */
        #detailContainer { display: none; padding-top: 20px; padding-bottom: 80px; max-width: 700px; margin: 0 auto; width: 100%; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; width: 100%; animation: slideUp 0.3s ease-out; }
        .image-box { background: #fff; text-align: center; padding: 20px; position: relative; border-bottom: 1px solid #f5f5f5; }
        .image-box img { max-width: 100%; height: 300px; object-fit: contain; }
        .promo-badge { position: absolute; bottom: 15px; right: 15px; background: #ff9800; color: white; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; z-index: 10; }
        .p-info { padding: 24px; }
        .p-cat { font-size: 11px; font-weight: 800; color: var(--miniso-red); text-transform: uppercase; margin-bottom: 8px; display: block; }
        .p-title { font-size: 22px; font-weight: 800; margin: 0 0 10px 0; color: #000; line-height: 1.3; }
        
        .price-comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .price-item { padding: 14px; border-radius: 14px; border-bottom: 4px solid #ddd; background: var(--bg-gray); }
        .price-item.reg { border-bottom-color: var(--miniso-red); background: var(--miniso-soft); }
        .price-item.str { border-bottom-color: var(--promo-green); }
        .price-label { font-size: 10px; font-weight: 800; color: #777; margin-bottom: 5px; text-transform: uppercase; display: block; }
        .price-val { font-size: 19px; font-weight: 800; color: #222; }
        .price-item.reg .price-val { color: var(--miniso-red); }

        /* Lightbox */
        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(12px); cursor: pointer; }
        #lightbox.active { display: flex; }
        #lightbox img { max-width: 90%; max-height: 80vh; border-radius: 20px; }

        .floating-back { position: fixed; top: calc(25px + env(safe-area-inset-top)); left: 20px; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.15); z-index: 9999; border: 1px solid #eee; }
        
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <h2>MMS-X</h2>
    <a href="#" onclick="location.reload()">Refresh Page</a>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="">
</div>

<div id="appContent" style="display:flex; height: 100vh; flex-direction: column;">
    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none; padding:10px 5px;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="search-container">
                <input id="searchInput" placeholder="Scan / Input Barcode..." autocomplete="off">
                <button id="scanBtn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
            </div>
        </div>
        <div id="reader">
            <video id="video-canvas"></video>
            <div class="focus-guide"></div>
            <div class="tap-hint">ARAHKAN BARCODE • TAP UNTUK FOKUS</div>
        </div>
        <div id="cameraControl"><select id="videoSource" style="padding: 10px; width: 90%; max-width: 300px; border-radius: 8px; margin: 10px auto; display:block;"></select></div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    document.addEventListener("DOMContentLoaded", () => { document.body.classList.add("fade-in"); });

    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanning = false, lastScroll = 0, timer;
    let lastSelectedDeviceId = localStorage.getItem('preferredCameraId');
    const codeReader = new ZXing.BrowserMultiFormatReader();

    function toggleSidebar() { 
        const active = document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = active ? "block" : "none";
    }
    function openLightbox(src) { if(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('active'); } }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
    function cleanPrice(val) { return parseInt(String(val || 0).replace(/[^0-9]/g, "")) || 0; }

    document.getElementById("searchInput").oninput = () => { clearTimeout(timer); timer = setTimeout(search, 400); };

    async function search() {
        const q = document.getElementById("searchInput").value.trim();
        if(!q) return;
        const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${q}%`).limit(10);
        if(data) {
            document.getElementById("listContainer").innerHTML = data.map(p => `
                <div class="list-item" onclick="showDetail('${p.Barcode}')">
                    <div class="list-img-box" onclick="event.stopPropagation(); openLightbox('${p.Image}')">
                        <img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/150x150?text=Miniso'">
                    </div>
                    <div class="list-info">
                        <div class="list-cat">${p.Category || 'GENERAL'}</div>
                        <div class="list-name">${p.Name}</div>
                        <div class="list-bc">${p.Barcode}</div>
                    </div>
                </div>`).join('');
        }
    }

    document.getElementById("scanBtn").onclick = () => { scanning ? stopScan() : startScan(lastSelectedDeviceId); };

    async function startScan(deviceId = null) {
        scanning = true;
        document.getElementById("reader").style.display = "block";
        const constraints = { video: { deviceId: deviceId ? { exact: deviceId } : undefined, width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "environment" } };

        try {
            if (!deviceId) {
                const devices = await codeReader.listVideoInputDevices();
                const back = devices.find(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('environment'));
                deviceId = back ? back.deviceId : (devices.length ? devices[devices.length-1].deviceId : null);
            }

            codeReader.decodeFromConstraints(constraints, 'video-canvas', async (result) => {
                if (result) {
                    const code = result.text;
                    const { data } = await _supabase.from('export').select('Barcode').ilike('Barcode', `%${code}%`).maybeSingle();
                    if(data) {
                        document.getElementById("beepOk").play();
                        stopScan();
                        document.getElementById("searchInput").value = code;
                        showDetail(code);
                    }
                }
            });

            const video = document.getElementById('video-canvas');
            video.onplaying = async () => {
                const track = video.srcObject.getVideoTracks()[0];
                const cap = track.getCapabilities();
                const adv = {};
                if (cap.focusMode && cap.focusMode.includes('continuous')) adv.focusMode = "continuous";
                if (cap.zoom) adv.zoom = Math.min(1, cap.zoom.max);
                if (Object.keys(adv).length > 0) await track.applyConstraints({ advanced: [adv] });
            };
            updateCameraList();
        } catch (err) { console.error(err); }
    }

    function stopScan() { codeReader.reset(); scanning = false; document.getElementById("reader").style.display = "none"; document.getElementById("cameraControl").style.display = "none"; }

    document.getElementById("reader").onclick = async () => {
        const video = document.getElementById('video-canvas');
        if (!video.srcObject) return;
        const track = video.srcObject.getVideoTracks()[0];
        const cap = track.getCapabilities();
        if (cap.focusMode) {
            document.querySelector('.tap-hint').innerText = "MEMFOKUSKAN... ⏳";
            await track.applyConstraints({ advanced: [{ focusMode: "manual" }] });
            setTimeout(async () => {
                await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
                document.querySelector('.tap-hint').innerText = "ARAHKAN BARCODE • TAP UNTUK FOKUS";
            }, 500);
        }
    };

    async function updateCameraList() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const final = devices.filter(d => d.kind === 'videoinput' && !d.label.toLowerCase().includes('front'));
        const source = document.getElementById("videoSource");
        if (final.length <= 1) { document.getElementById("cameraControl").style.display = "none"; }
        else {
            document.getElementById("cameraControl").style.display = "block";
            source.innerHTML = final.map(d => `<option value="${d.deviceId}" ${d.deviceId === lastSelectedDeviceId ? 'selected' : ''}>${d.label || 'Kamera'}</option>`).join("");
        }
    }

    document.getElementById("videoSource").onchange = (e) => {
        lastSelectedDeviceId = e.target.value;
        localStorage.setItem('preferredCameraId', lastSelectedDeviceId);
        codeReader.reset();
        startScan(lastSelectedDeviceId);
    };

    async function showDetail(fullBarcode) {
        lastScroll = document.getElementById("scrollContainer").scrollTop;
        const { data: p } = await _supabase.from('export').select('*').ilike('Barcode', `%${fullBarcode}%`).maybeSingle();
        if(!p) return;
        document.getElementById("listContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "none";
        const regPrice = cleanPrice(p["Regular Store Price"]);
        const strPrice = cleanPrice(p["Street Store Price"]);
        const promo = (p["Extra Promo"] || "").trim();
        const badge = (promo && promo !== "NORMAL PRICE") ? `<div class="promo-badge">${promo}</div>` : "";

        document.getElementById("detailContainer").innerHTML = `
            <div class="product-card">
                <div class="image-box">${badge}<img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/500x500?text=Miniso'" onclick="openLightbox('${p.Image}')"></div>
                <div class="p-info">
                    <span class="p-cat">${p.Category || 'GENERAL'}</span>
                    <h3 class="p-title">${p.Name}</h3>
                    <div class="price-comparison-grid">
                        <div class="price-item reg"><span class="price-label">Regular Store</span><span class="price-val">Rp${regPrice.toLocaleString('id-ID')}</span></div>
                        <div class="price-item str"><span class="price-label">Street Store</span><span class="price-val">Rp${strPrice.toLocaleString('id-ID')}</span></div>
                    </div>
                    <div style="border-top: 1px solid #eee; padding-top: 20px; font-size:12px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span style="color:#888">BARCODE</span><b>${p.Barcode}</b></div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span style="color:#888">REG PROMO</span><b style="color:var(--promo-blue)">${p["Regular Store Promo"] || '-'}</b></div>
                        <div style="display:flex; justify-content:space-between;"><span style="color:#888">STR PROMO</span><b style="color:var(--promo-green)">${p["Street Store Promo"] || '-'}</b></div>
                    </div>
                </div>
            </div>`;
        document.getElementById("detailContainer").style.display = "block";
        document.getElementById("btnBackFloating").style.display = "flex";
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid";
        document.getElementById("btnBackFloating").style.display = "none";
        document.getElementById("scrollContainer").scrollTop = lastScroll;
    }

    // Auto-start scan jika ID kamera sudah tersimpan
    if(lastSelectedDeviceId) startScan(lastSelectedDeviceId);
</script>
</body>
</html>
