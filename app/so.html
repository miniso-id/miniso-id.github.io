<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>SO ID12</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f4f6f9;
    }

    /* Bilah atas untuk tombol kembali */
    #topBar {
      width: 100%;
      height: 44px; /* tinggi pas untuk jari */
      background: #ffffff;
      display: flex;
      align-items: center;
      padding-left: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      z-index: 100;
      position: relative;
      /* Aman dari notch */
      padding-top: env(safe-area-inset-top);
      box-sizing: content-box; /* agar padding-top menambah tinggi total */
    }

#backBtn {
  display: flex;
  align-items: center;
  justify-content: center;
}

    #backButton:active {
      background: rgba(0,0,0,0.15);
    }

    /* Judul kecil di samping tombol (opsional) */
    #titleHint {
      margin-left: 12px;
      font-size: 14px;
      color: #666;
      font-weight: 500;
    }

    /* Iframe mengisi sisa tinggi di bawah bilah atas */
    #stockFrame {
      border: none;
      width: 100%;
      height: calc(100% - 44px - env(safe-area-inset-top));
      display: block;
    }
  </style>
</head>
<body>
  <!-- Bilah atas dengan tombol kembali -->

  <div id="backBtn" onclick="goBack()" title="Kembali">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M12 19l-7-7 7-7"/>
  </svg>
</div>

  <iframe id="stockFrame"
    src="https://script.google.com/macros/s/AKfycbyT3PRoqiv_epPOPQtQKOFukkA-SVFsO4twJUfPGs8-CZ8QJSHxgyBnCttwRVmhi2W-bg/exec"
    loading="lazy"
    allowfullscreen
    scrolling="yes">
  </iframe>

  <script>
    function goToMMSX() {
      // Arahkan ke halaman MMS-X
      window.location.href = "https://miniso-id.github.io/app/?app=mmsx";
    }

    // Sesuaikan tinggi iframe saat orientasi berubah
    function resizeIframe() {
      const iframe = document.getElementById('stockFrame');
      iframe.style.height = (window.innerHeight - 44 - (window.safeAreaInsets?.top || 0)) + 'px';
    }

    window.addEventListener('resize', resizeIframe);
    window.addEventListener('orientationchange', resizeIframe);
    window.addEventListener('load', resizeIframe);
  </script>
</body>
</html>
