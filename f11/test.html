<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F11 Miniso - Portrait 480x800</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #2563eb; 
            --danger: #dc2626; 
            --bg: #f1f5f9;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); 
            margin: 0; 
            padding: 0;
            width: 480px; 
            height: 800px; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* Container Utama */
        #result { 
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }

        .card { 
            background: white; 
            border-radius: 24px; 
            overflow: hidden; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 100%; /* Mengisi ruang yang tersedia */
            animation: slideUp 0.3s ease-out;
        }

        /* Area Gambar (Max 40% dari layar) */
        .card-header { 
            width: 100%;
            height: 320px; 
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #f1f5f9;
        }
        .card-header img { 
            max-width: 95%; 
            max-height: 95%; 
            object-fit: contain; 
        }

        .card-body { 
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .category { 
            font-size: 0.85rem; 
            font-weight: 800; 
            color: var(--primary); 
            text-transform: uppercase; 
            margin-bottom: 8px;
        }

        .product-name { 
            font-size: 1.6rem; 
            color: #1e293b; 
            margin: 0 0 10px 0; 
            line-height: 1.2;
            font-weight: 700;
        }

        .barcode-badge { 
            display: inline-block;
            font-family: 'Courier New', Courier, monospace;
            background: #f8fafc; 
            padding: 5px 12px; 
            border-radius: 8px; 
            color: #475569; 
            font-size: 1.1rem;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        /* Harga Section */
        .price-container {
            margin-top: auto; /* Dorong harga ke bawah */
        }

        .price-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .price-box { 
            flex: 1;
            padding: 15px; 
            border-radius: 16px; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0;
        }

        .price-label { font-size: 0.75rem; color: #64748b; font-weight: bold; margin-bottom: 5px; }
        .price-value { font-size: 1.5rem; font-weight: 800; color: #1e293b; }
        .promo-tag { color: var(--danger); font-size: 0.8rem; font-weight: bold; margin-top: 5px; }

        /* Standby Overlay */
        .standby-msg { 
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: var(--bg);
            z-index: 10;
        }
        .standby-msg h1 { font-size: 3rem; color: #cbd5e1; margin: 0; }
        .standby-msg p { font-size: 1.2rem; color: #94a3b8; }

        .search-container { position: absolute; left: -9999px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="standby-msg" id="standby">
        <h1>SCAN</h1>
        <p>Silahkan scan barcode produk</p>
        <div id="status-db" style="margin-top:20px; font-size:0.9rem;">Connecting...</div>
    </div>

    <div class="search-container">
        <input id="searchInput" type="text" autocomplete="off" autofocus>
    </div>

    <div id="result"></div>

    <audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>
    <audio id="beepErr" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
const SUPABASE_URL = 'https://uesupubktkxfjsylcwwr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const input = document.getElementById("searchInput");
const resultDiv = document.getElementById("result");
const standbyDiv = document.getElementById("standby");
const statusDb = document.getElementById("status-db");
const beepOk = document.getElementById("beepOk");
const beepErr = document.getElementById("beepErr");

let isSearching = false;

async function checkConn() {
    const { error } = await supabaseClient.from('export').select('count', { count: 'exact', head: true });
    statusDb.innerText = error ? "OFFLINE" : "DATABASE ONLINE";
    statusDb.style.color = error ? "#ef4444" : "#22c55e";
}
checkConn();

async function search(q) {
    if (isSearching) return;
    isSearching = true;
    standbyDiv.style.opacity = "0.5";

    try {
        const { data, error } = await supabaseClient.rpc('get_product_cached', { search_term: q.trim() });
        if (error || !data || data.length === 0) throw new Error();

        beepOk.play().catch(()=>{});
        render(data[0]);
        standbyDiv.style.display = "none";
    } catch (err) {
        beepErr.play().catch(()=>{});
        resultDiv.innerHTML = `<div style="margin-top:100px; text-align:center; color:white; background:var(--danger); padding:30px; border-radius:20px; font-size:1.5rem; font-weight:bold;">TIDAK DITEMUKAN</div>`;
        setTimeout(resetUI, 2000);
    } finally {
        isSearching = false;
        standbyDiv.style.opacity = "1";
    }
}

function resetUI() {
    resultDiv.innerHTML = "";
    standbyDiv.style.display = "flex";
    input.focus();
}

function render(p) {
    const clean = (val) => (!val || val === "NORMAL PRICE" || val === "NORMAL") ? "" : val;
    const name = p.Name || p.name || "Produk";
    const barcode = p.Barcode || p.barcode || "-";
    const regPrice = p["Regular Store Price"] || p.regular_price || "0";
    const strPrice = p["Street Store Price"] || p.street_price || "0";
    const promoExtra = clean(p["Extra Promo"]);

    resultDiv.innerHTML = `
        <div class="card">
            <div class="card-header">
                <img src="${p.Image || p.image || 'https://placehold.co/400x400'}" onerror="this.src='https://placehold.co/400x400'">
            </div>
            <div class="card-body">
                <div class="category">${p.Category || '-'}</div>
                <h2 class="product-name">${name}</h2>
                <div class="barcode-badge">${barcode}</div>

                <div class="price-container">
                    <div class="price-row">
                        <div class="price-box">
                            <div class="price-label">REGULAR STORE</div>
                            <div class="price-value">${regPrice}</div>
                            ${clean(p["Regular Store Promo"]) ? `<div class="promo-tag">${p["Regular Store Promo"]}</div>` : ""}
                        </div>
                        <div class="price-box" style="background:#f0f9ff; border-color:#bae6fd">
                            <div class="price-label" style="color:#0369a1">STREET STORE</div>
                            <div class="price-value" style="color:#0369a1">${strPrice}</div>
                            ${clean(p["Street Store Promo"]) ? `<div class="promo-tag" style="color:#0369a1">${p["Street Store Promo"]}</div>` : ""}
                        </div>
                    </div>
                    
                    ${promoExtra ? `
                    <div style="background:#fef2f2; padding:15px; border-radius:12px; border-left:6px solid var(--danger)">
                        <div class="price-label" style="color:var(--danger)">PROMO SPESIAL</div>
                        <div style="font-weight:bold; color:var(--danger); font-size:1.1rem;">${promoExtra}</div>
                    </div>` : ""}
                </div>
            </div>
        </div>
    `;
}

// Global Click for Focus
document.addEventListener('click', () => input.focus());
setInterval(() => { if(document.activeElement !== input) input.focus(); }, 1000);

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        if(input.value) search(input.value);
        input.value = "";
    }
});
window.onload = () => input.focus();
</script>
</body>
</html>
