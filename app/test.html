    <!-- ... STRUKTUR HTML YANG SUDAH ADA TETAP PERSIS ... -->

    <script>
        // --- SISTEM CACHE (24 JAM) ---
        const CACHE_EXPIRATION = 86400000;
        function saveToLocalCache(barcode, data) { /* tetap */ }
        function getLocalCache(barcode) { /* tetap */ }

        // ... (kode inisialisasi, scanner, ZXing, preprocessing, startScan, dll.) TETAP SAMA ...

        // ========== BAGIAN BARU: INTEGRASI MINISO ==========
        const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const STOCK_PROXY_URL = `https://uesupubktkxfjsylcwwr.supabase.co/functions/v1/stock-proxy`;

        function getStoreCode() {
            return localStorage.getItem('mmsx_store_code') || 'ID12';
        }

        // Normalisasi data dari Miniso agar kompatibel dengan renderDetailView
        function normalizeProduct(p) {
            if (p.name) {
                return {
                    ...p,
                    Name: p.name,
                    Barcode: p.barCode || p.barcode,
                    Image: p.picList?.[0]?.materialPictureUrl || p.picUrl || '',
                    "Regular Store Price": p.retailPrice || '0',
                    "Street Store Price": p.retailPrice || '0',
                    Category: p.Category || '',
                    "Detail Category": p["Detail Category"] || '',
                    "Regular Store Promo": p.lifecycleName || '',
                    "Street Store Promo": '',
                    "Extra Promo": '',
                    Description: '',
                };
            }
            return p;
        }

        // Panggil Edge Function untuk mendapatkan data produk dari Miniso
        async function fetchProductFromMiniso(barcode) {
            const storeCode = getStoreCode();
            try {
                const resp = await fetch(STOCK_PROXY_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                    },
                    body: JSON.stringify({
                        barCodeOrGoodsName: barcode,
                        storeCode: storeCode,
                        brandCode: 30,
                    }),
                });
                if (!resp.ok) return null;
                const json = await resp.json();
                if (json.code === "200" && json.data.list.length > 0) {
                    return json.data.list[0]; // objek produk tunggal
                }
                return null;
            } catch (e) {
                console.error("fetchProductFromMiniso error:", e);
                return null;
            }
        }

        // Modifikasi onDetected & showDetail agar mengambil data Miniso jika perlu
        const originalOnDetected = onDetected; // simpan referensi asli
        async function onDetected(code) {
            // Cek cache lokal dulu
            const cachedData = getLocalCache(code);
            if (cachedData) {
                if (isProcessingScan) return;
                isProcessingScan = true;
                try {
                    stopScan();
                    renderDetailView(cachedData);
                    document.getElementById("beepOk").play();
                    document.getElementById("searchInput").blur();
                    document.getElementById("searchInput").value = code;
                } finally {
                    isProcessingScan = false;
                }
                return;
            }

            // Cek cooldown barcode gagal
            const failedAt = failedBarcodes.get(code);
            if (failedAt && (Date.now() - failedAt) < FAILED_COOLDOWN) return;
            if (isProcessingScan) return;
            isProcessingScan = true;

            try {
                // Coba dari Supabase dulu
                let product = await queryWithTimeout(code).then(res => res.data);
                // Kalau tidak ada, panggil Miniso
                if (!product) {
                    product = await fetchProductFromMiniso(code);
                }

                if (product) {
                    saveToLocalCache(code, product);
                    stopScan();
                    renderDetailView(product);
                    document.getElementById("beepOk").play();
                    document.getElementById("searchInput").blur();
                    document.getElementById("searchInput").value = code;
                } else {
                    failedBarcodes.set(code, Date.now());
                }
            } catch (e) {
                failedBarcodes.set(code, Date.now());
            } finally {
                isProcessingScan = false;
            }
        }

        // Override showDetail yang asli (dari applyPriceLanguage kita tangani terpisah)
        async function showDetail(fullBarcode) {
            lastScroll = document.getElementById("scrollContainer").scrollTop;
            let p = getLocalCache(fullBarcode);
            if (!p) {
                const { data, error } = await _supabase.rpc('get_product_by_barcode', { 
                    target_barcode: fullBarcode 
                });
                if (error || !data || data.length === 0) {
                    // Fallback ke Miniso
                    p = await fetchProductFromMiniso(fullBarcode);
                    if (!p) return;
                } else {
                    p = data[0];
                }
                saveToLocalCache(fullBarcode, p);
            }
            renderDetailView(p);
        }

        // Fungsi renderDetailView yang sudah dimodifikasi (menambahkan tombol CEK STOCK)
        function renderDetailView(p) {
            document.getElementById("listContainer").style.display = "none";
            document.getElementById("ui-header").style.display = "none";
            const regPrice = cleanPrice(p["Regular Store Price"]);
            const strPrice = cleanPrice(p["Street Store Price"]);
            const promoText = (p["Extra Promo"] || "").trim();
            const discountLabel = (promoText !== "" && promoText !== "NORMAL PRICE" && p["Regular Store Promo"] !== "NORMAL") 
                ? `<div class="promo-badge">${promoText}</div>` 
                : "";
            const firstBarcode = p.Barcode ? p.Barcode.split('/')[0].trim() : "";
            const lang = localStorage.getItem('mms_lang') || 'id';
            const t = prodTranslations[lang];

            const det = document.getElementById("detailContainer");
            det.innerHTML = `
                <div class="product-card">
                    <div class="image-box">
                        ${discountLabel}
                        <img src="${p.Image || ''}" onerror="this.src='https://placehold.co/150x150?text=MINISO'" onclick="openLightbox('${p.Image || ''}')">
                    </div>
                    <div class="p-info">
                        <span class="p-cat">${p.Category || 'GENERAL'}</span>
                        <span style="display: block; font-size: 10px; color: #888; margin-top: 1px; margin-bottom: 1px;">${p["Detail Category"] || ''}</span>
                        <h3 class="p-title">${p.Name}</h3>
                        <p class="p-desc">${p.Description || ''}</p>
                        <div class="price-comparison-grid">
                            <div class="price-item reg">
                                <span class="price-label">${t.regStoreLabel}</span>
                                <span class="price-val">Rp${regPrice.toLocaleString('id-ID')}</span>
                            </div>
                            <div class="price-item str">
                                <span class="price-label">${t.strStoreLabel}</span>
                                <span class="price-val">Rp${strPrice.toLocaleString('id-ID')}</span>
                            </div>
                        </div>
                        <div style="border-top: 1px solid #eee; padding-top: 20px;">
                            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
                                <span style="color:#888; font-weight:600;">${t.barcodeLabel}</span><span style="font-weight:700; word-break:break-all; text-align:right; max-width:60%;">${p.Barcode}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
                                <span style="color:#888; font-weight:600;">${t.regPromoLabel}</span><span style="font-weight:700; color:var(--promo-blue)">${p["Regular Store Promo"] || '-'}</span>
                            </div>
                            <div style="display:flex; justify-content:space-between; font-size:12px;">
                                <span style="color:#888; font-weight:600;">${t.strPromoLabel}</span><span style="font-weight:700; color:var(--promo-green)">${p["Street Store Promo"] || '-'}</span>
                            </div>

                            <!-- TOMBOL CEK STOCK -->
                            <button class="btn-stock" id="btnCekStock" onclick="checkStock('${firstBarcode}')">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                                ${t.stockCheckBtn}
                            </button>
                            <div id="stockResult"></div>
                        </div>
                    </div>
                </div>
            `;
            if (firstBarcode) {
                JsBarcode("#barcodeCanvas", firstBarcode, {
                    format: "CODE128", lineColor: "#000", width: 2, height: 40, displayValue: false
                });
            }
            det.style.display = "block";
            det.classList.add('active');
            document.getElementById("btnBackFloating").style.display = "flex";
            document.getElementById("scrollContainer").scrollTo(0, 0);
        }

        // ========== BAGIAN BARU: STOCK CHECK ==========
        let stockAbortController = null;

        function getStockTranslation() {
            const lang = localStorage.getItem('mms_lang') || 'id';
            const t = prodTranslations[lang];
            return {
                loading: t.stockLoading || 'Menghubungi server MINISO...',
                fetching: t.stockFetching || 'Mengambil Data...',
                empty: t.stockEmpty || 'Tidak ada data stock untuk barcode ini di toko',
                error: t.stockError || 'Gagal mengambil data stock.',
                headerSku: t.stockHeaderSku || 'SKU ditemukan',
                totalLabel: t.stockTotalLabel || 'Total',
                availableLabel: t.stockAvailableLabel || 'Tersedia',
                onOrderLabel: t.stockOnOrderLabel || 'On Order',
                refreshBtn: t.stockRefreshBtn || 'REFRESH STOCK',
                storeLabel: t.stockStoreLabel || 'STOCK TOKO'
            };
        }

        async function checkStock(barcode) {
            const btn = document.getElementById('btnCekStock');
            const box = document.getElementById('stockResult');
            if (!btn || !box) return;

            if (stockAbortController) {
                stockAbortController.abort();
            }
            stockAbortController = new AbortController();

            const s = getStockTranslation();
            btn.disabled = true;
            btn.innerHTML = `<div class="mini-spin" style="border-top-color:white;"></div> ${s.fetching}`;
            box.style.display = 'block';
            box.innerHTML = `<div class="stock-loading"><div class="mini-spin"></div> ${s.loading}</div>`;

            try {
                const resp = await fetch(STOCK_PROXY_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                    },
                    body: JSON.stringify({
                        barCodeOrGoodsName: barcode,
                        pageSize: 20,
                        pageNum: 1,
                        storeCode: getStoreCode(),
                        brandCode: 30,
                    }),
                    signal: stockAbortController.signal,
                });

                const text = await resp.text();
                if (!text || text.trim() === '') {
                    box.innerHTML = `<div class="stock-empty-msg">📦 ${s.empty} <b>${getStoreCode()}</b>.</div>`;
                    return;
                }

                const json = JSON.parse(text);
                renderStockResult(json, barcode, getStoreCode(), s);
            } catch (err) {
                if (err.name === 'AbortError') {
                    console.log('Request stok dibatalkan');
                    return;
                }
                box.innerHTML = `<div class="stock-error">⚠️ ${s.error}<br><small style="font-weight:400; color:#666;">${err.message}</small></div>`;
            } finally {
                if (stockAbortController?.signal.aborted === false) {
                    btn.disabled = false;
                    btn.innerHTML = `<svg width="18" height="18"...> ${s.refreshBtn}`;
                }
                stockAbortController = null;
            }
        }

        function renderStockResult(json, barcode, storeCode, s) {
            const box = document.getElementById('stockResult');
            if (!box) return;

            const items = json?.data?.list || [];
            const total = json?.data?.total ?? 0;

            box.innerHTML = `
                <div class="stock-header">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    ${s.storeLabel} <span class="store-badge">${storeCode}</span>
                    <span style="margin-left:auto; font-size:10px; opacity:0.7;">${total} ${s.headerSku}</span>
                </div>
            `;

            if (!items.length) {
                box.innerHTML += `<div class="stock-empty-msg">📦 ${s.empty} <b>${storeCode}</b>.</div>`;
                return;
            }

            items.forEach(item => {
                const name          = item.name || '-';
                const barCodeVal    = item.barCode || barcode;
                const retailPrice   = parseInt(item.retailPrice || 0);
                const totalInv      = parseInt(item.totalInvent ?? 0);
                const availableInv  = parseInt(item.availableInvent ?? 0);
                const inTransitInv  = parseInt(item.inTransitInvent ?? 0);
                const imgUrl        = item.picList?.[0]?.materialPictureUrl || '';
                const category      = item.Category || '';
                const detailCategory = item["Detail Category"] || '';

                let avClass = 'ok';
                if (availableInv <= 0)     avClass = 'empty';
                else if (availableInv < 5) avClass = 'low';

                box.innerHTML += `
                    <div style="background:white; padding:14px 16px; border-bottom:1px solid #f0f0f0;">
                        <div style="display:flex; gap:12px; align-items:flex-start; margin-bottom:12px;">
                            ${imgUrl ? `<img src="${imgUrl}" style="width:56px; height:56px; object-fit:contain; border-radius:10px; border:1px solid #eee; flex-shrink:0;" onerror="this.style.display='none'">` : ''}
                            <div style="flex:1; min-width:0;">
                                <div style="font-weight:700; font-size:13px; color:#111; line-height:1.4; margin-bottom:3px;">${name}</div>
                                ${(category || detailCategory) ? `<div style="font-size:10px; color:#888; margin-top:2px;">${category}${detailCategory ? ' · ' + detailCategory : ''}</div>` : ''}
                                <div style="font-size:11px; color:#888; margin-bottom:2px;">Barcode: ${barCodeVal}</div>
                                <div style="font-size:13px; font-weight:800; color:var(--miniso-red);">Rp${retailPrice.toLocaleString('id-ID')}</div>
                            </div>
                        </div>
                        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
                            <div style="background:#f9f9f9; border-radius:10px; padding:10px; text-align:center; border-bottom:3px solid #ddd;">
                                <div style="font-size:10px; font-weight:800; color:#999; text-transform:uppercase; margin-bottom:4px;">${s.totalLabel}</div>
                                <div style="font-size:20px; font-weight:800; color:#333;">${totalInv < 0 ? '—' : totalInv}</div>
                            </div>
                            <div style="background:#f9f9f9; border-radius:10px; padding:10px; text-align:center; border-bottom:3px solid ${availableInv <= 0 ? '#dc2626' : availableInv < 5 ? '#d97706' : '#16a34a'};">
                                <div style="font-size:10px; font-weight:800; color:#999; text-transform:uppercase; margin-bottom:4px;">${s.availableLabel}</div>
                                <div style="font-size:20px; font-weight:800; color:${availableInv <= 0 ? '#dc2626' : availableInv < 5 ? '#d97706' : '#16a34a'};">${availableInv < 0 ? '—' : availableInv}</div>
                            </div>
                            <div style="background:#f9f9f9; border-radius:10px; padding:10px; text-align:center; border-bottom:3px solid #3b82f6;">
                                <div style="font-size:10px; font-weight:800; color:#999; text-transform:uppercase; margin-bottom:4px;">${s.onOrderLabel}</div>
                                <div style="font-size:20px; font-weight:800; color:#3b82f6;">${inTransitInv}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // ========== MULTIBAHASA ==========
        const prodTranslations = {
            id: {
                searchPlace: "Scan / Input Barcode...",
                tapHint: "ARAHKAN BARCODE • TAP UNTUK FOKUS",
                sidebarHome: "Beranda",
                regStoreLabel: "Toko Reguler",
                strStoreLabel: "Toko Ruko",
                barcodeLabel: "BARCODE",
                regPromoLabel: "PROMO REGULER",
                strPromoLabel: "PROMO RUKO",
                stockCheckBtn: "CEK STOCK TOKO",
                stockLoading: "Menghubungi server MINISO...",

                stockError: "Gagal mengambil data stock.",
                stockHeaderSku: "SKU ditemukan",
                stockTotalLabel: "Total",
                stockAvailableLabel: "Tersedia",
                stockOnOrderLabel: "On Order",
                stockRefreshBtn: "REFRESH STOCK",
                stockStoreLabel: "STOCK TOKO"
            },
            en: {
                searchPlace: "Scan / Enter Barcode...",
                tapHint: "POINT AT BARCODE • TAP TO FOCUS",
                sidebarHome: "Home",
                regStoreLabel: "Regular Store",
                strStoreLabel: "Street Store",
                barcodeLabel: "BARCODE",
                regPromoLabel: "REGULAR STORE PROMO",
                strPromoLabel: "STREET STORE PROMO",
                stockCheckBtn: "CHECK STOCK",
                stockLoading: "Connecting to MINISO server...",
                stockFetching: "Fetching Data...",
                stockEmpty: "No stock data for this barcode in store",
                stockError: "Failed to retrieve stock data.",
                stockHeaderSku: "SKUs found",
                stockTotalLabel: "Total",
                stockAvailableLabel: "Available",
                stockOnOrderLabel: "On Order",
                stockRefreshBtn: "REFRESH STOCK",
                stockStoreLabel: "STOCK STORE"
            },
            cn: {
                searchPlace: "扫描 / 输入条形码...",
                tapHint: "对准条形码 • 轻触对焦",
                sidebarHome: "首页",
                regStoreLabel: "常规店价格",
                strStoreLabel: "街边店价格",
                barcodeLabel: "条码",
                regPromoLabel: "常规促销",
                strPromoLabel: "街边店促销",
                stockCheckBtn: "检查库存",
                stockLoading: "正在连接MINISO服务器...",
                stockFetching: "获取数据中...",
                stockEmpty: "该商品在门店无库存数据",
                stockError: "获取库存数据失败。",
                stockHeaderSku: "个SKU",
                stockTotalLabel: "总库存",
                stockAvailableLabel: "可用",
                stockOnOrderLabel: "在途",
                stockRefreshBtn: "刷新库存",
                stockStoreLabel: "门店库存"
            }
        };

        function applyPriceLanguage() {
            const lang = localStorage.getItem('mms_lang') || 'id';
            const t = prodTranslations[lang];

            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.placeholder = t.searchPlace;
            
            const tapHint = document.querySelector('.tap-hint');
            if (tapHint) tapHint.innerText = t.tapHint;

            const sidebarHome = document.querySelector('#sidebar a');
            if (sidebarHome) sidebarHome.innerText = t.sidebarHome;

            // Override showDetail yang sudah ada (tapi kita sudah definisikan ulang di atas)
            // Tidak perlu lagi override di sini karena kita sudah pakai showDetail baru
        }

        document.addEventListener('DOMContentLoaded', applyPriceLanguage);
    </script>
</body>
