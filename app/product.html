<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            margin: 0; padding: 0; 
            width: 100%;
            overflow-x: hidden; /* Mengunci scroll horizontal */
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; 
            background: #ffffff; color: var(--text-dark); 
            height: 100vh; display: flex; flex-direction: column;
        }

        /* --- LOGIN --- */
        #loginScreen { position: fixed; inset: 0; background: white; z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; }
        .login-input { width: 100%; max-width: 340px; padding: 16px; margin-bottom: 12px; border: 1.5px solid #eee; border-radius: 14px; font-size: 16px; outline: none; }
        .btn-login { width: 100%; max-width: 340px; padding: 16px; background: var(--miniso-red); color: white; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; }

        /* --- SIDEBAR --- */
        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        /* --- HEADER --- */
        #ui-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 16px; border-bottom: 1px solid #eee; z-index: 1000; width: 100%; }
        .top-bar { display: flex; gap: 10px; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        /* --- SCANNER --- */
        #reader { display:none; width:100%; max-width:340px; aspect-ratio:1/1; margin:15px auto; background:#000; border-radius:20px; overflow:hidden; position:relative; border: 4px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        #reader video { width: 100%; height: 100%; object-fit: cover; }

        /* --- IMPROVED LIST (FIXED WIDTH) --- */
        /* --- IMPROVED LIST (FIXED WIDTH) --- */
        .main-content { 
            flex: 1; 
            overflow-y: auto; 
            overflow-x: hidden; 
            padding: 0 16px; 
            width: 100%; 
            /* Tambahan agar padding tidak menambah lebar total */
            box-sizing: border-box; 
        }

        #listContainer { 
            width: 100%; 
            max-width: 1200px; 
            margin: 15px auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            /* Mencegah kebocoran ke samping */
            box-sizing: border-box; 
        }
        
        .search-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            padding: 10px; 
            background: #fff; 
            border-radius: 16px; 
            border: 1px solid #f0f0f0; 
            width: 100%; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.03); 
            /* Pastikan padding item tidak mendorong lebar keluar */
            box-sizing: border-box; 
        }

        .thumb-wrapper { width: 65px; height: 65px; border-radius: 10px; background: #f9f9f9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .thumb-img { width: 85%; height: 85%; object-fit: contain; }
        
        .item-info { flex: 1; min-width: 0; } 
        .item-name { font-size: 14px; font-weight: 700; color: #111; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-cat { font-size: 9px; font-weight: 800; color: var(--miniso-red); text-transform: uppercase; }
        .item-bc { font-size: 11px; color: #999; }
        .item-price { font-size: 14px; font-weight: 800; color: var(--miniso-red); margin-top: 2px; }

        /* --- DETAIL CARD --- */
        #detailContainer { display: none; padding: 20px 0 80px 0; width: 100%; max-width: 600px; margin: 0 auto; box-sizing: border-box; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; width: 100%; box-sizing: border-box; }
        
        /* --- MEDIA QUERY REPAIR --- */
        @media (min-width: 768px) {
            #listContainer { 
                display: grid; 
                /* Menggunakan repeat auto-fill dengan kalkulasi gap agar pas 100% */
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
                gap: 20px;
            }
            .search-item { 
                flex-direction: column; 
                align-items: flex-start; 
                height: 100%; /* Menyamakan tinggi card di grid */
            }
            .thumb-wrapper { width: 100%; height: 180px; }
            .item-info { width: 100%; }
        }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <h2>MMS-X</h2>
    <a href="#" onclick="location.reload()">Home</a>
    <a href="#" onclick="handleLogout()" style="margin-top: 50px; opacity: 0.7;">Logout</a>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="loginScreen">
    <h1 style="color:var(--miniso-red); font-size: 3rem; font-weight: 900; margin: 0;">MINISO</h1>
    <p style="color:#999; margin-bottom: 25px;">MMS-X System</p>
    <input type="text" id="username" class="login-input" placeholder="Username">
    <input type="password" id="password" class="login-input" placeholder="Password">
    <button class="btn-login" onclick="handleLogin()">LOGIN</button>
</div>

<div id="appContent" style="display:none; flex-direction: column; width: 100%;">
    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="search-container">
                <input id="searchInput" placeholder="Cari nama / barcode...">
                <button id="scanBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path></svg>
                </button>
            </div>
        </div>
        <div id="reader"></div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanning = false, lastScroll = 0, timer;

    function toggleSidebar() { 
        const s = document.getElementById("sidebar");
        s.classList.toggle("active");
        document.getElementById("overlay").style.display = s.classList.contains("active") ? "block" : "none";
    }

    function handleLogin() {
        if(document.getElementById("username").value === "admin") {
            sessionStorage.setItem("logged", "true");
            init();
        } else { alert("Login Gagal"); }
    }
    function handleLogout() { sessionStorage.clear(); location.reload(); }

    function init() {
        if(sessionStorage.getItem("logged") !== "true") return;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appContent").style.display = "flex";
    }

    function cleanPrice(val) {
        return parseInt(String(val || 0).replace(/[^0-9]/g, "")) || 0;
    }

    document.getElementById("searchInput").oninput = () => { clearTimeout(timer); timer = setTimeout(search, 500); };

    async function search() {
        const q = document.getElementById("searchInput").value.trim();
        const list = document.getElementById("listContainer");
        if(!q) { list.innerHTML = ""; return; }
        
        let { data } = await _supabase.from('export').select('*').or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`).limit(15);
        if(data) {
            list.innerHTML = data.map(p => `
                <div class="search-item" onclick="showDetail('${p.Barcode}')">
                    <div class="thumb-wrapper">
                        <img class="thumb-img" src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/100'">
                    </div>
                    <div class="item-info">
                        <span class="item-cat">${p.Category || 'GENERAL'}</span>
                        <div class="item-name">${p.Name}</div>
                        <div class="item-bc">${p.Barcode}</div>
                        <div class="item-price">Rp${cleanPrice(p["Regular Store Price"]).toLocaleString('id-ID')}</div>
                    </div>
                </div>
            `).join('');
        }
    }

    document.getElementById("scanBtn").onclick = () => { scanning ? stopScan() : startScan(); };

    function startScan() {
        scanning = true; document.getElementById("reader").style.display = "block";
        Quagga.init({
            inputStream: { type: "LiveStream", target: document.getElementById("reader"), constraints: { facingMode: "environment" } },
            decoder: { readers: ["ean_reader", "code_128_reader"] }
        }, (err) => { if(!err) Quagga.start(); });
    }

    function stopScan() { Quagga.stop(); scanning = false; document.getElementById("reader").style.display = "none"; }

    Quagga.onDetected(res => {
        const code = res.codeResult.code;
        document.getElementById("beepOk").play();
        stopScan();
        document.getElementById("searchInput").value = code;
        showDetail(code);
    });

    async function showDetail(bc) {
        lastScroll = document.getElementById("scrollContainer").scrollTop;
        const { data: p } = await _supabase.from('export').select('*').ilike('Barcode', `%${bc}%`).maybeSingle();
        if(!p) return;

        document.getElementById("ui-header").style.display = "none";
        document.getElementById("listContainer").style.display = "none";
        
        const reg = cleanPrice(p["Regular Store Price"]);
        const str = cleanPrice(p["Street Store Price"]);

        const det = document.getElementById("detailContainer");
        det.innerHTML = `
            <div class="product-card">
                <div class="image-box">
                    <img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/300'">
                </div>
                <div style="padding: 20px;">
                    <span class="item-cat">${p.Category}</span>
                    <h2 style="margin: 5px 0 15px 0; font-size: 18px;">${p.Name}</h2>
                    <div class="price-comparison-grid">
                        <div class="price-item reg">
                            <small>REGULAR</small>
                            <div class="price-val">Rp${reg.toLocaleString('id-ID')}</div>
                        </div>
                        <div class="price-item">
                            <small>STREET</small>
                            <div class="price-val">Rp${str.toLocaleString('id-ID')}</div>
                        </div>
                    </div>
                    <div style="font-size: 12px; border-top: 1px solid #eee; padding-top: 15px; color: #666;">
                        <p>Barcode: <b>${p.Barcode}</b></p>
                        <p>Promo Reg: <b style="color:var(--promo-blue)">${p["Regular Store Promo"] || '-'}</b></p>
                        <p>Promo Str: <b style="color:var(--promo-green)">${p["Street Store Promo"] || '-'}</b></p>
                    </div>
                </div>
            </div>
        `;
        det.style.display = "block";
        document.getElementById("btnBackFloating").style.display = "flex";
        document.getElementById("scrollContainer").scrollTo(0, 0);
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "flex";
        document.getElementById("btnBackFloating").style.display = "none";
        document.getElementById("scrollContainer").scrollTop = lastScroll;
    }

    window.onload = init;
</script>
</body>
</html>
