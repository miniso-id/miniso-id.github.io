<!doctype html>
<html amp lang="id">
<head>
  <meta charset="utf-8">
  <title>MMS – Miniso Management System</title>

  <link rel="canonical" href="https://miniso-id.github.io/">
  <meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1">

  <!-- AMP -->
  <script async src="https://cdn.ampproject.org/v0.js"></script>

  <!-- iOS PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MMS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- AMP Boilerplate -->
  <style amp-boilerplate>
    body{visibility:hidden}
  </style>
  <noscript>
    <style amp-boilerplate>
      body{visibility:visible}
    </style>
  </noscript>

  <!-- CUSTOM STYLE -->
  <style amp-custom>
    body {
      margin: 0;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial;
      background: #f5f5f7;
      padding-bottom: 100px;
    }

    header {
      background: #111;
      color: #fff;
      padding: 14px 16px;
      font-size: 16px;
    }

    main {
      padding: 16px;
    }

    /* ===== iOS A2HS BANNER (AMP SAFE) ===== */
    .ios-a2hs {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: env(safe-area-inset-bottom);
      background: rgba(28,28,30,.95);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      display: flex;
      align-items: center;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      animation: a2hsSlideUp .4s ease;
    }

    .ios-a2hs-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ios-a2hs-icon {
      font-size: 28px;
    }

    .ios-a2hs-text {
      font-size: 14px;
      line-height: 1.3;
    }

    .ios-a2hs-text span {
      font-size: 12px;
      opacity: .85;
    }

    .ios-a2hs-close {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 18px;
      cursor: pointer;
      opacity: .8;
    }

    #a2hs-close:checked + .ios-a2hs {
      display: none;
    }

    @keyframes a2hsSlideUp {
      from { transform: translateY(120%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Desktop hide */
    @media (min-width: 768px) {
      .ios-a2hs {
        display: none;
      }
    }
  </style>
</head>

<body>

<header>
  MMS – Miniso Management System
</header>

<main>
  <h2>Welcome 👋</h2>
  <p>
    Sistem internal MMS siap digunakan.  
    Untuk pengalaman terbaik di iPhone, tambahkan ke Home Screen.
  </p>
</main>

<!-- ===== iOS ADD TO HOME SCREEN BANNER ===== -->
<input type="checkbox" id="a2hs-close" hidden>

<div class="ios-a2hs">
  <label for="a2hs-close" class="ios-a2hs-close">✕</label>
  <div class="ios-a2hs-content">
    <div class="ios-a2hs-icon">📲</div>
    <div class="ios-a2hs-text">
      <strong>Add to Home Screen</strong><br>
      <span>Tap <b>Share</b> → <b>Add to Home Screen</b></span>
    </div>
  </div>
</div>

</body>
</html>
