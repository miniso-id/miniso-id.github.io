<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>SO ID12</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: #f4f6f9;
    }

    /* Bilah atas untuk tombol kembali */
    #topBar {
      width: 100%;
      height: 44px;
      background: #ffffff;
      display: flex;
      align-items: center;
      padding-left: 12px;
      padding-right: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      z-index: 100;
      position: relative;
      padding-top: env(safe-area-inset-top);
      box-sizing: content-box; /* agar padding-top menambah tinggi total */
    }

    #backBtn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    #backBtn:active {
      background: rgba(0,0,0,0.1);
    }

    #titleHint {
      margin-left: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #333;
    }

    /* Iframe mengisi sisa tinggi di bawah bilah atas */
    #stockFrame {
      border: none;
      width: 100%;
      height: calc(100% - 44px - env(safe-area-inset-top));
      display: block;
    }
  </style>
</head>
<body>
  <!-- Bilah atas dengan tombol kembali -->
  <div id="topBar">
    <div id="backBtn" onclick="goBack()" title="Kembali ke Menu Utama">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </div>
    <div id="titleHint">Menu Utama</div>
  </div>

  <iframe id="stockFrame"
    src="https://script.google.com/macros/s/AKfycbyT3PRoqiv_epPOPQtQKOFukkA-SVFsO4twJUfPGs8-CZ8QJSHxgyBnCttwRVmhi2W-bg/exec"
    loading="lazy"
    allowfullscreen
    scrolling="yes">
  </iframe>

  <script>
    function goBack() {
      // Arahkan ke halaman MMS-X
      window.location.href = "https://miniso-id.github.io/app/?app=mmsx";
    }

    // Sesuaikan tinggi iframe saat orientasi berubah
    function resizeIframe() {
      const iframe = document.getElementById('stockFrame');
      iframe.style.height = (window.innerHeight - 44 - (window.safeAreaInsets?.top || 0)) + 'px';
    }

    window.addEventListener('resize', resizeIframe);
    window.addEventListener('orientationchange', resizeIframe);
    window.addEventListener('load', resizeIframe);
  </script>
</body>
</html>
