<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Deluxe v4.7</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --text-dark: #1a1a1a;
            --bg-gray: #f2f2f7;
            --promo-blue: #007aff;
            --promo-blue-soft: #f0f7ff;
            --promo-green: #34c759;
            --promo-green-soft: #f1fdf5;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; 
            background: #ffffff; color: var(--text-dark); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- LOGIN --- */
        #loginScreen {
            position: fixed; inset: 0; background: white; z-index: 9000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
        }
        .login-input {
            width: 100%; max-width: 340px; padding: 16px; margin-bottom: 12px; 
            border: 1.5px solid #eee; border-radius: 14px; font-size: 16px;
        }
        .btn-login {
            width: 100%; max-width: 340px; padding: 16px; background: var(--miniso-red); 
            color: white; border: none; border-radius: 14px; font-weight: bold;
        }

        /* --- STICKY HEADER --- */
        #ui-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 16px 16px 8px 16px;
            border-bottom: 1px solid #eee;
            z-index: 1000;
            position: sticky; top: 0;
            transition: opacity 0.2s ease;
        }
        .top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        .search-container { position: relative; flex: 1; }
        #searchInput { 
            width: 100%; height: 46px; padding: 0 45px 0 15px; 
            border-radius: 14px; border: 1.5px solid #eee; 
            background: #f2f2f7; outline: none; font-size: 15px;
        }
        #scanBtn { 
            position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; 
            background: var(--miniso-red); color: white; border: none; border-radius: 10px; 
            display: flex; align-items: center; justify-content: center;
        }

        /* --- SCANNER --- */
        #reader {
            display: none; width: 100%; max-width: 340px; aspect-ratio: 1/1;
            margin: 10px auto; background: #000; border-radius: 24px;
            overflow: hidden; position: relative; border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        #reader video { width: 100%; height: 100%; object-fit: cover; }

        /* --- CONTENT --- */
        .main-content { flex: 1; overflow-y: auto; padding: 0 16px; position: relative; }
        .search-item { display: flex; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid #f0f0f0; }
        .thumb-img { width: 65px; height: 65px; border-radius: 10px; object-fit: contain; background: #f9f9f9; }

        /* --- DETAIL DESIGN --- */
        .product-detail-card { display: none; padding-bottom: 50px; will-change: transform, opacity; }
        .product-detail-card.active { display: block; animation: slideUp 0.3s ease both; }

        .price-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .price-item { padding: 15px; border-radius: 18px; text-align: center; }
        
        .price-item.reg { background: var(--promo-blue-soft); border: 1px solid rgba(0,122,255,0.05); }
        .price-item.str { background: var(--promo-green-soft); border: 1px solid rgba(52,199,89,0.05); }
        
        .price-val { font-size: 20px; font-weight: 900; margin-top: 4px; color: var(--text-dark); }
        
        .promo-banner { padding: 20px; border-radius: 24px; background: #fff; border: 1.5px solid #eee; }
        .promo-label { color: #666; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* WARNA TEKS PROMO */
        .txt-blue { color: var(--promo-blue); font-weight: 900; }
        .txt-green { color: var(--promo-green); font-weight: 900; }

        .floating-back {
            position: fixed; top: 20px; left: 20px; width: 45px; height: 45px; 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-radius: 50%; display: none; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 8000;
        }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width); background: var(--miniso-red); color: #fff;
            position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%);
            transition: 0.4s; z-index: 5000; padding: 25px;
        }
        .sidebar.active { transform: translateX(0); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 4000; display: none; }
    </style>
</head>
<body>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="loginScreen">
    <h1 style="color:var(--miniso-red); font-size: 3.5rem; font-weight: 900; margin:0; letter-spacing:-3px;">MINISO</h1>
    <p style="color:#888; margin-bottom: 30px;">Inventory System v4.7</p>
    <input type="text" id="username" class="login-input" placeholder="Username">
    <input type="password" id="password" class="login-input" placeholder="Password">
    <button class="btn-login" onclick="handleLogin()">MASUK</button>
</div>

<div id="appContent" style="display:none; height: 100vh; flex-direction: column;">
    <div id="sidebar" class="sidebar">
        <h2 style="font-weight: 900;">MMS-X</h2>
        <a href="#" style="color:white; display:block; padding:15px; text-decoration:none;">🔍 Price Checker</a>
        <a href="https://miniso-id.github.io/so/" style="color:white; display:block; padding:15px; text-decoration:none;">📦 Stock Opname</a>
        <a href="#" onclick="handleLogout()" style="color:white; display:block; padding:15px; text-decoration:none; margin-top:50px; opacity:0.7;">Logout</a>
    </div>
    <div id="overlay" onclick="toggleSidebar()"></div>

    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none; font-size:24px;">☰</button>
            <div class="search-container">
                <input id="searchInput" placeholder="Cari nama / barcode...">
                <button id="scanBtn">🔍</button>
            </div>
        </div>
        <select id="catFilter" style="width:100%; padding:12px; border-radius:12px; border:1px solid #eee; font-weight:bold;">
            <option value="">Semua Kategori</option>
        </select>
        <div id="reader"></div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer" class="product-detail-card"></div>
    </main>
</div>

<audio id="beep" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanning = false, lastScroll = 0, timer;
    const input = document.getElementById("searchInput");
    const catFilter = document.getElementById("catFilter");
    const listCont = document.getElementById("listContainer");
    const detCont = document.getElementById("detailContainer");
    const header = document.getElementById("ui-header");
    const floatingBack = document.getElementById("btnBackFloating");

    function cleanPrice(val) {
        if(!val) return "Rp0";
        let num = parseInt(String(val).replace(/[^0-9]/g, "")) || 0;
        return "Rp" + num.toLocaleString('id-ID');
    }

    function handleLogin() {
        if(document.getElementById("username").value === "admin") {
            sessionStorage.setItem("logged", "true");
            location.reload();
        }
    }
    function handleLogout() { sessionStorage.clear(); location.reload(); }
    function toggleSidebar() { 
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }

    document.getElementById("scanBtn").onclick = () => {
        if (scanning) { Quagga.stop(); scanning = false; document.getElementById("reader").style.display = "none"; } 
        else { 
            scanning = true; document.getElementById("reader").style.display = "block";
            Quagga.init({
                inputStream: { type: "LiveStream", target: document.getElementById("reader"), constraints: { facingMode: "environment" } },
                decoder: { readers: ["ean_reader", "code_128_reader"] }
            }, (err) => { if (!err) Quagga.start(); });
        }
    };

    Quagga.onDetected(res => {
        document.getElementById("beep").play();
        Quagga.stop(); scanning = false;
        document.getElementById("reader").style.display = "none";
        showDetail(res.codeResult.code);
    });

    input.oninput = () => { clearTimeout(timer); timer = setTimeout(search, 500); };
    catFilter.onchange = search;

    async function search() {
        const q = input.value.trim();
        if(!q && !catFilter.value) { listCont.innerHTML = ""; return; }
        let query = _supabase.from('export').select('*');
        if(q) query = query.or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`);
        if(catFilter.value) query = query.eq('Category', catFilter.value);
        const { data } = await query.limit(50);
        if(data) renderList(data);
    }

    function renderList(data) {
        listCont.innerHTML = data.map(p => `
            <div class="search-item" onclick="showDetail('${p.Barcode}')">
                <img class="thumb-img" src="${p.Image || ''}" onerror="this.src='https://placehold.co/100x100?text=No+Img'">
                <div style="flex:1">
                    <small style="color:var(--miniso-red); font-weight:bold;">${p.Category || ''}</small>
                    <div style="font-weight:bold; font-size:14px; color:var(--text-dark);">${p.Name || ''}</div>
                    <div style="font-size:11px; color:#666;">${p.Barcode}</div>
                </div>
                <div style="font-weight:bold; color:var(--text-dark);">${cleanPrice(p["Regular Store Price"])}</div>
            </div>
        `).join('');
    }

    async function showDetail(fullBarcode) {
        lastScroll = document.getElementById("scrollContainer").scrollTop;
        const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${fullBarcode}%`).maybeSingle();

        if(data) {
            listCont.style.opacity = "0"; header.style.opacity = "0";
            setTimeout(() => {
                listCont.style.display = "none"; header.style.display = "none";
                const bcUrl = `https://bwipjs-api.metafloor.com/?bcid=ean13&text=${data.Barcode}&scale=3&includetext`;

                detCont.innerHTML = `
                    <div style="text-align:center; margin-bottom:20px;">
                        <img src="${data.Image || ''}" style="width:100%; max-height:350px; object-fit:contain;">
                    </div>
                    <div style="padding:0 5px;">
                        <small style="font-weight:bold; color:var(--miniso-red);">${data.Category || ''}</small>
                        <h2 style="margin:5px 0 20px 0; font-weight:800;">${data.Name || ''}</h2>
                        
                        <div class="price-box">
                            <div class="price-item reg">
                                <div class="promo-label">REGULAR STORE</div>
                                <div class="price-val">${cleanPrice(data["Regular Store Price"])}</div>
                            </div>
                            <div class="price-item str">
                                <div class="promo-label">STREET STORE</div>
                                <div class="price-val">${cleanPrice(data["Street Store Price"])}</div>
                            </div>
                        </div>

                        <div class="promo-banner">
                            <div style="display:flex; justify-content:space-between; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid #f0f0f0;">
                                <span class="promo-label">REGULAR PROMO</span> 
                                <b class="txt-blue">${data["Regular Store Promo"] || "NORMAL PRICE"}</b>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span class="promo-label">STREET PROMO</span> 
                                <b class="txt-green">${data["Street Store Promo"] || "NORMAL PRICE"}</b>
                            </div>
                            ${data["Extra Promo"] ? `
                                <div style="text-align:center; margin-top:15px; padding:10px; border-radius:12px; background:var(--bg-gray); color:var(--miniso-red); font-weight:900; font-size:13px; border:1px dashed #ccc;">
                                    ${data["Extra Promo"]}
                                </div>` : ''}
                        </div>

                        <div class="barcode-img-container">
                            <img src="${bcUrl}" style="max-width:100%;">
                        </div>
                    </div>
                `;
                detCont.style.display = "block";
                setTimeout(() => { detCont.classList.add('active'); floatingBack.style.display = "flex"; }, 10);
            }, 200);
        }
    }

    function back() {
        detCont.classList.remove('active'); floatingBack.style.display = "none";
        setTimeout(() => {
            detCont.style.display = "none"; header.style.display = "block"; listCont.style.display = "block";
            setTimeout(() => { header.style.opacity = "1"; listCont.style.opacity = "1"; }, 10);
        }, 300);
    }

    window.onload = () => { if(sessionStorage.getItem("logged")) { document.getElementById("loginScreen").style.display="none"; document.getElementById("appContent").style.display="flex"; } };
</script>
</body>
</html>
