<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>MMS-X v2.0</title>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen font-sans">

    <div class="h-40 bg-[#e60012] w-full"></div>

    <div class="flex-grow flex justify-center px-4 -mt-20">
        <div class="bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full h-fit text-center border border-gray-100">
            
            <div class="flex justify-center mb-6">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Miniso_logo.svg/1200px-Miniso_logo.svg.png" 
                     alt="Miniso Logo" 
                     class="h-20 w-20 object-contain rounded-2xl shadow-sm">
            </div>

            <h1 class="text-2xl font-bold text-gray-800 mb-8 tracking-tight">MMS-X v2.0</h1>

            <div class="space-y-4">
                <a href="#" class="flex items-center justify-start px-6 py-4 border-2 border-gray-200 rounded-2xl hover:bg-gray-50 transition-all group">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Android_robot.svg" class="h-8 w-8 mr-4 opacity-70 group-hover:opacity-100" alt="Android">
                    <div class="text-left">
                        <p class="text-[10px] text-gray-500 uppercase font-semibold">Download for</p>
                        <p class="text-lg font-bold text-gray-800 leading-tight">Android (APK)</p>
                    </div>
                </a>

                <a href="#" class="flex items-center justify-start px-6 py-4 border-2 border-gray-200 rounded-2xl hover:bg-gray-50 transition-all group">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" class="h-7 w-7 mr-5 opacity-70 group-hover:opacity-100" alt="Apple">
                    <div class="text-left">
                        <p class="text-[10px] text-gray-500 uppercase font-semibold">Open for</p>
                        <p class="text-lg font-bold text-gray-800 leading-tight">iOS / Web PWA</p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <footer class="pb-8 pt-4 text-center">
        <p class="text-gray-400 text-xs font-medium">
            &copy; 2026 Miniso Indonesia<br>
            Developed by Fahril Dwi Ilyas
        </p>
    </footer>

</body>
</html>
