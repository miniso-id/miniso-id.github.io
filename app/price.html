<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --bg-gray: #f2f2f7;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; 
            background: #ffffff; color: var(--text-dark); 
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        /* --- HEADER --- */
        #ui-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 16px 16px 8px 16px; border-bottom: 1px solid #eee; z-index: 1000; position: sticky; top: 0; }
        .top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; max-width: 1200px; margin-inline: auto; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; transition: border 0.3s; }
        #searchInput:focus { border-color: var(--miniso-red); background: #fff; }

        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* --- SCANNER --- */
        #reader { display:none; width:100%; max-width: 500px; aspect-ratio:1/1; margin:10px auto; background:#000; border-radius:20px; overflow:hidden; position:relative; border: 4px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        #reader video { width: 100%; height: 100%; object-fit: cover; }
        .focus-guide { position: absolute; inset: 20%; border: 2.5px solid var(--miniso-red); border-radius: 15px; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }

        .main-content { flex: 1; overflow-y: auto; padding: 0 16px; }
        
        /* --- DETAIL VIEW --- */
        .product-detail-card { display: none; padding-bottom: 100px; max-width: 800px; margin: 0 auto; }
        .product-detail-card.active { display: block; animation: slideUp 0.3s ease both; }
        .price-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .price-item { padding: 15px; border-radius: 18px; text-align: center; }
        .price-item.reg { background: var(--miniso-soft); }
        .price-item.str { background: var(--bg-gray); }

        .floating-back { position: fixed; top: 20px; left: 20px; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 8000; cursor: pointer; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="sidebar" class="sidebar">
    <h2 style="margin-bottom: 30px;">MMS-X</h2>
    <a href="#" onclick="location.reload()">Refresh App</a>
    <p style="position: absolute; bottom: 20px; font-size: 10px; opacity: 0.5;">v5.9 - No Login Mode</p>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="appContent" style="height: 100vh; display: flex; flex-direction: column;">
    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none; padding:10px 5px; cursor:pointer;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-dark)" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="search-container">
                <input id="searchInput" placeholder="Scan atau ketik 13 digit barcode...">
                <button id="scanBtn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                </button>
            </div>
        </div>
        
        <div id="reader">
            <div class="focus-guide"></div>
        </div>
        <div id="cameraControl" style="max-width: 1200px; margin-inline: auto; display: none;">
            <select id="videoSource" style="width:100%; padding:10px; border-radius:10px; border:1px solid #eee; margin-top: 5px;"></select>
        </div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="detailContainer" class="product-detail-card"></div>
        <div id="welcomeMsg" style="text-align: center; padding-top: 50px; color: #ccc;">
            <p>Siap scan barcode...</p>
        </div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanning = false;
    let lastSelectedDeviceId = localStorage.getItem('preferredCameraId');

    function toggleSidebar() { 
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }

    window.onload = () => {
        setTimeout(() => {
            startScan(lastSelectedDeviceId);
        }, 500);
    };

    document.getElementById("searchInput").oninput = (e) => {
        const val = e.target.value.trim();
        if(val.length >= 13) {
            showDetail(val);
        }
    };

    document.getElementById("scanBtn").onclick = () => { scanning ? stopScan() : startScan(lastSelectedDeviceId); };

    async function startScan(deviceId = null) {
        scanning = true; 
        document.getElementById("reader").style.display = "block";
        document.getElementById("welcomeMsg").style.display = "none";
        
        const constraints = { width: { ideal: 1920 }, height: { ideal: 1080 }, facingMode: "environment" };
        if (deviceId) { constraints.deviceId = { exact: deviceId }; }

        Quagga.init({
            inputStream: { type: "LiveStream", target: document.getElementById("reader"), constraints: constraints, area: { top: "20%", right: "20%", left: "20%", bottom: "20%" } },
            decoder: { readers: ["ean_reader", "code_128_reader"] }
        }, (err) => {
            if (err) { if(deviceId) startScan(null); return; }
            Quagga.start(); updateCameraList();
        });
    }

    async function updateCameraList() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        if (videoDevices.length > 1) {
            document.getElementById("cameraControl").style.display = "block";
            const source = document.getElementById("videoSource");
            source.innerHTML = videoDevices.map(d => `<option value="${d.deviceId}" ${d.deviceId === lastSelectedDeviceId ? 'selected' : ''}>${d.label || 'Camera'}</option>`).join("");
        }
    }

    document.getElementById("videoSource").onchange = (e) => { 
        lastSelectedDeviceId = e.target.value; 
        localStorage.setItem('preferredCameraId', lastSelectedDeviceId); 
        Quagga.stop(); 
        startScan(lastSelectedDeviceId); 
    };

    function stopScan() { 
        Quagga.stop(); 
        scanning = false; 
        document.getElementById("reader").style.display = "none"; 
        document.getElementById("cameraControl").style.display = "none"; 
        document.getElementById("searchInput").focus();
    }

    Quagga.onDetected(async res => {
        const code = res.codeResult.code;
        if(code.length >= 12) {
            document.getElementById("beepOk").play();
            stopScan();
            document.getElementById("searchInput").value = code;
            showDetail(code);
        }
    });

    async function showDetail(fullBarcode) {
        const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${fullBarcode}%`).maybeSingle();
        
        if(!data) return;

        document.getElementById("ui-header").style.display = "none";
        document.getElementById("welcomeMsg").style.display = "none";
        
        const det = document.getElementById("detailContainer");
        det.innerHTML = `
            <div style="text-align:center;">
                <img src="${data.Image || ''}" style="width:100%; max-height:450px; object-fit:contain;" onerror="this.src='https://placehold.co/400x400?text=No+Image'">
            </div>
            <div style="padding:25px;">
                <span style="display:inline-block; padding:4px 10px; background:var(--miniso-red); color:#fff; border-radius:6px; font-size:11px; font-weight:800;">${data.Category || 'GENERAL'}</span>
                <h2 style="margin:15px 0; font-size:26px; font-weight:800; line-height:1.2;">${data.Name}</h2>
                <div style="font-size:14px; color:#666; margin-bottom: 20px; font-family: monospace;">Barcode: ${data.Barcode}</div>
                
                <div class="price-box">
                    <div class="price-item reg"><small style="font-weight:bold; color:#888;">REGULAR STORE</small><div style="color:var(--miniso-red); font-size:24px; font-weight:900; margin-top:5px;">Rp${(data["Regular Store Price"]||0).toLocaleString('id-ID')}</div></div>
                    <div class="price-item str"><small style="font-weight:bold; color:#888;">STREET STORE</small><div style="font-size:24px; font-weight:900; margin-top:5px;">Rp${(data["Street Store Price"]||0).toLocaleString('id-ID')}</div></div>
                </div>
                
                <div style="padding:15px; background:#f9f9f9; border-radius:18px; border:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:13px; font-weight:600; color:#666;">PROMO STATUS</span>
                    <b style="color:var(--miniso-red); font-size:14px;">${data["Regular Store Promo"] || "NORMAL PRICE"}</b>
                </div>
            </div>
        `;
        det.style.display = "block";
        setTimeout(() => { 
            det.classList.add('active'); 
            document.getElementById("btnBackFloating").style.display = "flex"; 
        }, 10);
    }

    function back() {
        document.getElementById("detailContainer").classList.remove('active');
        document.getElementById("btnBackFloating").style.display = "none";
        document.getElementById("searchInput").value = "";
        setTimeout(() => { 
            document.getElementById("detailContainer").style.display = "none"; 
            document.getElementById("ui-header").style.display = "block"; 
            startScan(lastSelectedDeviceId);
        }, 300);
    }
</script>
</body>
</html>
