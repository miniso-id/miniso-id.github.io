<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Fix2</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js"></script>
    
    <style>
        :root { --miniso-red: #e61523; --bg-gray: #f4f4f4; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { padding: calc(20px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid #eee; background: white; }
        .top-bar { display: flex; gap: 10px; align-items: center; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 44px; border-radius: 12px; border: 1px solid #ddd; background: #f5f5f7; padding: 0 45px 0 12px; outline: none; }
        #scanBtn { position: absolute; right: 5px; top: 5px; width: 34px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        #statusTag { font-size: 10px; text-align: center; margin-top: 5px; font-weight: bold; color: #999; }

        /* SCANNER STYLE */
        #reader { display: none; width: 90%; max-width: 320px; aspect-ratio: 1/1; margin: 15px auto; background: #000; border-radius: 20px; overflow: hidden; position: relative; border: 4px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        .scanner-guide { position: absolute; inset: 20%; border: 2px solid var(--miniso-red); border-radius: 15px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); pointer-events: none; }

        .main-content { flex: 1; overflow-y: auto; padding: 10px 16px 80px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .item-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid #eee; }
        .item-img { width: 50px; height: 50px; background: #f9f9f9; border-radius: 8px; object-fit: contain; }
        
        #detailView { display: none; }
        .back-btn { padding: 8px 15px; background: #eee; border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-block; margin-bottom: 15px; }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="search-container">
            <input id="searchInput" placeholder="Cari barcode/nama...">
            <button id="scanBtn">📸</button>
        </div>
    </div>
    <div id="statusTag">MEMUAT MESIN...</div>

    <div id="reader">
        <video id="videoElement" playsinline muted></video>
        <div class="scanner-guide"></div>
    </div>
</header>

<main class="main-content">
    <div id="listContainer"></div>
    <div id="detailView"></div>
</main>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let detector = null;
    let isScanning = false;
    let isLocked = false;

    // 1. INISIALISASI (Ini yang bikin tidak macet)
    async function initScanner() {
        const tag = document.getElementById('statusTag');
        try {
            const vision = await tasksVision.FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            detector = await tasksVision.BarcodeDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/barcode_detector/barcode_detector/float16/1/barcode_detector.tflite",
                    delegate: "GPU"
                },
                runningMode: "VIDEO"
            });
            tag.innerText = "SCANNER SIAP ✅";
            tag.style.color = "green";
        } catch (e) {
            tag.innerText = "GAGAL LOAD ENGINE ❌";
            console.error(e);
        }
    }
    initScanner();

    // 2. LOGIKA TOMBOL SCAN
    document.getElementById('scanBtn').onclick = () => {
        if (isScanning) stopScan(); else startScan();
    };

    async function startScan() {
        if (!detector) return alert("Mesin belum siap!");
        isScanning = true;
        isLocked = false;
        document.getElementById('reader').style.display = 'block';
        const video = document.getElementById('videoElement');

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: 640, height: 640 } 
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                requestAnimationFrame(renderLoop);
            };
        } catch (e) {
            alert("Kamera diblokir browser!");
            stopScan();
        }
    }

    function renderLoop() {
        if (!isScanning) return;
        const video = document.getElementById('videoElement');
        
        if (video.readyState >= 2 && !isLocked) {
            const result = detector.detectForVideo(video, performance.now());
            if (result.barcodes.length > 0) {
                isLocked = true; // Kunci biar tidak scan berkali-kali
                handleResult(result.barcodes[0].rawValue);
            }
        }
        requestAnimationFrame(renderLoop);
    }

    async function handleResult(code) {
        const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${code}%`).maybeSingle();
        if (data) {
            document.getElementById('beepOk').play();
            stopScan();
            showDetail(data);
        } else {
            console.log("Tidak ditemukan:", code);
            // Lepas kunci setelah 1.5 detik kalau tidak ketemu, biar bisa scan lagi
            setTimeout(() => { isLocked = false; }, 1500);
        }
    }

    function stopScan() {
        isScanning = false;
        const video = document.getElementById('videoElement');
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        document.getElementById('reader').style.display = 'none';
    }

    function showDetail(p) {
        document.getElementById('listContainer').style.display = 'none';
        const det = document.getElementById('detailView');
        det.style.display = 'block';
        det.innerHTML = `
            <div class="back-btn" onclick="location.reload()">← Kembali</div>
            <div style="text-align:center"><img src="${p.Image}" style="width:100%; max-width:300px; border-radius:20px;"></div>
            <h2 style="margin:15px 0 5px">${p.Name}</h2>
            <p style="color:var(--miniso-red); font-size:28px; font-weight:bold; margin:0">Rp${parseInt(p["Regular Store Price"]).toLocaleString()}</p>
            <p style="color:#888">Barcode: ${p.Barcode}</p>
        `;
    }

    // 3. SEARCH MANUAL
    document.getElementById('searchInput').oninput = async (e) => {
        const val = e.target.value;
        if (val.length < 3) return;
        const { data } = await _supabase.from('export').select('*').or(`Name.ilike.%${val}%,Barcode.ilike.%${val}%`).limit(10);
        if (data) {
            document.getElementById('listContainer').innerHTML = data.map(p => `
                <div class="item-card" onclick="showDetail(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <img class="item-img" src="${p.Image}">
                    <div><b>${p.Name}</b><br><small>${p.Barcode}</small></div>
                </div>
            `).join('');
        }
    };
</script>
</body>
</html>
