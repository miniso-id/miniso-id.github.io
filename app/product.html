<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X (Full Stable v3.4)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --bg-gray: #f2f2f7;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto; 
            background: #ffffff; color: var(--text-dark); 
            height: 100vh; overflow: hidden; 
        }

        /* --- LOGIN --- */
        #loginScreen {
            position: fixed; inset: 0; background: white; z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
        }
        .login-input {
            width: 100%; max-width: 340px; padding: 16px; margin-bottom: 12px; 
            border: 1.5px solid #eee; border-radius: 14px; font-size: 16px;
        }
        .btn-login {
            width: 100%; max-width: 340px; padding: 16px; background: var(--miniso-red); 
            color: white; border: none; border-radius: 14px; font-weight: bold;
        }

        /* --- APP STRUCTURE --- */
        #appContent { display: none; height: 100vh; width: 100%; flex-direction: column; }
        .app-wrapper { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width); background: var(--miniso-red); color: #fff;
            position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%);
            transition: 0.4s; z-index: 2000; padding: 25px;
        }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 10px; margin-bottom: 5px; font-weight: 600; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1500; display: none; backdrop-filter: blur(4px); }

        /* --- MAIN AREA --- */
        .main-content { flex: 1; overflow-y: auto; padding: 16px; background: #fff; }
        .top-bar-container { position: sticky; top: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 1000; padding-bottom: 10px; }
        .top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 44px; padding: 0 45px 0 15px; border-radius: 12px; border: 1.5px solid #eee; background: #f5f5f7; outline: none; }
        #scanBtn { position: absolute; right: 5px; top: 5px; width: 34px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 8px; }

        /* --- LIST & CARDS --- */
        .search-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .thumb-img { width: 60px; height: 60px; border-radius: 8px; object-fit: contain; background: #f9f9f9; }
        
        #reader { display: none; width: 100%; max-width: 350px; margin: 10px auto; border-radius: 20px; overflow: hidden; border: 3px solid var(--miniso-red); }
        #loader { display: none; text-align: center; color: var(--miniso-red); padding: 10px; font-weight: bold; }

        .product-detail-card { display: none; animation: slideUp 0.3s ease; }
        .price-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .price-item { background: var(--bg-gray); padding: 12px; border-radius: 12px; text-align: center; }
        .barcode-img-container { background: white; padding: 20px; border-radius: 15px; border: 1px dashed #ccc; text-align: center; margin-top: 15px; }
        
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="loginScreen">
    <h1 style="color:var(--miniso-red); font-size: 3rem; margin-bottom: 0;">MINISO</h1>
    <p style="color:#888; margin-bottom: 30px;">Inventory System v3.4</p>
    <input type="text" id="username" class="login-input" placeholder="Username">
    <input type="password" id="password" class="login-input" placeholder="Password">
    <button class="btn-login" onclick="handleLogin()">MASUK</button>
</div>

<div id="appContent">
    <div id="sidebar" class="sidebar">
        <h2>MMS-X</h2>
        <div id="userDisplay" style="font-size: 12px; opacity: 0.8; margin-bottom: 20px;"></div>
        <a href="#" style="background: rgba(255,255,255,0.2);">🔍 Price Checker</a>
        <a href="https://miniso-id.github.io/so/">📦 Stock Opname</a>
        <a href="#" onclick="handleLogout()" style="margin-top: 50px; opacity: 0.7;">Logout</a>
    </div>
    <div id="overlay" onclick="toggleSidebar()"></div>

    <main class="main-content" id="scrollContainer">
        <div id="ui-header">
            <div class="top-bar-container">
                <div class="top-bar">
                    <button onclick="toggleSidebar()" style="background:none; border:none; font-size:24px;">☰</button>
                    <div class="search-container">
                        <input id="searchInput" placeholder="Cari nama / barcode...">
                        <button id="scanBtn">📸</button>
                    </div>
                </div>
                <select id="catFilter" style="width:100%; padding:10px; border-radius:10px; border:1px solid #eee;">
                    <option value="">Semua Kategori</option>
                </select>
            </div>
            <div id="reader"></div>
            <div id="loader">Memproses...</div>
        </div>

        <div id="listContainer"></div>
        <div id="detailContainer" class="product-detail-card"></div>
    </main>
</div>

<audio id="beep" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scanning = false, lastScroll = 0, timer;
    const input = document.getElementById("searchInput");
    const catFilter = document.getElementById("catFilter");
    const listCont = document.getElementById("listContainer");
    const detCont = document.getElementById("detailContainer");

    function handleLogin() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        if((u === "admin" && p === "miniso123") || (u === "ID12" && p === "12121212")) {
            sessionStorage.setItem("logged", "true");
            location.reload();
        } else { alert("Login Gagal"); }
    }
    function handleLogout() { sessionStorage.clear(); location.reload(); }
    function toggleSidebar() { 
        document.getElementById("sidebar").classList.toggle("active");
        document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none";
    }

    async function init() {
        if(sessionStorage.getItem("logged") !== "true") return;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appContent").style.display = "flex";
        loadCategories();
    }

    async function loadCategories() {
        const { data } = await _supabase.from('export').select('Category');
        if(data) {
            const cats = [...new Set(data.map(i => i.Category))].sort();
            cats.forEach(c => {
                if(c) {
                    const opt = document.createElement("option");
                    opt.value = opt.textContent = c;
                    catFilter.appendChild(opt);
                }
            });
        }
    }

    input.oninput = () => { clearTimeout(timer); timer = setTimeout(search, 500); };
    catFilter.onchange = search;

    async function search() {
        const q = input.value.trim();
        const c = catFilter.value;
        if(!q && !c) { listCont.innerHTML = ""; return; }
        detCont.style.display = "none";
        listCont.style.display = "block";
        document.getElementById("loader").style.display = "block";

        let query = _supabase.from('export').select('*');
        if(q) query = query.or(`Name.ilike.%${q}%,Barcode.eq.${q}`);
        if(c) query = query.eq('Category', c);

        const { data } = await query.limit(50);
        document.getElementById("loader").style.display = "none";
        if(data) renderList(data);
    }

    function renderList(data) {
        listCont.innerHTML = data.map(p => `
            <div class="search-item" onclick="showDetail('${p.Barcode}')">
                <img class="thumb-img" src="${p.Image || p["Image"] || ''}" onerror="this.src='https://placehold.co/100x100?text=No+Img'">
                <div style="flex:1">
                    <small style="color:var(--miniso-red); font-weight:bold;">${p.Category || p["Category"] || ''}</small>
                    <div style="font-weight:bold; font-size:14px;">${p.Name || p["Name"]}</div>
                    <div style="font-size:11px; color:#666;">${p.Barcode}</div>
                </div>
                <div style="font-weight:bold; color:var(--miniso-red);">Rp${(p["Regular Store Price"] || 0).toLocaleString()}</div>
            </div>
        `).join('');
    }

    // --- DETAIL VIEW DENGAN LOGIKA SPLIT BARCODE ---
    async function showDetail(fullBarcode) {
        lastScroll = document.getElementById("scrollContainer").scrollTop;
        document.getElementById("loader").style.display = "block";

        const { data } = await _supabase.from('export').select('*').eq('Barcode', fullBarcode).maybeSingle();
        document.getElementById("loader").style.display = "none";

        if(data) {
            listCont.style.display = "none";
            document.getElementById("ui-header").style.display = "none";
            detCont.style.display = "block";

            // LOGIKA SPLIT: Jika barcode berisi '/', ambil bagian pertama saja untuk gambar
            const rawString = String(data.Barcode || data["Barcode"]).trim();
            const barcodeForImg = rawString.includes('/') ? rawString.split('/')[0] : rawString;
            
            const bcType = barcodeForImg.length === 13 ? 'ean13' : 'code128';
            const bcUrl = `https://bwipjs-api.metafloor.com/?bcid=${bcType}&text=${barcodeForImg}&scale=3&rotate=N&includetext`;

            detCont.innerHTML = `
                <div style="text-align:center; padding:20px;">
                    <img src="${data.Image || data["Image"] || ''}" style="max-width:100%; max-height:250px;" onerror="this.src='https://placehold.co/300x300?text=No+Image'">
                </div>
                <div style="padding:0 10px;">
                    <small style="color:var(--miniso-red); font-weight:bold;">${data.Category || ''}</small>
                    <h2 style="margin:5px 0;">${data.Name || ''}</h2>
                    
                    <div class="price-box">
                        <div class="price-item"><small>Regular</small><br><b style="color:var(--miniso-red)">Rp${(data["Regular Store Price"] || 0).toLocaleString()}</b></div>
                        <div class="price-item"><small>Street</small><br><b>Rp${(data["Street Store Price"] || 0).toLocaleString()}</b></div>
                    </div>

                    <div style="background:#f9f9f9; padding:15px; border-radius:12px; font-size:13px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>Promo Reg:</span> <b>${data["Regular Promo"] || '-'}</b></div>
                        <div style="display:flex; justify-content:space-between;"><span>Promo Street:</span> <b>${data["Street Store Promo"] || '-'}</b></div>
                    </div>

                    <div class="barcode-img-container">
                        <img src="${bcUrl}" style="max-width:100%" onerror="this.src='https://placehold.co/200x80?text=Barcode+Error'">
                        <div style="margin-top:10px; font-weight:bold; font-size:12px; word-break: break-all; letter-spacing:1px; color:#555;">
                            ${rawString}
                        </div>
                    </div>

                    <button onclick="back()" style="width:100%; padding:18px; background:var(--miniso-red); color:white; border:none; border-radius:15px; font-weight:bold; margin:20px 0;">KEMBALI</button>
                </div>
            `;
        }
    }

    function back() {
        detCont.style.display = "none";
        listCont.style.display = "block";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("scrollContainer").scrollTop = lastScroll;
    }

    document.getElementById("scanBtn").onclick = () => {
        if(scanning) { Quagga.stop(); scanning = false; document.getElementById("reader").style.display = "none"; }
        else {
            scanning = true;
            document.getElementById("reader").style.display = "block";
            Quagga.init({
                inputStream: { type: "LiveStream", target: document.getElementById("reader"), constraints: { facingMode: "environment" } },
                decoder: { readers: ["ean_reader", "code_128_reader"] }
            }, (err) => { if(!err) Quagga.start(); });
        }
    };

    Quagga.onDetected(res => {
        document.getElementById("beep").play();
        Quagga.stop(); scanning = false;
        document.getElementById("reader").style.display = "none";
        showDetail(res.codeResult.code);
    });

    window.onload = init;
</script>
</body>
</html>
