<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.json">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>F11 Miniso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW Registered!', reg))
        .catch(err => console.log('SW Registration Failed!', err));
    });
  }
</script>
    
    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; cursor: pointer; }
        
        /* State Standby */
        .standby-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #cbd5e1; z-index: -1; }
        .standby-msg h1 { font-size: 3rem; margin: 0; letter-spacing: -1px; }
        .standby-msg p { font-size: 1.2rem; margin: 5px 0; }

        .search-container { 
            position: fixed; 
            top: -5000px; 
            left: 0; 
        }

        /* Result Display */
        #result { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; }
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); animation: slideUp 0.3s ease-out; }
        
        .card-header { position: relative; width: 100%; height: 250px; background: #ffffff; }
        .card-header img { width: 100%; height: 100%; object-fit: contain; }
        
        .card-body { padding: 20px; }
        .category { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--primary); margin-bottom: 5px; letter-spacing: 1px; }
        .product-name { font-size: 1.4rem; color: #1e293b; margin: 0 0 10px 0; line-height: 1.2; }
        .barcode-text { font-family: monospace; background: #f1f5f9; padding: 2px 8px; border-radius: 4px; color: #64748b; font-size: 0.9rem; }

        .price-section { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .price-box { padding: 12px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; }
        .price-label { font-size: 0.7rem; color: #64748b; margin-bottom: 4px; text-transform: uppercase; }
        .price-value { font-size: 1.1rem; font-weight: 800; color: #1e293b; }
        
        .promo-banner { margin-top: 15px; padding: 12px; background: #fef2f2; border-left: 4px solid var(--danger); border-radius: 4px; }
        .promo-text { color: var(--danger); font-weight: bold; font-size: 0.9rem; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="standby-msg" id="standby">
        <h1>READY TO SCAN</h1>
        <p>Arahkan scanner ke barcode produk</p>
        <div id="status-db" style="font-size: 0.8rem; color: #94a3b8; margin-top: 20px;">Menghubungkan ke Database...</div>
    </div>

    <div class="search-container">
        <input id="searchInput" type="text" autocomplete="off" autofocus>
    </div>

    <div id="result"></div>

    <audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>
    <audio id="beepErr" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = 'https://uesupubktkxfjsylcwwr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const input = document.getElementById("searchInput");
const resultDiv = document.getElementById("result");
const standbyDiv = document.getElementById("standby");
const statusDb = document.getElementById("status-db");
const beepOk = document.getElementById("beepOk");
const beepErr = document.getElementById("beepErr");

// Cek Koneksi
async function checkConn() {
    const { error } = await supabaseClient.from('export').select('count', { count: 'exact', head: true });
    statusDb.innerText = error ? "Koneksi Bermasalah!" : "Database Online - MMS-X";
}
checkConn();

/* ================= SEARCH ================= */
// [OPTIMASI] Tambahan flag untuk mencegah double scan beruntun dari alat fisik
/* ================= SEARCH ================= */
let isSearching = false; 

async function search(q) {
    standbyDiv.style.opacity = "0.1";
    isSearching = true; 
    const cleanQuery = q.trim();

    try {
        // MENGGUNAKAN RPC UNTUK PEMANFAATAN CACHED EGRESS
        const { data, error } = await supabaseClient
            .rpc('get_product_cached', { search_term: cleanQuery });

        if (error) throw error;

        if (data && data.length > 0) {
            beepOk.play().catch(e => console.log("Audio play blocked"));
            render(data[0]);
        } else {
            throw new Error("Not Found");
        }
    } catch (err) {
        console.error("Detail Error Pencarian:", err); 
        beepErr.play().catch(e => console.log("Audio play blocked"));
        
        let pesanError = "Produk tidak ditemukan!";
        resultDiv.innerHTML = `<div style="text-align:center; color:white; background:#dc2626; padding:15px; border-radius:10px;">${pesanError}</div>`;
        
        // Kembalikan ke layar standby setelah 3 detik jika error
        setTimeout(() => { if(!input.value) resetUI(); }, 3000);
    } finally {
        isSearching = false; 
    }
}

function resetUI() {
    resultDiv.innerHTML = "";
    standbyDiv.style.opacity = "1";
}

/* ================= RENDER ================= */
function render(p) {
    const clean = (val) => (!val || val === "NORMAL PRICE" || val === "NORMAL") ? "" : val;

    const name = p.Name || p.name || "Produk Tanpa Nama";
    const barcode = p.Barcode || p.barcode || "N/A";
    const cat = p.Category || p.category || "-";
    const subCat = p["Detail Category"] || p.detail_category || "-";
    const img = p.Image || p.image || 'https://placehold.co/400x400?text=No+Image';
    
    const regPrice = p["Regular Store Price"] || p.regular_price || "0";
    const strPrice = p["Street Store Price"] || p.street_price || "0";
    
    const promoReg = clean(p["Regular Store Promo"]);
    const promoStr = clean(p["Street Store Promo"]);
    const extra = clean(p["Extra Promo"]);

    resultDiv.innerHTML = `
        <div class="card">
            <div class="card-header">
                <img src="${img}" onerror="this.src='https://placehold.co/400x400?text=Image+Not+Found'">
            </div>
            <div class="card-body">
                <div class="category">${cat} / ${subCat}</div>
                <h2 class="product-name">${name}</h2>
                <span class="barcode-text">${barcode}</span>

                <div class="price-section">
                    <div class="price-box">
                        <div class="price-label">Regular Price</div>
                        <div class="price-value">${regPrice}</div>
                        ${promoReg ? `<div class="promo-text" style="font-size:0.7rem;">${promoReg}</div>` : ""}
                    </div>
                    <div class="price-box" style="border-color: #bae6fd; background: #f0f9ff;">
                        <div class="price-label" style="color:#0369a1;">Street Price</div>
                        <div class="price-value" style="color:#0369a1;">${strPrice}</div>
                        ${promoStr ? `<div class="promo-text" style="font-size:0.7rem; color:#0369a1;">${promoStr}</div>` : ""}
                    </div>
                </div>

                ${extra ? `
                <div class="promo-banner">
                    <div class="price-label" style="color:var(--danger)">Special Promo</div>
                    <div class="promo-text">${extra}</div>
                </div>
                ` : ""}
            </div>
        </div>
    `;
}

/* ================= AGGRESSIVE FOCUS LOGIC ================= */

// Fungsi untuk memaksa fokus
const forceFocus = () => {
    input.focus();
};

// 1. Fokus saat halaman load
window.onload = forceFocus;

// 2. Klik DIMANAPUN di halaman akan melempar fokus ke input
// Ini mengatasi masalah jika scanner ter-unfocus
document.addEventListener('click', forceFocus);
document.addEventListener('touchstart', forceFocus);

// 3. Interval "Pencuri Fokus"
// Cek setiap 1 detik, kalau fokus hilang, rebut kembali
setInterval(() => {
    if (document.activeElement !== input) {
        console.log("Re-focusing scanner input...");
        forceFocus();
    }
}, 1000);

// 4. Input Handler
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        // [OPTIMASI] Jika masih proses fetch dari database, hiraukan pencetan Enter berikutnya
        if (isSearching) return; 

        const val = input.value.trim();
        if(val) search(val);
        input.value = "";
        
        // Jaga-jaga, paksa fokus lagi setelah enter
        setTimeout(forceFocus, 10);
    }
});

</script>
</body>
</html>
