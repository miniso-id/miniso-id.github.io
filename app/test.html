<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Fix</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js"></script>
    
    <style>
        :root { --miniso-red: #e61523; }
        body { margin: 0; font-family: sans-serif; }
        header { padding: 20px; border-bottom: 1px solid #eee; text-align: center; }
        #statusLabel { font-size: 12px; font-weight: bold; color: orange; margin-bottom: 10px; }
        
        #scannerContainer { 
            display: none; 
            width: 300px; height: 300px; 
            margin: 20px auto; 
            position: relative; 
            background: #000;
            border-radius: 20px;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .guide { 
            position: absolute; inset: 20%; 
            border: 2px solid var(--miniso-red); 
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); 
        }
        button { 
            padding: 10px 20px; background: var(--miniso-red); 
            color: white; border: none; border-radius: 8px; 
        }
    </style>
</head>
<body>

<header>
    <div id="statusLabel">MENGHUBUNGKAN KE AI...</div>
    <button id="scanBtn">BUKA SCANNER</button>
</header>

<div id="scannerContainer">
    <video id="webcam" playsinline muted></video>
    <div class="guide"></div>
</div>

<script>
    let barcodeDetector;
    let isScanning = false;

    // FUNGSI UTAMA: Load AI MediaPipe
    async function initializeAI() {
        const label = document.getElementById('statusLabel');
        try {
            // Memanggil library MediaPipe
            const vision = await tasksVision.FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            
            barcodeDetector = await tasksVision.BarcodeDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/barcode_detector/barcode_detector/float16/1/barcode_detector.tflite",
                    delegate: "GPU"
                },
                runningMode: "VIDEO"
            });

            label.innerText = "SCANNER SIAP ✅";
            label.style.color = "green";
        } catch (error) {
            label.innerText = "GAGAL MENGHUBUNGKAN ❌";
            label.style.color = "red";
            console.error("AI Error:", error);
            alert("Gagal memuat AI. Pastikan internet lancar dan gunakan HTTPS.");
        }
    }

    // Jalankan inisialisasi
    initializeAI();

    document.getElementById('scanBtn').onclick = async () => {
        if (!barcodeDetector) return alert("AI belum siap!");
        
        const container = document.getElementById('scannerContainer');
        const video = document.getElementById('webcam');

        if (isScanning) {
            stopCamera();
            container.style.display = 'none';
        } else {
            container.style.display = 'block';
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                isScanning = true;
                detectLoop();
            };
        }
    };

    function detectLoop() {
        if (!isScanning) return;
        const video = document.getElementById('webcam');
        
        if (video.readyState >= 2) {
            const detections = barcodeDetector.detectForVideo(video, performance.now());
            if (detections.barcodes.length > 0) {
                alert("Barcode: " + detections.barcodes[0].rawValue);
                stopCamera();
                return;
            }
        }
        requestAnimationFrame(detectLoop);
    }

    function stopCamera() {
        isScanning = false;
        const video = document.getElementById('webcam');
        if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
        document.getElementById('scannerContainer').style.display = 'none';
    }
</script>
</body>
</html>
