<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X (beta) - Premium UI</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-dark: #c10f1b;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --text-muted: #6c757d;
            --bg-gray: #f8f9fa;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --sidebar-width: 280px;
            --radius-lg: 16px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.12);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #ffffff; color: var(--text-dark); 
            height: 100vh; overflow: hidden; 
        }

        /* --- LOGIN SCREEN SMOOTH --- */
        #loginScreen {
            position: fixed; inset: 0; background: white; z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
            transition: transform 0.6s cubic-bezier(0.8, 0, 0.2, 1), opacity 0.4s;
        }
        .login-card { width: 100%; max-width: 350px; text-align: center; animation: fadeInScale 0.5s ease-out; }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .login-card h1 { color: var(--miniso-red); font-size: 2.8rem; margin-bottom: 0; font-weight: 900; letter-spacing: -1px; }
        .login-input {
            width: 100%; padding: 16px; margin-bottom: 12px; border: 1.5px solid #eee;
            border-radius: var(--radius-lg); outline: none; font-size: 16px; transition: all 0.3s;
            background: var(--bg-gray);
        }
        .login-input:focus { border-color: var(--miniso-red); background: white; box-shadow: 0 0 0 4px var(--miniso-soft); }
        .btn-login {
            width: 100%; padding: 16px; background: var(--miniso-red); color: white;
            border: none; border-radius: var(--radius-lg); font-size: 16px; font-weight: 800; cursor: pointer;
            box-shadow: 0 6px 20px rgba(230,21,35,0.25); transition: 0.3s;
        }
        .btn-login:active { transform: scale(0.98); background: var(--miniso-dark); }

        /* --- APP WRAPPER --- */
        #appContent { display: none; height: 100vh; width: 100%; flex-direction: column; }
        .app-wrapper { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* --- SIDEBAR REFINED --- */
        .sidebar {
            width: var(--sidebar-width); background-color: var(--miniso-red); color: #fff;
            display: flex; flex-direction: column; padding: 25px;
            z-index: 2000; flex-shrink: 0;
            transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: transform;
        }
        .sidebar h2 { font-size: 1.6rem; font-weight: 800; margin: 10px 0; }
        .user-tag { font-size: 13px; opacity: 0.8; margin-bottom: 30px; display: flex; align-items: center; gap: 8px; }
        .user-tag::before { content: ''; width: 8px; height: 8px; background: #4ade80; border-radius: 50%; }
        
        .sidebar a { 
            text-decoration: none; color: #fff; padding: 14px 18px; margin-bottom: 6px; 
            border-radius: 12px; display: block; font-weight: 600; font-size: 15px;
            transition: all 0.2s; 
        }
        .sidebar a:active { background: rgba(255,255,255,0.15); transform: translateX(5px); }
        .logout-btn { margin-top: auto; background: rgba(0,0,0,0.15) !important; text-align: center; }

        /* --- OVERLAY BLUR --- */
        #overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1500; 
            opacity: 0; visibility: hidden; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            transition: all 0.4s ease;
        }
        #overlay.active { opacity: 1; visibility: visible; }

        /* --- MAIN AREA & TOP BAR --- */
        .main-content { flex: 1; overflow-y: auto; position: relative; padding: 15px; scroll-behavior: smooth; }

        .top-bar-container { 
            background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 12px; border-radius: 20px; box-shadow: var(--shadow-sm); 
            margin-bottom: 15px; position: sticky; top: 0; z-index: 1100;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .top-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .menu-toggle { 
            background: white; color: var(--miniso-red); border: 1px solid #eee; 
            width: 44px; height: 44px; font-size: 22px; border-radius: 12px; cursor: pointer;
            box-shadow: var(--shadow-sm);
        }
        
        .search-container { position: relative; flex-grow: 1; }
        #searchInput { 
            width: 100%; height: 44px; padding: 0 45px 0 15px; font-size: 15px; 
            border: 1.5px solid #eee; border-radius: 12px; outline: none; 
            background: #f1f3f5; transition: 0.3s;
        }
        #searchInput:focus { background: white; border-color: var(--miniso-red); }
        
        #scanBtn { 
            background: var(--miniso-red); color: white; border: none; 
            width: 36px; height: 36px; border-radius: 10px; 
            position: absolute; right: 4px; top: 4px;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- LIST & CARD ANIMATIONS --- */
        .search-results-list { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .search-item { 
            background: white; padding: 12px; border-radius: 15px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm);
            border: 1px solid transparent; transition: 0.2s;
        }
        .search-item:active { transform: scale(0.98); border-color: var(--miniso-soft); }

        .thumb-img { 
            width: 60px; height: 60px; object-fit: contain; border-radius: 10px; 
            background: #f9f9f9; padding: 5px; flex-shrink: 0; 
        }

        /* --- PRODUCT DETAIL PREVIEW --- */
        .product-card { 
            background: white; border-radius: 24px; overflow: hidden; 
            box-shadow: var(--shadow-md); animation: cardIn 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }
        @keyframes cardIn { from { transform: translateY(100vh); } to { transform: translateY(0); } }

        .price-item { 
            background: #f8f9fa; padding: 15px; border-radius: 16px; 
            border-left: 4px solid var(--miniso-red);
        }
        .price-item.street { border-left-color: var(--text-dark); }

        .barcode-box { 
            background: #f1f3f5; padding: 20px; border-radius: 20px; 
            text-align: center; margin-top: 20px; border: 2px dashed #dee2e6;
        }

        /* --- SCANNER REFINED --- */
        #reader {
            display:none; width:100%; max-width:340px; aspect-ratio:1/1; 
            margin:15px auto; background:#000; border-radius:24px; 
            overflow:hidden; position:relative; border: 6px solid white;
            box-shadow: var(--shadow-md);
        }
        .focus-guide {
            position: absolute; inset: 20%; border: 2px solid white;
            border-radius: 20px; pointer-events: none; z-index: 2;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.5);
        }
        .focus-guide::after {
            content: ''; position: absolute; inset: -2px; 
            border: 4px solid var(--miniso-red); border-radius: 20px;
            animation: scanAnim 2s infinite;
        }
        @keyframes scanAnim { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        @media (max-width: 768px) {
            .sidebar { position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-card">
        <h1>MINISO</h1>
        <p style="color:var(--text-muted); margin-bottom:30px; font-size:14px; font-weight: 500;">MMS-X Product Checker v2.3</p>
        <input type="text" id="username" class="login-input" placeholder="Username" autocomplete="off">
        <input type="password" id="password" class="login-input" placeholder="Password">
        <button class="btn-login" onclick="handleLogin()">LOGIN KE SISTEM</button>
        <div id="loginError" style="color:var(--miniso-red); font-size:13px; margin-top:15px; font-weight:bold; display:none;">⚠️ Akun tidak ditemukan!</div>
    </div>
</div>

<div id="appContent">
    <div id="imagePopup" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:6000; align-items:center; justify-content:center;" onclick="this.style.display='none'">
        <img id="popupImg" style="max-width:90%; max-height:80%; border-radius:15px;" src="">
    </div>
    
    <div class="app-wrapper">
        <nav class="sidebar" id="sidebar">
            <h2>MMS-X</h2>
            <div id="userDisplay" class="user-tag"></div>
            <a href="#" style="background:rgba(255,255,255,0.15)">📸 Price Checker</a>
            <a href="#">📦 Stock Opname</a>
            <a href="#">📋 Report Harian</a>
            <a href="#" class="logout-btn" onclick="handleLogout()">KELUAR AKUN</a>
        </nav>
        <div id="overlay" onclick="toggleSidebar()"></div>

        <main class="main-content" id="scrollContainer">
            <div id="ui-controls">
                <div class="top-bar-container">
                    <div class="top-bar">
                        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                        <div class="search-container">
                            <input id="searchInput" placeholder="Mencari produk...">
                            <button id="scanBtn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2m-10 0H5a2 2 0 0 1-2-2v-2"></path></svg>
                            </button>
                        </div>
                    </div>
                    <select id="catFilter" style="width:100%; height:40px; border-radius:10px; border:1.5px solid #eee; background:#fff; font-size:13px; font-weight:700; color:var(--text-dark); padding: 0 10px;">
                        <option value="">Semua Kategori</option>
                    </select>
                </div>

                <div id="reader">
                    <div class="focus-guide"></div>
                    <div class="tap-hint">ARAHKAN BARCODE KE KOTAK</div>
                </div>
                
                <div id="cameraControl" style="display:none; margin-bottom:15px;">
                    <select id="videoSource" style="width:100%; padding:12px; border-radius:12px; border: 1px solid #ddd; font-weight:600;"></select>
                </div>

                <div id="countDisplay" style="font-size:12px; color:var(--text-muted); margin:0 5px 10px 5px; font-weight:600;"></div>
            </div>

            <div id="listContainer"></div>
            <div id="detailContainer" class="product-card"></div>
        </main>
    </div>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    // --- LOGIC TETAP SAMA NAMUN DENGAN PENYEMPURNAAN TRANSISI ---
    const USERS = {
        "admin": { pass: "miniso123", name: "Administrator" },
        "staff1": { pass: "mms001", name: "Rizky Ramadhan" }
    };

    function handleLogin() {
        const u = document.getElementById("username").value.toLowerCase().trim();
        const p = document.getElementById("password").value;
        const screen = document.getElementById("loginScreen");
        
        if(USERS[u] && USERS[u].pass === p) {
            screen.style.transform = "translateY(-100%)";
            screen.style.opacity = "0";
            setTimeout(() => {
                sessionStorage.setItem("isLoggedIn", "true");
                sessionStorage.setItem("activeUserName", USERS[u].name);
                location.reload(); 
            }, 500);
        } else {
            const err = document.getElementById("loginError");
            err.style.display = "block";
            err.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'}], {duration:100, iterations:3});
        }
    }

    function handleLogout() {
        document.getElementById("appContent").style.opacity = "0";
        setTimeout(() => { sessionStorage.clear(); location.reload(); }, 300);
    }

    let allProducts = [];
    let barcodeIndex = new Map();
    let lastScrollPos = 0;
    let scanning = false;

    const input = document.getElementById("searchInput");
    const catFilter = document.getElementById("catFilter");
    const listContainer = document.getElementById("listContainer");
    const detailContainer = document.getElementById("detailContainer");
    const scrollContainer = document.getElementById("scrollContainer");
    const reader = document.getElementById("reader");
    const videoSource = document.getElementById("videoSource");

    function initApp() {
        if(sessionStorage.getItem("isLoggedIn") !== "true") return;
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appContent").style.display = "flex";
        document.getElementById("userDisplay").textContent = sessionStorage.getItem("activeUserName");

        fetch("https://miniso-id.github.io/product/products.json").then(r => r.json()).then(data => {
            allProducts = data;
            const cats = new Set();
            data.forEach(p => { 
                if(p.b) p.b.split("/").forEach(c => barcodeIndex.set(c.trim(), p)); 
                if(p.c) cats.add(p.c);
            });
            Array.from(cats).sort().forEach(c => {
                const o = document.createElement("option"); o.value = c; o.textContent = c; catFilter.appendChild(o);
            });
            input.placeholder = "Ketik nama atau scan...";
        });
    }

    // Toggle Sidebar Halus
    function toggleSidebar() { 
        document.getElementById("sidebar").classList.toggle("active"); 
        document.getElementById("overlay").classList.toggle("active"); 
    }

    // Logic Scan & Search (Fitur Asli)
    document.getElementById("scanBtn").onclick = () => {
        if (scanning) { stopScan(); return; }
        startScan(localStorage.getItem('lastCameraId'));
    };

    async function startScan(deviceId = null) {
        scanning = true; reader.style.display = "block";
        Quagga.init({
            inputStream: {
                type: "LiveStream", target: reader,
                constraints: {
                    width: { ideal: 1920 }, height: { ideal: 1080 },
                    deviceId: deviceId ? { exact: deviceId } : undefined,
                    facingMode: deviceId ? undefined : "environment"
                },
                area: { top: "20%", right: "20%", left: "20%", bottom: "20%" }
            },
            decoder: { readers: ["ean_reader", "code_128_reader"] },
            locate: true
        }, (err) => {
            if (err) { stopScan(); return; }
            Quagga.start();
            document.getElementById("cameraControl").style.display = "block";
            updateCameraList();
        });
    }

    async function updateCameraList() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const backCameras = devices.filter(d => d.kind === 'videoinput' && !d.label.toLowerCase().includes("front"));
        videoSource.innerHTML = backCameras.map(d => `<option value="${d.deviceId}">${d.label || 'Kamera Belakang'}</option>`).join("");
    }

    function stopScan() { Quagga.stop(); scanning = false; reader.style.display = "none"; document.getElementById("cameraControl").style.display = "none"; }

    Quagga.onDetected(res => {
        const code = res.codeResult.code;
        if(barcodeIndex.has(code)) { 
            document.getElementById("beepOk").play().catch(()=>{}); 
            stopScan(); input.value = code; showDetail(barcodeIndex.get(code), code); 
        }
    });

    input.oninput = () => renderResults();
    catFilter.onchange = () => renderResults();

    function renderResults() {
        detailContainer.style.display = "none";
        listContainer.style.display = "block";
        document.getElementById("ui-controls").style.display = "block";
        const q = input.value.trim().toLowerCase();
        const selectedCat = catFilter.value;
        
        if(!q && !selectedCat) { listContainer.innerHTML = ""; return; }
        if(barcodeIndex.has(q)) { showDetail(barcodeIndex.get(q), q); return; }

        let filtered = allProducts;
        if(selectedCat) filtered = filtered.filter(p => p.c === selectedCat);
        if(q) filtered = filtered.filter(p => p.n && p.n.toLowerCase().includes(q));

        document.getElementById("countDisplay").textContent = `Ditemukan ${filtered.length} produk`;
        
        let html = '<div class="search-results-list">';
        filtered.slice(0, 30).forEach(p => {
            const b = p.b ? p.b.split("/")[0].trim() : "";
            html += `
                <div class="search-item" onclick="selectItem('${b}')">
                    <img class="thumb-img" src="${p.i || 'https://via.placeholder.com/150'}" onerror="this.src='https://via.placeholder.com/150';">
                    <div style="flex:1">
                        <span style="font-size:10px; font-weight:800; color:var(--miniso-red); text-transform:uppercase;">${p.c || ''}</span>
                        <span style="font-size:14px; font-weight:700; display:block; margin:2px 0;">${p.n}</span>
                        <span style="font-size:13px; font-weight:800; color:var(--text-dark);">Rp${(p.r || 0).toLocaleString('id-ID')}</span>
                    </div>
                </div>`;
        });
        listContainer.innerHTML = html + '</div>';
    }

    window.selectItem = (b) => {
        lastScrollPos = scrollContainer.scrollTop; 
        showDetail(barcodeIndex.get(b), b);
    };

    function showDetail(p, q) {
        listContainer.style.display = "none";
        document.getElementById("ui-controls").style.display = "none";
        detailContainer.style.display = "block";
        scrollContainer.scrollTop = 0;

        const barcodeApi = `https://bwipjs-api.metafloor.com/?bcid=ean13&text=${q}&scale=3&rotate=N&includetext`;
        const extraPromo = (p.e && p.e !== "NORMAL PRICE") ? `<div class="promo-badge">${p.e}</div>` : "";

        detailContainer.innerHTML = `
            <div class="image-box" style="text-align:center; padding:30px; background:#fff; position:relative;">
                ${extraPromo}
                <img src="${p.i || ''}" style="max-width:100%; max-height:250px;" onclick="openPopup('${p.i}')">
            </div>
            <div style="padding:25px; background:white; border-radius:30px 30px 0 0; margin-top:-20px; position:relative; box-shadow: 0 -10px 20px rgba(0,0,0,0.05);">
                <span style="color:var(--miniso-red); font-weight:800; font-size:12px; text-transform:uppercase;">${p.c || ''}</span>
                <h2 style="margin:8px 0 20px 0; font-size:20px; line-height:1.4;">${p.n}</h2>
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:25px;">
                    <div class="price-item"><small style="font-weight:700; color:#888;">HARGA REGULER</small><b style="font-size:18px; color:var(--miniso-red); display:block;">Rp${(p.r || 0).toLocaleString('id-ID')}</b></div>
                    <div class="price-item street"><small style="font-weight:700; color:#888;">HARGA STREET</small><b style="font-size:18px; display:block;">Rp${(p.s || 0).toLocaleString('id-ID')}</b></div>
                </div>

                <div style="background:#f8f9fa; padding:15px; border-radius:15px; margin-bottom:20px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:13px;">
                        <span style="color:#666;">Reg Promo:</span> <b style="color:var(--promo-blue);">${p.rp || '-'}</b>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:13px;">
                        <span style="color:#666;">Street Promo:</span> <b style="color:var(--promo-green);">${p.sp || '-'}</b>
                    </div>
                </div>

                <div class="barcode-box"><img src="${barcodeApi}" style="max-width:100%"><div style="font-weight:800; margin-top:10px; letter-spacing:2px;">${q}</div></div>
                
                <button onclick="backToPrev()" style="width:100%; margin-top:25px; padding:18px; border:none; background:var(--text-dark); border-radius:16px; font-weight:800; color:white; font-size:15px;">KEMBALI KE DAFTAR</button>
            </div>`;
    }

    window.backToPrev = () => {
        detailContainer.style.display = "none";
        listContainer.style.display = "block";
        document.getElementById("ui-controls").style.display = "block";
        setTimeout(() => { scrollContainer.scrollTo(0, lastScrollPos); }, 10);
    }

    function openPopup(src) { document.getElementById("popupImg").src = src; document.getElementById("imagePopup").style.display = "flex"; }

    window.onload = initApp;
</script>
</body>
</html>
