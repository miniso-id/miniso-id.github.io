<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Display Rak (Teachable Machine)</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 15px; }
    label { display: block; margin-top: 15px; }
    button { margin-top: 20px; padding: 12px 24px; background: #0070f3; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: 0.6; }
    #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; }
    #status { font-size: 0.9em; color: #555; }
  </style>
</head>
<body>
  <h2>Cek Display Rak Promo</h2>
  <label>Nama Toko / ID:</label>
  <input type="text" id="storeName" placeholder="Toko A">
  <label>Upload Foto Display:</label>
  <input type="file" id="photoInput" accept="image/*" capture="environment">
  <button id="submitBtn" onclick="submitCheck()">Cek Kepatuhan</button>
  <div id="result"></div>
  <div id="status">Memuat model...</div>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <!-- Teachable Machine Image Library -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

  <script>
    const MODEL_URL = './model/model.json'; // sesuaikan path di GitHub Pages
    let model;

    async function loadModel() {
      try {
        model = await tmImage.load(MODEL_URL);
        document.getElementById('status').textContent = 'Model siap.';
      } catch (err) {
        document.getElementById('status').textContent = 'Gagal memuat model: ' + err.message;
      }
    }

    async function submitCheck() {
      const storeName = document.getElementById('storeName').value.trim();
      const fileInput = document.getElementById('photoInput');
      const file = fileInput.files[0];
      const resultDiv = document.getElementById('result');
      const submitBtn = document.getElementById('submitBtn');

      if (!storeName || !file) {
        resultDiv.innerHTML = '<p style="color:red;">Isi nama toko dan pilih foto.</p>';
        return;
      }

      if (!model) {
        resultDiv.innerHTML = '<p style="color:red;">Model belum dimuat.</p>';
        return;
      }

      submitBtn.disabled = true;
      resultDiv.innerHTML = '<p>⏳ Mengecek...</p>';

      try {
        // Load gambar ke elemen Image
        const img = await loadImage(file);
        // Klasifikasi
        const predictions = await model.predict(img);
        // Cari kelas dengan probabilitas tertinggi
        const top = predictions.reduce((a, b) => a.probability > b.probability ? a : b);
        const className = top.className;
        const confidence = top.probability;

        // Sesuaikan dengan nama kelas Anda (misal "Lulus", "Tidak Lulus")
        let status = 'Lulus';
        if (className.includes('tidak') || className.includes('gagal')) {
          status = 'Tidak Lulus';
        }

        resultDiv.innerHTML = `
          <h3>Status: ${status === 'Lulus' ? '✅ Lulus' : '❌ Tidak Lulus'}</h3>
          <p>Kelas terdeteksi: ${className} (${(confidence * 100).toFixed(1)}%)</p>
        `;
      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
      } finally {
        submitBtn.disabled = false;
      }
    }

    function loadImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // Preload model
    window.addEventListener('load', loadModel);
  </script>
</body>
</html>
