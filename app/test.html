<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        body { opacity: 0; transition: opacity 0.2s ease-in; margin: 0; padding: 0; font-family: -apple-system, system-ui; background: #ffffff; height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }
        body.fade-in { opacity: 1; }
        .fade-out { opacity: 0 !important; transition: opacity 0.2s ease-out; }

        /* --- LOGIN --- */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg-gray); z-index: 20000; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; width: 90%; max-width: 350px; padding: 35px 25px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; }
        .btn-login { width: 100%; height: 50px; background: var(--miniso-red); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }

        /* --- SIDEBAR --- */
        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s; z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        /* --- HEADER & SCANNER --- */
        #ui-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px; border-bottom: 1px solid #eee; z-index: 1000; flex-shrink: 0; }
        .top-bar { display: flex; gap: 10px; align-items: center; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; }

        #catFilterContainer { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px 0; scrollbar-width: none; }
        .cat-chip { padding: 8px 16px; background: #f0f0f0; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; text-transform: uppercase; }
        .cat-chip.active { background: var(--miniso-red); color: white; }

        /* FIX: Scanner Box agar tidak terlalu dominan */
        #reader { display:none; width:100%; max-width:300px; aspect-ratio:1/1; margin:10px auto; background:#000; border-radius:16px; overflow:hidden; position:relative; border: 3px solid var(--miniso-red); }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        .ai-status-tag { position: absolute; top: 0; width: 100%; text-align: center; color: #fff; font-size: 10px; font-weight: 800; background: rgba(230, 21, 35, 0.8); padding: 4px 0; z-index: 5; }

        /* --- CONTENT --- */
        .main-content { flex: 1; overflow-y: auto; padding: 0 16px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px 0 100px 0; }
        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px; background: white; border-radius: 16px; border: 1px solid #f0f0f0; }
        .list-img-box { width: 65px; height: 65px; background: #f9f9f9; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
        .list-img-box img { width: 100%; height: 100%; object-fit: contain; }
        
        #detailContainer { display: none; padding: 20px 0 100px 0; }
        .floating-back { position: fixed; top: 30px; left: 20px; width: 45px; height: 45px; background: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 9999; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2 style="color:var(--miniso-red)">MMS-X</h2>
        <input type="text" id="username" placeholder="Username" style="width:100%; height:45px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd; padding:0 10px;">
        <input type="password" id="password" placeholder="Password" style="width:100%; height:45px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd; padding:0 10px;">
        <button class="btn-login" onclick="checkLogin()">LOGIN</button>
    </div>
</div>

<div id="sidebar" class="sidebar">
    <h3>MMS-X</h3>
    <a href="#" onclick="logout()">Logout</a>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="btnBackFloating" class="floating-back" onclick="back()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</div>

<div id="appContent" style="display:flex; height: 100vh; flex-direction: column;">
    <header id="ui-header">
        <div class="top-bar">
            <button onclick="toggleSidebar()" style="background:none; border:none;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
            <div class="search-container">
                <input id="searchInput" placeholder="Cari produk...">
                <button id="scanBtn"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="3"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path></svg></button>
            </div>
        </div>
        <div id="catFilterContainer">
            <div class="cat-chip active" onclick="filterCat('All', this)">All</div>
        </div>
        <div id="reader">
            <div class="ai-status-tag" id="aiStatus">AI SCANNER READY</div>
            <video id="videoElement" playsinline></video>
        </div>
        <div id="cameraControl" style="display:none;"><select id="videoSource" style="width:100%; margin-top:10px; padding:8px; border-radius:8px;"></select></div>
    </header>

    <main class="main-content" id="scrollContainer">
        <div id="listContainer"></div>
        <div id="detailContainer"></div>
    </main>
</div>

<audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const codeReader = new ZXing.BrowserMultiFormatReader();

    let scanning = false, aiActive = false, detector, timer;
    let currentCategory = 'All';

    document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("fade-in");
        if(localStorage.getItem('mms_auth') === 'true') document.getElementById('loginOverlay').style.display = 'none';
        search();
        initAI();
    });

    async function checkLogin() {
        // Simple mock login for speed
        localStorage.setItem('mms_auth', 'true');
        document.getElementById('loginOverlay').style.display = 'none';
    }

    function logout() { localStorage.clear(); location.reload(); }

    async function search() {
        const q = document.getElementById("searchInput").value.trim();
        const list = document.getElementById("listContainer");
        let query = _supabase.from('export').select('*');
        if (currentCategory !== 'All') query = query.eq('Category', currentCategory);
        if (q) query = query.or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`);
        
        let { data } = await query.limit(40);
        if(data) {
            list.innerHTML = data.map(p => `
                <div class="list-item" onclick="showDetail('${p.Barcode}')">
                    <div class="list-img-box"><img src="${p.Image || ''}" onerror="this.src='https://via.placeholder.com/100'"></div>
                    <div class="list-info">
                        <div style="font-size:9px; color:red; font-weight:800;">${p.Category}</div>
                        <div style="font-weight:700; font-size:14px;">${p.Name}</div>
                        <div style="font-size:11px; color:#888;">${p.Barcode}</div>
                    </div>
                </div>
            `).join('');
        }
    }

    /* --- SCANNER LOGIC --- */
    document.getElementById("scanBtn").onclick = () => { scanning ? stopScan() : startScan(); };

    async function startScan() {
        scanning = true; window.isScanning = true;
        document.getElementById("reader").style.display = "block";
        
        const devices = await codeReader.listVideoInputDevices();
        const selectedId = localStorage.getItem('preferredCameraId') || devices[0].deviceId;

        updateCameraList(devices, selectedId);

        codeReader.decodeFromVideoDevice(selectedId, 'videoElement', (result) => {
            if (result && scanning) {
                document.getElementById("beepOk").play();
                document.getElementById("searchInput").value = result.text;
                stopScan(); // OTOMATIS TUTUP KAMERA AGAR HASIL TERLIHAT
                search();
            }
        });
    }

    function stopScan() {
        codeReader.reset();
        scanning = false; window.isScanning = false;
        document.getElementById("reader").style.display = "none";
        document.getElementById("cameraControl").style.display = "none";
    }

    function updateCameraList(devices, currentId) {
        if (devices.length > 1) {
            const source = document.getElementById("videoSource");
            document.getElementById("cameraControl").style.display = "block";
            source.innerHTML = devices.map(d => `<option value="${d.deviceId}" ${d.deviceId === currentId ? 'selected' : ''}>${d.label}</option>`).join("");
            source.onchange = (e) => { 
                localStorage.setItem('preferredCameraId', e.target.value);
                stopScan(); startScan(); 
            };
        }
    }

    async function showDetail(barcode) {
        stopScan(); // Tutup kamera jika masih terbuka
        const { data: p } = await _supabase.from('export').select('*').ilike('Barcode', `%${barcode}%`).maybeSingle();
        if (!p) return;
        document.getElementById("listContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "none";
        document.getElementById("detailContainer").style.display = "block";
        document.getElementById("btnBackFloating").style.display = "flex";
        document.getElementById("detailContainer").innerHTML = `
            <div style="background:white; border-radius:20px; overflow:hidden; border:1px solid #eee;">
                <img src="${p.Image}" style="width:100%; height:280px; object-fit:contain; padding:20px;">
                <div style="padding:20px;">
                    <h2 style="margin:0;">${p.Name}</h2>
                    <p style="color:red; font-weight:bold;">Rp${parseInt(p["Regular Store Price"]).toLocaleString('id-ID')}</p>
                    <small>Barcode: ${p.Barcode}</small>
                </div>
            </div>`;
    }

    function back() {
        document.getElementById("detailContainer").style.display = "none";
        document.getElementById("ui-header").style.display = "block";
        document.getElementById("listContainer").style.display = "grid";
        document.getElementById("btnBackFloating").style.display = "none";
    }

    function filterCat(cat, el) {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentCategory = cat;
        search();
    }

    document.getElementById("searchInput").oninput = () => { clearTimeout(timer); timer = setTimeout(search, 400); };
    function toggleSidebar() { document.getElementById("sidebar").classList.toggle("active"); document.getElementById("overlay").style.display = document.getElementById("sidebar").classList.contains("active") ? "block" : "none"; }

    /* --- AI ENGINE --- */
    async function initAI() {
        try {
            detector = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            document.getElementById('aiStatus').innerText = "AI ACTIVE";
        } catch (e) { document.getElementById('aiStatus').innerText = "AI OFFLINE"; }
    }

    async function runAI() {
        if (!detector || !window.isScanning) { aiActive = false; return; }
        const video = document.getElementById('videoElement');
        if (video && video.readyState >= 2) {
            const predictions = await detector.detect(video);
            if (predictions.length > 0 && window.isScanning) {
                const best = predictions.filter(p => p.class !== 'person').sort((a,b) => b.score - a.score)[0];
                if (best && best.score > 0.6) {
                    document.getElementById("searchInput").value = best.class;
                    stopScan(); // OTOMATIS TUTUP KAMERA JIKA OBJEK DITEMUKAN
                    search();
                }
            }
        }
        if(window.isScanning) setTimeout(runAI, 2000);
    }

    const obs = new MutationObserver(() => {
        if (document.getElementById('reader').style.display === 'block' && !aiActive) {
            aiActive = true; runAI();
        }
    });
    obs.observe(document.getElementById('reader'), { attributes: true });

</script>
</body>
</html>
