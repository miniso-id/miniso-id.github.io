<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X AI Vision</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --ai-purple: #5856d6;
        }

        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #fff; opacity: 0; transition: opacity 0.2s; }
        body.fade-in { opacity: 1; }

        #ui-header { 
            background: white; padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px; 
            border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; 
        }
        .top-bar { display: flex; gap: 8px; align-items: center; }
        .search-container { position: relative; flex: 1; display: flex; gap: 6px; }
        
        #searchInput { 
            flex: 1; height: 46px; padding: 0 15px; border-radius: 14px; 
            border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px;
        }

        .btn-action {
            width: 44px; height: 44px; border-radius: 12px; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: white;
        }
        #scanBtn { background: var(--miniso-red); }
        #aiBtn { background: var(--ai-purple); position: relative; }
        
        /* Loading spinner kecil di tombol AI */
        .loader-ai { width: 12px; height: 12px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #reader { 
            display:none; width:100%; max-width:340px; aspect-ratio:1/1; 
            margin:15px auto; background:#000; border-radius:20px; 
            overflow:hidden; position:relative; border: 4px solid white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        #reader video { width: 100%; height: 100%; object-fit: cover; }
        
        .ai-badge {
            position: absolute; top: 12px; left: 12px; background: var(--ai-purple);
            color: white; padding: 4px 10px; border-radius: 8px; font-size: 11px;
            font-weight: 800; z-index: 10; letter-spacing: 0.5px;
        }

        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px; }
        .list-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #f9f9f9; border-radius: 14px; }
        .list-img { width: 60px; height: 60px; border-radius: 10px; object-fit: contain; background: white; border: 1px solid #eee; }
        .list-info { flex: 1; }
        .list-info h4 { margin: 0; font-size: 14px; color: #111; }
        .list-info p { margin: 2px 0 0 0; font-size: 11px; color: #888; }
    </style>
</head>
<body class="fade-in">

<header id="ui-header">
    <div class="top-bar">
        <div class="search-container">
            <input id="searchInput" placeholder="Cari barang atau gunakan AI...">
            <button id="scanBtn" class="btn-action">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            </button>
            <button id="aiBtn" class="btn-action">
                <span id="aiIcon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8M8 12h8"></path></svg></span>
                <div class="loader-ai" id="aiLoader"></div>
            </button>
        </div>
    </div>
    
    <div id="reader">
        <div id="aiLabel" class="ai-badge" style="display:none;">AI SCANNING...</div>
        <video id="videoElement" autoplay playsinline muted></video>
    </div>
</header>

<main id="listContainer"></main>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const codeReader = new ZXing.BrowserMultiFormatReader();
    let net = null; 
    let isAiScanning = false;
    let stream = null;

    // Load AI Model MobileNet
    async function initAI() {
        document.getElementById('aiLoader').style.display = 'block';
        document.getElementById('aiIcon').style.display = 'none';
        try {
            net = await mobilenet.load();
            console.log("AI Model Loaded");
        } catch (e) {
            console.error("AI Load Failed", e);
        }
        document.getElementById('aiLoader').style.display = 'none';
        document.getElementById('aiIcon').style.display = 'block';
    }
    initAI();

    // Event Klik Tombol AI
    document.getElementById('aiBtn').onclick = () => {
        if (isAiScanning) { stopScanning(); } 
        else { startAiVision(); }
    };

    // Event Klik Tombol Barcode
    document.getElementById('scanBtn').onclick = () => {
        stopScanning();
        // Fungsi barcode scanner ZXing kamu bisa dipanggil di sini
        alert("Barcode Scanner Aktif (ZXing)");
    };

    async function startAiVision() {
        if (!net) return alert("AI sedang loading, tunggu sebentar...");
        
        isAiScanning = true;
        document.getElementById('reader').style.display = 'block';
        document.getElementById('aiLabel').style.display = 'block';
        
        const video = document.getElementById('videoElement');
        stream = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment", width: 640, height: 640 } 
        });
        video.srcObject = stream;

        const loop = async () => {
            if (!isAiScanning) return;
            
            const predictions = await net.classify(video);
            if (predictions.length > 0) {
                const best = predictions[0];
                const label = best.className.split(',')[0];
                document.getElementById('aiLabel').innerText = "AI: " + label.toUpperCase();

                // Jika AI yakin > 65%, cari ke database
                if (best.probability > 0.65) {
                    searchDatabase(label);
                }
            }
            setTimeout(loop, 1000); // Scan setiap 1 detik agar tidak panas
        };
        loop();
    }

    async function searchDatabase(keyword) {
        // Cari nama barang yang mirip dengan hasil tebakan AI
        const { data } = await _supabase.from('export')
            .select('*')
            .ilike('Name', `%${keyword}%`)
            .limit(15);
        
        if (data && data.length > 0) {
            const list = document.getElementById('listContainer');
            list.innerHTML = data.map(p => `
                <div class="list-item">
                    <img class="list-img" src="${p.Image}" onerror="this.src='https://via.placeholder.com/60'">
                    <div class="list-info">
                        <h4>${p.Name}</h4>
                        <p>${p.Barcode} • ${p.Category}</p>
                    </div>
                </div>
            `).join('');
        }
    }

    function stopScanning() {
        isAiScanning = false;
        if (stream) {
            stream.getTracks().forEach(t => t.stop());
        }
        document.getElementById('reader').style.display = 'none';
        document.getElementById('aiLabel').style.display = 'none';
    }

    document.addEventListener("DOMContentLoaded", () => document.body.classList.add("fade-in"));
</script>

</body>
</html>
