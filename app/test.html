<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X Promo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --promo-blue: #007bff;
            --promo-green: #28a745;
            --bg-gray: #f4f4f4;
            --sidebar-width: 280px;
        }

        /* Animasi Masuk Halaman */
        body {
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }
        body.fade-in {
            opacity: 1;
        }
        .fade-out {
            opacity: 0 !important;
            transition: opacity 0.2s ease-out;
        }

        /* Kotak Fokus yang Lebih Responsif */
        .focus-guide {
            position: absolute;
            inset: 15%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            z-index: 2;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.5);
        }
        .focus-guide::before, .focus-guide::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            border: 4px solid var(--miniso-red);
        }
        .focus-guide::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
        .focus-guide::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }

        /* --- LOGIN OVERLAY --- */
        #loginOverlay {
            position: fixed; inset: 0; background: var(--bg-gray);
            z-index: 20000; display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: white; width: 90%; max-width: 350px; padding: 35px 25px;
            border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center;
        }
        .login-box h2 { color: var(--miniso-red); margin: 0 0 10px 0; font-weight: 800; font-size: 28px; }
        .login-box p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .login-box label { display: block; text-align: left; font-size: 11px; font-weight: 800; color: #999; margin: 0 0 5px 5px; text-transform: uppercase; }
        .login-box input, .login-box select {
            width: 100%; height: 48px; margin-bottom: 15px; padding: 0 15px;
            border-radius: 12px; border: 1.5px solid #eee; background: #f9f9f9; outline: none; font-size: 15px; transition: 0.3s;
        }
        .login-box input:focus { border-color: var(--miniso-red); background: white; }
        .btn-login {
            width: 100%; height: 50px; background: var(--miniso-red); color: white;
            border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
        .btn-login:active { transform: scale(0.98); }

        /* --- STYLE ASLI --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto;
            background: #ffffff; color: var(--text-dark);
            height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden;
        }

        .sidebar { width: var(--sidebar-width); background: var(--miniso-red); color: #fff; position: fixed; height: 100%; left: 0; top: 0; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9500; padding: 25px; }
        .sidebar.active { transform: translateX(0); }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 15px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; background: rgba(255,255,255,0.1); }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9000; display: none; backdrop-filter: blur(4px); }

        #ui-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px;
            border-bottom: 1px solid #eee;
            z-index: 1000;
            width: 100%;
            flex-shrink: 0;
        }
        .top-bar { display: flex; gap: 10px; align-items: center; max-width: 1200px; margin-inline: auto; width: 100%; }
        .search-container { position: relative; flex: 1; }
        #searchInput { width: 100%; height: 46px; padding: 0 50px 0 15px; border-radius: 14px; border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px; }
        #scanBtn { position: absolute; right: 6px; top: 6px; width: 38px; height: 34px; background: var(--miniso-red); color: white; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        #catFilterContainer { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px 0; scrollbar-width: none; width: 100%; }
        #catFilterContainer::-webkit-scrollbar { display: none; }
        .cat-chip { padding: 8px 16px; background: #f0f0f0; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; border: 1px solid transparent; transition: 0.2s; flex-shrink: 0; text-transform: uppercase; }
        .cat-chip.active { background: var(--miniso-red); color: white; }

        #reader {
            display:none; width:100%; max-width:340px; aspect-ratio:1/1;
            margin:15px auto; background:#000; border-radius:20px;
            overflow:hidden; position:relative; border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        #reader video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: crisp-edges;
        }
        .focus-guide { position: absolute; inset: 20%; border: 2.5px solid var(--miniso-red); border-radius: 15px; pointer-events: none; z-index: 2; box-shadow: 0 0 0 1000px rgba(0,0,0,0.4); }
        .tap-hint { position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 3; transition: all 0.3s ease; }
        .tap-hint.warn { color: #FFD600; font-size: 12px; }
        #cameraControl { display:none; text-align:center; margin-bottom: 20px; }

        .main-content { flex: 1; overflow-y: auto; overflow-x: hidden; width: 100%; padding: 0 16px; }
        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px 0 80px 0; width: 100%; }
        @media (min-width: 768px) { #listContainer { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; } }

        .list-item { display: flex; align-items: center; gap: 14px; padding: 12px; background: white; border-radius: 16px; border: 1px solid #f0f0f0; transition: 0.2s; cursor: pointer; width: 100%; min-width: 0; }
        .list-item:active { transform: scale(0.98); background: #fafafa; }
        .list-img-box { width: 70px; height: 70px; background: #f9f9f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid #f0f0f0; }
        .list-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .list-info { flex: 1; min-width: 0; }
        .list-cat { font-size: 10px; color: var(--miniso-red); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .list-name { font-weight: 700; font-size: 14px; color: #111; line-height: 1.4; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .list-bc { font-size: 11px; color: #888; word-break: break-all; line-height: 1.2; }

        #detailContainer { display: none; padding-top: 20px; padding-bottom: 80px; max-width: 700px; margin: 0 auto; width: 100%; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; width: 100%; animation: slideUp 0.3s ease-out; }
        .image-box { background: #fff; text-align: center; padding: 20px; position: relative; border-bottom: 1px solid #f5f5f5; }
        .image-box img { max-width: 100%; height: 300px; object-fit: contain; cursor: zoom-in; }
        .promo-badge { position: absolute; bottom: 15px; right: 15px; background: #ff9800; color: white; padding: 5px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; z-index: 10; }
        .p-info { padding: 24px; }
        .p-cat { font-size: 11px; font-weight: 800; color: var(--miniso-red); text-transform: uppercase; margin-bottom: 8px; display: block; }
        .p-title { font-size: 22px; font-weight: 800; margin: 0 0 10px 0; color: #000; line-height: 1.3; word-break: break-word; }
        .p-desc { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.6; word-break: break-word; }

        .price-comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .price-item { padding: 14px; border-radius: 14px; border-bottom: 4px solid #ddd; background: var(--bg-gray); }
        .price-item.reg { border-bottom-color: var(--miniso-red); background: var(--miniso-soft); }
        .price-item.str { border-bottom-color: var(--promo-green); }
        .price-label { font-size: 10px; font-weight: 800; color: #777; margin-bottom: 5px; text-transform: uppercase; display: block; }
        .price-val { font-size: 19px; font-weight: 800; color: #222; }
        .price-item.reg .price-val { color: var(--miniso-red); }

        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 24px; cursor: pointer; backdrop-filter: blur(12px); }
        #lightbox.active { display: flex; opacity: 1; }
        #lightbox img { max-width: 95%; max-height: 85vh; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); transform: scale(0.8) translateY(20px); transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #lightbox.active img { transform: scale(1) translateY(0); }

        .floating-back {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top));
            left: 16px;
            width: 44px; height: 44px;
            background: white;
            border-radius: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            z-index: 9999;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.06);
        }
        .floating-back:active { opacity: 0.7; transform: scale(0.95); }

        .login-back-btn {
            position: absolute;
            top: calc(env(safe-area-inset-top) + 16px);
            left: 16px;
            width: 44px; height: 44px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.06);
            z-index: 20001;
        }
        .login-back-btn:active { opacity: 0.7; transform: scale(0.95); }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Stock styles */
        .btn-stock {
            width: 100%; height: 48px; background: #111; color: white;
            border: none; border-radius: 14px; font-weight: 700; font-size: 14px;
            cursor: pointer; margin-top: 16px; display: flex; align-items: center;
            justify-content: center; gap: 8px; letter-spacing: 0.5px; transition: 0.2s;
        }
        .btn-stock:active { transform: scale(0.98); opacity: 0.85; }
        .btn-stock:disabled { background: #aaa; cursor: not-allowed; }
        #stockResult {
            margin-top: 14px; border-radius: 16px; overflow: hidden;
            border: 1px solid #eee; display: none; animation: slideUp 0.3s ease-out;
        }
        .stock-header {
            background: #111; color: white; padding: 12px 16px;
            font-size: 12px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;
        }
        .stock-header .store-badge { background: var(--miniso-red); padding: 2px 8px; border-radius: 6px; font-size: 11px; }
        .store-badge {
            background: var(--miniso-red); padding: 3px 10px; border-radius: 6px;
            font-size: 11px; font-weight: 800; color: white; display: inline-block;
        }
        .stock-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 16px; border-bottom: 1px solid #f0f0f0; background: white;
            font-size: 13px;
        }
        .stock-row:last-child { border-bottom: none; }
        .stock-sku { font-weight: 600; color: #333; flex: 1; min-width: 0; word-break: break-all; }
        .stock-name { font-size: 11px; color: #888; margin-top: 2px; }
        .stock-qty {
            font-weight: 800; font-size: 15px; min-width: 48px; text-align: right;
            padding: 4px 10px; border-radius: 8px; margin-left: 10px; flex-shrink: 0;
        }
        .stock-qty.ok { color: #16a34a; background: #dcfce7; }
        .stock-qty.low { color: #d97706; background: #fef3c7; }
        .stock-qty.empty { color: #dc2626; background: #fee2e2; }
        .stock-empty-msg { padding: 24px; text-align: center; color: #888; font-size: 13px; font-weight: 600; background: white; }
        .stock-loading { padding: 20px; text-align: center; color: #666; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 10px; background: white; }
        .mini-spin {
            width: 18px; height: 18px; border: 3px solid #eee;
            border-top-color: var(--miniso-red); border-radius: 50%;
            animation: spin 0.8s linear infinite; flex-shrink: 0;
        }
        .stock-error { padding: 16px; text-align: center; color: var(--miniso-red); font-size: 13px; font-weight: 700; background: #fff1f2; }
    </style>
</head>

<script>
// --- SISTEM CACHE (24 JAM) ---
const CACHE_EXPIRATION = 86400000;

function saveToLocalCache(barcode, data) {
    const cacheEntry = { timestamp: Date.now(), payload: data };
    localStorage.setItem(`cache_${barcode}`, JSON.stringify(cacheEntry));
}

function getLocalCache(barcode) {
    const rawData = localStorage.getItem(`cache_${barcode}`);
    if (!rawData) return null;
    const cacheEntry = JSON.parse(rawData);
    if ((Date.now() - cacheEntry.timestamp) > CACHE_EXPIRATION) {
        localStorage.removeItem(`cache_${barcode}`);
        return null;
    }
    return cacheEntry.payload;
}

async function loadMorePromos() {
    if (promoIsLoading || !promoHasMore) return;
    promoIsLoading = true;

    const indicator = document.getElementById('loadMoreIndicator');
    if (indicator) indicator.style.display = 'block';

    const q = document.getElementById('searchInput').value.trim();

    let query = _supabase
        .from('export')
        .select('Barcode, Name, Category, "Detail Category", Image, "Regular Store Promo", "Street Store Promo"');

    if (currentPromo === 'All') {
        // Tampilkan semua produk yang punya promo apapun (Regular ATAU Street)
        query = query.or(
            '"Regular Store Promo".not.is.null,"Street Store Promo".not.is.null'
        );
    } else if (currentPromoType === 'street') {
        // Filter khusus Street Store Promo
        query = query
            .not('"Street Store Promo"', 'is', null)
            .neq('"Street Store Promo"', '')
            .neq('"Street Store Promo"', 'NORMAL PRICE')
            .neq('"Street Store Promo"', 'NORMAL')
            .eq('"Street Store Promo"', currentPromo);
    } else {
        // Filter Regular Store Promo (default)
        query = query
            .not('"Regular Store Promo"', 'is', null)
            .neq('"Regular Store Promo"', '')
            .neq('"Regular Store Promo"', 'NORMAL PRICE')
            .neq('"Regular Store Promo"', 'NORMAL')
            .eq('"Regular Store Promo"', currentPromo);
    }

    // Filter teks pencarian
    if (q) {
        query = query.or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%,"Detail Category".ilike.%${q}%`);
    }

    query = query.range(promoOffset, promoOffset + PAGE_SIZE - 1);

    const { data, error } = await query;

    if (!error && data) {
        // Untuk mode "All", filter manual agar exclude NORMAL PRICE di kedua kolom
        const filtered = currentPromo === 'All'
            ? data.filter(p => {
                const reg = p["Regular Store Promo"];
                const str = p["Street Store Promo"];
                const isRegPromo = reg && reg !== '' && reg !== 'NORMAL PRICE' && reg !== 'NORMAL';
                const isStrPromo = str && str !== '' && str !== 'NORMAL PRICE' && str !== 'NORMAL';
                return isRegPromo || isStrPromo;
              })
            : data;

        if (data.length < PAGE_SIZE) promoHasMore = false;

        const list = document.getElementById('listContainer');
        const fragment = document.createDocumentFragment();

        filtered.forEach(p => {
            const regPromo = p["Regular Store Promo"];
            const strPromo = p["Street Store Promo"];
            const isRegPromo = regPromo && regPromo !== 'NORMAL PRICE' && regPromo !== 'NORMAL';
            const isStrPromo = strPromo && strPromo !== 'NORMAL PRICE' && strPromo !== 'NORMAL';

            // Badge promo: tampilkan sesuai yang relevan
            let badgesHtml = '';
            if (isRegPromo) {
                badgesHtml += `<span style="display:inline-block; background:#fff3cd; color:#856404; font-size:10px; font-weight:800; padding:2px 8px; border-radius:6px; text-transform:uppercase; margin-right:4px;">${regPromo}</span>`;
            }
            if (isStrPromo) {
                badgesHtml += `<span style="display:inline-block; background:#d4edda; color:#155724; font-size:10px; font-weight:800; padding:2px 8px; border-radius:6px; text-transform:uppercase;">🏪 ${strPromo}</span>`;
            }

            const div = document.createElement('div');
            div.innerHTML = `
                <div class="list-item" onclick="showDetail('${p.Barcode}')">
                    <div class="list-img-box" onclick="event.stopPropagation(); openLightbox('${p.Image}')">
                        <img src="${p.Image || ''}" onerror="this.src='https://placehold.co/150x150?text=MINISO'" loading="lazy">
                    </div>
                    <div class="list-info">
                        <div class="list-cat">${p.Category || 'GENERAL'}</div>
                        <div style="font-size: 10px; color: #888; margin-top: 1px; margin-bottom: 1px;">${p["Detail Category"] || ''}</div>
                        <div class="list-name">${p.Name}</div>
                        <div class="list-bc">${p.Barcode}</div>
                        <div style="margin-top:4px;">${badgesHtml}</div>
                    </div>
                </div>
            `;
            fragment.appendChild(div.firstElementChild);
        });

        list.appendChild(fragment);
        promoOffset += data.length;
    }

    promoIsLoading = false;
    const indicator2 = document.getElementById('loadMoreIndicator');
    if (indicator2) indicator2.style.display = 'none';
}

// ============================================================
// ADVANCED SCANNER
// ============================================================
const _canvas = document.getElementById('cropCanvas');
const _ctx = _canvas.getContext('2d', { willReadFrequently: true });
const _canvasWarp = document.createElement('canvas');
const _ctxWarp = _canvasWarp.getContext('2d', { willReadFrequently: true });

const nativeDetector = ('BarcodeDetector' in window)
    ? new BarcodeDetector({ formats: ['code_128', 'ean_13', 'ean_8', 'upc_a', 'upc_e'] })
    : null;

function applyContrastGrayscale(imageData, contrast = 60) {
    const d = imageData.data;
    const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
    for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        const v = Math.min(255, Math.max(0, factor * (gray - 128) + 128));
        d[i] = d[i+1] = d[i+2] = v;
    }
    return imageData;
}

function sobelEdges(imageData, w, h) {
    const src = imageData.data;
    const out = new Float32Array(w * h);
    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
            const tl = src[((y-1)*w+(x-1))*4], tm = src[((y-1)*w+x)*4], tr = src[((y-1)*w+(x+1))*4];
            const ml = src[(y*w+(x-1))*4], mr = src[(y*w+(x+1))*4];
            const bl = src[((y+1)*w+(x-1))*4], bm = src[((y+1)*w+x)*4], br = src[((y+1)*w+(x+1))*4];
            const gx = -tl - 2*ml - bl + tr + 2*mr + br;
            const gy = -tl - 2*tm - tr + bl + 2*bm + br;
            out[y * w + x] = Math.sqrt(gx*gx + gy*gy);
        }
    }
    return out;
}

function findBarcodeBounds(edges, w, h) {
    const threshold = 80;
    let minX = w, maxX = 0, minY = h, maxY = 0, found = false;
    const colDensity = new Float32Array(w);
    for (let x = 0; x < w; x++) {
        let sum = 0;
        for (let y = 0; y < h; y++) { if (edges[y * w + x] > threshold) sum++; }
        colDensity[x] = sum;
    }
    const avgDensity = colDensity.reduce((a, b) => a + b, 0) / w;
    const densityThreshold = avgDensity * 1.5;
    for (let x = 0; x < w; x++) {
        if (colDensity[x] > densityThreshold) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            found = true;
        }
    }
    if (!found || (maxX - minX) < 30) return null;
    for (let y = 0; y < h; y++) {
        for (let x = minX; x <= maxX; x++) {
            if (edges[y * w + x] > threshold) { if (y < minY) minY = y; if (y > maxY) maxY = y; }
        }
    }
    const pad = 15;
    return { x: Math.max(0, minX - pad), y: Math.max(0, minY - pad), w: Math.min(w, maxX - minX + pad * 2), h: Math.min(h, maxY - minY + pad * 2) };
}

function perspectiveCorrect(video, zoomFactor = 1.5) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const cropW = Math.floor(vw / zoomFactor), cropH = Math.floor(vh / zoomFactor);
    const cropX = Math.floor((vw - cropW) / 2), cropY = Math.floor((vh - cropH) / 2);
    const outW = 640, outH = Math.floor(outW * (cropH / cropW));
    _canvas.width = outW; _canvas.height = outH;
    _ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);
    let imageData = _ctx.getImageData(0, 0, outW, outH);
    applyContrastGrayscale(imageData, 50); _ctx.putImageData(imageData, 0, 0);
    imageData = _ctx.getImageData(0, 0, outW, outH);
    const edges = sobelEdges(imageData, outW, outH);
    const bounds = findBarcodeBounds(edges, outW, outH);
    if (!bounds || bounds.w < 40 || bounds.h < 10) {
        applyContrastGrayscale(imageData, 60); _ctx.putImageData(imageData, 0, 0);
        return _canvas;
    }
    const targetW = 500, targetH = Math.max(120, Math.floor(targetW * (bounds.h / bounds.w)));
    _canvasWarp.width = targetW; _canvasWarp.height = targetH;
    _ctxWarp.drawImage(_canvas, bounds.x, bounds.y, bounds.w, bounds.h, 0, 0, targetW, targetH);
    const warpData = _ctxWarp.getImageData(0, 0, targetW, targetH);
    applyContrastGrayscale(warpData, 70); _ctxWarp.putImageData(warpData, 0, 0);
    return _canvasWarp;
}

function preprocessFrame(video, zoomFactor = 1.5) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const cropW = Math.floor(vw / zoomFactor), cropH = Math.floor(vh / zoomFactor);
    const cropX = Math.floor((vw - cropW) / 2), cropY = Math.floor((vh - cropH) / 2);
    const outW = 640, outH = Math.floor(outW * (cropH / cropW));
    _canvas.width = outW; _canvas.height = outH;
    _ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);
    const imageData = _ctx.getImageData(0, 0, outW, outH);
    applyContrastGrayscale(imageData, 60); _ctx.putImageData(imageData, 0, 0);
    return _canvas;
}

function scanDigitArea(video) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const cropW = Math.floor(vw / 1.5), cropH = Math.floor(vh / 4);
    const cropX = Math.floor((vw - cropW) / 2), cropY = Math.floor(vh / 2);
    const outW = 640, outH = Math.floor(outW * (cropH / cropW));
    _canvas.width = outW; _canvas.height = outH;
    _ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);
    const imageData = _ctx.getImageData(0, 0, outW, outH);
    applyContrastGrayscale(imageData, 80); _ctx.putImageData(imageData, 0, 0);
    return _canvas;
}

async function scanNative(video) {
    if (!nativeDetector) return null;
    try {
        let barcodes = await nativeDetector.detect(video);
        if (barcodes.length > 0) return barcodes[0].rawValue;
        const processed = preprocessFrame(video, 1.5);
        if (processed) { barcodes = await nativeDetector.detect(processed); if (barcodes.length > 0) return barcodes[0].rawValue; }
        const warped = perspectiveCorrect(video, 1.5);
        if (warped) { barcodes = await nativeDetector.detect(warped); if (barcodes.length > 0) return barcodes[0].rawValue; }
        const digits = scanDigitArea(video);
        if (digits) { barcodes = await nativeDetector.detect(digits); if (barcodes.length > 0) return barcodes[0].rawValue; }
        return null;
    } catch (e) { return null; }
}

const _hints = new Map();
_hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
_hints.set(ZXing.DecodeHintType.TRY_HARDER, false);
_hints.set(ZXing.DecodeHintType.CHARACTER_SET, 'utf-8');
_hints.set(ZXing.DecodeHintType.PURE_BARCODE, false);
_hints.set(ZXing.DecodeHintType.ASSUME_GS1, true);
_hints.set(ZXing.DecodeHintType.ALSO_SUPPORT_CONVEX, true);
codeReader.hints = _hints;

const _hintsHard = new Map();
_hintsHard.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
_hintsHard.set(ZXing.DecodeHintType.TRY_HARDER, true);
_hintsHard.set(ZXing.DecodeHintType.CHARACTER_SET, 'utf-8');
_hintsHard.set(ZXing.DecodeHintType.PURE_BARCODE, false);
_hintsHard.set(ZXing.DecodeHintType.ASSUME_GS1, true);
const codeReaderHard = new ZXing.BrowserMultiFormatReader();
codeReaderHard.hints = _hintsHard;

async function scanZxingHard(video) {
    try {
        const processed = preprocessFrame(video, 1.5);
        if (processed) {
            const lum1 = new ZXing.HTMLCanvasElementLuminanceSource(processed);
            const result1 = codeReaderHard.decodeBitmap(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum1)));
            if (result1) return result1.text;
        }
        const warped = perspectiveCorrect(video, 1.5);
        if (warped) {
            const lum2 = new ZXing.HTMLCanvasElementLuminanceSource(warped);
            const result2 = codeReaderHard.decodeBitmap(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum2)));
            if (result2) return result2.text;
        }
        return null;
    } catch (e) { return null; }
}

document.getElementById("scanBtn").onclick = () => { scanning ? stopScan() : startScan(lastSelectedDeviceId); };

let _cachedDevices = null;

async function startScan(deviceId = null) {
    scanning = true; 
    document.getElementById("reader").style.display = "block";

    const tapHint = document.querySelector('.tap-hint');
    const HINT_DEFAULT = 'ARAHKAN BARCODE KE TENGAH KOTAK';
    const HINTS_STRUGGLE = [
        'Coba sisi kemasan yang lebih datar',
        'Hindari tepi yang melengkung',
        'Perkecil atau perbesar jarak',
        'Pastikan cahaya cukup',
    ];
    let hintIndex = 0, hintTimer = null;

    function resetHint() {
        if (tapHint) { tapHint.textContent = HINT_DEFAULT; tapHint.classList.remove('warn'); }
        clearInterval(hintTimer); hintTimer = null;
    }

    function startStruggleHints() {
        if (hintTimer) return;
        hintIndex = 0;
        hintTimer = setInterval(() => {
            if (!scanning) { clearInterval(hintTimer); return; }
            if (tapHint) { tapHint.textContent = HINTS_STRUGGLE[hintIndex % HINTS_STRUGGLE.length]; tapHint.classList.add('warn'); }
            hintIndex++;
        }, 2500);
    }

    let struggleTimeout = setTimeout(startStruggleHints, 4000);
    window._resetScanHint = () => { clearTimeout(struggleTimeout); resetHint(); };

    const constraints = {
        video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: 1280 }, height: { ideal: 720 },
            frameRate: { ideal: 30 }, facingMode: "environment",
            focusMode: { ideal: "continuous" }, whiteBalanceMode: { ideal: "continuous" }
        }
    };

    try {
        if (!_cachedDevices) {
            const videoDevices = await codeReader.listVideoInputDevices();
            _cachedDevices = videoDevices.filter(d => !d.label.toLowerCase().includes('front'));
        }
        const backCameras = _cachedDevices;
        let selectedId = deviceId || lastSelectedDeviceId || (backCameras.length > 0 ? backCameras[0].deviceId : null);
        updateCameraList(backCameras, selectedId);

        const useNative = !!nativeDetector;

        if (useNative) {
            let zxingThrottled = false;
            await codeReader.decodeFromConstraints(constraints, 'videoElement', (result, err) => {
                if (result && !isProcessingScan && !zxingThrottled) {
                    zxingThrottled = true;
                    setTimeout(() => { zxingThrottled = false; }, 1500);
                    onDetected(result.text);
                }
            });
        } else {
            await codeReader.decodeFromConstraints(constraints, 'videoElement', (result, err) => {
                if (result) onDetected(result.text);
            });
        }

        const videoTrack = document.getElementById('videoElement').srcObject.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        const advanced = {};
        if (capabilities.focusMode?.includes('continuous')) advanced.focusMode = 'continuous';
        if (capabilities.exposureMode?.includes('continuous')) advanced.exposureMode = 'continuous';
        if (Object.keys(advanced).length > 0) await videoTrack.applyConstraints({ advanced: [advanced] });

        if (useNative) {
            const NATIVE_INTERVAL = 100;
            const checkNative = async () => {
                if (!scanning) return;
                const nativeCode = await scanNative(videoElement);
                if (nativeCode && !isProcessingScan) {
                    onDetected(nativeCode);
                    setTimeout(checkNative, NATIVE_INTERVAL);
                    return;
                }
                if (!isProcessingScan) {
                    const hardCode = await scanZxingHard(videoElement);
                    if (hardCode && !isProcessingScan) onDetected(hardCode);
                }
                setTimeout(checkNative, NATIVE_INTERVAL);
            };
            checkNative();
        } else {
            const HARD_INTERVAL = 200;
            const checkHard = async () => {
                if (!scanning) return;
                if (!isProcessingScan) {
                    const hardCode = await scanZxingHard(videoElement);
                    if (hardCode && !isProcessingScan) onDetected(hardCode);
                }
                setTimeout(checkHard, HARD_INTERVAL);
            };
            checkHard();
        }

    } catch (err) {
        console.error("Gagal start scan:", err);
        if (deviceId) { codeReader.reset(); startScan(null); }
    }
}

let isProcessingScan = false;
const failedBarcodes = new Map();
const FAILED_COOLDOWN = 5000;
const SUPABASE_TIMEOUT = 3000;

async function queryWithTimeout(code) {
    return Promise.race([
        _supabase.from('export').select('*').eq('Barcode', code).maybeSingle(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), SUPABASE_TIMEOUT))
    ]);
}

async function onDetected(code) {
    const cachedData = getLocalCache(code);
    if (cachedData) {
        if (isProcessingScan) return;
        isProcessingScan = true;
        try {
            stopScan();
            if (window._resetScanHint) window._resetScanHint();
            document.getElementById("beepOk").play();
            document.getElementById("searchInput").blur();
            document.getElementById("searchInput").value = code;
            renderDetailView(cachedData);
        } finally { isProcessingScan = false; }
        return;
    }

    const failedAt = failedBarcodes.get(code);
    if (failedAt && (Date.now() - failedAt) < FAILED_COOLDOWN) return;
    if (isProcessingScan) return;
    isProcessingScan = true;

    try {
        const { data } = await queryWithTimeout(code);
        if (data) {
            saveToLocalCache(code, data);
            stopScan();
            if (window._resetScanHint) window._resetScanHint();
            document.getElementById("beepOk").play();
            document.getElementById("searchInput").blur();
            document.getElementById("searchInput").value = code;
            renderDetailView(data);
        } else {
            failedBarcodes.set(code, Date.now());
        }
    } catch (e) {
        failedBarcodes.set(code, Date.now());
    } finally { isProcessingScan = false; }
}

let stockAbortController = null;

async function checkStock(barcode) {
    const btn = document.getElementById('btnCekStock');
    const box = document.getElementById('stockResult');
    if (!btn || !box) return;

    if (stockAbortController) {
        stockAbortController.abort();
    }
    stockAbortController = new AbortController();

    const s = getStockTranslation();
    btn.disabled = true;
    btn.innerHTML = `<div class="mini-spin" style="border-top-color:white;"></div> ${s.fetching}`;
    box.style.display = 'block';
    box.innerHTML = `<div class="stock-loading"><div class="mini-spin"></div> ${s.loading}</div>`;

    try {
        const resp = await fetch(STOCK_PROXY_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${SUPABASE_KEY}`,
            },
            body: JSON.stringify({
                barCodeOrGoodsName: barcode,
                pageSize: 20,
                pageNum: 1,
                storeCode: getStoreCode(),
                brandCode: 30,
            }),
            signal: stockAbortController.signal,
        });

        const text = await resp.text();
        console.log('Stock proxy response:', text);

        if (!text || text.trim() === '') {
            box.innerHTML = `<div class="stock-empty-msg">📦 ${s.empty} <b>${getStoreCode()}</b>.</div>`;
            return;
        }

        const json = JSON.parse(text);
        renderStockResult(json, barcode, getStoreCode(), s);

    } catch (err) {
        if (err.name === 'AbortError') {
            console.log('Request stok dibatalkan');
            return;
        }
        console.error('Stock error:', err);
        box.innerHTML = `<div class="stock-error">⚠️ ${s.error}<br><small style="font-weight:400; color:#666;">${err.message}</small></div>`;
    } finally {
        if (stockAbortController?.signal.aborted === false) {
            btn.disabled = false;
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> ${s.refreshBtn}`;
        }
        stockAbortController = null;
    }

// ── AI Vision: session cache & debounce guard ──────────────────
const _aiCache = new Map();   // hash → {description, ts}
const AI_CACHE_TTL = 5 * 60 * 1000;  // 5 menit
let _aiCapturing = false;

// Hash ringan untuk deteksi duplikat gambar
function _quickHash(str) {
    // Sample 200 titik merata dari string base64
    const step = Math.max(1, Math.floor(str.length / 200));
    let h = 2166136261;
    for (let i = 0; i < str.length; i += step) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16);
}

document.getElementById('aiSearchBtn').onclick = async () => {

                // Resolusi lebih kecil — cukup untuk AI, hemat bandwidth
                width: { ideal: 640 },

            } 
        });

    } catch (err) {

async function captureAi() {
    // Debounce: cegah double-tap / spam
    if (_aiCapturing) return;
    _aiCapturing = true;

    showAiLoading("AI Sedang Memeriksa Barang...");
    
    const video = document.getElementById('aiVideo');
    const canvas = document.getElementById('aiCanvas');

    // Crop hanya area dalam viewfinder box (inset 20% dari setiap sisi)
    // Ini yang benar-benar dilihat pengguna = lebih fokus, payload lebih kecil
    const inset = 0.20;
    const srcX = Math.floor(video.videoWidth  * inset);
    const srcY = Math.floor(video.videoHeight * inset);
    const srcW = Math.floor(video.videoWidth  * (1 - inset * 2));
    const srcH = Math.floor(video.videoHeight * (1 - inset * 2));

    // Target max 320px — cukup untuk AI baca teks & kenali karakter,
    // token input ke model ~2.5x lebih sedikit vs 480px
    const MAX_PX = 320;
    const ratio  = Math.min(MAX_PX / srcW, MAX_PX / srcH, 1);
    canvas.width  = Math.round(srcW * ratio);
    canvas.height = Math.round(srcH * ratio);

    const ctx = canvas.getContext('2d');
    // imageSmoothingQuality 'high' agar teks tetap terbaca meski kecil
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, canvas.width, canvas.height);

    // JPEG 0.65 — teks masih jelas, file ~30% lebih kecil dari 0.75
    const base64 = canvas.toDataURL('image/jpeg', 0.65).split(',')[1];

    // Cek cache client-side dulu (hemat 1 API call jika foto sama)
    const hash = _quickHash(base64);
    const cached = _aiCache.get(hash);
    if (cached && (Date.now() - cached.ts) < AI_CACHE_TTL) {
        console.log("AI Cache hit, skip server call");
        document.getElementById("searchInput").value = cached.description;
        closeAi();
        search();
        hideAiLoading();
        _aiCapturing = false;
        return;
    }

    try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-vision`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify({ image: base64 })
        });

        if (!response.ok) throw new Error(`Server Error: ${response.status}`);

        const data = await response.json();
        const textDescription = data.description; 
        console.log("AI Mendeteksi:", textDescription);

        // Simpan ke cache client
        _aiCache.set(hash, { description: textDescription, ts: Date.now() });
        // Batasi ukuran cache
        if (_aiCache.size > 20) {
            _aiCache.delete(_aiCache.keys().next().value);
        }

        document.getElementById("searchInput").value = textDescription;
        closeAi();
        search();
        
    } catch (e) {
        console.error("Detail Error:", e);
        alert("Gagal menganalisis gambar. Pastikan koneksi internet stabil.");
    }
    hideAiLoading();
    _aiCapturing = false;
}

function showAiLoading(msg) {
    document.getElementById('aiStatus').innerText = msg;
    document.getElementById('aiLoading').style.display = 'flex';
}

function hideAiLoading() {
    document.getElementById('aiLoading').style.display = 'none';
}

function closeAi() {
    const video = document.getElementById('aiVideo');
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('aiOverlay').style.display = 'none';
}
</script>

<script>
(function() {
    async function checkActiveAndLogout() {
        const user = localStorage.getItem('mms_user');
        if (!user) {
            window.location.replace('index.html');
            return;
        }
        try {
            const { data, error } = await _supabase
                .from('users')
                .select('active')
                .eq('username', user)
                .maybeSingle();
            if (error || !data || data.active === false) {
                localStorage.removeItem('mms_auth');
                localStorage.removeItem('mms_role');
                localStorage.removeItem('mms_user');
                localStorage.removeItem('mmsx_auth');
                localStorage.removeItem('mmsx_role');
                alert('Sesi Anda telah berakhir. Silakan login kembali.');
                window.location.replace('index.html');
            }
        } catch (e) {
            console.warn('Gagal validasi status aktif:', e);
        }
    }
    window.addEventListener('load', checkActiveAndLogout);
})();
</script>
