<script>
// --- SISTEM CACHE MENGHEMAT EGRESS ---
const CACHE_EXPIRATION = 86400000;

function saveToLocalCache(barcode, data) {
    const cacheEntry = { timestamp: Date.now(), payload: data };
    localStorage.setItem(`cache_${barcode}`, JSON.stringify(cacheEntry));
}

function getLocalCache(barcode) {
    const rawData = localStorage.getItem(`cache_${barcode}`);
    if (!rawData) return null;
    const cacheEntry = JSON.parse(rawData);
    if ((Date.now() - cacheEntry.timestamp) > CACHE_EXPIRATION) {
        localStorage.removeItem(`cache_${barcode}`);
        return null;
    }
    return cacheEntry.payload;
}

// Variable global untuk OCR

let lastDetectedCode = "";
let lastDetectedAt = 0;


// Tambahkan fungsi pembantu ini
// BarcodeDetector dibuat SEKALI di luar loop agar tidak ada overhead tiap scan
const nativeDetector = ('BarcodeDetector' in window)
    ? new BarcodeDetector({ formats: ['code_128', 'ean_13', 'ean_8', 'upc_a', 'upc_e'] })
    : null;

// Canvas preprocessing — crop tengah + tingkatkan kontras + sharpen
const _canvas = document.getElementById('cropCanvas');
const _ctx = _canvas.getContext('2d', { willReadFrequently: true });
const _canvasWarp = document.createElement('canvas'); // Canvas kedua untuk perspective warp
const _ctxWarp = _canvasWarp.getContext('2d', { willReadFrequently: true });

// Grayscale + boost kontras pada ImageData
function applyContrastGrayscale(imageData, contrast = 60) {
    const d = imageData.data;
    const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
    for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        const v = Math.min(255, Math.max(0, factor * (gray - 128) + 128));
        d[i] = d[i+1] = d[i+2] = v;
    }
    return imageData;
}

// Sobel edge detection — kembalikan array grayscale edge strength
function sobelEdges(imageData, w, h) {
    const src = imageData.data;
    const out = new Float32Array(w * h);
    for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
            const idx = (y * w + x) * 4;
            const tl = src[((y-1)*w+(x-1))*4];
            const tm = src[((y-1)*w+x)*4];
            const tr = src[((y-1)*w+(x+1))*4];
            const ml = src[(y*w+(x-1))*4];
            const mr = src[(y*w+(x+1))*4];
            const bl = src[((y+1)*w+(x-1))*4];
            const bm = src[((y+1)*w+x)*4];
            const br = src[((y+1)*w+(x+1))*4];
            const gx = -tl - 2*ml - bl + tr + 2*mr + br;
            const gy = -tl - 2*tm - tr + bl + 2*bm + br;
            out[y * w + x] = Math.sqrt(gx*gx + gy*gy);
        }
    }
    return out;
}

// Cari bounding box area barcode berdasarkan konsentrasi edge vertikal
function findBarcodeBounds(edges, w, h) {
    const threshold = 80;
    let minX = w, maxX = 0, minY = h, maxY = 0;
    let found = false;

    // Scan kolom — barcode punya banyak edge vertikal berulang
    const colDensity = new Float32Array(w);
    for (let x = 0; x < w; x++) {
        let sum = 0;
        for (let y = 0; y < h; y++) {
            if (edges[y * w + x] > threshold) sum++;
        }
        colDensity[x] = sum;
    }

    // Temukan region dengan kolom-kolom yang dense (karakteristik barcode)
    const avgDensity = colDensity.reduce((a, b) => a + b, 0) / w;
    const densityThreshold = avgDensity * 1.5;

    for (let x = 0; x < w; x++) {
        if (colDensity[x] > densityThreshold) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            found = true;
        }
    }

    if (!found || (maxX - minX) < 30) return null;

    // Untuk Y, ambil area dengan edge di kolom yang terdeteksi
    for (let y = 0; y < h; y++) {
        for (let x = minX; x <= maxX; x++) {
            if (edges[y * w + x] > threshold) {
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;
            }
        }
    }

    // Tambah padding
    const pad = 15;
    return {
        x: Math.max(0, minX - pad),
        y: Math.max(0, minY - pad),
        w: Math.min(w, maxX - minX + pad * 2),
        h: Math.min(h, maxY - minY + pad * 2)
    };
}

// Perspective correction: crop + straighten area barcode
function perspectiveCorrect(video, zoomFactor = 1.5) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) return null;

    // Step 1: Crop tengah (zoom digital)
    const cropW = Math.floor(vw / zoomFactor);
    const cropH = Math.floor(vh / zoomFactor);
    const cropX = Math.floor((vw - cropW) / 2);
    const cropY = Math.floor((vh - cropH) / 2);

    const outW = 640;
    const outH = Math.floor(outW * (cropH / cropW));
    _canvas.width = outW;
    _canvas.height = outH;
    _ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

    // Step 2: Grayscale + kontras untuk edge detection
    let imageData = _ctx.getImageData(0, 0, outW, outH);
    applyContrastGrayscale(imageData, 50);
    _ctx.putImageData(imageData, 0, 0);

    // Step 3: Deteksi tepi Sobel
    imageData = _ctx.getImageData(0, 0, outW, outH);
    const edges = sobelEdges(imageData, outW, outH);

    // Step 4: Temukan bounding box barcode
    const bounds = findBarcodeBounds(edges, outW, outH);

    if (!bounds || bounds.w < 40 || bounds.h < 10) {
        // Tidak ketemu region barcode — kembalikan full frame yang sudah diproses
        applyContrastGrayscale(imageData, 60);
        _ctx.putImageData(imageData, 0, 0);
        return _canvas;
    }

    // Step 5: Crop ke area barcode saja dan stretch ke canvas baru
    // Ini efeknya "meluruskan" area barcode walau ada sedikit distorsi perspektif
    const targetW = 500;
    const targetH = Math.max(120, Math.floor(targetW * (bounds.h / bounds.w)));
    _canvasWarp.width = targetW;
    _canvasWarp.height = targetH;

    _ctxWarp.drawImage(_canvas,
        bounds.x, bounds.y, bounds.w, bounds.h,
        0, 0, targetW, targetH
    );

    // Step 6: Boost kontras lagi pada hasil crop
    const warpData = _ctxWarp.getImageData(0, 0, targetW, targetH);
    applyContrastGrayscale(warpData, 70);
    _ctxWarp.putImageData(warpData, 0, 0);

    return _canvasWarp;
}

function preprocessFrame(video, zoomFactor = 1.5) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) return null;
    const cropW = Math.floor(vw / zoomFactor);
    const cropH = Math.floor(vh / zoomFactor);
    const cropX = Math.floor((vw - cropW) / 2);
    const cropY = Math.floor((vh - cropH) / 2);
    const outW = 640;
    const outH = Math.floor(outW * (cropH / cropW));
    _canvas.width = outW;
    _canvas.height = outH;
    _ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);
    const imageData = _ctx.getImageData(0, 0, outW, outH);
    applyContrastGrayscale(imageData, 60);
    _ctx.putImageData(imageData, 0, 0);
    return _canvas;
}

async function scanNative(video) {
    if (!nativeDetector) return null;
    try {
        // Layer 1: Langsung dari video (tercepat)
        let barcodes = await nativeDetector.detect(video);
        if (barcodes.length > 0) return barcodes[0].rawValue;

        // Layer 2: Dari canvas preprocessed biasa
        const processed = preprocessFrame(video, 1.5);
        if (processed) {
            barcodes = await nativeDetector.detect(processed);
            if (barcodes.length > 0) return barcodes[0].rawValue;
        }

        // Layer 3: Dari canvas perspective corrected
        const warped = perspectiveCorrect(video, 1.5);
        if (warped) {
            barcodes = await nativeDetector.detect(warped);
            if (barcodes.length > 0) return barcodes[0].rawValue;
        }

        // Layer 4: Crop area bawah frame — zona angka di bawah barcode
        const digits = scanDigitArea(video);
        if (digits) {
            barcodes = await nativeDetector.detect(digits);
            if (barcodes.length > 0) return barcodes[0].rawValue;
        }

        return null;
    } catch (e) {
        return null;
    }
}

// Crop zona angka di bawah barcode — area sepertiga bawah frame, zoom 2x, kontras tinggi
function scanDigitArea(video) {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) return null;

    // Ambil sepertiga bawah dari tengah frame (zona angka barcode)
    const cropW = Math.floor(vw / 1.5);
    const cropH = Math.floor(vh / 4);         // Hanya sepertiga bawah
    const cropX = Math.floor((vw - cropW) / 2);
    const cropY = Math.floor(vh / 2);          // Mulai dari tengah ke bawah

    const outW = 640;
    const outH = Math.floor(outW * (cropH / cropW));
    _canvas.width = outW;
    _canvas.height = outH;
    _ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, outW, outH);

    // Kontras sangat tinggi untuk angka hitam di background putih
    const imageData = _ctx.getImageData(0, 0, outW, outH);
    applyContrastGrayscale(imageData, 80);
    _ctx.putImageData(imageData, 0, 0);

    return _canvas;
}



// Hints & constraints dibuat SEKALI sebagai konstanta — tidak perlu rebuild tiap startScan
const _hints = new Map();
_hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E
]);
_hints.set(ZXing.DecodeHintType.TRY_HARDER, false);
_hints.set(ZXing.DecodeHintType.CHARACTER_SET, 'utf-8');
_hints.set(ZXing.DecodeHintType.PURE_BARCODE, false);
_hints.set(ZXing.DecodeHintType.ASSUME_GS1, true);
_hints.set(ZXing.DecodeHintType.ALSO_SUPPORT_CONVEX, true);
codeReader.hints = _hints;

// ZXing khusus untuk barcode sulit — TRY_HARDER aktif, decode dari canvas preprocessed
const _hintsHard = new Map();
_hintsHard.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13,
    ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.CODE_128,
    ZXing.BarcodeFormat.UPC_A,
    ZXing.BarcodeFormat.UPC_E
]);
_hintsHard.set(ZXing.DecodeHintType.TRY_HARDER, true);
_hintsHard.set(ZXing.DecodeHintType.CHARACTER_SET, 'utf-8');
_hintsHard.set(ZXing.DecodeHintType.PURE_BARCODE, false);
_hintsHard.set(ZXing.DecodeHintType.ASSUME_GS1, true);
const codeReaderHard = new ZXing.BrowserMultiFormatReader();
codeReaderHard.hints = _hintsHard;

// Decode ZXing dari canvas preprocessed (untuk barcode sulit/melengkung)
async function scanZxingHard(video) {
    try {
        // Coba preprocessed biasa dulu
        const processed = preprocessFrame(video, 1.5);
        if (processed) {
            const lum1 = new ZXing.HTMLCanvasElementLuminanceSource(processed);
            const result1 = codeReaderHard.decodeBitmap(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum1)));
            if (result1) return result1.text;
        }

        // Coba perspective corrected
        const warped = perspectiveCorrect(video, 1.5);
        if (warped) {
            const lum2 = new ZXing.HTMLCanvasElementLuminanceSource(warped);
            const result2 = codeReaderHard.decodeBitmap(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum2)));
            if (result2) return result2.text;
        }

        return null;
    } catch (e) {
        return null;
    }
}

let _cachedDevices = null; // Cache device list agar tidak query ulang tiap startScan

async function startScan(deviceId = null) {
    scanning = true; 
    document.getElementById("reader").style.display = "block";

    // Reset hint ke default
    const tapHint = document.querySelector('.tap-hint');
    const HINT_DEFAULT = 'POINT BARCODE HERE • TAP TO FOCUS';
    const HINTS_STRUGGLE = [
        'Try a flatter side of the package',
        'Avoid curved edges',
        'Move closer or further',
        'Better lighting helps',
    ];
    let hintIndex = 0;
    let hintTimer = null;

    function resetHint() {
        if (tapHint) { tapHint.textContent = HINT_DEFAULT; tapHint.classList.remove('warn'); }
        clearInterval(hintTimer);
        hintTimer = null;
    }

    function startStruggleHints() {
        if (hintTimer) return; // Sudah jalan
        hintIndex = 0;
        hintTimer = setInterval(() => {
            if (!scanning) { clearInterval(hintTimer); return; }
            if (tapHint) {
                tapHint.textContent = HINTS_STRUGGLE[hintIndex % HINTS_STRUGGLE.length];
                tapHint.classList.add('warn');
            }
            hintIndex++;
        }, 2500); // Ganti hint tiap 2.5 detik
    }

    // Mulai hint struggle setelah 4 detik tidak terbaca
    let struggleTimeout = setTimeout(startStruggleHints, 4000);

    // Patch onDetected untuk reset hint saat berhasil
    const _origOnDetected = onDetected;
    window._resetScanHint = () => {
        clearTimeout(struggleTimeout);
        resetHint();
    };

    const constraints = {
        video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30 },
            facingMode: "environment",
            focusMode: { ideal: "continuous" },
            whiteBalanceMode: { ideal: "continuous" }
        }
    };

    try {
        // Gunakan cache device list jika sudah ada
        if (!_cachedDevices) {
            const videoDevices = await codeReader.listVideoInputDevices();
            _cachedDevices = videoDevices.filter(d => !d.label.toLowerCase().includes('front'));
        }
        const backCameras = _cachedDevices;
        let selectedId = deviceId || lastSelectedDeviceId || (backCameras.length > 0 ? backCameras[0].deviceId : null);
        
        updateCameraList(backCameras, selectedId);

        const useNative = !!nativeDetector;

        if (useNative) {
            let zxingThrottled = false;
            await codeReader.decodeFromConstraints(constraints, 'videoElement', (result, err) => {
                if (result && !isProcessingScan && !zxingThrottled) {
                    zxingThrottled = true;
                    setTimeout(() => { zxingThrottled = false; }, 1500);
                    onDetected(result.text);
                }
            });
        } else {
            await codeReader.decodeFromConstraints(constraints, 'videoElement', (result, err) => {
                if (result) onDetected(result.text);
            });
        }

        // Maksimalkan Hardware Focus & Exposure
        const videoTrack = document.getElementById('videoElement').srcObject.getVideoTracks()[0];
        const capabilities = videoTrack.getCapabilities();
        const advanced = {};
        if (capabilities.focusMode?.includes('continuous')) advanced.focusMode = 'continuous';
        if (capabilities.exposureMode?.includes('continuous')) advanced.exposureMode = 'continuous';
        if (Object.keys(advanced).length > 0) await videoTrack.applyConstraints({ advanced: [advanced] });

        // Loop Native — pakai setTimeout bukan rAF agar tidak terikat 60fps
        if (useNative) {
            const NATIVE_INTERVAL = 100;
            const checkNative = async () => {
                if (!scanning) return;

                // Layer 1: Native langsung dari video (tercepat)
                const nativeCode = await scanNative(videoElement);
                if (nativeCode && !isProcessingScan) {
                    onDetected(nativeCode);
                    setTimeout(checkNative, NATIVE_INTERVAL);
                    return;
                }

                // Layer 2: ZXing TRY_HARDER dari canvas preprocessed (untuk barcode sulit)
                if (!isProcessingScan) {
                    const hardCode = await scanZxingHard(videoElement);
                    if (hardCode && !isProcessingScan) {
                        onDetected(hardCode);
                    }
                }

                setTimeout(checkNative, NATIVE_INTERVAL);
            };
            checkNative();
        } else {
            // Tanpa Native: ZXing loop internal + ZXing Hard sebagai lapisan kedua
            const HARD_INTERVAL = 200;
            const checkHard = async () => {
                if (!scanning) return;
                if (!isProcessingScan) {
                    const hardCode = await scanZxingHard(videoElement);
                    if (hardCode && !isProcessingScan) onDetected(hardCode);
                }
                setTimeout(checkHard, HARD_INTERVAL);
            };
            checkHard();
        }

    } catch (err) {
        console.error("Gagal start scan:", err);
        if (deviceId) { codeReader.reset(); startScan(null); }
    }
}
    
function updateCameraList(devices, currentId) {
    const source = document.getElementById("videoSource");
    const control = document.getElementById("cameraControl");
    
    if (devices.length <= 1) {
        control.style.display = "none";
    } else {
        control.style.display = "block";
        source.innerHTML = devices.map(d => 
            `<option value="${d.deviceId}" ${d.deviceId === currentId ? 'selected' : ''}>${d.label || 'Kamera'}</option>`
        ).join("");
    }
}

document.getElementById("videoSource").onchange = (e) => { 
    lastSelectedDeviceId = e.target.value; 
    localStorage.setItem('preferredCameraId', lastSelectedDeviceId);
    _cachedDevices = null; // Reset cache saat user ganti kamera manual
    stopScan(); 
    startScan(lastSelectedDeviceId); 
};

document.getElementById("reader").onclick = async () => {
    const videoTrack = document.getElementById('videoElement').srcObject?.getVideoTracks()[0];
    if (videoTrack) {
        try {
            const capabilities = videoTrack.getCapabilities();
            if (capabilities.focusMode) {
                await videoTrack.applyConstraints({
                    advanced: [{ focusMode: 'continuous' }]
                });
                console.log("Fokus dipicu ulang");
            }
        } catch (e) {
            console.warn("Fokus manual tidak didukung pada perangkat ini.");
        }
    }
};

function stopScan() { 
    codeReader.reset(); 
    scanning = false; 
    document.getElementById("reader").style.display = "none"; 
    document.getElementById("cameraControl").style.display = "none";
    // Reset hint state
    const tapHint = document.querySelector('.tap-hint');
    if (tapHint) { tapHint.textContent = 'POINT BARCODE HERE • TAP TO FOCUS'; tapHint.classList.remove('warn'); }
    if (window._resetScanHint) window._resetScanHint();
}

let isProcessingScan = false;
const failedBarcodes = new Map();
const FAILED_COOLDOWN = 5000;
const SUPABASE_TIMEOUT = 3000;

async function queryWithTimeout(code) {
    return Promise.race([
        _supabase.from('export').select('*').ilike('Barcode', `%${code}%`).maybeSingle(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), SUPABASE_TIMEOUT))
    ]);
}

async function onDetected(code) {
    // Cek cache SEBELUM lock — paling cepat, tidak perlu tunggu apapun
    const cachedData = getLocalCache(code);
    if (cachedData) {
        if (isProcessingScan) return;
        isProcessingScan = true;
        try {
            stopScan();
            renderDetailView(cachedData); // Langsung render, tidak perlu query lagi
            document.getElementById("beepOk").play();
            document.getElementById("searchInput").blur();
            document.getElementById("searchInput").value = code;
        } finally {
            isProcessingScan = false;
        }
        return;
    }

    // Cek cooldown barcode yang sudah terbukti tidak ada di DB
    const failedAt = failedBarcodes.get(code);
    if (failedAt && (Date.now() - failedAt) < FAILED_COOLDOWN) return;

    if (isProcessingScan) return;
    isProcessingScan = true;

    try {
        const { data } = await queryWithTimeout(code);
        if (data) {
            saveToLocalCache(code, data);
            stopScan();
            renderDetailView(data); // Langsung render dari data yang baru diambil
            document.getElementById("beepOk").play();
            document.getElementById("searchInput").blur();
            document.getElementById("searchInput").value = code;
        } else {
            failedBarcodes.set(code, Date.now());
        }
    } catch (e) {
        failedBarcodes.set(code, Date.now());
    } finally {
        isProcessingScan = false;
    }
}

function renderDetailView(p) {
    document.getElementById("listContainer").style.display = "none";
    document.getElementById("ui-header").style.display = "none";
    const regPrice = cleanPrice(p["Regular Store Price"]);
    const strPrice = cleanPrice(p["Street Store Price"]);
    const promoText = (p["Extra Promo"] || "").trim();
    const discountLabel = (promoText !== "" && promoText !== "NORMAL PRICE" && p["Regular Store Promo"] !== "NORMAL") 
        ? `<div class="promo-badge">${promoText}</div>` 
        : "";
        
    const det = document.getElementById("detailContainer");
    det.innerHTML = `
        <div class="product-card">
            <div class="image-box">
                ${discountLabel}
                <img src="${p.Image || ''}" onerror="this.src='https://placehold.co/150x150?text=MINISO'" onclick="openLightbox('${p.Image || ''}')">
            </div>
            <div class="p-info">
                <span class="p-cat">${p.Category || 'GENERAL'}</span>
                <span style="display: block; font-size: 10px; color: #888; margin-top: 1px; margin-bottom: 1px;">
        ${p["Detail Category"] || ''}
    </span>
                <h3 class="p-title">${p.Name}</h3>
                <p class="p-desc">${p.Description || ''}</p>
                <div class="price-comparison-grid">
                    <div class="price-item reg">
                        <span class="price-label">Regular Store</span>
                        <span class="price-val">Rp${regPrice.toLocaleString('id-ID')}</span>
                    </div>
                    <div class="price-item str">
                        <span class="price-label">Street Store</span>
                        <span class="price-val">Rp${strPrice.toLocaleString('id-ID')}</span>
                    </div>
                </div>
                <div style="border-top: 1px solid #eee; padding-top: 20px;">
                    <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
                        <span style="color:#888; font-weight:600;">BARCODE</span><span style="font-weight:700; word-break:break-all; text-align:right; max-width:60%;">${p.Barcode}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:10px;">
                        <span style="color:#888; font-weight:600;">REG PROMO</span><span style="font-weight:700; color:var(--promo-blue)">${p["Regular Store Promo"] || '-'}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:12px;">
                        <span style="color:#888; font-weight:600;">STR PROMO</span><span style="font-weight:700; color:var(--promo-green)">${p["Street Store Promo"] || '-'}</span>
                    </div>
                </div>
            </div>
        </div>
    `;
    det.style.display = "block";
    det.classList.add('active');
    document.getElementById("btnBackFloating").style.display = "flex";
    document.getElementById("scrollContainer").scrollTo(0, 0);
}

async function showDetail(fullBarcode) {
    lastScroll = document.getElementById("scrollContainer").scrollTop;
    
    // Cek cache dulu — tidak perlu query jika sudah ada
    let p = getLocalCache(fullBarcode);
    
    if (!p) {
        const { data, error } = await _supabase.rpc('get_product_by_barcode', { 
            target_barcode: fullBarcode 
        });
        if (error || !data || data.length === 0) return;
        p = data[0];
        saveToLocalCache(fullBarcode, p);
    }
    
    renderDetailView(p);
}

function back() {
    document.getElementById("detailContainer").style.display = "none";
    document.getElementById("ui-header").style.display = "block";
    document.getElementById("listContainer").style.display = "grid";
    document.getElementById("btnBackFloating").style.display = "none";
    
    document.getElementById("searchInput").value = "";
    
    document.getElementById("scrollContainer").scrollTop = lastScroll;
    
    startScan(lastSelectedDeviceId);
}

// Jalankan scan otomatis saat startup
startScan(lastSelectedDeviceId);
