<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X (No Login)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --miniso-soft: #fff1f2;
            --text-dark: #1a1a1a;
            --bg-gray: #f4f4f4;
        }

        body { 
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            background: white; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* HEADER & SEARCH */
        header { 
            padding: calc(20px + env(safe-area-inset-top)) 16px 10px; 
            border-bottom: 1px solid #eee; 
            background: white; 
            z-index: 100; 
        }
        .top-bar { display: flex; gap: 10px; align-items: center; }
        .search-container { position: relative; flex: 1; }
        #searchInput { 
            width: 100%; height: 44px; border-radius: 12px; 
            border: 1px solid #ddd; background: #f5f5f7; 
            padding: 0 45px 0 12px; outline: none; box-sizing: border-box; 
        }
        #scanBtn { 
            position: absolute; right: 5px; top: 5px; 
            width: 34px; height: 34px; background: var(--miniso-red); 
            color: white; border: none; border-radius: 8px; 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }
        
        #statusLabel { 
            font-size: 10px; text-align: center; margin-top: 5px; 
            font-weight: bold; color: #999; text-transform: uppercase; 
        }

        /* SCANNER AREA */
        #scannerContainer { 
            display: none; width: 92%; max-width: 350px; aspect-ratio: 1/1; 
            margin: 15px auto; background: #000; border-radius: 20px; 
            overflow: hidden; position: relative; border: 4px solid white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        #videoElement { width: 100%; height: 100%; object-fit: cover; }
        .scanner-guide { 
            position: absolute; inset: 20%; border: 2px solid var(--miniso-red); 
            border-radius: 15px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); pointer-events: none; 
        }
        #cameraSelect { 
            width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px; 
            border: 1px solid #ddd; font-size: 12px; display: none; 
        }

        /* CONTENT AREA */
        .main-content { flex: 1; overflow-y: auto; padding: 10px 16px 80px; }
        .list-item { 
            display: flex; align-items: center; gap: 12px; padding: 12px; 
            border-bottom: 1px solid #eee; cursor: pointer;
        }
        .list-img { width: 50px; height: 50px; border-radius: 8px; object-fit: contain; background: #f9f9f9; }

        #detailContainer { display: none; padding-bottom: 50px; }
        .back-btn { 
            padding: 8px 16px; background: #eee; border-radius: 8px; 
            font-weight: bold; display: inline-block; margin-bottom: 15px; cursor: pointer; 
        }

        /* DETAIL CARD STYLING */
        .product-card { text-align: center; }
        .image-box img { width: 100%; max-width: 300px; border-radius: 20px; }
        .price-val { color: var(--miniso-red); font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="search-container">
            <input id="searchInput" placeholder="Cari barcode atau nama...">
            <button id="scanBtn">📸</button>
        </div>
    </div>
    <div id="statusLabel">Menghubungkan AI...</div>
    <select id="cameraSelect"></select>

    <div id="scannerContainer">
        <video id="videoElement" playsinline muted></video>
        <div class="scanner-guide"></div>
    </div>
</header>

<main class="main-content">
    <div id="listContainer"></div>
    <div id="detailContainer"></div>
</main>

<audio id="beep" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let barcodeDetector;
    let isScanning = false;
    let isLocked = false;
    let currentStream = null;

    // 1. Setup MediaPipe
    async function initAI() {
        const status = document.getElementById('statusLabel');
        try {
            const vision = await tasksVision.FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            barcodeDetector = await tasksVision.BarcodeDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/barcode_detector/barcode_detector/float16/1/barcode_detector.tflite",
                    delegate: "GPU"
                },
                runningMode: "VIDEO"
            });
            status.innerText = "Scanner Siap ✅";
            status.style.color = "green";
            loadCameras();
        } catch (e) {
            status.innerText = "Error: Gunakan HTTPS ❌";
            console.error(e);
        }
    }

    // 2. Load Daftar Kamera & Simpan Pilihan (Request 22-02)
    async function loadCameras() {
        const select = document.getElementById('cameraSelect');
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            
            if (videoDevices.length > 0) {
                select.style.display = 'block';
                select.innerHTML = videoDevices.map(d => `<option value="${d.deviceId}">${d.label || 'Kamera '+d.deviceId.slice(0,4)}</option>`).join('');
                
                const savedCam = localStorage.getItem('lastCamId');
                if (savedCam) select.value = savedCam;

                select.onchange = () => {
                    localStorage.setItem('lastCamId', select.value);
                    if (isScanning) startScan(select.value);
                };
            }
        } catch (e) { console.error("Gagal load kamera", e); }
    }

    // 3. Logika Scanner
    document.getElementById('scanBtn').onclick = () => isScanning ? stopScan() : startScan(document.getElementById('cameraSelect').value);

    async function startScan(deviceId) {
        isScanning = true;
        isLocked = false;
        document.getElementById('scannerContainer').style.display = 'block';
        document.getElementById('detailContainer').style.display = 'none';
        document.getElementById('listContainer').style.display = 'block';
        const video = document.getElementById('videoElement');

        if (currentStream) currentStream.getTracks().forEach(t => t.stop());

        try {
            currentStream = await navigator.mediaDevices.getUserMedia({
                video: { deviceId: deviceId ? { exact: deviceId } : undefined, facingMode: deviceId ? undefined : "environment" }
            });
            video.srcObject = currentStream;
            video.onloadedmetadata = () => {
                video.play();
                draw();
            };
        } catch (e) {
            alert("Kamera diblokir!");
            stopScan();
        }
    }

    function draw() {
        if (!isScanning) return;
        const video = document.getElementById('videoElement');
        if (video.readyState >= 2 && !isLocked) {
            const results = barcodeDetector.detectForVideo(video, performance.now());
            if (results.barcodes.length > 0) {
                isLocked = true;
                processBarcode(results.barcodes[0].rawValue);
            }
        }
        requestAnimationFrame(draw);
    }

    async function processBarcode(code) {
        const { data } = await _supabase.from('export').select('*').ilike('Barcode', `%${code}%`).maybeSingle();
        if (data) {
            document.getElementById('beep').play();
            if (navigator.vibrate) navigator.vibrate(100);
            stopScan();
            showDetail(data);
        } else {
            // Jika tidak ada di DB, tunggu 1.5 detik lalu scan lagi
            setTimeout(() => { isLocked = false; }, 1500);
        }
    }

    function stopScan() {
        isScanning = false;
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        document.getElementById('scannerContainer').style.display = 'none';
    }

    // 4. UI Rendering
    function showDetail(p) {
        document.getElementById('listContainer').style.display = 'none';
        const det = document.getElementById('detailContainer');
        det.style.display = 'block';
        det.innerHTML = `
            <div class="back-btn" onclick="location.reload()">← Kembali</div>
            <div class="product-card">
                <div class="image-box"><img src="${p.Image || ''}"></div>
                <h2>${p.Name}</h2>
                <div class="price-val">Rp${parseInt(p["Regular Store Price"] || 0).toLocaleString()}</div>
                <p style="color:#888; margin-top:10px;">Barcode: ${p.Barcode}</p>
            </div>
        `;
    }

    // Search Manual
    document.getElementById('searchInput').oninput = async (e) => {
        const q = e.target.value;
        if (q.length < 3) return;
        const { data } = await _supabase.from('export').select('*').or(`Name.ilike.%${q}%,Barcode.ilike.%${q}%`).limit(10);
        if (data) {
            document.getElementById('listContainer').innerHTML = data.map(p => `
                <div class="list-item" onclick="showDetail(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                    <img class="list-img" src="${p.Image}">
                    <div><b>${p.Name}</b><br><small>${p.Barcode}</small></div>
                </div>
            `).join('');
        }
    };

    window.onload = initAI;
</script>
</body>
</html>
