<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MMS-X AI Vision</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    
    <style>
        :root {
            --miniso-red: #e61523;
            --ai-purple: #5856d6;
            --bg-gray: #f4f4f4;
        }

        body { margin: 0; font-family: -apple-system, sans-serif; background: #fff; }

        #ui-header { 
            background: white; padding: calc(20px + env(safe-area-inset-top)) 16px 12px 16px; 
            border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 1000; 
        }
        .top-bar { display: flex; gap: 8px; align-items: center; }
        .search-container { position: relative; flex: 1; display: flex; gap: 6px; }
        
        #searchInput { 
            flex: 1; height: 46px; padding: 0 15px; border-radius: 14px; 
            border: 1.5px solid #eee; background: #f2f2f7; outline: none; font-size: 15px;
        }

        .btn-action {
            width: 44px; height: 44px; border-radius: 12px; border: none;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: white;
        }
        #scanBtn { background: var(--miniso-red); }
        #aiBtn { background: var(--ai-purple); position: relative; }
        
        #reader { 
            display:none; width:100%; max-width:340px; aspect-ratio:1/1; 
            margin:15px auto; background:#000; border-radius:20px; 
            overflow:hidden; position:relative; border: 4px solid white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        #reader video { width: 100%; height: 100%; object-fit: cover; }
        
        .ai-badge {
            position: absolute; top: 12px; left: 12px; background: var(--ai-purple);
            color: white; padding: 4px 10px; border-radius: 8px; font-size: 11px;
            font-weight: 800; z-index: 10;
        }

        #listContainer { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 16px; }
        .list-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: #f9f9f9; border-radius: 14px; border: 1px solid #eee; }
        .list-img { width: 60px; height: 60px; border-radius: 10px; object-fit: contain; background: white; }
    </style>
</head>
<body>

<header id="ui-header">
    <div class="top-bar">
        <div class="search-container">
            <input id="searchInput" placeholder="Cari barang atau gunakan AI...">
            <button id="scanBtn" class="btn-action">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"></path><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            </button>
            <button id="aiBtn" class="btn-action">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8M8 12h8"></path></svg>
            </button>
        </div>
    </div>
    
    <div id="reader">
        <div id="aiLabel" class="ai-badge" style="display:none;">AI LOADING...</div>
        <video id="videoElement" autoplay playsinline muted></video>
    </div>
</header>

<main id="listContainer"></main>

<script>
    const SUPABASE_URL = "https://uesupubktkxfjsylcwwr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let net = null; 
    let isAiScanning = false;
    let stream = null;
    // Mengambil kamera terakhir yang dipilih pengguna sesuai instruksi simpanan [cite: 2026-02-22]
    let lastSelectedDeviceId = localStorage.getItem('preferredCameraId'); 

    // 1. Fungsi Memuat AI dengan Indikator Status
    async function initAI() {
        const labelEl = document.getElementById('aiLabel');
        try {
            console.log("Loading MobileNet...");
            net = await mobilenet.load();
            console.log("AI Model Loaded!");
            if(labelEl) labelEl.innerText = "AI READY";
        } catch (e) {
            console.error("AI Load Failed", e);
            if(labelEl) labelEl.innerText = "AI ERROR";
        }
    }
    initAI();

    // 2. Logika Utama AI Vision
    async function startAiVision() {
        if (!net) return alert("AI sedang mendownload data (sekitar 3MB), tunggu sebentar...");
        
        const video = document.getElementById('videoElement');
        const labelEl = document.getElementById('aiLabel');
        
        isAiScanning = true;
        document.getElementById('reader').style.display = 'block';
        labelEl.style.display = 'block';
        labelEl.innerText = "MENCARI BENDA...";

        try {
            // Gunakan deviceId terakhir jika ada
            const constraints = { 
                video: { 
                    deviceId: lastSelectedDeviceId ? { exact: lastSelectedDeviceId } : undefined,
                    facingMode: "environment" 
                } 
            };
            
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;

            // Memastikan video benar-benar berputar sebelum AI mulai bekerja
            video.onloadedmetadata = () => {
                video.play();
                runAiInference();
            };

        } catch (e) {
            alert("Kamera Error: " + e.message);
            stopScanning();
        }
    }

    // 3. Fungsi Deteksi (Inference) yang Berulang
    async function runAiInference() {
        const video = document.getElementById('videoElement');
        const labelEl = document.getElementById('aiLabel');

        if (!isAiScanning || !video) return;

        try {
            // Analisis gambar dari video
            const predictions = await net.classify(video);
            
            if (predictions.length > 0) {
                const topResult = predictions[0];
                const itemName = topResult.className.split(',')[0]; // Ambil nama utama
                
                labelEl.innerText = `AI: ${itemName.toUpperCase()} (${(topResult.probability * 100).toFixed(0)}%)`;

                // Jika AI yakin di atas 60%, langsung cari di database
                if (topResult.probability > 0.60) {
                    searchDatabase(itemName);
                }
            }
        } catch (err) {
            console.error("Inference error:", err);
        }

        // Ulangi setiap 1 detik agar tidak memberatkan processor
        setTimeout(runAiInference, 1000);
    }

    async function searchDatabase(keyword) {
        // Logika pencarian ke tabel Supabase 'export'
        const { data } = await _supabase.from('export')
            .select('*')
            .ilike('Name', `%${keyword}%`) // Mencari nama yang mirip
            .limit(10);
        
        if (data && data.length > 0) {
            renderResults(data);
        }
    }

    function renderResults(data) {
        const container = document.getElementById('listContainer');
        container.innerHTML = data.map(p => `
            <div class="list-item" onclick="showDetail('${p.Barcode}')">
                <div class="list-img-box"><img src="${p.Image || ''}"></div>
                <div class="list-info">
                    <div class="list-name">${p.Name}</div>
                    <div class="list-bc">${p.Barcode}</div>
                </div>
            </div>
        `).join('');
    }

    function stopScanning() {
        isAiScanning = false;
        if (stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('reader').style.display = 'none';
    }

    // Pasang event ke tombol AI
    document.getElementById('aiBtn').onclick = () => {
        if (isAiScanning) stopScanning();
        else startAiVision();
    };
</script>
</body>
</html>
