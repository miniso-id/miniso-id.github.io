<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F11 Miniso - Landscape Optimized</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #2563eb; 
            --danger: #dc2626; 
            --bg: #0f172a; /* Gelap agar kontras di layar industri */
            --card-bg: #ffffff;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 0;
            width: 800px; 
            height: 480px; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            cursor: none; /* Sembunyikan kursor jika pakai touchscreen/scanner */
        }

        /* Standby State */
        .standby-msg { 
            text-align: center; 
            color: #475569; 
            transition: opacity 0.3s;
        }
        .standby-msg h1 { font-size: 3.5rem; margin: 0; color: #f8fafc; }
        .standby-msg p { font-size: 1.2rem; margin-top: 10px; }

        /* Container Utama */
        #result { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            padding: 15px; 
            box-sizing: border-box; 
        }

        .card { 
            display: flex; 
            width: 100%; 
            background: var(--card-bg); 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.2s ease-out;
        }

        /* Bagian Kiri: Gambar */
        .card-header { 
            flex: 0 0 320px; /* Lebar tetap untuk gambar */
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px solid #f1f5f9;
        }
        .card-header img { 
            max-width: 90%; 
            max-height: 90%; 
            object-fit: contain; 
        }

        /* Bagian Kanan: Info */
        .card-body { 
            flex: 1; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
        }

        .category { 
            font-size: 0.8rem; 
            font-weight: 700; 
            color: var(--primary); 
            text-transform: uppercase; 
            margin-bottom: 4px;
        }

        .product-name { 
            font-size: 1.8rem; 
            color: #1e293b; 
            margin: 0 0 8px 0; 
            line-height: 1.1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .barcode-text { 
            display: inline-block;
            font-family: monospace; 
            background: #f1f5f9; 
            padding: 4px 10px; 
            border-radius: 6px; 
            color: #64748b; 
            font-size: 1rem;
            margin-bottom: 15px;
        }

        /* Harga Horizontal */
        .price-section { 
            display: flex; 
            gap: 12px; 
        }
        .price-box { 
            flex: 1;
            padding: 12px; 
            border-radius: 12px; 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
        }
        .price-label { font-size: 0.75rem; color: #64748b; font-weight: 600; margin-bottom: 2px; }
        .price-value { font-size: 1.6rem; font-weight: 800; color: #1e293b; }

        .promo-text { color: var(--danger); font-weight: 700; font-size: 0.85rem; margin-top: 4px; }

        /* Promo Banner di bawah harga */
        .promo-banner { 
            margin-top: 12px; 
            padding: 10px 15px; 
            background: #fef2f2; 
            border-left: 5px solid var(--danger); 
            border-radius: 8px; 
        }

        .search-container { position: absolute; left: -9999px; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="standby-msg" id="standby">
        <h1>READY</h1>
        <p>Scan barcode produk sekarang</p>
        <div id="status-db" style="font-size: 0.9rem; color: #64748b; margin-top: 15px;">Connecting...</div>
    </div>

    <div class="search-container">
        <input id="searchInput" type="text" autocomplete="off" autofocus>
    </div>

    <div id="result"></div>

    <audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>
    <audio id="beepErr" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
const SUPABASE_URL = 'https://uesupubktkxfjsylcwwr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const input = document.getElementById("searchInput");
const resultDiv = document.getElementById("result");
const standbyDiv = document.getElementById("standby");
const statusDb = document.getElementById("status-db");
const beepOk = document.getElementById("beepOk");
const beepErr = document.getElementById("beepErr");

let isSearching = false;

async function checkConn() {
    try {
        const { error } = await supabaseClient.from('export').select('count', { count: 'exact', head: true });
        statusDb.innerText = error ? "OFFLINE" : "DATABASE READY";
        statusDb.style.color = error ? "#ef4444" : "#22c55e";
    } catch(e) { statusDb.innerText = "CONN ERROR"; }
}
checkConn();

async function search(q) {
    if (isSearching) return;
    isSearching = true;
    
    try {
        const { data, error } = await supabaseClient.rpc('get_product_cached', { search_term: q.trim() });
        if (error || !data || data.length === 0) throw new Error("Not Found");

        beepOk.play().catch(() => {});
        render(data[0]);
        standbyDiv.style.display = "none";
    } catch (err) {
        beepErr.play().catch(() => {});
        showError();
    } finally {
        isSearching = false;
    }
}

function showError() {
    resultDiv.innerHTML = `<div style="margin:auto; color:white; background:#dc2626; padding:20px; border-radius:15px; font-size:1.5xl; font-weight:bold;">PRODUK TIDAK DITEMUKAN</div>`;
    setTimeout(resetUI, 2000);
}

function resetUI() {
    resultDiv.innerHTML = "";
    standbyDiv.style.display = "block";
    input.focus();
}

function render(p) {
    const clean = (val) => (!val || val === "NORMAL PRICE" || val === "NORMAL") ? "" : val;
    
    // Mapping data dengan fallback
    const d = {
        name: p.Name || p.name || "Unknown Product",
        barcode: p.Barcode || p.barcode || "-",
        cat: `${p.Category || '-'} / ${p["Detail Category"] || '-'}`,
        img: p.Image || p.image || 'https://placehold.co/400x400?text=No+Image',
        regP: p["Regular Store Price"] || p.regular_price || "0",
        strP: p["Street Store Price"] || p.street_price || "0",
        pReg: clean(p["Regular Store Promo"]),
        pStr: clean(p["Street Store Promo"]),
        extra: clean(p["Extra Promo"])
    };

    resultDiv.innerHTML = `
        <div class="card">
            <div class="card-header">
                <img src="${d.img}" onerror="this.src='https://placehold.co/400x400?text=No+Image'">
            </div>
            <div class="card-body">
                <div class="category">${d.cat}</div>
                <h2 class="product-name">${d.name}</h2>
                <div><span class="barcode-text">${d.barcode}</span></div>

                <div class="price-section">
                    <div class="price-box">
                        <div class="price-label">REGULAR STORE</div>
                        <div class="price-value">${d.regP}</div>
                        ${d.pReg ? `<div class="promo-text">${d.pReg}</div>` : ""}
                    </div>
                    <div class="price-box" style="background: #f0f9ff; border-color: #bae6fd;">
                        <div class="price-label" style="color:#0369a1">STREET STORE</div>
                        <div class="price-value" style="color:#0369a1">${d.strP}</div>
                        ${d.pStr ? `<div class="promo-text" style="color:#0369a1">${d.pStr}</div>` : ""}
                    </div>
                </div>

                ${d.extra ? `
                <div class="promo-banner">
                    <div class="price-label" style="color:var(--danger)">SPECIAL OFFER</div>
                    <div class="promo-text" style="font-size:1rem">${d.extra}</div>
                </div>` : ""}
            </div>
        </div>
    `;
}

/* Auto Focus Logic */
const focusInput = () => input.focus();
document.addEventListener('click', focusInput);
setInterval(() => { if(document.activeElement !== input) focusInput(); }, 1000);

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const val = input.value.trim();
        if(val) search(val);
        input.value = "";
    }
});
window.onload = focusInput;
</script>
</body>
</html>
