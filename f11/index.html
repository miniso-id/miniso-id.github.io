<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.json">
    <meta name="viewport" content="width=device-width,initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F11 Miniso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW Registered!', reg))
        .catch(err => console.log('SW Registration Failed!', err));
    });
  }
</script>
    
    <style>
        :root { --primary: #2563eb; --danger: #dc2626; --bg: #f8fafc; }
        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            cursor: pointer; 
        }
        
        .standby-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #cbd5e1; z-index: -1; width: 100%; }
        .standby-msg h1 { font-size: 3rem; margin: 0; letter-spacing: -1px; }
        .standby-msg p { font-size: 1.2rem; margin: 5px 0; }

        .search-container { position: fixed; top: -5000px; left: 0; }

        #result { 
            width: 100%; 
            max-width: 900px; 
            padding: 15px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        
        .card { 
            background: white; border-radius: 16px; overflow: hidden; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            animation: slideUp 0.3s ease-out; 
            display: flex; 
            flex-direction: column; 
            max-height: 95vh;
        }

        @media (min-width: 768px) {
            .card { flex-direction: row; align-items: stretch; }
            .card-header { width: 45% !important; height: auto !important; border-right: 1px solid #f1f5f9; }
            .card-body { width: 55%; justify-content: center; padding: 30px !important; }
            .product-name { font-size: 1.8rem !important; }
            .price-value { font-size: 1.5rem !important; }
        }
        
        .card-header { position: relative; width: 100%; height: 190px; background: #ffffff; flex-shrink: 0; }
        .card-header img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
        
        .card-body { padding: 15px; display: flex; flex-direction: column; overflow: hidden; }
        .category { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--primary); margin-bottom: 3px; letter-spacing: 1px; }
        
        .product-name { 
            font-size: 1.3rem; color: #1e293b; margin: 0 0 8px 0; line-height: 1.2; 
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .barcode-text { font-family: monospace; background: #f1f5f9; padding: 2px 8px; border-radius: 4px; color: #64748b; font-size: 0.9rem; display: inline-block; align-self: flex-start; }

        .price-section { margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .price-box { padding: 10px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; }
        .price-label { font-size: 0.7rem; color: #64748b; margin-bottom: 2px; text-transform: uppercase; }
        .price-value { font-size: 1.15rem; font-weight: 800; color: #1e293b; }
        
        .promo-banner { margin-top: 10px; padding: 8px 12px; background: #fef2f2; border-left: 4px solid var(--danger); border-radius: 4px; }
        .promo-text { color: var(--danger); font-weight: bold; font-size: 0.85rem; margin-top: 2px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="standby-msg" id="standby">
        <h1>READY TO SCAN</h1>
        <p>Arahkan scanner ke barcode produk</p>
        <div id="status-db" style="font-size: 0.8rem; color: #94a3b8; margin-top: 20px;">Menghubungkan ke Database...</div>
    </div>

    <div class="search-container">
        <input id="searchInput" type="text" autocomplete="off" autofocus>
    </div>

    <div id="result"></div>

    <audio id="beepOk" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>
    <audio id="beepErr" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3"></audio>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = 'https://uesupubktkxfjsylcwwr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVlc3VwdWJrdGt4ZmpzeWxjd3dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NjI0MTYsImV4cCI6MjA4NjQzODQxNn0.94aUoL9T0kX5vfUthg9M6ucIwp9TkQfjNViCCT6Q25k';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const input = document.getElementById("searchInput");
const resultDiv = document.getElementById("result");
const standbyDiv = document.getElementById("standby");
const statusDb = document.getElementById("status-db");
const beepOk = document.getElementById("beepOk");
const beepErr = document.getElementById("beepErr");

const CACHE_NAME = "MMS_DATA_LOCAL";
const CACHE_EXPIRATION_MS = 24 * 60 * 60 * 1000; // 24 Jam

/* ================= CACHE LOGIC ================= */
const loadCache = () => {
    try {
        const saved = localStorage.getItem(CACHE_NAME);
        return saved ? JSON.parse(saved) : {};
    } catch (e) { return {}; }
};
let localProductCache = loadCache();

/* ================= CHECK CONNECTION ================= */
async function checkConn() {
    try {
        const { error } = await supabaseClient.from('export').select('count', { count: 'exact', head: true });
        if (error) throw error;
        statusDb.innerHTML = `<span style="color:#22c55e">●</span> Database Online - Ready`;
    } catch (err) {
        statusDb.innerHTML = `<span style="color:#ef4444">●</span> Koneksi Bermasalah`;
    }
}
checkConn();

/* ================= SEARCH LOGIC ================= */
let isSearching = false; 

async function search(q) {
    const cleanQuery = q.trim();
    if(!cleanQuery) return;

    const now = new Date().getTime();

    // 1. CEK CACHE LOKAL + WAKTU
    if (localProductCache[cleanQuery]) {
        const item = localProductCache[cleanQuery];
        if (now - item.timestamp < CACHE_EXPIRATION_MS) {
            render(item.data);
            beepOk.play().catch(e => {});
            standbyDiv.style.opacity = "0.1";
            return;
        }
    }

    // 2. JIKA TIDAK ADA / EXPIRED
    standbyDiv.style.opacity = "0.1";
    isSearching = true; 

    try {
        const { data, error } = await supabaseClient.rpc('get_product_cached', { search_term: cleanQuery });

        if (error) throw error;

        if (data && data.length > 0) {
            localProductCache[cleanQuery] = { data: data[0], timestamp: now };
            localStorage.setItem(CACHE_NAME, JSON.stringify(localProductCache));
            render(data[0]);
            beepOk.play().catch(e => {});
        } else {
            throw new Error("Not Found");
        }
    } catch (err) {
        beepErr.play().catch(e => {});
        resultDiv.innerHTML = `<div style="text-align:center; color:white; background:#dc2626; padding:15px; border-radius:10px; width:100%;">Produk tidak ditemukan!</div>`;
        setTimeout(() => { if(!input.value) resetUI(); }, 3000);
    } finally {
        isSearching = false; 
    }
}

function resetUI() {
    resultDiv.innerHTML = "";
    standbyDiv.style.opacity = "1";
}

function render(p) {
    const clean = (val) => (!val || val === "NORMAL PRICE" || val === "NORMAL") ? "" : val;
    const name = p.Name || p.name || "Produk Tanpa Nama";
    const barcode = p.Barcode || p.barcode || "N/A";
    const cat = p.Category || p.category || "-";
    const subCat = p["Detail Category"] || p.detail_category || "-";
    const img = p.Image || p.image || 'https://placehold.co/400x400?text=No+Image';
    const regPrice = p["Regular Store Price"] || p.regular_price || "0";
    const strPrice = p["Street Store Price"] || p.street_price || "0";
    const promoReg = clean(p["Regular Store Promo"]);
    const promoStr = clean(p["Street Store Promo"]);
    const extra = clean(p["Extra Promo"]);

    resultDiv.innerHTML = `
        <div class="card">
            <div class="card-header"><img src="${img}" onerror="this.src='https://placehold.co/400x400?text=Image+Not+Found'"></div>
            <div class="card-body">
                <div class="category">${cat} / ${subCat}</div>
                <h2 class="product-name">${name}</h2>
                <span class="barcode-text">${barcode}</span>
                <div class="price-section">
                    <div class="price-box">
                        <div class="price-label">Regular Price</div>
                        <div class="price-value">${regPrice}</div>
                        ${promoReg ? `<div class="promo-text" style="font-size:0.7rem;">${promoReg}</div>` : ""}
                    </div>
                    <div class="price-box" style="border-color: #bae6fd; background: #f0f9ff;">
                        <div class="price-label" style="color:#0369a1;">Street Price</div>
                        <div class="price-value" style="color:#0369a1;">${strPrice}</div>
                        ${promoStr ? `<div class="promo-text" style="font-size:0.7rem; color:#0369a1;">${promoStr}</div>` : ""}
                    </div>
                </div>
                ${extra ? `<div class="promo-banner"><div class="price-label" style="color:var(--danger)">Special Promo</div><div class="promo-text">${extra}</div></div>` : ""}
            </div>
        </div>
    `;
}

/* ================= FOCUS ================= */
const forceFocus = () => { input.focus(); };
window.onload = forceFocus;
document.addEventListener('click', forceFocus);
document.addEventListener('touchstart', forceFocus);
setInterval(() => { if (document.activeElement !== input) forceFocus(); }, 1000);

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        if (isSearching) return; 
        const val = input.value.trim();
        if(val) search(val);
        input.value = "";
        setTimeout(forceFocus, 10);
    }
});
</script>
</body>
</html>
